        /* =========================================================
           HOME - DUE DISPENSE
        ========================================================= */

        .pantry-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
        }

        .pantry-card {
            position: relative;
            min-height: 270px;

            border: 0;
            border-radius: 32px;

            padding: 30px;

            text-align: left;

            overflow: hidden;

            color: #ffffff;

            -webkit-box-shadow:
                0 16px 35px rgba(35,45,60,0.13);

            box-shadow:
                0 16px 35px rgba(35,45,60,0.13);

            -webkit-transition:
                -webkit-transform 0.15s ease,
                -webkit-box-shadow 0.15s ease;

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .pantry-card:active {
            -webkit-transform: scale(0.98);
            transform: scale(0.98);
        }

        .pantry-card:before {
            content: "";

            position: absolute;

            width: 210px;
            height: 210px;

            right: -65px;
            top: -65px;

            border-radius: 50%;

            background: rgba(255,255,255,0.18);

        .pantry-card:after {
            content: "";

            position: absolute;

            width: 130px;
            height: 130px;

            left: -55px;
            bottom: -55px;

            border-radius: 50%;

            background: rgba(255,255,255,0.10);

        }

        .pantry-card.cantina {

            align-items: center;

            -webkit-box-pack: center;
            -ms-flex-pack: center;
            justify-content: center;

            line-height: 1.1;

            margin: 0;

            font-size: 15px;
            line-height: 1.5;

            bottom: 25px;

            font-weight: 700;
        }

        .form-input,
        .form-select {
            width: 100%;
            height: 49px;

            padding: 0 14px;

            border: 1px solid #e1e5eb;
            border-radius: 14px;

            outline: none;

            background: #f9fafc;
            color: #252a32;

            font-size: 15px;

            -webkit-appearance: none;
        }

        .form-input:focus,
        .form-select:focus {
            border-color: #93b7ff;
            background: #ffffff;
        }

        .form-row {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;
        }

        .modal-actions {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

            margin-top: 22px;
        }

        .modal-button {
            height: 50px;

            border: 0;
            border-radius: 15px;

            font-size: 15px;
            font-weight: 800;
        }

        .primary-button {
            background: #2e9c57;
            color: #ffffff;
        }

        .secondary-button {
            background: #edf0f4;
            color: #454c57;
        }

        .danger-button {
            width: 100%;
            height: 47px;

            margin-top: 10px;

            border: 0;
            border-radius: 14px;

            background: #fff0f0;
            color: #e84d4d;

            font-size: 14px;
            font-weight: 800;
        }


        /* =========================================================
           SCANNER
        ========================================================= */

        .scanner-modal-content {
            max-width: 520px;
            padding: 20px;
        }

        .scanner-container {
            width: 100%;

            overflow: hidden;

            border-radius: 20px;

            background: #111111;
        }

        #reader {
            width: 100%;
            min-height: 280px;
        }

        .scanner-help {
            margin: 14px 0 0;

            text-align: center;

            color: #747b87;

            font-size: 13px;
            line-height: 1.45;
        }

        .scanner-close-button {
            width: 100%;
            height: 48px;

            margin-top: 15px;

            border: 0;
            border-radius: 15px;

            background: #edf0f4;
            color: #3f4650;

            font-size: 15px;
            font-weight: 800;
        }


        /* =========================================================
           TOAST
        ========================================================= */

        .toast {
            position: fixed;

            z-index: 2000;

            left: 50%;
            bottom: 25px;

            max-width: calc(100% - 40px);

            padding: 13px 18px;

            border-radius: 15px;

            background: #20242b;
            color: #ffffff;

            font-size: 14px;
            font-weight: 700;

            opacity: 0;
            pointer-events: none;

            -webkit-transform: translate(-50%, 15px);
            transform: translate(-50%, 15px);

            -webkit-transition:
                opacity 0.2s ease,
                -webkit-transform 0.2s ease;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        .toast.show {
            opacity: 1;

            -webkit-transform: translate(-50%, 0);
            transform: translate(-50%, 0);
        }


        /* =========================================================
           TABLET
        ========================================================= */

        @media only screen
        and (min-width: 768px)
        and (max-width: 1100px) {

            .home-container,
            .pantry-container,
            .category-container {
                padding-left: 42px;
                padding-right: 42px;
            }

            .home-title {
                font-size: 40px;
            }

            .pantry-card {
                min-height: 290px;
            }

            .category-card {
                min-height: 250px;
            }

            .products-list {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .scanner-button {
                width: 64px;
                min-width: 64px;
                height: 58px;
            }
        }


        /* =========================================================
           IPHONE
        ========================================================= */

        @media only screen and (max-width: 700px) {

            .home-container {
                padding: 32px 18px 35px;
            }

            .pantry-container,
            .category-container {
                padding: 18px 16px 35px;
            }

            .home-header {
                margin-bottom: 28px;
            }

            .home-logo {
                width: 78px;

                border-radius: 23px;

            }

            .home-title {

            }

            .pantry-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .pantry-card {
                min-height: 205px;

            }

            .pantry-icon {
                width: 64px;
                height: 64px;

                border-radius: 20px;

            }

            .pantry-card h2 {
                margin-top: 21px;
                font-size: 25px;
            }

            .category-grid {

            }

            .category-card {
                min-height: 170px;

                padding: 20px;

                border-radius: 23px;
            }

            .category-icon {
                width: 60px;

            }

            .category-card h2 {

            }

            .category-heading h1 {
                font-size: 25px;
            }

            .category-heading p {
                font-size: 12px;
            }

            .products-list {
                grid-template-columns: 1fr;
            }

            .product-card {
                min-height: 155px;
            }

            .modal {
                padding: 12px;
            }

            .modal-content {
                border-radius: 23px;
                padding: 20px;
            }
        }


        /* =========================================================
           SMALL PHONE
        ========================================================= */

        @media only screen and (max-width: 420px) {

            .toolbar {
                gap: 8px;
            }

            #searchInput {
                height: 56px;
            }

            .scanner-button {
                width: 56px;
                min-width: 56px;
                height: 56px;
            }

            .camera-svg {
                width: 26px;
                height: 26px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }


        /* =========================================================
           IPAD MINI LANDSCAPE
        ========================================================= */

        @media only screen
        and (min-width: 768px)
        and (max-width: 1100px)
        and (orientation: landscape) {

            .home-container {
                padding-top: 28px;
            }

            .home-header {
                margin-bottom: 25px;
            }

            .home-logo {
                width: 70px;

            }

                font-size: 32px;
            }

            .pantry-card {
                min-height: 230px;
            }

            .category-card {
                min-height: 205px;
            }
        }

    </style>
</head>

<body>


<!-- =========================================================
     HOME PRINCIPALE
========================================================= -->

<main id="homeScreen" class="screen active">

    <div class="home-screen">

        <div class="home-container">

            <header class="home-header">

                </div>

                        </div>

                    </div>

                    </div>

                </button>


                <button
                    type="button"
                    class="pantry-card cantina"

                    <div class="pantry-content">

                        <div class="pantry-icon">
                            🏡
                        </div>

                        <h2>
                            Dispensa Cantina
                        </h2>

                        <p>
                            Prodotti per la pulizia
                            della casa.
                        </p>

                    </div>

                    <div class="pantry-arrow">
                        →
                    </div>

                </button>

            </div>

        </div>

    </div>

</main>


<!-- =========================================================
     SCHERMATA DISPENSA CASA / CANTINA
========================================================= -->

<main id="pantryScreen" class="screen">

    <div class="pantry-screen">

        <div class="pantry-container">

            <header class="pantry-header">

                <button
                    type="button"
                    id="pantryBackButton"
                    class="pantry-back-button"
                    aria-label="Torna alla home">
                    ‹
                </button>

                <div class="pantry-heading">

                    <h1 id="pantryTitle">
                        Dispensa Casa
                    </h1>

                    <p id="pantrySubtitle">
                        Scegli una categoria
                    </p>

                </div>

            </header>


            <div
                id="categoryGrid"
                class="category-grid">


                <!-- CIBO -->

                <button
                    type="button"
                    class="category-card cibo"
                    data-category="cibo">

                    <div class="category-top">

                        <div class="category-icon">
                            🍎
                        </div>

                        <div class="category-arrow">
                            →
                        </div>

                    </div>

                    <h2>
                        Cibo
                    </h2>

                    <p>
                        Pasta, bevande, conserve e tutto
                        quello che trovi nella tua dispensa.
                    </p>

                </button>


                <!-- BAGNO -->

                <button
                    type="button"
                    class="category-card bagno"
                    data-category="bagno">

                    <div class="category-top">

                        <div class="category-icon">
                            🧴
                        </div>

                        <div class="category-arrow">
                            →
                        </div>

                    </div>

                    <h2>
                        Prodotti bagno
                    </h2>

                    <p>
                        Shampoo, saponi, dentifricio e prodotti
                        per la cura personale.
                    </p>

                </button>


                <!-- PULIZIA -->

                <button
                    type="button"
                    class="category-card pulizia"
                    data-category="pulizia">

                    <div class="category-top">

                        <div class="category-icon">
                            🧹
                        </div>

                        <div class="category-arrow">
                            →
                        </div>

                    </div>

                    <h2>
                        Prodotti pulizia
                    </h2>

                    <p>
                        Detersivi, detergenti e prodotti
                        per la pulizia della casa.
                    </p>

                </button>

            </div>

        </div>

    </div>

</main>


<!-- =========================================================
     CATEGORY SCREEN
========================================================= -->

<main id="categoryScreen" class="screen">

    <div class="category-screen">

        <div class="category-container">

            <header class="category-header">

                <button
                    type="button"
                    id="backButton"
                    class="back-button"
                    aria-label="Torna indietro">
                    ‹
                </button>

                <div class="category-heading">

                    <h1 id="categoryTitle">
                        Cibo
                    </h1>

                    <p id="categorySubtitle">
                        I tuoi prodotti
                    </p>

                </div>

            </header>


            <div class="toolbar">

                <div class="search-box">

                    <span class="search-icon">
                        🔍
                    </span>

                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Cerca prodotto..."
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="none"
                        spellcheck="false">

                </div>


                <button
                    type="button"
                    id="scannerButton"
                    class="scanner-button"
                    aria-label="Scansiona codice a barre">

                    <svg
                        class="camera-svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.9"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true">

                        <path d="M4 7h3l1.5-2h5L15 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"></path>

                        <circle
                            cx="12"
                            cy="13"
                            r="3.5">
                        </circle>

                    </svg>

                </button>

            </div>


            <div class="filters">

                <button
                    type="button"
                    class="filter-button active"
                    data-filter="all">
                    Tutti
                </button>

                <button
                    type="button"
                    class="filter-button low-stock"
                    data-filter="low">
                    🔴 Scorte basse
                </button>

            </div>


            <button
                type="button"
                id="addProductButton"
                class="add-product-button">
                ＋ Aggiungi prodotto
            </button>


            <section
                id="products"
                class="products-list">
            </section>

        </div>

    </div>

</main>


<!-- =========================================================
     PRODUCT MODAL
========================================================= -->

<div
    id="productModal"
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="productModalTitle">

    <div class="modal-content">

        <div class="modal-header">

            <h2
                id="productModalTitle"
                class="modal-title">
                Nuovo prodotto
            </h2>

            <button
                type="button"
                id="closeProductButton"
                class="close-button"
                aria-label="Chiudi">
                ×
            </button>

        </div>


        <form id="productForm">

            <div class="form-group">

                <label
                    class="form-label"
                    for="productName">
                    Nome prodotto
                </label>

                <input
                    id="productName"
                    class="form-input"
                    type="text"
                    required
                    autocomplete="off">

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label
                        class="form-label"
                        for="productBrand">
                        Marca
                    </label>

                    <input
                        id="productBrand"
                        class="form-input"
                        type="text"
                        autocomplete="off">

                </div>


                <div class="form-group">

                    <label
                        class="form-label"
                        for="productFormat">
                        Formato
                    </label>

                    <input
                        id="productFormat"
                        class="form-input"
                        type="text"
                        placeholder="es. 500 g"
                        autocomplete="off">

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label
                        class="form-label"
                        for="productQuantity">
                        Quantità
                    </label>

                    <input
                        id="productQuantity"
                        class="form-input"
                        type="number"
                        min="0"
                        step="1"
                        value="1">

                </div>


                <div class="form-group">

                    <label
                        class="form-label"
                        for="productMinStock">
                        Scorta minima
                    </label>

                    <input
                        id="productMinStock"
                        class="form-input"
                        type="number"
                        min="0"
                        step="1"
                        value="1">

                </div>

            </div>


            <div class="form-group">

                <label
                    class="form-label"
                    for="productCategory">
                    Categoria
                </label>

                <select
                    id="productCategory"
                    class="form-select">

                    <option value="cibo">
                        🍎 Cibo
                    </option>

                    <option value="bagno">
                        🧴 Prodotti bagno
                    </option>

                    <option value="pulizia">
                        🧹 Prodotti pulizia
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label
                    class="form-label"
                    for="productBarcode">
                    Codice a barre
                </label>

                <input
                    id="productBarcode"
                    class="form-input"
                    type="text"
                    inputmode="numeric"
                    autocomplete="off">

            </div>


            <div class="form-group">

                <label
                    class="form-label"
                    for="productImage">
                    URL immagine
                </label>

                <input
                    id="productImage"
                    class="form-input"
                    type="url"
                    placeholder="https://..."
                    autocomplete="off">

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    id="cancelProductButton"
                    class="modal-button secondary-button">
                    Annulla
                </button>

                <button
                    type="submit"
                    class="modal-button primary-button">
                    Salva
                </button>

            </div>


            <button
                type="button"
                id="deleteProductButton"
                class="danger-button"
                style="display:none;">
                Elimina prodotto
            </button>

        </form>

    </div>

</div>


<!-- =========================================================
     SCANNER
========================================================= -->

<div
    id="scannerModal"
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="scannerTitle">

    <div class="modal-content scanner-modal-content">

        <div class="modal-header">

            <h2
                id="scannerTitle"
                class="modal-title">
                Scansiona prodotto
            </h2>

            <button
                type="button"
                id="closeScannerButton"
                class="close-button"
                aria-label="Chiudi scanner">
                ×
            </button>

        </div>


        <div class="scanner-container">

            <div id="reader"></div>

        </div>


        <p class="scanner-help">
            Inquadra il codice a barre del prodotto.
            Verrà cercato automaticamente.
        </p>


        <button
            type="button"
            id="manualScannerClose"
            class="scanner-close-button">
            Chiudi scanner
        </button>

    </div>

</div>


<!-- =========================================================
     TOAST
========================================================= -->

<div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite">
</div>


<script>
(function () {

    "use strict";


    /* =========================================================
       CONFIG
    ========================================================= */

    var STORAGE_KEY =
        "laMiaDispensaProdotti";


    var categoryData = {

        cibo: {
            title: "Cibo",
            subtitle: "Dispensa Casa · Alimentari"
        },

        bagno: {
            title: "Prodotti bagno",
            subtitle: "Dispensa Casa · Cura personale"
        },

        pulizia: {
            title: "Prodotti pulizia",
            subtitle: "Dispensa Cantina · Pulizia della casa"
        }

    };


    /* =========================================================
       STATE
    ========================================================= */

    var products = [];

    var currentCategory = "cibo";

    var currentFilter = "all";

    var editingProductId = null;

    var currentPantry = "casa";

    var html5QrCode = null;

    var scannerStarting = false;

    var scannerRunning = false;

    var scannerLocked = false;

    var toastTimer = null;


    /* =========================================================
       DOM
    ========================================================= */

    var homeScreen =
        document.getElementById("homeScreen");

    var pantryScreen =
        document.getElementById("pantryScreen");

    var categoryScreen =
        document.getElementById("categoryScreen");


    var pantryTitle =
        document.getElementById("pantryTitle");

    var pantrySubtitle =
        document.getElementById("pantrySubtitle");


    var categoryTitle =
        document.getElementById("categoryTitle");

    var categorySubtitle =
        document.getElementById("categorySubtitle");


    var productsContainer =
        document.getElementById("products");


    var searchInput =
        document.getElementById("searchInput");


    var productModal =
        document.getElementById("productModal");


    var productModalTitle =
        document.getElementById("productModalTitle");


    var productForm =
        document.getElementById("productForm");


    var productName =
        document.getElementById("productName");

    var productBrand =
        document.getElementById("productBrand");

    var productFormat =
        document.getElementById("productFormat");

    var productBarcode =
        document.getElementById("productBarcode");

    var productQuantity =
        document.getElementById("productQuantity");

    var productMinStock =
        document.getElementById("productMinStock");

    var productCategory =
        document.getElementById("productCategory");

    var productImage =
        document.getElementById("productImage");


    var deleteProductButton =
        document.getElementById(
            "deleteProductButton"
        );


    var scannerModal =
        document.getElementById(
            "scannerModal"
        );


    /* =========================================================
       UTILITY
    ========================================================= */

    function generateId() {

        return String(new Date().getTime()) +
            "_" +
            String(
                Math.floor(
                    Math.random() * 100000
                )
            );

    }


    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function saveProducts() {

        try {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(products)
            );

        } catch (error) {

            console.log(
                "Errore salvataggio:",
                error
            );

        }

    }


    function loadProducts() {

        try {

            var saved =
                localStorage.getItem(
                    STORAGE_KEY
                );

            if (saved) {

                products =
                    JSON.parse(saved);

                if (
                    !Array.isArray(products)
                ) {
                    products = [];
                }

                return;
            }

        } catch (error) {

            products = [];

        }


        products = [

            {
                id: generateId(),
                name: "Pasta",
                brand: "Barilla",
                format: "500 g",
                quantity: 3,
                minStock: 2,
                category: "cibo",
                barcode: "",
                image: ""
            },

            {
                id: generateId(),
                name: "Latte",
                brand: "Parmalat",
                format: "1 L",
                quantity: 1,
                minStock: 2,
                category: "cibo",
                barcode: "",
                image: ""
            },

            {
                id: generateId(),
                name: "Shampoo",
                brand: "Pantene",
                format: "250 ml",
                quantity: 2,
                minStock: 1,
                category: "bagno",
                barcode: "",
                image: ""
            },

            {
                id: generateId(),
                name: "Detersivo piatti",
                brand: "Nelsen",
                format: "900 ml",
                quantity: 1,
                minStock: 1,
                category: "pulizia",
                barcode: "",
                image: ""
            }

        ];

        saveProducts();

    }


    function isLowStock(product) {

        return Number(
            product.quantity
        ) <
        Number(
            product.minStock
        );

    }


    /* =========================================================
       HOME PRINCIPALE
    ========================================================= */

    function openPantry(pantry) {

        currentPantry = pantry;


        if (pantry === "casa") {

            pantryTitle.textContent =
                "Dispensa Casa";

            pantrySubtitle.textContent =
                "Cibo e cura personale";

            showCategoryButton(
                "pulizia",
                false
            );

            showCategoryButton(
                "cibo",
                true
            );

            showCategoryButton(
                "bagno",
                true
            );

        }


        if (pantry === "cantina") {

            pantryTitle.textContent =
                "Dispensa Cantina";

            pantrySubtitle.textContent =
                "Prodotti per la pulizia";

            showCategoryButton(
                "cibo",
                false
            );

            showCategoryButton(
                "bagno",
                false
            );

            showCategoryButton(
                "pulizia",
                true
            );

        }


        homeScreen.classList.remove(
            "active"
        );

        categoryScreen.classList.remove(
            "active"
        );

        pantryScreen.classList.add(
            "active"
        );


        window.scrollTo(0, 0);

    }


    function showCategoryButton(
        category,
        visible
    ) {

        var button =
            document.querySelector(
                '.category-card[data-category="' +
                category +
                '"]'
            );

        if (!button) {
            return;
        }

        if (visible) {

            button.style.display = "";

        } else {

            button.style.display = "none";

        }

    }


    function goHome() {

        stopScanner();

        pantryScreen.classList.remove(
            "active"
        );

        categoryScreen.classList.remove(
            "active"
        );

        homeScreen.classList.add(
            "active"
        );

        window.scrollTo(0, 0);

    }


    function backToPantry() {

        stopScanner();

        categoryScreen.classList.remove(
            "active"
        );

        pantryScreen.classList.add(
            "active"
        );

        window.scrollTo(0, 0);

    }


    /* =========================================================
       CATEGORY
    ========================================================= */

    function openCategory(category) {

        currentCategory =
            category;

        currentFilter =
            "all";


        var data =
            categoryData[category];


        if (!data) {
            return;
        }


        categoryTitle.textContent =
            data.title;

        categorySubtitle.textContent =
            data.subtitle;


        pantryScreen.classList.remove(
            "active"
        );

        homeScreen.classList.remove(
            "active"
        );

        categoryScreen.classList.add(
            "active"
        );


        searchInput.value = "";


        updateFilters();

        renderProducts();


        window.scrollTo(0, 0);

    }


    /* =========================================================
       FILTER
    ========================================================= */

    function setFilter(filter) {

        currentFilter =
            filter;

        updateFilters();

        renderProducts();

    }


    function updateFilters() {

        var buttons =
            document.querySelectorAll(
                ".filter-button"
            );

        var i;

        for (
            i = 0;
            i < buttons.length;
            i++
        ) {

            if (
                buttons[i].getAttribute(
                    "data-filter"
                ) === currentFilter
            ) {

                buttons[i].classList.add(
                    "active"
                );

            } else {

                buttons[i].classList.remove(
                    "active"
                );

            }

        }

    }


    /* =========================================================
       PRODUCTS
    ========================================================= */

    function renderProducts() {

        var query =
            String(
                searchInput.value || ""
            )
            .toLowerCase()
            .replace(
                /^\s+|\s+$/g,
                ""
            );


        var filtered = [];

        var i;


        for (
            i = 0;
            i < products.length;
            i++
        ) {

            var product =
                products[i];


            if (
                product.category !==
                currentCategory
            ) {
                continue;
            }


            if (
                currentFilter === "low" &&
                !isLowStock(product)
            ) {
                continue;
            }


            var searchable =
                String(
                    product.name || ""
                ) +
                " " +
                String(
                    product.brand || ""
                ) +
                " " +
                String(
                    product.barcode || ""
                );


            searchable =
                searchable.toLowerCase();


            if (
                query &&
                searchable.indexOf(
                    query
                ) === -1
            ) {
                continue;
            }


            filtered.push(
                product
            );

        }


        productsContainer.innerHTML =
            "";


        if (
            filtered.length === 0
        ) {

            productsContainer.innerHTML =
                '<div class="empty-state">' +

                    '<div class="empty-icon">' +
                        '📦' +
                    '</div>' +

                    '<h3>Nessun prodotto</h3>' +

                    '<p>' +
                        'Non ci sono prodotti da mostrare.' +
                    '</p>' +

                '</div>';

            return;
        }


        for (
            i = 0;
            i < filtered.length;
            i++
        ) {

            productsContainer.insertAdjacentHTML(
                "beforeend",
                createProductCard(
                    filtered[i]
                )
            );

        }

    }


    function createProductCard(
        product
    ) {

        var low =
            isLowStock(product);


        var categoryClass =
            "cibo-bar";


        if (
            product.category ===
            "bagno"
        ) {
            categoryClass =
                "bagno-bar";
        }


        if (
            product.category ===
            "pulizia"
        ) {
            categoryClass =
                "pulizia-bar";
        }


        var imageHtml;


        if (product.image) {

            imageHtml =
                '<img src="' +
                escapeHtml(
                    product.image
                ) +
                '" alt="">';

        } else {

            var icon =
                "🍎";


            if (
                product.category ===
                "bagno"
            ) {
                icon =
                    "🧴";
            }


            if (
                product.category ===
                "pulizia"
            ) {
                icon =
                    "🧹";
            }


            imageHtml =
                icon;

        }


        var stockText;


        if (low) {

            stockText =
                "Scorta bassa · min " +
                escapeHtml(
                    product.minStock
                );

        } else {

            stockText =
                "Scorta OK · min " +
                escapeHtml(
                    product.minStock
                );

        }


        return (

            '<article class="product-card ' +
            (
                low
                ? "low-stock"
                : ""
            ) +
            '" data-product-id="' +
            escapeHtml(
                product.id
            ) +
            '">' +


                '<div class="product-color-bar ' +
                    categoryClass +
                '"></div>' +


                '<div class="product-top">' +

                    '<div class="product-image">' +
                        imageHtml +
                    '</div>' +


                    '<div class="product-info">' +

                        '<h3 class="product-name">' +
                            escapeHtml(
                                product.name
                            ) +
                        '</h3>' +


                        '<p class="product-brand">' +
                            escapeHtml(
                                product.brand ||
                                "—"
                            ) +
                        '</p>' +


                        '<p class="product-format">' +
                            escapeHtml(
                                product.format ||
                                ""
                            ) +
                        '</p>' +


                        '<span class="stock-badge ' +
                            (
                                low
                                ? "low"
                                : ""
                            ) +
                        '">' +

                            (
                                low
                                ? "🔴 "
                                : "🟢 "
                            ) +

                            stockText +

                        '</span>' +

                    '</div>' +

                '</div>' +


                '<div class="product-bottom">' +

                    '<div class="quantity-controls">' +

                        '<button ' +
                            'type="button" ' +
                            'class="quantity-button js-minus" ' +
                            'data-id="' +
                            escapeHtml(
                                product.id
                            ) +
                            '">' +
                            "−" +
                        '</button>' +


                        '<span class="quantity-value">' +
                            escapeHtml(
                                product.quantity
                            ) +
                        '</span>' +


                        '<button ' +
                            'type="button" ' +
                            'class="quantity-button js-plus" ' +
                            'data-id="' +
                            escapeHtml(
                                product.id
                            ) +
                            '">' +
                            "+" +
                        '</button>' +

                    '</div>' +


                    '<button ' +
                        'type="button" ' +
                        'class="edit-button js-edit" ' +
                        'data-id="' +
                        escapeHtml(
                            product.id
                        ) +
                        '" ' +
                        'aria-label="Modifica prodotto">' +
                        "✎" +
                    '</button>' +

                '</div>' +

            '</article>'

        );

    }


    /* =========================================================
       QUANTITY
    ========================================================= */

    function changeQuantity(
        id,
        amount
    ) {

        var product =
            findProductById(id);


        if (!product) {
            return;
        }


        var quantity =
            Number(
                product.quantity
            ) || 0;


        quantity += amount;


        if (quantity < 0) {
            quantity = 0;
        }


        product.quantity =
            quantity;


        saveProducts();

        renderProducts();

    }


    /* =========================================================
       PRODUCT MODAL
    ========================================================= */

    ) {

        if (product) {

            editingProductId =
                product.id;

            productBrand.value =

                ) || 0;

        );

    }


    function saveProductFromForm(
        event
    ) {

        event.preventDefault();


        var name =
            String(
                productName.value || ""
            )
            .replace(
                /^\s+|\s+$/g,
                ""
            );


        if (!name) {

            showToast(
                "Inserisci il nome del prodotto."
            );

            return;

        }


        var quantity =
            parseInt(
                productQuantity.value,
                10
            );


        var minStock =
            parseInt(
                productMinStock.value,
                10
            );


        if (
            isNaN(quantity) ||
            quantity < 0
        ) {
            quantity = 0;
        }


        if (
            isNaN(minStock) ||
            minStock < 0
        ) {
            minStock = 0;
        }


        var data = {

            name: name,

            brand:
                String(
                    productBrand.value || ""
                )
                .replace(
                    /^\s+|\s+$/g,
                    ""
                ),

            format:
                String(
                    productFormat.value || ""
                )
                .replace(
                    /^\s+|\s+$/g,
                    ""
                ),

            quantity:
                quantity,

            minStock:
                minStock,

            category:
                productCategory.value,

            barcode:
                String(
                    productBarcode.value || ""
                )
                .replace(
                    /^\s+|\s+$/g,
                    ""
                ),

            image:
                String(
                    productImage.value || ""
                )
                .replace(
                    /^\s+|\s+$/g,
                    ""
                )

        };


        if (editingProductId) {

            var existing =
                findProductById(
                    editingProductId
                );


            if (existing) {

                existing.name =
                    data.name;

                existing.brand =
                    data.brand;

                existing.format =
                    data.format;

                existing.quantity =
                    data.quantity;

                existing.minStock =
                    data.minStock;

                existing.category =
                    data.category;

                existing.barcode =
                    data.barcode;

                existing.image =
                    data.image;

            }


            showToast(
                "Prodotto modificato."
            );

        } else {

            data.id =
                generateId();


            products.push(
                data
            );


            showToast(
                "Prodotto aggiunto."
            );

        }


        saveProducts();

        closeProductModal();

        renderProducts();

    }


    function deleteCurrentProduct() {

        if (!editingProductId) {
            return;
        }


        var confirmed =
            window.confirm(
                "Vuoi eliminare questo prodotto?"
            );


        if (!confirmed) {
            return;
        }


        var newProducts = [];

        var i;


        for (
            i = 0;
            i < products.length;
            i++
        ) {

            if (
                products[i].id !==
                editingProductId
            ) {

                newProducts.push(
                    products[i]
                );

            }

        }


        products =
            newProducts;


        saveProducts();

        closeProductModal();

        renderProducts();


        showToast(
            "Prodotto eliminato."
        );

    }


    /* =========================================================
       SCANNER
    ========================================================= */

    function openScanner() {

        if (
            typeof Html5Qrcode ===
            "undefined"
        ) {

            showToast(
                "Scanner non disponibile."
            );

            return;

        }


        scannerModal.classList.add(
            "active"
        );


        scannerLocked =
            false;


        setTimeout(
            startScanner,
            300
        );

    }


    function startScanner() {

        if (
            scannerStarting ||
            scannerRunning
        ) {
            return;
        }


        scannerStarting =
            true;


        html5QrCode =
            new Html5Qrcode(
                "reader"
            );


        var config = {

            fps: 8,

            qrbox: {
                width: 280,
                height: 160
            }

        };


        html5QrCode.start(

            {
                facingMode: "user"
            },

            config,

            function (
                decodedText
            ) {

                handleBarcode(
                    decodedText
                );

            },

            function () {}

        )
        .then(
            function () {

                scannerStarting =
                    false;

                scannerRunning =
                    true;

            }
        )
        .catch(
            function () {

                scannerStarting =
                    false;

                startScannerFallback();

            }
        );

    }


    function startScannerFallback() {

        if (
            typeof Html5Qrcode ===
            "undefined"
        ) {
            return;
        }


        Html5Qrcode.getCameras()

            .then(
                function (
                    cameras
                ) {

                    if (
                        !cameras ||
                        cameras.length === 0
                    ) {

                        showCameraError();

                        return;

                    }


                    var selectedCamera =
                        cameras[0];


                    var i;


                    for (
                        i = 0;
                        i < cameras.length;
                        i++
                    ) {

                        var label =
                            String(
                                cameras[i].label ||
                                ""
                            )
                            .toLowerCase();


                        if (
                            label.indexOf(
                                "front"
                            ) !== -1 ||

                            label.indexOf(
                                "facetime"
                            ) !== -1 ||

                            label.indexOf(
                                "user"
                            ) !== -1
                        ) {

                            selectedCamera =
                                cameras[i];

                            break;

                        }

                    }


                    html5QrCode =
                        new Html5Qrcode(
                            "reader"
                        );


                    return html5QrCode.start(

                        selectedCamera.id,

                        {
                            fps: 8,

                            qrbox: {
                                width: 280,
                                height: 160
                            }
                        },

                        function (
                            decodedText
                        ) {

                            handleBarcode(
                                decodedText
                            );

                        },

                        function () {}

                    );

                }
            )

            .then(
                function () {

                    scannerRunning =
                        true;

                }
            )

            .catch(
                function () {

                    showCameraError();

                }
            );

    }


    function stopScanner() {

        if (!html5QrCode) {
            return;
        }


        var scanner =
            html5QrCode;


        html5QrCode =
            null;


        scannerStarting =
            false;

        scannerRunning =
            false;


        try {

            scanner.stop()

                .then(
                    function () {

                        try {
                            scanner.clear();
                        } catch (e) {}

                    }
                )

                .catch(
                    function () {

                        try {
                            scanner.clear();
                        } catch (e) {}

                    }
                );

        } catch (error) {

            try {
                scanner.clear();
            } catch (e) {}

        }

    }


    function closeScanner() {

        stopScanner();

        scannerModal.classList.remove(
            "active"
        );

    }


    /* =========================================================
       BARCODE
    ========================================================= */

    function handleBarcode(
        barcode
    ) {

        if (scannerLocked) {
            return;
        }


        scannerLocked =
            true;


        barcode =
            String(
                barcode || ""
            )
            .replace(
                /^\s+|\s+$/g,
                ""
            );


        if (!barcode) {

            scannerLocked =
                false;

            return;

        }


        stopScanner();


        scannerModal.classList.remove(
            "active"
        );


        var existing =
            null;


        var i;


        for (
            i = 0;
            i < products.length;
            i++
        ) {

            if (
                String(
                    products[i].barcode ||
                    ""
                ) === barcode
            ) {

                existing =
                    products[i];

                break;

            }

        }


        if (existing) {

            existing.quantity =
                (
                    Number(
                        existing.quantity
                    ) || 0
                ) + 1;


            saveProducts();


            if (
                existing.category ===
                currentCategory
            ) {

                renderProducts();

            }


            showToast(
                existing.name +
                " · quantità aumentata."
            );


            scannerLocked =
                false;


            return;

        }


        lookupOpenFoodFacts(
            barcode
        );

    }


    function lookupOpenFoodFacts(
        barcode
    ) {

        var url =
            "https://world.openfoodfacts.org/api/v2/product/" +
            encodeURIComponent(
                barcode
            ) +
            ".json";


        fetch(url)

            .then(
                function (
                    response
                ) {

                    if (!response.ok) {
                        throw new Error(
                            "HTTP"
                        );
                    }

                    return response.json();

                }
            )

            .then(
                function (
                    data
                ) {

                    var product =
                        data &&
                        data.product
                            ? data.product
                            : null;


                    openProductModal(
                        null
                    );


                    productBarcode.value =
                        barcode;


                    productQuantity.value =
                        1;


                    productMinStock.value =
                        1;


                    productCategory.value =
                        currentCategory;


                    if (product) {

                        productName.value =
                            product.product_name ||
                            product.product_name_it ||
                            "";

                        productBrand.value =
                            product.brands ||
                            "";

                        productFormat.value =
                            product.quantity ||
                            "";

                        productImage.value =
                            product.image_front_url ||
                            product.image_url ||
                            "";

                    }


                    scannerLocked =
                        false;


                    if (!product) {

                        showToast(
                            "Prodotto non trovato. Inseriscilo manualmente."
                        );

                    }

                }
            )

            .catch(
                function () {

                    scannerLocked =
                        false;


                    openProductModal(
                        null
                    );


                    productBarcode.value =
                        barcode;


                    productQuantity.value =
                        1;


                    productMinStock.value =
                        1;


                    productCategory.value =
                        currentCategory;


                    showToast(
                        "Prodotto non trovato. Inseriscilo manualmente."
                    );

                }
            );

    }


    function showCameraError() {

        scannerStarting =
            false;

        scannerRunning =
            false;


        showToast(
            "Impossibile accedere alla fotocamera. Controlla i permessi e usa HTTPS."
        );

    }


    /* =========================================================
       TOAST
    ========================================================= */

    function showToast(
        message
    ) {

        var toast =
            document.getElementById(
                "toast"
            );


        toast.textContent =
            message;


        toast.classList.add(
            "show"
        );


        if (toastTimer) {

            clearTimeout(
                toastTimer
            );

        }


        toastTimer =
            setTimeout(
                function () {

                    toast.classList.remove(
                        "show"
                    );

                },
                2600
            );

    }


    /* =========================================================
       FIND PRODUCT
    ========================================================= */

    function findProductById(
        id
    ) {

        var i;


        for (
            i = 0;
            i < products.length;
            i++
        ) {

            if (
                products[i].id === id
            ) {

                return products[i];

            }

        }


        return null;

    }


    /* =========================================================
       EVENTS
    ========================================================= */

    function setupEvents() {


        /*
         * DUE DISPENSE
         */

        var pantryButtons =
            document.querySelectorAll(
                ".pantry-card"
            );


        var i;


        for (
            i = 0;
            i < pantryButtons.length;
            i++
        ) {

            pantryButtons[i].addEventListener(
                "click",
                function () {

                    openPantry(
                        this.getAttribute(
                            "data-pantry"
                        )
                    );

                }
            );

        }


        /*
         * TORNA ALLA HOME
         */

        document
            .getElementById(
                "pantryBackButton"
            )
            .addEventListener(
                "click",
                goHome
            );


        /*
         * CATEGORIE
         */

        var categoryButtons =
            document.querySelectorAll(
                ".category-card"
            );


        for (
            i = 0;
            i < categoryButtons.length;
            i++
        ) {

            categoryButtons[i].addEventListener(
                "click",
                function () {

                    openCategory(
                        this.getAttribute(
                            "data-category"
                        )
                    );

                }
            );

        }


        /*
         * TORNA ALLA DISPENSA
         */

        document
            .getElementById(
                "backButton"
            )
            .addEventListener(
                "click",
                backToPantry
            );


        /*
         * AGGIUNGI PRODOTTO
         */

        document
            .getElementById(
                "addProductButton"
            )
            .addEventListener(
                "click",
                function () {

                    openProductModal(
                        null
                    );

                }
            );


        /*
         * SCANNER
         */

        document
            .getElementById(
                "scannerButton"
            )
            .addEventListener(
                "click",
                openScanner
            );


        /*
         * MODAL PRODOTTO
         */

        document
            .getElementById(
                "closeProductButton"
            )
            .addEventListener(
                "click",
                closeProductModal
            );


        document
            .getElementById(
                "cancelProductButton"
            )
            .addEventListener(
                "click",
                closeProductModal
            );


        deleteProductButton
            .addEventListener(
                "click",
                deleteCurrentProduct
            );


        productForm
            .addEventListener(
                "submit",
                saveProductFromForm
            );


        /*
         * RICERCA
         */

        searchInput
            .addEventListener(
                "input",
                renderProducts
            );


        /*
         * FILTRI
         */

        var filterButtons =
            document.querySelectorAll(
                ".filter-button"
            );


        for (
            i = 0;
            i < filterButtons.length;
            i++
        ) {

            filterButtons[i].addEventListener(
                "click",
                function () {

                    setFilter(
                        this.getAttribute(
                            "data-filter"
                        )
                    );

                }
            );

        }


        /*
         * CHIUSURA SCANNER
         */

        document
            .getElementById(
                "closeScannerButton"
            )
            .addEventListener(
                "click",
                closeScanner
            );


        document
            .getElementById(
                "manualScannerClose"
            )
            .addEventListener(
                "click",
                closeScanner
            );


        /*
         * EVENT DELEGATION PRODOTTI
         */

        productsContainer
            .addEventListener(
                "click",
                function (
                    event
                ) {

                    var target =
                        event.target;


                    var button =
                        target.closest
                            ? target.closest(
                                "button"
                              )
                            : null;


                    if (!button) {
                        return;
                    }


                    var id =
                        button.getAttribute(
                            "data-id"
                        );


                    if (!id) {
                        return;
                    }


                    if (
                        button.classList.contains(
                            "js-minus"
                        )
                    ) {

                        changeQuantity(
                            id,
                            -1
                        );

                    }


                    else if (
                        button.classList.contains(
                            "js-plus"
                        )
                    ) {

                        changeQuantity(
                            id,
                            1
                        );

                    }


                    else if (
                        button.classList.contains(
                            "js-edit"
                        )
                    ) {

                        var product =
                            findProductById(
                                id
                            );


                        if (product) {

                            openProductModal(
                                product
                            );

                        }

                    }

                }
            );


        /*
         * CHIUSURA MODAL PRODOTTO
         */

        productModal.addEventListener(
            "click",
            function (
                event
            ) {

                if (
                    event.target ===
                    productModal
                ) {

                    closeProductModal();

                }

            }
        );


        /*
         * CHIUSURA SCANNER
         */

        scannerModal.addEventListener(
            "click",
            function (
                event
            ) {

                if (
                    event.target ===
                    scannerModal
                ) {

                    closeScanner();

                }

            }
        );


        /*
         * ESC
         */

        document.addEventListener(
            "keydown",
            function (
                event
            ) {

                if (
                    event.key ===
                    "Escape"
                ) {

                    if (
                        productModal
                            .classList
                            .contains(
                                "active"
                            )
                    ) {

                        closeProductModal();

                    }


                    if (
                        scannerModal
                            .classList
                            .contains(
                                "active"
                            )
                    ) {

                        closeScanner();

                    }

                }

            }
        );


        /*
         * BACKGROUND APP
         */

        document.addEventListener(
            "visibilitychange",
            function () {

                if (
                    document.hidden &&
                    scannerRunning
                ) {

                    stopScanner();

                }

            }
        );


        window.addEventListener(
            "pagehide",
            function () {

                stopScanner();

            }
        );

    }


    /* =========================================================
       START
    ========================================================= */

    loadProducts();

    setupEvents();

    renderProducts();

})();
</script>

</body>
</html>
