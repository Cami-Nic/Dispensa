
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7bbf6a">
<title>La Mia Dispensa</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7f4;color:#29372d;font-family:system-ui,-apple-system,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
main{max-width:850px;margin:auto;padding:20px 16px}
.hidden{display:none!important}
h1{font-size:27px;margin:0 0 5px}
h2{margin:0;font-size:23px}
.muted{color:#78857d;font-size:14px}
.top{display:flex;align-items:center;gap:12px;margin:12px 0 25px}
.logo{font-size:35px;background:white;border-radius:17px;padding:10px}
.top button{margin-left:auto}
button{border:0;border-radius:12px;padding:11px 15px}
.primary,.add{background:#7bbf6a;color:white;font-weight:700}
.secondary{background:#edf2eb;color:#425343}
.danger{background:#fff0ee;color:#b64238}
.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.category{background:white;border-radius:20px;min-height:135px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:700}
.category span{font-size:37px}
.header{display:flex;align-items:center;gap:12px;margin:8px 0 18px}
.header button{font-size:22px;background:white}
.toolbar{display:flex;gap:8px;margin-bottom:12px}
input,select{width:100%;padding:12px;border:1px solid #dce4dc;border-radius:12px;background:white;color:#29372d}
.toolbar input{flex:1;min-width:0}
.filters{display:flex;gap:8px;margin:12px 0}
.filter.active{background:#e3f2dd;color:#356c2e}
.products{display:grid;gap:10px}
.product{display:flex;align-items:center;gap:10px;background:white;border-radius:16px;padding:12px}
.product.low{outline:2px solid #e57368}
.product img,.emoji{width:52px;height:52px;border-radius:12px;object-fit:cover;display:grid;place-items:center;background:#f0f4ee;font-size:28px;flex-shrink:0}
.info{flex:1;min-width:0}
.name{font-weight:700;overflow-wrap:anywhere}
.small{font-size:12px;color:#78857d}
.lowlabel{color:#c34c42;font-size:12px;font-weight:700}
.controls{display:flex;align-items:center;gap:4px}
.controls button{padding:7px 10px;background:#edf2eb}
.qty{min-width:20px;text-align:center;font-weight:700}
.add{width:100%;margin-top:15px;padding:15px}
.empty{background:white;border-radius:16px;padding:30px 15px;text-align:center;color:#78857d}
.card{max-width:430px;margin:8vh auto;background:white;padding:24px;border-radius:22px}
.card label,.field label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
.card input{margin-bottom:8px}
.card button{width:100%;margin-top:12px}
.error{color:#b42318;font-size:14px}
#loginStatus{font-size:13px;color:#78857d}
.modal{position:fixed;inset:0;background:#17251b99;display:flex;align-items:center;justify-content:center;padding:12px;z-index:5;overflow:auto}
.dialog{background:white;width:100%;max-width:520px;max-height:94vh;overflow:auto;border-radius:20px;padding:20px}
.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dialoghead h2{font-size:21px}
.field{margin:10px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;margin-top:16px}
.actions button{flex:1}

/* Scanner grande e centrato su iPad */
#scannerModal {
  padding: 8px;
}

#scannerModal .scanner-dialog {
  width: 100%;
  max-width: 1000px;
  height: 94vh;
  max-height: 94vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding: 16px;
  margin: auto;
}

#scannerModal .dialoghead {
  flex: 0 0 auto;
  margin-bottom: 10px;
}

#reader {
  width: 100%;
  flex: 1 1 auto;
  min-height: 0;
  margin: 0 auto 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#reader video {
  max-width: 100% !important;
  object-fit: contain !important;
}

#reader__scan_region {
  width: 100% !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}

#reader__dashboard {
  flex: 0 0 auto;
  width: 100%;
}

#scannerModal .scanner-help {
  flex: 0 0 auto;
  margin: 4px 0 10px;
}

#scannerModal .scanner-close {
  flex: 0 0 auto;
  width: 100%;
}

@media (max-width: 1024px) {
  #scannerModal .scanner-dialog {
    width: 100%;
    max-width: none;
    height: 96vh;
    max-height: 96vh;
    padding: 12px;
  }
}


/* Scanner spostato verso l'alto su iPad */
#scannerModal {
  align-items: flex-start !important;
  justify-content: center !important;
  padding: 4px !important;
}

#scannerModal .scanner-dialog {
  width: 100% !important;
  max-width: 1000px !important;
  height: 94vh !important;
  max-height: 94vh !important;
  margin: 0 auto !important;
  padding: 10px !important;
  overflow-y: auto !important;
  display: flex;
  flex-direction: column;
}

#scannerModal .dialoghead {
  flex: 0 0 auto;
  margin-bottom: 4px;
}

#reader {
  width: 100% !important;
  flex: 0 0 auto;
  margin: 0 auto 8px !important;
  min-height: 320px;
  overflow: hidden;
}

#reader video {
  width: 100% !important;
  max-width: 100% !important;
  height: auto !important;
  object-fit: contain !important;
}

#reader__scan_region {
  width: 100% !important;
  min-height: 280px;
}

#scannerModal .scanner-help {
  flex: 0 0 auto;
  margin: 4px 0 8px;
}

#scannerModal .scanner-close {
  flex: 0 0 auto;
  margin-bottom: 4px;
}

@media (orientation: landscape) and (max-width: 1024px) {
  #scannerModal .scanner-dialog {
    height: 98vh !important;
    max-height: 98vh !important;
  }

  #reader {
    min-height: 220px;
  }

  #reader__scan_region {
    min-height: 200px;
  }
}

@media(max-width:600px){
 .categories{grid-template-columns:1fr}
 .category{min-height:85px;flex-direction:row;justify-content:flex-start;padding:14px 22px}
 .category span{font-size:30px}
 .product{gap:7px;padding:9px}
 .product img,.emoji{width:42px;height:42px}
 .controls{gap:2px}
 .controls button{padding:7px}
}
  
/* CORREZIONE SAFARI iPad: scanner sempre in alto */
#scannerModal {
  position: fixed !important;
  top: 0 !important;
  right: 0 !important;
  bottom: auto !important;
  left: 0 !important;

  height: 100vh !important;
  height: -webkit-fill-available !important;

  padding: 0 !important;
  margin: 0 !important;

  display: block !important;
  overflow-y: auto !important;
  -webkit-overflow-scrolling: touch;
  box-sizing: border-box !important;
}

#scannerModal.hidden {
  display: none !important;
}

#scannerModal .scanner-dialog {
  position: relative !important;
  top: 0 !important;
  left: 0 !important;
  transform: none !important;

  width: 100% !important;
  max-width: 100% !important;

  height: auto !important;
  max-height: none !important;
  min-height: 0 !important;

  margin: 0 auto !important;
  padding: 8px !important;
  border-radius: 0 0 14px 14px !important;

  display: flex !important;
  flex-direction: column !important;
  justify-content: flex-start !important;
  align-items: stretch !important;

  overflow: visible !important;
  box-sizing: border-box !important;
}

#scannerModal .dialoghead {
  flex: 0 0 auto !important;
  margin: 0 0 6px !important;
  padding: 0 !important;
}

#scannerModal #reader {
  position: relative !important;
  top: 0 !important;
  flex: 0 0 auto !important;
  width: 100% !important;
  height: auto !important;
  min-height: 0 !important;
  margin: 0 auto 8px !important;
  padding: 0 !important;
  overflow: hidden !important;
}

#scannerModal #reader video {
  display: block !important;
  width: 100% !important;
  max-width: 100% !important;
  height: auto !important;
  object-fit: contain !important;
}

#scannerModal .scanner-help {
  margin: 4px 0 8px !important;
}

#scannerModal .scanner-close {
  width: 100% !important;
  margin: 0 !important;
}

</style>
</head>
<body>

<main id="loginScreen">
  <div class="card">
    <div class="logo" style="display:inline-block">🛒</div>
    <h1>La Mia Dispensa</h1>
    <p class="muted">Accedi alla tua dispensa personale.</p>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="primary" id="loginButton" type="submit">Accedi</button>
    </form>
    <p id="loginStatus" role="status"></p>
    <p id="loginError" class="error" role="alert"></p>
  </div>
</main>

<main id="home" class="hidden">
  <div class="top">
    <div class="logo">🛒</div>
    <div><h1>La Mia Dispensa</h1><div class="muted">Scegli una categoria</div></div>
    <button class="secondary" id="logout">Esci</button>
  </div>
  <div class="categories">
    <button class="category" data-action="category" data-cat="cibo"><span>🍎</span>Cibo</button>
    <button class="category" data-action="category" data-cat="bagno"><span>🧴</span>Prodotti bagno</button>
    <button class="category" data-action="category" data-cat="pulizia"><span>🧹</span>Prodotti pulizia</button>
  </div>
</main>

<main id="categoryScreen" class="hidden">
  <div class="header">
    <button data-action="home" aria-label="Indietro">←</button>
    <div><h2 id="categoryTitle">Cibo</h2><div class="muted">I tuoi prodotti</div></div>
  </div>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Cerca prodotto...">
    <button class="secondary" data-action="scan" aria-label="Scansiona barcode">📷</button>
  </div>
  <div class="filters">
    <button id="allFilter" class="filter active" data-action="filter" data-filter="all">Tutti</button>
    <button id="lowFilter" class="filter" data-action="filter" data-filter="low">🔴 Scorte basse</button>
  </div>
  <div id="products" class="products"></div>
  <button class="add" data-action="new">＋ Aggiungi prodotto</button>
</main>

<div id="productModal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="dialog">
    <div class="dialoghead"><h2 id="formTitle">Aggiungi prodotto</h2><button data-action="closeForm">✕</button></div>
    <form id="productForm">
      <div class="field"><label for="pName">Nome prodotto *</label><input id="pName" required></div>
      <div class="two">
        <div class="field"><label for="pBrand">Marca</label><input id="pBrand"></div>
        <div class="field"><label for="pFormat">Formato</label><input id="pFormat" placeholder="Es. 450 g"></div>
      </div>
      <div class="two">
        <div class="field"><label for="pQty">Quantità</label><input id="pQty" type="number" min="0" step="1" value="1"></div>
        <div class="field"><label for="pMin">Scorta minima</label><input id="pMin" type="number" min="0" step="1" value="" placeholder="Lascia vuoto se non serve"></div>
      </div>
      <div class="field"><label for="pCat">Categoria</label>
        <select id="pCat">
          <option value="cibo">Cibo</option>
          <option value="bagno">Prodotti bagno</option>
          <option value="pulizia">Prodotti pulizia</option>
        </select>
      </div>
      <div class="field"><label for="pBarcode">Barcode</label><input id="pBarcode" inputmode="numeric"></div>
      <div class="field"><label for="pImage">URL immagine</label><input id="pImage" type="url" placeholder="https://..."></div>
      <div class="actions">
        <button type="button" class="danger hidden" id="deleteProduct">Elimina</button>
        <button type="button" class="secondary" data-action="closeForm">Annulla</button>
        <button class="primary" id="saveButton" type="submit">Salva</button>
      </div>
    </form>
  </div>
</div>



<div id="scannerModal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="dialog scanner-dialog">
    <div class="dialoghead">
      <h2>Scansiona barcode</h2>
      <button data-action="closeScan">✕</button>
    </div>

    <div id="reader"></div>

    <p class="muted scanner-help">
      Consenti l'accesso alla fotocamera quando richiesto.
    </p>

    <button class="secondary scanner-close" data-action="closeScan">
      Chiudi scanner
    </button>
  </div>
</div>


<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
(function () {
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyDd1tEuQeo4Bk7wjRJL-zkkSQXTbmq7wb4",
    authDomain: "la-mia-dispensa-a3a62.firebaseapp.com",
    projectId: "la-mia-dispensa-a3a62",
    storageBucket: "la-mia-dispensa-a3a62.firebasestorage.app",
    messagingSenderId: "806958296645",
    appId: "1:806958296645:web:7dbfa0b8d37757a2dbfd2c"
  };

  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();

  var user = null;
  var inventoryRef = null;
  var products = [];
  var category = "cibo";
  var filter = "all";
  var editingId = null;
  var busy = false;
  var scanner = null;
  var categories = {
    cibo: {name:"Cibo", icon:"🍎"},
    bagno: {name:"Prodotti bagno", icon:"🧴"},
    pulizia: {name:"Prodotti pulizia", icon:"🧹"}
  };

  function $(id) { return document.getElementById(id); }
  function escapeHTML(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function num(v) {
    var n = Number(v);
    return isFinite(n) && n > 0 ? Math.floor(n) : 0;
  }
  function newId() {
    return "p-" + Date.now() + "-" + Math.floor(Math.random()*1000000);
  }
  function low(p) { return num(p.quantity) < num(p.minStock); }
  function setScreen(id) {
    ["loginScreen","home","categoryScreen"].forEach(function(k) {
      $(k).classList.toggle("hidden", k !== id);
    });
  }
  function showError(message) { $("loginError").textContent = message || ""; }

  function cleanProduct(p) {
    return {
      id:String(p.id || newId()),
      name:String(p.name || ""),
      brand:String(p.brand || ""),
      format:String(p.format || ""),
      quantity:num(p.quantity),
      minStock:num(p.minStock),
      category:categories[p.category] ? p.category : "cibo",
      barcode:String(p.barcode || ""),
      image:String(p.image || "")
    };
  }

  function findProduct(id) {
    return products.find(function(p) { return p.id === id; });
  }

  function openCategory(cat) {
    if (!user || !categories[cat]) return;
    category = cat;
    filter = "all";
    $("categoryTitle").textContent = categories[cat].name;
    $("search").value = "";
    updateFilters();
    setScreen("categoryScreen");
    render();
  }

  function updateFilters() {
    $("allFilter").classList.toggle("active", filter === "all");
    $("lowFilter").classList.toggle("active", filter === "low");
  }

  function render() {
    if (!user) return;
    var q = $("search").value.trim().toLowerCase();
    var list = products.filter(function(p) {
      var match = (p.name + " " + p.brand + " " + p.format + " " + p.barcode).toLowerCase().indexOf(q) !== -1;
      return p.category === category && match && (filter !== "low" || low(p));
    }).sort(function(a,b) { return a.name.localeCompare(b.name); });

    if (!list.length) {
      $("products").innerHTML = '<div class="empty">📦<br><br>Nessun prodotto trovato.<br>Puoi aggiungerne uno con il pulsante qui sotto.</div>';
      return;
    }

    $("products").innerHTML = list.map(function(p) {
      var picture = p.image && /^https?:\/\//i.test(p.image)
        ? '<img src="' + escapeHTML(p.image) + '" alt="Foto di ' + escapeHTML(p.name) + '" loading="lazy" referrerpolicy="no-referrer">'
        : '<div class="emoji">' + categories[p.category].icon + '</div>';
      return '<article class="product ' + (low(p) ? 'low' : '') + '">' +
        picture + '<div class="info">' +
        (p.brand ? '<div class="small">' + escapeHTML(p.brand) + '</div>' : '') +
        '<div class="name">' + escapeHTML(p.name) + '</div>' +
        (p.format ? '<div class="small">' + escapeHTML(p.format) + '</div>' : '') +
        (low(p) ? '<div class="lowlabel">🔴 Scorta bassa</div>' : '') +
        '</div><div class="controls">' +
        '<button data-action="qty" data-id="' + escapeHTML(p.id) + '" data-delta="-1" aria-label="Diminuisci">−</button>' +
        '<span class="qty">' + num(p.quantity) + '</span>' +
        '<button data-action="qty" data-id="' + escapeHTML(p.id) + '" data-delta="1" aria-label="Aumenta">＋</button>' +
        '<button data-action="edit" data-id="' + escapeHTML(p.id) + '" aria-label="Modifica">✏️</button>' +
        '</div></article>';
    }).join("");

    Array.prototype.forEach.call($("products").querySelectorAll("img"), function(img) {
      img.onerror = function() {
        var el = document.createElement("div");
        el.className = "emoji"; el.textContent = "📦";
        img.parentNode.replaceChild(el, img);
      };
    });
  }

  // Un singolo documento per utente. Non legge né scrive localStorage.
  function saveInventory(nextProducts) {
    if (!user || !inventoryRef) {
      return Promise.reject(new Error("Non sei autenticata."));
    }
    if (busy) {
      return Promise.reject(new Error("Attendi che termini il salvataggio precedente."));
    }
    busy = true;
    var safe = nextProducts.map(cleanProduct);
    return inventoryRef.set({
      products: safe,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function() {
      products = safe;
      render();
    }).catch(function(error) {
      console.error("Firestore:", error);
      alert("Salvataggio non riuscito (" + error.code + "). Controlla la connessione e le regole Firestore.");
      throw error;
    }).finally(function() {
      busy = false;
    });
  }

  function loadInventory() {
    products = [];
    $("products").innerHTML = '<div class="empty">Caricamento…</div>';
    inventoryRef = db.collection("inventories").doc(user.uid);

    inventoryRef.get().then(function(doc) {
      if (!user) return;
      products = doc.exists && Array.isArray(doc.data().products)
        ? doc.data().products.map(cleanProduct) : [];
      render();
    }).catch(function(error) {
      console.error("Lettura Firestore:", error);
      $("products").innerHTML = '<div class="empty">Impossibile caricare la dispensa. Controlla le regole Firestore.</div>';
      alert("Errore di caricamento (" + error.code + "). Verifica che l'UID nelle regole Firestore corrisponda al tuo account.");
    });
  }

  function changeQuantity(id, delta) {
    if (busy) return;
    var p = findProduct(id);
    if (!p) return;
    var next = products.map(function(item) { return Object.assign({}, item); });
    var target = next.find(function(item) { return item.id === id; });
    target.quantity = Math.max(0, num(target.quantity) + delta);
    saveInventory(next).catch(function(){});
  }

  function openForm(p) {
    if (!user) return;
    editingId = p ? p.id : null;
    $("formTitle").textContent = p ? "Modifica prodotto" : "Aggiungi prodotto";
    $("pName").value = p ? p.name : "";
    $("pBrand").value = p ? p.brand : "";
    $("pFormat").value = p ? p.format : "";
    $("pQty").value = p ? num(p.quantity) : 1;
    $("pMin").value = p ? num(p.minStock) : "";
    $("pCat").value = p ? p.category : category;
    $("pBarcode").value = p ? p.barcode : "";
    $("pImage").value = p ? p.image : "";
    $("deleteProduct").classList.toggle("hidden", !p);
    $("productModal").classList.remove("hidden");
  }

  function closeForm() {
    $("productModal").classList.add("hidden");
    editingId = null;
  }

  $("productForm").addEventListener("submit", function(event) {
    event.preventDefault();
    if (!user || busy) return;
    var name = $("pName").value.trim();
    if (!name) { alert("Inserisci il nome del prodotto."); return; }

    var image = $("pImage").value.trim();
    if (image && !/^https?:\/\//i.test(image)) {
      alert("L'URL dell'immagine deve iniziare con https:// o http://.");
      return;
    }

    var p = cleanProduct({
      id:editingId || newId(),
      name:name,
      brand:$("pBrand").value.trim(),
      format:$("pFormat").value.trim(),
      quantity:$("pQty").value,
      minStock:$("pMin").value,
      category:$("pCat").value,
      barcode:$("pBarcode").value.trim(),
      image:image
    });

    var next = products.filter(function(item) { return item.id !== p.id; });
    next.push(p);
    $("saveButton").disabled = true;

    saveInventory(next).then(function() {
      category = p.category;
      filter = "all";
      $("search").value = "";
      $("categoryTitle").textContent = categories[category].name;
      updateFilters();
      closeForm();
      setScreen("categoryScreen");
      render();
    }).catch(function() {
      // Il prodotto non viene presentato come salvato se Firestore rifiuta la scrittura.
    }).finally(function() {
      $("saveButton").disabled = false;
    });
  });

  $("deleteProduct").addEventListener("click", function() {
    if (!editingId || busy) return;
    var p = findProduct(editingId);
    if (!p || !confirm('Eliminare "' + p.name + '"?')) return;
    var next = products.filter(function(item) { return item.id !== editingId; });
    saveInventory(next).then(closeForm).catch(function(){});
  });

  $("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();
    showError("");
    $("loginButton").disabled = true;
    $("loginButton").textContent = "Accesso in corso…";
    auth.signInWithEmailAndPassword($("email").value.trim(), $("password").value)
      .catch(function(error) {
        console.error("Login:", error);
        showError("Accesso non riuscito. Controlla email e password e verifica che Email/Password sia abilitato in Firebase.");
      })
      .finally(function() {
        $("loginButton").disabled = false;
        $("loginButton").textContent = "Accedi";
      });
  });

  $("logout").addEventListener("click", function() {
    auth.signOut().catch(function(error) {
      alert("Non è stato possibile uscire: " + error.message);
    });
  });

  $("search").addEventListener("input", render);

  // Scanner barcode
  function stopScanner() {
    var s = scanner;
    scanner = null;
    if (!s) return Promise.resolve();
    return (s.stop().catch(function(){})).then(function() {
      try { s.clear(); } catch(e) {}
      $("reader").innerHTML = "";
    });
  }

  function closeScan() {
    $("scannerModal").classList.add("hidden");
    stopScanner();
  }

  function scanBarcode(code) {
    closeScan();

    // Se il prodotto è già presente nella dispensa, incrementa la quantità.
    var existing = products.find(function(p) {
      return String(p.barcode || "") === String(code);
    });
    if (existing) {
      changeQuantity(existing.id, 1);
      return;
    }

    // Apri subito il modulo: il barcode resta disponibile anche se OFF non risponde.
    openForm(null);
    $("pBarcode").value = code;
    $("pName").value = "";
    $("pBrand").value = "";
    $("pFormat").value = "";
    $("pImage").value = "";

    var url = "https://world.openfoodfacts.org/api/v2/product/" +
      encodeURIComponent(code) +
      ".json?fields=code,status,product_name,product_name_it,generic_name,generic_name_it,brands,quantity,image_front_url,image_front_small_url,image_url,selected_images";

    fetch(url, { headers: { "Accept": "application/json" } })
      .then(function(r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function(data) {
        if (!data || data.status !== 1 || !data.product) {
          alert("Prodotto non trovato su Open Food Facts. Il barcode è stato mantenuto: puoi compilare i dati manualmente.");
          return;
        }

        var p = data.product;

        // Usa il primo nome non vuoto disponibile, senza sovrascrivere con stringhe vuote.
        var name = p.product_name_it || p.product_name ||
          p.generic_name_it || p.generic_name || "";
        var brand = p.brands || "";
        var format = p.quantity || "";

        // Preferisci la foto frontale; prova poi gli altri campi immagine disponibili.
        var image = p.image_front_url ||
          p.image_front_small_url ||
          p.image_url ||
          (p.selected_images && p.selected_images.front &&
            p.selected_images.front.display &&
            (p.selected_images.front.display.it ||
             p.selected_images.front.display.en ||
             Object.values(p.selected_images.front.display)[0])) ||
          "";

        if (name) $("pName").value = name;
        if (brand) $("pBrand").value = brand;
        if (format) $("pFormat").value = format;

        if (typeof image === "string" && /^https?:\/\//i.test(image)) {
          $("pImage").value = image;
        }

        if (!name && !image) {
          alert("Open Food Facts ha trovato il codice, ma non ha restituito nome o immagine. Puoi completare i campi manualmente.");
        } else if (!image) {
          alert("Prodotto trovato su Open Food Facts, ma non è disponibile una foto. Puoi aggiungere un URL immagine manualmente.");
        }
      })
      .catch(function(error) {
        console.error("Open Food Facts:", error);
        alert("Non riesco a recuperare il prodotto online. Il barcode è stato mantenuto: controlla la connessione e inserisci i dati manualmente.");
      });
  }



function openScan() {
  if (!user) return;

  if (location.protocol !== "https:" &&
      location.hostname !== "localhost") {
    alert("La fotocamera richiede HTTPS.");
    return;
  }

  if (typeof Html5Qrcode === "undefined") {
    alert("Lo scanner non è disponibile. Ricarica la pagina.");
    return;
  }

  $("scannerModal").classList.remove("hidden");
  $("reader").innerHTML = "";

  scanner = new Html5Qrcode("reader");

  // Dimensioni ampie per codici a barre lineari.
  var readerWidth = $("reader").clientWidth || window.innerWidth;
  var readerHeight = $("reader").clientHeight ||
    Math.round(window.innerHeight * 0.60);

  var qrWidth = Math.min(
    Math.floor(readerWidth * 0.94),
    900
  );

  var qrHeight = Math.min(
    Math.floor(readerHeight * 0.45),
    260
  );

  // Evita dimensioni troppo piccole su schermi stretti.
  qrWidth = Math.max(250, qrWidth);
  qrHeight = Math.max(100, qrHeight);

  scanner.start(
    { facingMode: "environment" },
    {
      fps: 10,
      qrbox: {
        width: qrWidth,
        height: qrHeight
      },
      aspectRatio: 1.777,
      disableFlip: true
    },
    function(code) {
      scanBarcode(code);
    },
    function() {}
  ).catch(function(error) {
    console.error("Errore fotocamera:", error);
    alert(
      "Impossibile avviare la fotocamera. " +
      "Controlla i permessi di Safari e che il sito sia aperto tramite HTTPS."
    );
    closeScan();
  });
}


  document.addEventListener("click", function(event) {
    var el = event.target.closest("[data-action]");
    if (!el) return;
    var action = el.dataset.action;
    if (action === "category") openCategory(el.dataset.cat);
    if (action === "home") setScreen("home");
    if (action === "new") openForm(null);
    if (action === "edit") openForm(findProduct(el.dataset.id));
    if (action === "closeForm") closeForm();
    if (action === "scan") openScan();
    if (action === "closeScan") closeScan();
    if (action === "filter") {
      filter = el.dataset.filter;
      updateFilters();
      render();
    }
    if (action === "qty") changeQuantity(el.dataset.id, Number(el.dataset.delta));
  });

  $("productModal").addEventListener("click", function(event) {
    if (event.target === $("productModal")) closeForm();
  });
  $("scannerModal").addEventListener("click", function(event) {
    if (event.target === $("scannerModal")) closeScan();
  });
  document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") { closeForm(); closeScan(); }
  });
  window.addEventListener("pagehide", closeScan);

  auth.onAuthStateChanged(function(authUser) {
    user = authUser;
    products = [];
    inventoryRef = null;
    if (user) {
      showError("");
      setScreen("home");
      loadInventory();
    } else {
      closeForm();
      closeScan();
      setScreen("loginScreen");
    }
  });
}());
</script>
