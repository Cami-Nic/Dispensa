<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#D4E8DC">
<title>La Mia Dispensa</title>
<style>
/* =========================================
   LA MIA DISPENSA — CSS COMPLETO
   Smartphone, iPad e PC
   ========================================= */

   
:root {
  --bg: #f5f7f4;
  --text: #29372d;
  --muted: #78857d;
  --green: #7bbf6a;
  --green-dark: #356c2e;
  --soft: #edf2eb;
  --border: #dce4dc;
  --danger: #b64238;
  --low: #c34c42;
  --radius: 18px;
}

* {
  box-sizing: border-box;
}

html {
  font-size: 17px;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 1rem;
  line-height: 1.45;
}

button,
input,
select {
  font: inherit;
  max-width: 100%;
}

button {
  cursor: pointer;
  border: 0;
  border-radius: 14px;
  padding: 12px 16px;
  min-height: 44px;
  touch-action: manipulation;
}

button:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 3px solid #4d9360;
  outline-offset: 3px;
}

input,
select {
  width: 100%;
  min-height: 50px;
  padding: 13px 15px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: white;
  color: var(--text);
}

main {
  width: 100%;
  max-width: 1180px;
  margin-inline: auto;
  padding: 28px 24px;
}

.hidden {
  display: none !important;
}

h1 {
  margin: 0 0 8px;
  font-size: clamp(2rem, 4vw, 2.7rem);
  line-height: 1.12;
  letter-spacing: -0.035em;
}

h2 {
  margin: 0;
  font-size: clamp(1.5rem, 3vw, 2rem);
  line-height: 1.2;
}

.muted {
  color: var(--muted);
  font-size: 0.95rem;
  line-height: 1.5;
}

/* =========================================
   PULSANTI
   ========================================= */

.primary,
.add {
  background: var(--green);
  color: white;
  font-weight: 700;
  box-shadow: 0 4px 12px #427b3820;
}

.secondary,
.controls button,
.filter {
  background: var(--soft);
  color: #425343;
}

.danger {
  background: #fff0ee;
  color: var(--danger);
}

button.primary,
.top button,
.header button,
.toolbar button {
  min-height: 56px;
  padding: 14px 16px;
  font-size: 1.1rem;
  border-radius: 16px;
}

button.add,
.add {
  width: 100%;
  min-height: 70px;
  margin-top: 20px;
  padding: 16px;
  border-radius: 16px;
  font-size: 1.2rem;
  font-weight: 700;
}

/* =========================================
   BARRA SUPERIORE
   ========================================= */

.top {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 18px 0 30px;
}

.logo {
  flex-shrink: 0;
  font-size: 42px;
  background: white;
  border-radius: 20px;
  padding: 12px;
}

.top button {
  margin-left: auto;
}

.header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 12px 0 22px;
}

.header button {
  min-width: 52px;
  min-height: 52px;
  font-size: 1.5rem;
  background: white;
}

/* =========================================
   CATEGORIE
   ========================================= */

.categories {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
}

.category {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  min-width: 0;
  min-height: 165px;
  padding: 22px;
  border-radius: 24px;
  font-size: 1.2rem;
  font-weight: 700;
  box-shadow: 0 4px 14px #29372d0b;
  transition: transform 0.15s ease;
}

.category:active {
  transform: scale(0.98);
}

.category span {
  font-size: 46px;
}

.environment-casa {
  background: #D4E8DC;
  color: #285C48;
}

.environment-cantina {
  background: #EADCF5;
  color: #684783;
}

.category-cibo {
  background: #FFE2A8;
  color: #855A17;
}

.category-bagno {
  background: #CDE8FA;
  color: #285F83;
}

.category-pulizia {
  background: #F8D8D0;
  color: #914F43;
}

.category-freezer {
  background: #C9EDF0;
  color: #22666D;
}

/* =========================================
   RICERCA E FILTRI
   ========================================= */

.toolbar {
  display: flex;
  align-items: stretch;
  gap: 10px;
  margin-bottom: 16px;
}

.toolbar input {
  flex: 1;
  min-width: 0;
}

.toolbar button {
  min-width: 52px;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 16px 0 20px;
}

.filter {
  min-height: 44px;
  padding: 10px 15px;
}

.filter.active {
  background: #e3f2dd;
  color: var(--green-dark);
}

/* =========================================
   ELENCO E SCHEDE PRODOTTO
   ========================================= */

.products {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-items: stretch;
  gap: 16px;
}

.product {
  display: flex;
  align-items: stretch;
  gap: 10px;
  min-width: 0;
  min-height: 185px;
  padding: 16px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 14px #29372d0a;
}

.product.low {
  outline: 2px solid #e57368;
}

.product.empty-stock {
  outline: 2px solid var(--danger);
  background: #fff8f7;
}

.product img,
.product .emoji {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 56px;
  height: 56px;
  max-width: 30%;
  border-radius: 14px;
  object-fit: cover;
  background: #f0f4ee;
  font-size: 30px;
}

/* Informazioni prodotto */

.product .info {
  display: flex;
  flex: 1;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  min-width: 0;
}

.product .name {
  order: 1;
  max-width: 100%;
  font-size: 1.05rem;
  font-weight: 700;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.product .info > .small {
  order: 2;
  max-width: 100%;
  color: var(--muted);
  font-size: 0.85rem;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

/* Avviso scorta bassa */

.product .lowlabel {
  order: 3;
  margin-top: auto;
  padding-top: 12px;
  color: var(--low);
  font-size: 0.85rem;
  font-weight: 700;
  line-height: 1.25;
  white-space: normal;
  overflow-wrap: anywhere;
}

/* Controlli quantità e modifica */

.product .controls {
  display: flex;
  flex-shrink: 0;
  flex-direction: row;
  flex-wrap: nowrap;
  align-items: center;
  justify-content: flex-end;
  align-self: flex-end;
  gap: 5px;
}

.product .controls button {
  flex-shrink: 0;
  min-width: 40px;
  min-height: 42px;
  padding: 6px;
  border-radius: 12px;
  font-size: 1rem;
}

.product .controls .qty {
  min-width: 24px;
  text-align: center;
  font-size: 1rem;
  font-weight: 700;
}

.empty {
  padding: 36px 18px;
  background: white;
  border-radius: 18px;
  text-align: center;
  color: var(--muted);
}

/* =========================================
   LOGIN E SCHEDE
   ========================================= */

.card {
  width: 100%;
  max-width: 560px;
  margin: 8vh auto;
  padding: 30px;
  background: white;
  border-radius: 24px;
}

.card label,
.field label {
  display: block;
  margin: 14px 0 7px;
  font-size: 0.9rem;
  font-weight: 700;
}

.card input {
  margin-bottom: 8px;
}

.card button {
  width: 100%;
  margin-top: 12px;
}

.error {
  color: #b42318;
  font-size: 0.9rem;
}

#loginStatus {
  color: var(--muted);
  font-size: 0.85rem;
}

/* =========================================
   FINESTRE MODALI
   ========================================= */

.modal {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
  overflow: auto;
  background: #17251b99;
}

.dialog {
  width: 100%;
  max-width: 680px;
  max-height: 94vh;
  max-height: 94dvh;
  padding: 24px;
  overflow: auto;
  background: white;
  border-radius: 22px;
}

.dialoghead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.dialoghead h2 {
  font-size: 1.4rem;
}

.field {
  margin: 14px 0;
}

.two {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.actions button {
  flex: 1;
}

/* =========================================
   SCANNER BARCODE
   ========================================= */

#scannerModal {
  position: fixed !important;
  inset: 0 !important;
  z-index: 99999 !important;
  display: flex;
  align-items: flex-start !important;
  justify-content: center !important;
  padding: 0 !important;
  overflow-y: auto !important;
  -webkit-overflow-scrolling: touch;
}

#scannerModal.hidden {
  display: none !important;
}

#scannerModal .scanner-dialog {
  position: relative !important;
  width: 100% !important;
  max-width: 1000px !important;
  height: auto !important;
  max-height: none !important;
  margin: 0 !important;
  padding: 16px !important;
  overflow: visible !important;
  box-sizing: border-box !important;
  border-radius: 0 0 20px 20px !important;
}

#scannerModal .dialoghead {
  margin: 0 0 12px !important;
}

#reader {
  display: block !important;
  width: 100% !important;
  min-height: 0 !important;
  height: auto !important;
  margin: 0 0 12px !important;
  padding: 0 !important;
  overflow: hidden !important;
}

#reader video {
  display: block !important;
  width: 100% !important;
  max-width: 100% !important;
  height: auto !important;
  object-fit: contain !important;
}

#scannerModal .scanner-help {
  margin: 8px 0 12px !important;
}

#scannerModal .scanner-close {
  width: 100% !important;
}

#reader__dashboard {
  display: block !important;
  width: 100% !important;
  max-width: 100% !important;
  margin: 8px auto 0 !important;
  padding: 8px 0 !important;
  box-sizing: border-box !important;
  text-align: center !important;
}

#reader__dashboard button,
#reader__dashboard select {
  max-width: 100% !important;
  margin: 4px auto !important;
}

#reader__dashboard_section,
#reader__dashboard_section_csr {
  width: 100% !important;
  text-align: center !important;
}

/* =========================================
   IPAD E TABLET
   ========================================= */

@media screen and (min-width: 601px) and (max-width: 1024px) {
  main {
    padding: 24px;
  }

  .categories {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
  }

  .category {
    min-height: 155px;
  }

  .products {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  .product {
    min-height: 180px;
    padding: 14px;
    gap: 10px;
  }

  .product img,
  .product .emoji {
    width: 48px;
    height: 48px;
  }

  .product .controls {
    gap: 4px;
  }

  .product .controls button {
    min-width: 36px;
    min-height: 42px;
    padding: 5px;
  }

  .card {
    max-width: 620px;
  }

  .dialog {
    max-width: 760px;
  }
}

/* =========================================
   SMARTPHONE
   ========================================= */

@media screen and (max-width: 600px) {
  html {
    font-size: 16px;
  }

  main {
    padding: 18px 14px;
  }

  h1 {
    font-size: 2rem;
  }

  h2 {
    font-size: 1.5rem;
  }

  .top {
    flex-wrap: wrap;
    gap: 12px;
    margin: 14px 0 24px;
  }

  .logo {
    font-size: 36px;
    padding: 10px;
  }

  .header,
  .toolbar {
    gap: 8px;
  }

  .header {
    flex-wrap: wrap;
  }

  .toolbar {
    flex-wrap: nowrap;
  }

  .toolbar input {
    min-width: 0;
  }

  .toolbar button {
    min-width: 46px;
    min-height: 50px;
    padding: 8px;
  }

  .categories {
    grid-template-columns: minmax(0, 1fr);
    gap: 12px;
  }

  .category {
    flex-direction: row;
    justify-content: flex-start;
    min-height: 100px;
    padding: 16px 20px;
    border-radius: 20px;
    font-size: 1.1rem;
  }

  .category span {
    font-size: 38px;
  }

  .products {
    grid-template-columns: minmax(0, 1fr);
    gap: 12px;
  }

  .product {
    min-height: 175px;
    gap: 8px;
    padding: 12px;
    border-radius: 18px;
  }

  .product img,
  .product .emoji {
    width: 42px;
    height: 42px;
    font-size: 25px;
    border-radius: 10px;
  }

  .product .name {
    font-size: 0.98rem;
  }

  .product .info > .small,
  .product .lowlabel {
    font-size: 0.78rem;
  }

  .product .lowlabel {
    padding-top: 10px;
  }

  .product .controls {
    gap: 3px;
  }

  .product .controls button {
    min-width: 32px;
    min-height: 40px;
    padding: 4px;
    border-radius: 10px;
    font-size: 0.9rem;
  }

  .product .controls .qty {
    min-width: 19px;
    font-size: 0.9rem;
  }

  .filters {
    gap: 7px;
  }

  .filters button {
    min-height: 40px;
    padding: 8px 11px;
    font-size: 0.85rem;
  }

  .card {
    max-width: 100%;
    margin: 4vh auto;
    padding: 22px 18px;
  }

  .dialog {
    padding: 20px 16px;
    border-radius: 20px;
  }

  .two {
    grid-template-columns: minmax(0, 1fr);
    gap: 0;
  }

  .actions {
    flex-direction: column;
  }

  .actions button {
    width: 100%;
  }

  button.primary,
  .top button,
  .header button {
    min-height: 52px;
    padding: 12px;
  }

  button.add,
  .add {
    min-height: 64px;
    font-size: 1.1rem;
  }

  #scannerModal .scanner-dialog {
    padding: 12px !important;
  }

  #scannerModal .dialoghead h2 {
    font-size: 1.25rem;
  }
}

/* =========================================
   ACCESSIBILITÀ
   ========================================= */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}
   
/* Pulsante scanner: icona fotocamera più grande */
.toolbar button[data-action="scan"] {
  font-size: 3.2rem;
  min-width: 76px;
  min-height: 70px;
  padding: 8px;
}

/* Pulsanti quantità e modifica più grandi su smartphone */
@media (max-width: 600px) {
  .controls {
    gap: 6px;
  }

  .controls button {
    min-width: 46px;
    min-height: 48px;
    padding: 6px;
    font-size: 1.35rem;
    border-radius: 12px;
  }

  .controls .qty {
    min-width: 28px;
    font-size: 1.1rem;
  }
}
/* =========================================
   PULSANTI PIÙ GRANDI E FACILI DA TOCCARE
   ========================================= */

/* Pulsanti principali */
button.primary,
.top button,
.header button,
.toolbar button {
  min-height: 64px;
  padding: 16px 22px;
  font-size: 1.2rem;
  border-radius: 18px;
}

/* Aggiungi prodotto */
button.add,
.add {
  min-height: 82px;
  padding: 20px;
  font-size: 1.35rem;
  font-weight: 800;
  border-radius: 20px;
}

/* Quantità, meno, più e matita */
.product .controls {
  gap: 7px;
}

.product .controls button {
  min-width: 52px;
  min-height: 56px;
  padding: 8px;
  font-size: 1.3rem;
  font-weight: 700;
  border-radius: 14px;
}

/* Numero della quantità */
.product .controls .qty {
  min-width: 30px;
  font-size: 1.2rem;
  font-weight: 800;
}

/* iPad */
@media (min-width: 601px) and (max-width: 1024px) {
  .product .controls button {
    min-width: 46px;
    min-height: 52px;
  }
}

/* Smartphone */
@media (max-width: 600px) {
  button.primary,
  .top button,
  .header button,
  .toolbar button {
    min-height: 58px;
    padding: 12px;
    font-size: 1.1rem;
  }

  button.add,
  .add {
    min-height: 76px;
    font-size: 1.2rem;
  }

  .product .controls {
    gap: 4px;
  }

  .product .controls button {
    min-width: 44px;
    min-height: 48px;
    padding: 5px;
    font-size: 1.15rem;
  }

  .product .controls .qty {
    min-width: 24px;
    font-size: 1.05rem;
  }
}
</style>
</head>
<body>

<!-- ACCESSO -->
<main id="loginScreen">
  <div class="card">
    <div class="logo" style="display:inline-block">🛒</div>
    <h1>La Mia Dispensa</h1>
    <p class="muted">Accedi alla tua dispensa personale.</p>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="primary" id="loginButton" type="submit">Accedi</button>
    </form>
    <p id="loginStatus" role="status"></p>
    <p id="loginError" class="error" role="alert"></p>
  </div>
</main>

<!-- HOME: SCELTA AMBIENTE -->
<main id="home" class="hidden">
  <div class="top">
    <div class="logo">🛒</div>
    <div>
      <h1>La Mia Dispensa</h1>
      <div class="muted">Scegli un ambiente</div>
    </div>
    <button class="secondary" id="logout">Esci</button>
  </div>

  <div class="categories">
    <button class="category environment-casa"
            data-action="environment" data-env="casa">
      <span>🏠</span>Casa
    </button>

    <button class="category environment-cantina"
            data-action="environment" data-env="cantina">
      <span>🪜</span>Cantina
    </button>
  </div>
</main>

<!-- SCELTA CATEGORIA DELL'AMBIENTE -->
<main id="environmentScreen" class="hidden">
  <div class="header">
    <button data-action="home" aria-label="Torna alla home">←</button>
    <div>
      <h2 id="environmentTitle">Casa</h2>
      <div class="muted">Scegli una categoria</div>
    </div>
  </div>

  <div class="categories">
    <button class="category category-cibo"
            data-action="category" data-cat="cibo" data-env="casa">
      <span>🍎</span>Cibo
    </button>

    <button class="category category-bagno"
            data-action="category" data-cat="bagno" data-env="casa">
      <span>🛁</span>Bagno
    </button>

    <button class="category category-pulizia"
            data-action="category" data-cat="pulizia" data-env="cantina">
      <span>🧴</span>Pulizia
    </button>

    <button class="category category-freezer"
            data-action="category" data-cat="freezer" data-env="cantina">
      <span>🧊</span>Freezer
    </button>
  </div>
</main>

<!-- ELENCO PRODOTTI -->
<main id="categoryScreen" class="hidden">
  <div class="header">
    <button data-action="backEnvironment" aria-label="Torna alle categorie">←</button>
    <div>
      <h2 id="categoryTitle">Cibo</h2>
      <div class="muted">I tuoi prodotti</div>
    </div>
  </div>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Cerca prodotto...">
    <button class="secondary" data-action="scan" aria-label="Scansiona barcode">📷</button>
  </div>

  <div class="filters">
    <button id="allFilter" class="filter active" data-action="filter" data-filter="all">Tutti</button>
    <button id="lowFilter" class="filter" data-action="filter" data-filter="low">🟠 Scorte basse</button>
    <button id="emptyFilter" class="filter" data-action="filter" data-filter="empty">🔴 Terminati</button>
  </div>

  <div id="products" class="products"></div>
  <button class="add" data-action="new">＋ Aggiungi prodotto</button>
</main>

<!-- MODULO PRODOTTO -->
<div id="productModal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="dialog">
    <div class="dialoghead">
      <h2 id="formTitle">Aggiungi prodotto</h2>
      <button data-action="closeForm" aria-label="Chiudi">✕</button>
    </div>

    <form id="productForm">
      <div class="field">
        <label for="pName">Nome prodotto *</label>
        <input id="pName" required>
      </div>

      <div class="two">
        <div class="field">
          <label for="pBrand">Marca</label>
          <input id="pBrand">
        </div>
        <div class="field">
          <label for="pFormat">Formato</label>
          <input id="pFormat" placeholder="Es. 450 g">
        </div>
      </div>

      <div class="two">
        <div class="field">
          <label for="pQty">Quantità</label>
          <input id="pQty" type="number" min="0" step="1" value="1">
        </div>
        <div class="field">
          <label for="pMin">Scorta minima</label>
          <input id="pMin" type="number" min="0" step="1" value="" placeholder="Facoltativa">
        </div>
      </div>

      <div class="field">
        <label for="pCat">Categoria</label>
        <select id="pCat">
          <option value="cibo">🍎 Cibo</option>
          <option value="bagno">🛁 Bagno</option>
          <option value="pulizia">🧴 Pulizia</option>
          <option value="freezer">🧊 Freezer</option>
        </select>
      </div>

      <div class="field">
        <label for="pBarcode">Barcode</label>
        <input id="pBarcode" inputmode="numeric">
      </div>

      <div class="field">
        <label for="pImage">URL immagine</label>
        <input id="pImage" type="url" placeholder="https://...">
      </div>

      <div class="actions">
        <button type="button" class="danger hidden" id="deleteProduct">Elimina</button>
        <button type="button" class="secondary" data-action="closeForm">Annulla</button>
        <button class="primary" id="saveButton" type="submit">Salva</button>
      </div>
    </form>
  </div>
</div>

<!-- SCANNER BARCODE -->
<div id="scannerModal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="dialog scanner-dialog">
    <div class="dialoghead">
      <h2>Scansiona barcode</h2>
      <button data-action="closeScan" aria-label="Chiudi scanner">✕</button>
    </div>
    <div id="reader"></div>
    <p class="muted scanner-help">Consenti l'accesso alla fotocamera quando richiesto.</p>
    <button class="secondary scanner-close" data-action="closeScan">Chiudi scanner</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
(function () {
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyDd1tEuQeo4Bk7wjRJL-zkkSQXTbmq7wb4",
    authDomain: "la-mia-dispensa-a3a62.firebaseapp.com",
    projectId: "la-mia-dispensa-a3a62",
    storageBucket: "la-mia-dispensa-a3a62.firebasestorage.app",
    messagingSenderId: "806958296645",
    appId: "1:806958296645:web:7dbfa0b8d37757a2dbfd2c"
  };

  firebase.initializeApp(firebaseConfig);

  var auth = firebase.auth();
  var db = firebase.firestore();

  var user = null;
  var inventoryRef = null;
  var products = [];
  var category = "cibo";
  var currentEnvironment = "casa";
  var filter = "all";
  var editingId = null;
  var busy = false;
  var scanner = null;

  var categories = {
    cibo: {
      name: "Cibo",
      icon: "🍎",
      environment: "casa"
    },
    bagno: {
      name: "Bagno",
      icon: "🛁",
      environment: "casa"
    },
    pulizia: {
      name: "Pulizia",
      icon: "🧴",
      environment: "cantina"
    },
    freezer: {
      name: "Freezer",
      icon: "🧊",
      environment: "cantina"
    }
  };

  function $(id) {
    return document.getElementById(id);
  }

  function escapeHTML(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c];
    });
  }

  function num(v) {
    var n = Number(v);
    return isFinite(n) && n > 0 ? Math.floor(n) : 0;
  }

  function newId() {
    return "p-" + Date.now() + "-" + Math.floor(Math.random() * 1000000);
  }

  function low(p) {
    return num(p.quantity) < num(p.minStock);
  }

  function setScreen(id) {
    ["loginScreen", "home", "environmentScreen", "categoryScreen"].forEach(function(k) {
      $(k).classList.toggle("hidden", k !== id);
    });
  }

  function showError(message) {
    $("loginError").textContent = message || "";
  }

  function cleanProduct(p) {
    return {
      id: String(p.id || newId()),
      name: String(p.name || ""),
      brand: String(p.brand || ""),
      format: String(p.format || ""),
      quantity: num(p.quantity),
      minStock: num(p.minStock),
      category: categories[p.category] ? p.category : "cibo",
      barcode: String(p.barcode || ""),
      image: String(p.image || "")
    };
  }

  function findProduct(id) {
    return products.find(function(p) {
      return p.id === id;
    });
  }

  /* Navigazione ambienti */
  function openEnvironment(env) {
    if (!user || (env !== "casa" && env !== "cantina")) return;

    currentEnvironment = env;

    $("environmentTitle").textContent =
      env === "casa" ? "Casa 🏠" : "Cantina 🪜";

    Array.prototype.forEach.call(
      $("environmentScreen").querySelectorAll("[data-env]"),
      function(button) {
        button.classList.toggle("hidden", button.dataset.env !== env);
      }
    );

    setScreen("environmentScreen");
  }

  function backToEnvironment() {
    openEnvironment(currentEnvironment);
  }

  function openCategory(cat) {
    if (!user || !categories[cat]) return;

    category = cat;
    currentEnvironment = categories[cat].environment;
    filter = "all";

    $("categoryTitle").textContent = categories[cat].name;
    $("search").value = "";

    updateFilters();
    setScreen("categoryScreen");
    render();
  }

  function updateFilters() {
    $("allFilter").classList.toggle("active", filter === "all");
    $("lowFilter").classList.toggle("active", filter === "low");
    $("emptyFilter").classList.toggle("active", filter === "empty");
  }

  /* Visualizzazione prodotti */
  function render() {
    if (!user) return;

    var q = $("search").value.trim().toLowerCase();

    var list = products.filter(function(p) {
      var match = (
        p.name + " " + p.brand + " " + p.format + " " + p.barcode
      ).toLowerCase().indexOf(q) !== -1;

      return p.category === category &&
        match &&
        (
          filter === "all" ||
          (filter === "low" && low(p) && num(p.quantity) > 0) ||
          (filter === "empty" && num(p.quantity) === 0)
        );
    }).sort(function(a, b) {
      return a.name.localeCompare(b.name);
    });

    if (!list.length) {
      $("products").innerHTML =
        '<div class="empty">📦<br><br>Nessun prodotto trovato.' +
        '<br>Puoi aggiungerne uno con il pulsante qui sotto.</div>';
      return;
    }

    $("products").innerHTML = list.map(function(p) {
      var picture = p.image && /^https?:\/\//i.test(p.image)
        ? '<img src="' + escapeHTML(p.image) +
          '" alt="Foto di ' + escapeHTML(p.name) +
          '" loading="lazy" referrerpolicy="no-referrer">'
        : '<div class="emoji">' + categories[p.category].icon + '</div>';

      return '<article class="product ' +
        (num(p.quantity) === 0 ? 'empty-stock' : (low(p) ? 'low' : '')) +
        '">' +
        picture +
        '<div class="info">' +
        (p.brand ? '<div class="small">' + escapeHTML(p.brand) + '</div>' : '') +
        '<div class="name">' + escapeHTML(p.name) + '</div>' +
        (p.format ? '<div class="small">' + escapeHTML(p.format) + '</div>' : '') +
        (low(p) ? '<div class="lowlabel">🔴 Scorta bassa</div>' : '') +
        '</div>' +
        '<div class="controls">' +
        '<button data-action="qty" data-id="' + escapeHTML(p.id) +
          '" data-delta="-1" aria-label="Diminuisci quantità">−</button>' +
        '<span class="qty">' + num(p.quantity) + '</span>' +
        '<button data-action="qty" data-id="' + escapeHTML(p.id) +
          '" data-delta="1" aria-label="Aumenta quantità">＋</button>' +
        '<button data-action="edit" data-id="' + escapeHTML(p.id) +
          '" aria-label="Modifica prodotto">✏️</button>' +
        '</div></article>';
    }).join("");

    Array.prototype.forEach.call($("products").querySelectorAll("img"), function(img) {
      img.onerror = function() {
        var el = document.createElement("div");
        el.className = "emoji";
        el.textContent = "📦";
        img.parentNode.replaceChild(el, img);
      };
    });
  }

  /* Salvataggio Firestore */
  function saveInventory(nextProducts) {
    if (!user || !inventoryRef) {
      return Promise.reject(new Error("Non sei autenticata."));
    }

    if (busy) {
      return Promise.reject(new Error("Attendi che termini il salvataggio precedente."));
    }

    busy = true;
    var safe = nextProducts.map(cleanProduct);

    return inventoryRef.set({
      products: safe,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function() {
      products = safe;
      render();
    }).catch(function(error) {
      console.error("Firestore:", error);
      alert(
        "Salvataggio non riuscito (" + (error.code || "errore") +
        "). Controlla la connessione e le regole Firestore."
      );
      throw error;
    }).finally(function() {
      busy = false;
    });
  }

  function loadInventory() {
    products = [];
    $("products").innerHTML = '<div class="empty">Caricamento…</div>';
    inventoryRef = db.collection("inventories").doc(user.uid);

    inventoryRef.get().then(function(doc) {
      if (!user) return;

      products = doc.exists && Array.isArray(doc.data().products)
        ? doc.data().products.map(cleanProduct)
        : [];

      render();
    }).catch(function(error) {
      console.error("Lettura Firestore:", error);
      $("products").innerHTML =
        '<div class="empty">Impossibile caricare la dispensa. Controlla le regole Firestore.</div>';

      alert(
        "Errore di caricamento (" + (error.code || "errore") +
        "). Verifica le regole Firestore."
      );
    });
  }

  function changeQuantity(id, delta) {
    if (busy) return;

    var p = findProduct(id);
    if (!p) return;

    var next = products.map(function(item) {
      return Object.assign({}, item);
    });

    var target = next.find(function(item) {
      return item.id === id;
    });

    target.quantity = Math.max(0, num(target.quantity) + delta);
    saveInventory(next).catch(function() {});
  }

  /* Modulo aggiunta e modifica */
  function openForm(p) {
    if (!user) return;

    editingId = p ? p.id : null;

    $("formTitle").textContent = p ? "Modifica prodotto" : "Aggiungi prodotto";
    $("pName").value = p ? p.name : "";
    $("pBrand").value = p ? p.brand : "";
    $("pFormat").value = p ? p.format : "";
    $("pQty").value = p ? num(p.quantity) : 1;
    $("pMin").value = p && num(p.minStock) > 0 ? num(p.minStock) : "";
    $("pCat").value = p ? p.category : category;
    $("pBarcode").value = p ? p.barcode : "";
    $("pImage").value = p ? p.image : "";

    $("deleteProduct").classList.toggle("hidden", !p);
    $("productModal").classList.remove("hidden");
  }

  function closeForm() {
    $("productModal").classList.add("hidden");
    editingId = null;
  }

  $("productForm").addEventListener("submit", function(event) {
    event.preventDefault();
    if (!user || busy) return;

    var name = $("pName").value.trim();

    if (!name) {
      alert("Inserisci il nome del prodotto.");
      return;
    }

    var image = $("pImage").value.trim();

    if (image && !/^https?:\/\//i.test(image)) {
      alert("L'URL dell'immagine deve iniziare con https:// o http://.");
      return;
    }

    var p = cleanProduct({
      id: editingId || newId(),
      name: name,
      brand: $("pBrand").value.trim(),
      format: $("pFormat").value.trim(),
      quantity: $("pQty").value,
      minStock: $("pMin").value,
      category: $("pCat").value,
      barcode: $("pBarcode").value.trim(),
      image: image
    });

    var next = products.filter(function(item) {
      return item.id !== p.id;
    });

    next.push(p);
    $("saveButton").disabled = true;

    saveInventory(next).then(function() {
      category = p.category;
      currentEnvironment = categories[category].environment;
      filter = "all";
      $("search").value = "";
      $("categoryTitle").textContent = categories[category].name;

      updateFilters();
      closeForm();
      setScreen("categoryScreen");
      render();
    }).catch(function() {
      // Il prodotto non viene presentato come salvato se la scrittura fallisce.
    }).finally(function() {
      $("saveButton").disabled = false;
    });
  });

  $("deleteProduct").addEventListener("click", function() {
    if (!editingId || busy) return;

    var p = findProduct(editingId);
    if (!p || !confirm('Eliminare "' + p.name + '"?')) return;

    var next = products.filter(function(item) {
      return item.id !== editingId;
    });

    saveInventory(next).then(closeForm).catch(function() {});
  });

  /* Accesso */
  $("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();
    showError("");

    $("loginButton").disabled = true;
    $("loginButton").textContent = "Accesso in corso…";

    auth.signInWithEmailAndPassword(
      $("email").value.trim(),
      $("password").value
    ).catch(function(error) {
      console.error("Login:", error);
      showError(
        "Accesso non riuscito. Controlla email e password e verifica che Email/Password sia abilitato in Firebase."
      );
    }).finally(function() {
      $("loginButton").disabled = false;
      $("loginButton").textContent = "Accedi";
    });
  });

  $("logout").addEventListener("click", function() {
    auth.signOut().catch(function(error) {
      alert("Non è stato possibile uscire: " + error.message);
    });
  });

  $("search").addEventListener("input", render);

  /* Scanner barcode */
  function stopScanner() {
    var s = scanner;
    scanner = null;

    if (!s) return Promise.resolve();

    return s.stop().catch(function() {}).then(function() {
      try {
        s.clear();
      } catch(e) {}

      $("reader").innerHTML = "";
    });
  }

  function closeScan() {
    $("scannerModal").classList.add("hidden");
    stopScanner();
  }

  function scanBarcode(code) {
    closeScan();

    // Se esiste già un prodotto con questo barcode, aumenta la quantità.
    var existing = products.find(function(p) {
      return String(p.barcode || "") === String(code);
    });

    if (existing) {
      changeQuantity(existing.id, 1);
      return;
    }

    openForm(null);

    $("pBarcode").value = code;
    $("pName").value = "";
    $("pBrand").value = "";
    $("pFormat").value = "";
    $("pImage").value = "";

    var url =
      "https://world.openfoodfacts.org/api/v2/product/" +
      encodeURIComponent(code) +
      ".json?fields=code,status,product_name,product_name_it,generic_name,generic_name_it,brands,quantity,image_front_url,image_front_small_url,image_url,selected_images";

    fetch(url, {
      headers: {"Accept": "application/json"}
    }).then(function(r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function(data) {
      if (!data || data.status !== 1 || !data.product) {
        alert(
          "Prodotto non trovato su Open Food Facts. Il barcode è stato mantenuto: puoi compilare i dati manualmente."
        );
        return;
      }

      var p = data.product;

      var name = p.product_name_it || p.product_name ||
        p.generic_name_it || p.generic_name || "";

      var brand = p.brands || "";
      var format = p.quantity || "";

      var imageUrl = p.image_front_url ||
        p.image_front_small_url ||
        p.image_url ||
        (p.selected_images && p.selected_images.front &&
          p.selected_images.front.display &&
          (p.selected_images.front.display.it ||
           p.selected_images.front.display.en ||
           Object.values(p.selected_images.front.display)[0])) ||
        "";

      if (name) $("pName").value = name;
      if (brand) $("pBrand").value = brand;
      if (format) $("pFormat").value = format;

      if (typeof imageUrl === "string" && /^https?:\/\//i.test(imageUrl)) {
        $("pImage").value = imageUrl;
      }

      if (!name && !imageUrl) {
        alert(
          "Open Food Facts ha trovato il codice, ma non ha restituito nome o immagine. Puoi completare i campi manualmente."
        );
      } else if (!imageUrl) {
        alert(
          "Prodotto trovato su Open Food Facts, ma non è disponibile una foto."
        );
      }
    }).catch(function(error) {
      console.error("Open Food Facts:", error);
      alert(
        "Non riesco a recuperare il prodotto online. Il barcode è stato mantenuto: controlla la connessione e inserisci i dati manualmente."
      );
    });
  }

  function openScan() {
    if (!user) return;

    if (location.protocol !== "https:" && location.hostname !== "localhost") {
      alert("La fotocamera richiede HTTPS.");
      return;
    }

    if (typeof Html5Qrcode === "undefined") {
      alert("Scanner non disponibile. Ricarica la pagina.");
      return;
    }

    if (scanner) return;

    var modal = $("scannerModal");
    var reader = $("reader");

    modal.classList.remove("hidden");
    reader.innerHTML = "";
    modal.scrollTop = 0;

    var formats = [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39
    ];

    var currentScanner = new Html5Qrcode("reader", {
      formatsToSupport: formats,
      verbose: false
    });

    scanner = currentScanner;

    requestAnimationFrame(function() {
      if (scanner !== currentScanner) return;

      var config = {
        fps: 10,
        qrbox: function(width, height) {
          var boxWidth = Math.min(width, Math.floor(width * 0.92));
          var boxHeight = Math.min(150, Math.floor(height * 0.45));

          return {
            width: Math.max(150, boxWidth),
            height: Math.max(60, boxHeight)
          };
        },
        disableFlip: true
      };

      currentScanner.start(
        {facingMode: "environment"},
        config,
        function(code) {
          if (!code || scanner !== currentScanner) return;
          scanBarcode(code);
        },
        function() {
          // Fotogramma senza barcode leggibile.
        }
      ).catch(function(error) {
        console.error("Errore avvio scanner:", error);

        if (scanner === currentScanner) {
          scanner = null;

          try {
            currentScanner.clear();
          } catch(e) {}

          reader.innerHTML = "";
          modal.classList.add("hidden");

          alert(
            "Impossibile avviare la fotocamera. Controlla i permessi del browser e la connessione HTTPS."
          );
        }
      });
    });
  }

  /* Eventi pulsanti */
  document.addEventListener("click", function(event) {
    var el = event.target.closest("[data-action]");
    if (!el) return;

    var action = el.dataset.action;

    if (action === "environment") openEnvironment(el.dataset.env);
    if (action === "category") openCategory(el.dataset.cat);
    if (action === "home") setScreen("home");
    if (action === "backEnvironment") backToEnvironment();
    if (action === "new") openForm(null);
    if (action === "edit") openForm(findProduct(el.dataset.id));
    if (action === "closeForm") closeForm();
    if (action === "scan") openScan();
    if (action === "closeScan") closeScan();

    if (action === "filter") {
      filter = el.dataset.filter;
      updateFilters();
      render();
    }

    if (action === "qty") {
      changeQuantity(el.dataset.id, Number(el.dataset.delta));
    }
  });

  $("productModal").addEventListener("click", function(event) {
    if (event.target === $("productModal")) closeForm();
  });

  $("scannerModal").addEventListener("click", function(event) {
    if (event.target === $("scannerModal")) closeScan();
  });

  document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
      closeForm();
      closeScan();
    }
  });

  window.addEventListener("pagehide", closeScan);

  /* Stato autenticazione Firebase */
  auth.onAuthStateChanged(function(authUser) {
    user = authUser;
    products = [];

    inventoryRef = null;

    if (user) {
      showError("");
      setScreen("home");
      loadInventory();
    } else {
      closeForm();
      closeScan();
      setScreen("loginScreen");
    }
  });

}());
</script>
</body>
</html>
