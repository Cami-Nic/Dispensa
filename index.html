<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#2f7d4a">

    <title>La Mia Dispensa</title>

    <style>
        /* =========================================================
           RESET / COMPATIBILITÀ IOS 12.5.8
           ========================================================= */

        * {
            -webkit-box-sizing: border-box;
            box-sizing: border-box;

            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            min-height: 100%;
            background: #f4f7f5;

            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100vh;

            background: #f4f7f5;
            color: #1e2923;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Helvetica Neue",
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;

            overflow-x: hidden;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
            font-size: 16px;
        }

        button {
            -webkit-appearance: none;
            appearance: none;

            border: 0;

            cursor: pointer;

            touch-action: manipulation;
            -ms-touch-action: manipulation;

            -webkit-user-select: none;
            user-select: none;

            -webkit-tap-highlight-color: transparent;
        }

        button:focus {
            outline: none;
        }

        input,
        select {
            -webkit-appearance: none;
            appearance: none;
        }

        a {
            color: inherit;
        }

        img {
            max-width: 100%;
        }


        /* =========================================================
           VARIABILI
           ========================================================= */

        :root {
            --green: #2f7d4a;
            --green-dark: #23603a;
            --green-light: #eaf6ee;

            --bg: #f4f7f5;
            --white: #ffffff;

            --text: #1e2923;
            --muted: #6f7c74;

            --border: #dfe7e1;

            --danger: #b43a3a;
            --danger-light: #fff0f0;

            --warning: #d48a00;
            --warning-light: #fff5dd;

            --shadow:
                0 8px 24px rgba(25, 50, 35, 0.10);

            --shadow-large:
                0 15px 40px rgba(20, 40, 30, 0.20);

            --radius: 20px;
        }


        /* =========================================================
           STRUTTURA
           ========================================================= */

        body:before {
            content: "";

            display: block;

            width: 100%;
            height: 5px;

            background: var(--green);
        }

        .screen {
            display: none;
            width: 100%;
            min-height: calc(100vh - 5px);
        }

        .screen.active {
            display: block;
        }


        /* =========================================================
           HOME
           ========================================================= */

        .home-screen {
            padding:
                30px
                25px
                40px
                25px;
        }

        .home-container {
            width: 100%;
            max-width: 1100px;

            margin: 0 auto;
        }

        .home-header {
            text-align: center;

            margin: 10px auto 35px;
        }

        .home-logo {
            width: 105px;
            height: 105px;

            margin: 0 auto 20px;

            border-radius: 28px;

            background: var(--green-light);

            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;

            -webkit-box-align: center;
            -ms-flex-align: center;
            align-items: center;

            -webkit-box-pack: center;
            -ms-flex-pack: center;
            justify-content: center;

            font-size: 58px;

            -webkit-box-shadow: var(--shadow);
            box-shadow: var(--shadow);
        }

        .home-title {
            margin: 0;

            color: var(--green-dark);

            font-size: 34px;
            line-height: 1.15;

            font-weight: 800;
        }

        .home-subtitle {
            margin: 10px 0 0;

            color: var(--muted);

            font-size: 17px;
            line-height: 1.5;
        }


        /* =========================================================
           CATEGORIE
           ========================================================= */

        .category-grid {
            width: 100%;

            display: -ms-grid;
            display: grid;

            grid-template-columns: 1fr;

            gap: 18px;

            margin: 0 auto;
        }

        .category-card {
            width: 100%;
            min-height: 220px;

            padding: 25px;

            border: 1px solid var(--border);
            border-radius: 24px;

            background: var(--white);

            color: var(--text);

            text-align: center;

            -webkit-box-shadow: var(--shadow);
            box-shadow: var(--shadow);

            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;

            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;

            -ms-flex-direction: column;
            flex-direction: column;

            -webkit-box-align: center;
            -ms-flex-align: center;
            align-items: center;

            -webkit-box-pack: center;
            -ms-flex-pack: center;
            justify-content: center;
        }

        .category-card:active {
            -webkit-transform: scale(0.98);
            transform: scale(0.98);

            background: #f8fbf9;
        }

        .category-icon {
            width: 105px;
            height: 105px;

            margin-bottom: 18px;

            border-radius: 50%;

            background: var(--green-light);

            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;

            -webkit-box-align: center;
            -ms-flex-align: center;
            align-items: center;

            -webkit-box-pack: center;
            -ms-flex-pack: center;
            justify-content: center;

            font-size: 58px;
        }

        .category-name {
            margin: 0;

            font-size: 23px;
            font-weight: 800;
        }

        .category-description {
            margin: 8px 0 0;

            color: var(--muted);

            font-size: 15px;
        }


        /* =========================================================
           PAGINA CATEGORIA
           ========================================================= */

        .category-screen {
            padding: 20px;
        }

        .category-container {
            width: 100%;
            max-width: 1100px;

            margin: 0 auto;
        }

        .category-top {
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;

            -webkit-box-align: center;
            -ms-flex-align: center;
            align-items: center;

            margin-bottom: 20px;
        }

        .back-button {
            width: 56px;
            min-width: 56px;
            height: 56px;

            padding: 0;

            border-radius: 16px;

            background: var(--white);

            border: 1px solid var(--border);

            color: var(--green-dark);

            font-size: 25px;

            -webkit-box-shadow: var(--shadow);
            box-shadow: var(--shadow);
        }

        .back-button:active {
            -webkit-transform: scale(0.96);
            transform: scale(0.96);
        }

        .category-heading {
            margin-left: 15px;
        }

        .category-heading h1 {
            margin: 0;

            font-size: 27px;
            line-height: 1.2;

            color: var(--green-dark);
        }

        .category-heading p {
            margin: 5px 0 0;

            color: var(--muted);

            font-size: 15px;
        }


        /* =========================================================
           TOOLBAR
           ========================================================= */

        .toolbar {
            width: 100%;

            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;

            gap: 10px;

            margin-bottom: 15px;
        }

        .search-box {
            min-width: 0;

            -webkit-box-flex: 1;
            -ms-flex: 1;
            flex: 1;

            min-height: 58px;

            padding: 0 15px;

            border-radius: 16px;

            background: var(--white);

            border: 1px solid var(--border);

            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;

            -webkit-box-align: center;
            -ms-flex-align: center;
            align-items: center;

            -webkit-box-shadow: var(--shadow);
            box-shadow: var(--shadow);
        }

        .search-icon {
            margin-right: 10px;

            font-size: 22px;
        }

        .search-box input {
            width: 100%;

            min-width: 0;

            padding: 0;

            border: 0;
            outline: 0;

            background: transparent;

            font-size: 16px;
        }

        .scanner-button {
            width: 58px;
            min-width: 58px;
            height: 58px;

            padding: 0;

            border-radius: 16px;

            background: var(--green);

            color: #ffffff;

            font-size: 27px;

            -webkit-box-shadow: var(--shadow);
            box-shadow: var(--shadow);
        }

        .scanner-button:active {
            background: var(--green-dark);

            -webkit-transform: scale(0.96);
            transform: scale(0.96);
        }


        /* =========================================================
           FILTRI
           ========================================================= */

        .filters {
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;

            gap: 10px;

            overflow-x: auto;

            -webkit-overflow-scrolling: touch;

            padding-bottom: 4px;

            margin-bottom: 15px;
        }

        .filter-button {
            min-width: 105px;

            min-height: 48px;

            padding: 10px 15px;

            border-radius: 14px;

            background: var(--white);

            border: 1px solid var(--border);

            color: var(--text);

            font-weight: 700;

            white-space: nowrap;
        }

        .filter-button.active {
            background: var(--green);
            border-color: var(--green);

            color: #ffffff;
        }


        /* =========================================================
           AGGIUNGI PRODOTTO
           ========================================================= */

        .add-product-button {
            width: 100%;

            min-height: 58px;

            margin-bottom: 20px;

            border-radius: 16px;

            background: var(--green);

            color: #ffffff;

            font-size: 17px;
            font-weight: 800;

            -webkit-box-shadow: var(--shadow);
            box-shadow: var(--shadow);
        }

        .add-product-button:active {
            background: var(--green-dark);

            -webkit-transform: scale(0.99);
            transform: scale(0.99);
        }


        /* =========================================================
           PRODOTTI
           ========================================================= */

        .products-list {
            width: 100%;

            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;

            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;

            -ms-flex-direction: column;
            flex-direction: column;

            gap: 14px;
        }

        .product-card {
            width: 100%;

            padding: 15px;

            border-radius: 18px;

            background: var(--white);

            border: 1px solid var(--border);

            -webkit-box-shadow: var(--shadow);
            box-shadow: var(--shadow);

            display: -ms-grid;
            display: grid;

            grid-template-columns:
                82px
                minmax(0, 1fr)
                auto;

            gap: 15px;

            -webkit-box-align: center;
            -ms-flex-align: center;
            align-items: center;
        }

        .product-card.low-stock {
            border: 2px solid #e15a5a;

            background: #fffafa;
        }

        .product-image {
            width: 82px;
            height: 82px;

            border-radius: 15px;

            background: var(--green-light);

            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;

            -webkit-box-align: center;
            -ms-flex-align: center;
            align-items: center;

            -webkit-box-pack: center;
            -ms-flex-pack: center;
            justify-content: center;

            overflow: hidden;

            font-size: 38px;
        }

        .product-image img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .product-info {
            min-width: 0;
        }

        .product-name {
            margin: 0 0 4px;

            font-size: 18px;
            line-height: 1.25;

            font-weight: 800;

            word-break: break-word;
        }

        .product-brand {
            margin: 0 0 7px;

            color: var(--muted);

            font-size: 14px;
        }

        .product-meta {
            margin: 0;

            color: #536159;

            font-size: 13px;

            line-height: 1.5;
        }

        .low-stock-label {
            display: inline-block;

            margin-top: 7px;

            padding: 5px 8px;

            border-radius: 8px;

            background: var(--danger-light);

            color: var(--danger);

            font-size: 12px;
            font-weight: 800;
        }

        .quantity-controls {
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;

            -webkit-box-align: center;
            -ms-flex-align: center;
            align-items: center;

            gap: 6px;
        }

        .quantity-button {
            width: 50px;
            min-width: 50px;
            height: 50px;

            padding: 0;

            border-radius: 14px;

            background: var(--green-light);

            color: var(--green-dark);

            font-size: 25px;
            font-weight: 700;
        }

        .quantity-value {
            min-width: 40px;

            text-align: center;

            font-size: 18px;
            font-weight: 800;
        }

        .edit-button {
            width: 50px;
            min-width: 50px;
            height: 50px;

            padding: 0;

            border-radius: 14px;

            background: #edf1ef;

            color: var(--text);

            font-size: 21px;
        }


        /* =========================================================
           EMPTY
           ========================================================= */

        .empty-products {
            padding: 50px 20px;

            text-align: center;

            color: var(--muted);
        }

        .empty-icon {
            font-size: 52px;

            margin-bottom: 12px;
        }

        .empty-products h3 {
            margin: 0 0 8px;

            color: var(--text);

            font-size: 20px;
        }

        .empty-products p {
            margin: 0;

            line-height: 1.5;
        }


        /* =========================================================
           MODAL
           ========================================================= */

        .modal {
            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100vh;

            z-index: 10000;

            padding:
                18px
                18px
                18px
                18px;

            background: rgba(0, 0, 0, 0.55);

            -webkit-box-align: center;
            -ms-flex-align: center;
            align-items: center;

            -webkit-box-pack: center;
            -ms-flex-pack: center;
            justify-content: center;
        }

        .modal.active {
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;
        }

        .modal-content {
            width: 100%;
            max-width: 620px;
            max-height: 92vh;

            overflow-y: auto;

            -webkit-overflow-scrolling: touch;

            padding: 22px;

            border-radius: 22px;

            background: #ffffff;

            -webkit-box-shadow: var(--shadow-large);
            box-shadow: var(--shadow-large);
        }

        .modal-header {
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;

            -webkit-box-align: center;
            -ms-flex-align: center;
            align-items: center;

            -webkit-box-pack: justify;
            -ms-flex-pack: justify;
            justify-content: space-between;

            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;

            font-size: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;
            font-weight: 800;

            color: #34423a;
        }

        .form-row {
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;

            gap: 12px;
        }

        .form-row .form-group {
            -webkit-box-flex: 1;
            -ms-flex: 1;
            flex: 1;
        }

        .modal-actions {
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;

            gap: 10px;

            margin-top: 22px;
        }

        .modal-actions button {
            -webkit-box-flex: 1;
            -ms-flex: 1;
            flex: 1;
        }

        .delete-button {
            background: var(--danger-light);

            color: var(--danger);
        }


        /* =========================================================
           SCANNER
           ========================================================= */

        #reader {
            width: 100%;
            min-height: 280px;

            margin: 10px 0 15px;

            border-radius: 16px;

            overflow: hidden;

            background: #111111;
        }

        #reader video {
            width: 100% !important;
            height: auto !important;

            max-height: 55vh;

            object-fit: cover;
        }

        #reader select {
            width: 100%;

            min-height: 50px;

            margin-top: 8px;
        }

        .scanner-help {
            margin: 10px 0 18px;

            color: var(--muted);

            text-align: center;

            line-height: 1.5;
        }


        /* =========================================================
           TOAST
           ========================================================= */

        .toast {
            position: fixed;

            left: 50%;

            bottom: 20px;

            z-index: 20000;

            width: calc(100% - 40px);
            max-width: 500px;

            padding: 15px 18px;

            border-radius: 14px;

            background: #202722;

            color: #ffffff;

            text-align: center;

            font-size: 15px;
            font-weight: 700;

            opacity: 0;

            visibility: hidden;

            -webkit-transform:
                translateX(-50%)
                translateY(15px);

            transform:
                translateX(-50%)
                translateY(15px);

            -webkit-transition:
                opacity 0.2s ease,
                -webkit-transform 0.2s ease;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        .toast.show {
            opacity: 1;

            visibility: visible;

            -webkit-transform:
                translateX(-50%)
                translateY(0);

            transform:
                translateX(-50%)
                translateY(0);
        }

        .toast.error {
            background: #9f3030;
        }

        .toast.success {
            background: var(--green-dark);
        }


        /* =========================================================
           TABLET
           ========================================================= */

        @media only screen and (min-width: 600px) {

            .category-grid {
                grid-template-columns:
                    repeat(3, 1fr);

                gap: 20px;
            }

            .category-card {
                min-height: 250px;
            }

            .home-screen {
                padding-left: 35px;
                padding-right: 35px;
            }

            .category-screen {
                padding-left: 35px;
                padding-right: 35px;
            }
        }


        /* =========================================================
           IPAD MINI 2 LANDSCAPE
           ========================================================= */

        @media only screen
        and (min-width: 768px)
        and (max-width: 1100px)
        and (orientation: landscape) {

            .home-screen {
                padding:
                    25px
                    38px
                    35px;
            }

            .home-header {
                margin-bottom: 25px;
            }

            .home-logo {
                width: 90px;
                height: 90px;

                font-size: 50px;
            }

            .home-title {
                font-size: 31px;
            }

            .category-grid {
                max-width: 960px;

                gap: 22px;
            }

            .category-card {
                min-height: 250px;
            }

            .category-icon {
                width: 115px;
                height: 115px;

                font-size: 62px;
            }

            .category-name {
                font-size: 24px;
            }

            .category-screen {
                padding:
                    20px
                    38px
                    35px;
            }

            .category-container {
                max-width: 960px;
            }

            .product-card {
                padding: 18px;
            }

            .product-image {
                width: 90px;
                height: 90px;
            }

            .quantity-button,
            .edit-button {
                width: 54px;
                min-width: 54px;

                height: 54px;
            }

            .scanner-button {
                width: 62px;
                min-width: 62px;
                height: 62px;
            }
        }


        /* =========================================================
           TELEFONI PICCOLI
           ========================================================= */

        @media only screen and (max-width: 420px) {

            .home-screen {
                padding: 22px 15px 30px;
            }

            .home-title {
                font-size: 29px;
            }

            .category-card {
                min-height: 195px;
            }

            .category-icon {
                width: 88px;
                height: 88px;

                font-size: 48px;
            }

            .category-screen {
                padding: 15px;
            }

            .product-card {
                grid-template-columns: 70px minmax(0, 1fr);
            }

            .product-image {
                width: 70px;
                height: 70px;
            }

            .quantity-controls {
                grid-column: 1 / -1;

                width: 100%;

                -webkit-box-pack: end;
                -ms-flex-pack: end;
                justify-content: flex-end;

                padding-top: 8px;
            }

            .form-row {
                display: block;
            }

            .modal-actions {
                -webkit-box-orient: vertical;
                -webkit-box-direction: normal;

                -ms-flex-direction: column;
                flex-direction: column;
            }
        }


        /* =========================================================
           SAFE AREA - FUNZIONA ANCHE SU VERSIONI NUOVE,
           MA NON È NECESSARIA SU IOS 12
           ========================================================= */

        @supports (padding-top: env(safe-area-inset-top)) {

            .modal {
                padding-top:
                    calc(18px + env(safe-area-inset-top));

                padding-bottom:
                    calc(18px + env(safe-area-inset-bottom));
            }
        }

    </style>
</head>

<body>

    <!-- =========================================================
         HOME
         ========================================================= -->

    <main id="homeScreen" class="screen active">

        <div class="home-screen">

            <div class="home-container">

                <header class="home-header">

                    <div class="home-logo">
                        🛒
                    </div>

                    <h1 class="home-title">
                        La Mia Dispensa
                    </h1>

                    <p class="home-subtitle">
                        Tieni sotto controllo tutto quello che hai in casa.
                    </p>

                </header>


                <div class="category-grid">

                    <button
                        type="button"
                        class="category-card"
                        data-category="cibo"
                    >

                        <div class="category-icon">
                            🍎
                        </div>

                        <h2 class="category-name">
                            Cibo
                        </h2>

                        <p class="category-description">
                            Alimenti e bevande
                        </p>

                    </button>


                    <button
                        type="button"
                        class="category-card"
                        data-category="bagno"
                    >

                        <div class="category-icon">
                            🧴
                        </div>

                        <h2 class="category-name">
                            Prodotti bagno
                        </h2>

                        <p class="category-description">
                            Igiene e cura personale
                        </p>

                    </button>


                    <button
                        type="button"
                        class="category-card"
                        data-category="pulizia"
                    >

                        <div class="category-icon">
                            🧹
                        </div>

                        <h2 class="category-name">
                            Prodotti pulizia
                        </h2>

                        <p class="category-description">
                            Casa e pulizie
                        </p>

                    </button>

                </div>

            </div>

        </div>

    </main>


    <!-- =========================================================
         CATEGORIA
         ========================================================= -->

    <main id="categoryScreen" class="screen">

        <div class="category-screen">

            <div class="category-container">

                <div class="category-top">

                    <button
                        type="button"
                        id="backButton"
                        class="back-button"
                        aria-label="Torna alla home"
                    >
                        ←
                    </button>

                    <div class="category-heading">

                        <h1 id="categoryTitle">
                            Cibo
                        </h1>

                        <p id="categorySubtitle">
                            I tuoi prodotti
                        </p>

                    </div>

                </div>


                <div class="toolbar">

                    <div class="search-box">

    <!-- =========================================================
