<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>La Mia Dispensa</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #F5F5F7;
            color: #1D1D1F;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Helvetica Neue",
                Arial,
                sans-serif;
        }

        body {
            min-height: 100vh;
        }

        button,
        input,
        select {
            font: inherit;
            -webkit-appearance: none;
            appearance: none;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        .hidden {
            display: none !important;
        }

        /* =========================================================
           APP
        ========================================================= */

        .app {
            width: 100%;
            max-width: 760px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 0 18px 40px;
        }

        /* =========================================================
           HEADER
        ========================================================= */

        .top-header {
            padding: 28px 4px 24px;
            text-align: center;
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 14px;
            border-radius: 18px;
            background: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #34C759;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            border: 1px solid #E5E5EA;
        }

        .brand-icon svg {
            width: 31px;
            height: 31px;
        }

        .top-header h1 {
            margin: 0;
            font-size: 30px;
            line-height: 1.15;
            font-weight: 700;
            letter-spacing: -0.7px;
        }

        .top-header p {
            margin: 8px 0 0;
            color: #6E6E73;
            font-size: 16px;
            line-height: 1.4;
        }

        /* =========================================================
           SCREENS
        ========================================================= */

        .screen {
            width: 100%;
        }

        /* =========================================================
           HOME
        ========================================================= */

        .home-buttons {
            display: flex;
            flex-direction: column;
            gap: 42px;
            padding: 24px 0 10px;
        }

        .home-card {
            width: 100%;
            min-height: 148px;
            padding: 25px 24px;
            border-radius: 26px;
            background: #FFFFFF;
            border: 1px solid #E5E5EA;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.055);
            display: flex;
            align-items: center;
            text-align: left;
            color: #1D1D1F;
            transition: transform 0.15s ease;
        }

        .home-card-icon {
            flex: 0 0 auto;
            width: 68px;
            height: 68px;
            border-radius: 21px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 20px;
        }

        .home-card-icon svg {
            width: 34px;
            height: 34px;
        }

        .home-card.casa .home-card-icon {
            background: #E8F8EC;
            color: #34C759;
        }

        .home-card.cantina .home-card-icon {
            background: #F2E8F8;
            color: #AF52DE;
        }

        .home-card-content {
            min-width: 0;
            flex: 1;
        }

        .home-card-title {
            display: block;
            font-size: 22px;
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .home-card-subtitle {
            display: block;
            margin-top: 7px;
            color: #6E6E73;
            font-size: 15px;
            line-height: 1.35;
        }

        .home-card-arrow {
            width: 30px;
            height: 30px;
            color: #AEAEB2;
            flex: 0 0 auto;
        }

        /* =========================================================
           INNER HEADER
        ========================================================= */

        .inner-header {
            padding: 20px 0 22px;
        }

        .header-row {
            display: flex;
            align-items: center;
            min-height: 44px;
        }

        .back-button {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: #FFFFFF;
            color: #1D1D1F;
            border: 1px solid #E5E5EA;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
        }

        .back-button svg {
            width: 21px;
            height: 21px;
        }

        .header-title-area {
            margin-left: 12px;
            min-width: 0;
        }

        .header-title-area h2 {
            margin: 0;
            font-size: 25px;
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: -0.4px;
        }

        .header-title-area p {
            margin: 4px 0 0;
            color: #6E6E73;
            font-size: 14px;
        }

        /* =========================================================
           CATEGORY LIST
        ========================================================= */

        .category-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-top: 10px;
        }

        .category-card {
            width: 100%;
            min-height: 98px;
            padding: 18px;
            background: #FFFFFF;
            border: 1px solid #E5E5EA;
            border-radius: 22px;
            box-shadow: 0 7px 22px rgba(0, 0, 0, 0.045);
            display: flex;
            align-items: center;
            text-align: left;
        }

        .category-icon {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            flex: 0 0 auto;
        }

        .category-icon svg {
            width: 29px;
            height: 29px;
        }

        .category-icon.cibo {
            background: #FFF1DF;
            color: #FF9500;
        }

        .category-icon.bagno {
            background: #E4F1FF;
            color: #0A84FF;
        }

        .category-icon.pulizia {
            background: #F1E5F7;
            color: #AF52DE;
        }

        .category-content {
            flex: 1;
            min-width: 0;
        }

        .category-title {
            display: block;
            font-size: 19px;
            font-weight: 650;
        }

        .category-subtitle {
            display: block;
            margin-top: 4px;
            color: #6E6E73;
            font-size: 14px;
        }

        .category-arrow {
            width: 22px;
            height: 22px;
            color: #AEAEB2;
            flex: 0 0 auto;
        }

        /* =========================================================
           CATEGORY SCREEN
        ========================================================= */

        .category-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .primary-button,
        .scanner-button {
            min-height: 48px;
            border-radius: 16px;
            padding: 0 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 600;
        }

        .primary-button {
            flex: 1;
            background: #1D1D1F;
            color: #FFFFFF;
        }

        .scanner-button {
            flex: 1;
            background: #E4F1FF;
            color: #0A84FF;
        }

        .primary-button svg,
        .scanner-button svg {
            width: 20px;
            height: 20px;
        }

        /* =========================================================
           SEARCH
        ========================================================= */

        .search-box {
            position: relative;
            margin-bottom: 12px;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            width: 19px;
            height: 19px;
            transform: translateY(-50%);
            color: #8E8E93;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            height: 50px;
            padding: 0 16px 0 45px;
            border-radius: 16px;
            border: 1px solid #E5E5EA;
            background: #FFFFFF;
            color: #1D1D1F;
            outline: none;
            font-size: 16px;
        }

        .search-input:focus {
            border-color: #B8B8BD;
        }

        /* =========================================================
           FILTERS
        ========================================================= */

        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }

        .filter-button {
            min-height: 38px;
            padding: 0 15px;
            border-radius: 13px;
            background: #E5E5EA;
            color: #3A3A3C;
            font-size: 14px;
            font-weight: 600;
        }

        .filter-button.active {
            background: #1D1D1F;
            color: #FFFFFF;
        }

        /* =========================================================
           PRODUCTS
        ========================================================= */

        .products-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-card {
            background: #FFFFFF;
            border: 1px solid #E5E5EA;
            border-radius: 21px;
            padding: 15px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.04);
        }

        .product-main {
            display: flex;
            align-items: center;
        }

        .product-image {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            background: #F2F2F7;
            overflow: hidden;
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8E8E93;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .product-image svg {
            width: 31px;
            height: 31px;
        }

        .product-info {
            flex: 1;
            min-width: 0;
            margin-left: 14px;
        }

        .product-name {
            font-size: 17px;
            font-weight: 650;
            line-height: 1.25;
            word-break: break-word;
        }

        .product-meta {
            margin-top: 4px;
            color: #6E6E73;
            font-size: 13px;
            line-height: 1.4;
        }

        .low-stock {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 0 8px;
            margin-top: 7px;
            border-radius: 9px;
            background: #FFF0EE;
            color: #FF3B30;
            font-size: 12px;
            font-weight: 650;
        }

        .product-edit {
            width: 40px;
            height: 40px;
            border-radius: 13px;
            background: #F2F2F7;
            color: #6E6E73;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
        }

        .product-edit svg {
            width: 19px;
            height: 19px;
        }

        .quantity-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 14px;
            padding-top: 13px;
            border-top: 1px solid #F0F0F2;
        }

        .quantity-label {
            color: #6E6E73;
            font-size: 13px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-button {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: #F2F2F7;
            color: #1D1D1F;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quantity-button svg {
            width: 17px;
            height: 17px;
        }

        .quantity-number {
            min-width: 32px;
            text-align: center;
            font-size: 17px;
            font-weight: 650;
        }

        .empty-state {
            padding: 42px 20px;
            text-align: center;
            color: #6E6E73;
        }

        .empty-state-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 14px;
            border-radius: 18px;
            background: #EDEDF0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8E8E93;
        }

        .empty-state-icon svg {
            width: 28px;
            height: 28px;
        }

        .empty-state strong {
            display: block;
            color: #1D1D1F;
            font-size: 17px;
            margin-bottom: 5px;
        }

        /* =========================================================
           MODAL
        ========================================================= */

        .modal-overlay {
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.38);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 12px;
        }

        .modal {
            width: 100%;
            max-width: 680px;
            max-height: calc(100vh - 24px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: #FFFFFF;
            border-radius: 27px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
        }

        .close-button {
            width: 40px;
            height: 40px;
            border-radius: 13px;
            background: #F2F2F7;
            color: #6E6E73;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-button svg {
            width: 19px;
            height: 19px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #3A3A3C;
            font-size: 13px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border-radius: 14px;
            border: 1px solid #D1D1D6;
            background: #FFFFFF;
            color: #1D1D1F;
            outline: none;
            font-size: 16px;
        }

        .form-control:focus {
            border-color: #8E8E93;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-button {
            flex: 1;
            min-height: 49px;
            border-radius: 15px;
            font-weight: 650;
        }

        .modal-button.cancel {
            background: #F2F2F7;
            color: #3A3A3C;
        }

        .modal-button.save {
            background: #1D1D1F;
            color: #FFFFFF;
        }

        .modal-button.delete {
            background: #FFF0EE;
            color: #FF3B30;
        }

        /* =========================================================
           SCANNER
        ========================================================= */

        .scanner-overlay {
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            background: #000000;
            display: flex;
            flex-direction: column;
        }

        .scanner-header {
            min-height: 70px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #FFFFFF;
        }

        .scanner-title {
            font-size: 18px;
            font-weight: 650;
        }

        .scanner-close {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.13);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scanner-close svg {
            width: 20px;
            height: 20px;
        }

        #reader {
            width: 100%;
            flex: 1;
            min-height: 300px;
            background: #000000;
            overflow: hidden;
        }

        #reader video {
            width: 100% !important;
            height: auto !important;
            max-height: 70vh;
            object-fit: cover;
        }

        #reader img {
            display: none !important;
        }

        .scanner-info {
            padding: 18px 20px 28px;
            color: #FFFFFF;
            text-align: center;
        }

        .scanner-info p {
            margin: 0;
            color: #C7C7CC;
            font-size: 14px;
        }

        .scanner-frame {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 72%;
            max-width: 330px;
            height: 170px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 22px;
            pointer-events: none;
        }

        /* =========================================================
           TOAST
        ========================================================= */

        .toast {
            position: fixed;
            z-index: 3000;
            left: 50%;
            bottom: 25px;
            transform: translateX(-50%);
            max-width: calc(100% - 40px);
            padding: 12px 17px;
            border-radius: 14px;
            background: rgba(29, 29, 31, 0.94);
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
        }

        /* =========================================================
           SMALL IPAD / LANDSCAPE
        ========================================================= */

        @media (min-width: 600px) {
            .app {
                padding-left: 28px;
                padding-right: 28px;
            }

            .home-buttons {
                padding-top: 35px;
                gap: 52px;
            }

            .home-card {
                min-height: 165px;
                padding: 30px;
            }

            .home-card-icon {
                width: 76px;
                height: 76px;
            }

            .home-card-icon svg {
                width: 38px;
                height: 38px;
            }
        }

        @media (orientation: landscape) and (max-height: 600px) {
            .home-buttons {
                gap: 18px;
                padding-top: 10px;
            }

            .home-card {
                min-height: 105px;
            }

            .modal {
                max-height: calc(100vh - 16px);
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =========================================================
         HOME
    ========================================================== -->

    <section id="homeScreen" class="screen">

        <header class="top-header">

            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor"
                     stroke-width="1.8"
                     stroke-linecap="round"
                     stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M3.5 7.5h17l-1.3 11.2a1.7 1.7 0 0 1-1.7 1.5H6.5a1.7 1.7 0 0 1-1.7-1.5L3.5 7.5z"/>
                    <path d="M8 7.5a4 4 0 0 1 8 0"/>
                    <path d="M8 11h.01"/>
                    <path d="M16 11h.01"/>
                </svg>
            </div>

            <h1>La Mia Dispensa</h1>
            <p>Gestisci facilmente le tue scorte</p>

        </header>


        <div class="home-buttons">

            <button
                type="button"
                id="openCasaButton"
                class="home-card casa">

                <span class="home-card-icon">

                    <svg viewBox="0 0 24 24" fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         stroke-linecap="round"
                         stroke-linejoin="round"
                         aria-hidden="true">

                        <path d="M3.5 10.8 12 3.8l8.5 7"/>
                        <path d="M5.5 9.8v9.7a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9.8"/>
                        <path d="M9.2 20.5v-5.8h5.6v5.8"/>
                    </svg>

                </span>

                <span class="home-card-content">
                    <span class="home-card-title">Dispensa Casa</span>
                    <span class="home-card-subtitle">
                        Cibo e prodotti bagno
                    </span>
                </span>

                <svg
                    class="home-card-arrow"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="m9 5 7 7-7 7"/>
                </svg>

            </button>


            <button
                type="button"
                id="openCantinaButton"
                class="home-card cantina">

                <span class="home-card-icon">

                    <svg viewBox="0 0 24 24" fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         stroke-linecap="round"
                         stroke-linejoin="round"
                         aria-hidden="true">

                        <path d="M4 16.5h12.8"/>
                        <path d="M6.2 16.5 9.4 8h7.1l-2.1 8.5"/>
                        <path d="M9.4 8 8 6.2"/>
                        <path d="M13.5 8 15 5.8"/>
                        <path d="M17.4 16.5v2"/>
                        <path d="M4.5 18.5h15"/>
                    </svg>

                </span>

                <span class="home-card-content">
                    <span class="home-card-title">Dispensa Cantina</span>
                    <span class="home-card-subtitle">
                        Prodotti di pulizia
                    </span>
                </span>

                <svg
                    class="home-card-arrow"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="m9 5 7 7-7 7"/>
                </svg>

            </button>

        </div>

    </section>


    <!-- =========================================================
         DISPENSA
    ========================================================== -->

    <section id="dispensaScreen" class="screen hidden">

        <header class="inner-header">

            <div class="header-row">

                <button
                    type="button"
                    id="backFromDispensaButton"
                    class="back-button"
                    aria-label="Torna alla home">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.9"
                         stroke-linecap="round"
                         stroke-linejoin="round"
                         aria-hidden="true">
                        <path d="M19 12H5"/>
                        <path d="m11 18-6-6 6-6"/>
                    </svg>

                </button>

                <div class="header-title-area">
                    <h2 id="dispensaTitle">Dispensa</h2>
                    <p id="dispensaSubtitle"></p>
                </div>

            </div>

        </header>


        <div id="categoryList" class="category-list"></div>

    </section>


    <!-- =========================================================
         CATEGORY
    ========================================================== -->

    <section id="categoryScreen" class="screen hidden">

        <header class="inner-header">

            <div class="header-row">

                <button
                    type="button"
                    id="backFromCategoryButton"
                    class="back-button"
                    aria-label="Torna indietro">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.9"
                         stroke-linecap="round"
                         stroke-linejoin="round"
                         aria-hidden="true">
                        <path d="M19 12H5"/>
                        <path d="m11 18-6-6 6-6"/>
                    </svg>

                </button>

                <div class="header-title-area">
                    <h2 id="categoryTitle">Cibo</h2>
                    <p id="categorySubtitle"></p>
                </div>

            </div>

        </header>


        <div class="category-actions">

            <button
                type="button"
                id="addProductButton"
                class="primary-button">

<script>
(function () {

    "use strict";

    /* =========================================================
       CONFIGURAZIONE
    ========================================================= */

    var STORAGE_KEY = "laMiaDispensaProdotti";


    /* =========================================================
       DATI CATEGORIE
    ========================================================= */

    var categoryData = {

        cibo: {
            title: "Cibo",
            subtitle: "Dispensa e alimentari",
            icon: "food"
        },

        bagno: {
            title: "Prodotti bagno",

            icon: "bath"
        },

        pulizia: {
            title: "Prodotti pulizia",
            subtitle: "Pulizia della casa",
            icon: "cleaning"
        }

    };


    var dispensaData = {

        casa: {
            title: "Dispensa Casa",
            subtitle: "Cibo e prodotti bagno",
            categories: ["cibo", "bagno"]
        },

        cantina: {
            title: "Dispensa Cantina",
            subtitle: "Prodotti di pulizia",
            categories: ["pulizia"]
        }

    };


    /* =========================================================
       STATO
    ========================================================= */

    var products = [];

    var currentCategory = "cibo";
    var currentFilter = "all";
    var currentDispensa = null;

    var editingProductId = null;

    var html5QrCode = null;
    var scannerStarting = false;
    var scannerRunning = false;
    var scannerLocked = false;

    var toastTimer = null;


    /* =========================================================
       ELEMENTI DOM
    ========================================================= */

    var homeScreen = document.getElementById("homeScreen");
    var dispensaScreen = document.getElementById("dispensaScreen");
    var categoryScreen = document.getElementById("categoryScreen");

    var dispensaTitle = document.getElementById("dispensaTitle");
    var dispensaSubtitle = document.getElementById("dispensaSubtitle");

    var categoryList = document.getElementById("categoryList");

    var categoryTitle = document.getElementById("categoryTitle");
    var categorySubtitle = document.getElementById("categorySubtitle");

    var productsList = document.getElementById("productsList");

    var searchInput = document.getElementById("searchInput");

    var filterAllButton = document.getElementById("filterAllButton");
    var filterLowButton = document.getElementById("filterLowButton");

    var productModal = document.getElementById("productModal");
    var modalTitle = document.getElementById("modalTitle");

    var productForm = document.getElementById("productForm");

    var productName = document.getElementById("productName");
    var productBrand = document.getElementById("productBrand");
    var productFormat = document.getElementById("productFormat");
    var productQuantity = document.getElementById("productQuantity");
    var productMinStock = document.getElementById("productMinStock");
    var productCategory = document.getElementById("productCategory");
    var productBarcode = document.getElementById("productBarcode");
    var productImage = document.getElementById("productImage");

    var deleteProductButton = document.getElementById("deleteProductButton");

    var scannerOverlay = document.getElementById("scannerOverlay");

    var toast = document.getElementById("toast");


    /* =========================================================
       ICON SVG
    ========================================================= */

    function iconSvg(name, className) {

        var cls = className || "";

        var icons = {

            food:
                '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                    '<path d="M12 20.5c-3.8-2.4-6.4-5.8-6.4-9.2C5.6 8.4 7.3 6.5 9.5 6.5c1.2 0 2 .6 2.5 1.3.5-.7 1.3-1.3 2.5-1.3 2.2 0 3.9 1.9 3.9 4.8 0 3.4-2.6 6.8-6.4 9.2z"/>' +
                    '<path d="M12 7.8c-.3-2.1.5-3.6 2.4-4.3"/>' +
                '</svg>',

            bath:
                '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                    '<path d="M6 8.5h10.5a2 2 0 0 1 2 2V17H5V9.5a1 1 0 0 1 1-1z"/>' +
                    '<path d="M8 8.5V6.2a2.2 2.2 0 0 1 4.2-.9"/>' +
                    '<path d="M5 17h14"/>' +
                    '<path d="M8 20v-3"/>' +
                    '<path d="M16 20v-3"/>' +
                '</svg>',

            cleaning:
                '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                    '<path d="m5 19 9-9"/>' +
                    '<path d="m11.5 5.5 2-2 5 5-2 2z"/>' +
                    '<path d="m4 20 3-3"/>' +
                    '<path d="M15.5 14.5c2.5.5 4 2 4 3.5 0 1.2-1 2-2.2 2H12"/>' +
                '</svg>',

            package:
                '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                    '<path d="m4 7 8-4 8 4v10l-8 4-8-4z"/>' +
                    '<path d="m4 7 8 4 8-4"/>' +
                    '<path d="M12 11v10"/>' +
                '</svg>',

            pencil:
                '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                    '<path d="m4 16.8-.7 3.9 3.9-.7L18.7 8.5l-3.2-3.2z"/>' +
                    '<path d="m13.9 6.1 3.2 3.2"/>' +
                '</svg>',

            plus:
                '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">' +
                    '<path d="M12 5v14"/><path d="M5 12h14"/>' +
                '</svg>',

            minus:
                '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">' +
                    '<path d="M5 12h14"/>' +
                '</svg>',

            arrow:
                '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                    '<path d="m9 5 7 7-7 7"/>' +
                '</svg>',

            box:
                '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                    '<path d="m4 7 8-4 8 4v10l-8 4-8-4z"/>' +
                    '<path d="m4 7 8 4 8-4"/>' +
                    '<path d="M12 11v10"/>' +
                '</svg>'

        };

        return icons[name] || icons.package;
    }


    /* =========================================================
       INIT
    ========================================================= */

    function init() {

        loadProducts();

        bindEvents();

        showScreen("home");

    }


    /* =========================================================
       EVENTI
    ========================================================= */

    function bindEvents() {

        document
            .getElementById("openCasaButton")
            .addEventListener("click", function () {
                openDispensa("casa");
            });


        document
            .getElementById("openCantinaButton")
            .addEventListener("click", function () {
                openDispensa("cantina");
            });


        document
            .getElementById("backFromDispensaButton")
            .addEventListener("click", function () {
                goHome();
            });


        document
            .getElementById("backFromCategoryButton")
            .addEventListener("click", function () {
                goBackFromCategory();
            });


        document
            .getElementById("addProductButton")
            .addEventListener("click", function () {
                openProductModal(null);
            });


        document
            .getElementById("scannerButton")
            .addEventListener("click", function () {
                openScanner();
            });


        document
            .getElementById("closeScannerButton")
            .addEventListener("click", function () {
                closeScanner();
            });


        document
            .getElementById("closeModalButton")
            .addEventListener("click", function () {
                closeProductModal();
            });


        document
            .getElementById("cancelModalButton")
            .addEventListener("click", function () {
                closeProductModal();
            });


        deleteProductButton.addEventListener(
            "click",
            deleteCurrentProduct
        );


        productForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();

                saveProductFromForm();

            }
        );


        searchInput.addEventListener(
            "input",
            function () {

                renderProducts();

            }
        );


        filterAllButton.addEventListener(
            "click",
            function () {

                currentFilter = "all";

                updateFilterButtons();

                renderProducts();

            }
        );


        filterLowButton.addEventListener(
            "click",
            function () {

                currentFilter = "low";

                updateFilterButtons();

                renderProducts();

            }
        );


        productModal.addEventListener(
            "click",
            function (event) {

                if (event.target === productModal) {
                    closeProductModal();
                }

            }
        );

    }


    /* =========================================================
       SCREEN
    ========================================================= */

    function showScreen(screenName) {

        homeScreen.classList.add("hidden");
        dispensaScreen.classList.add("hidden");
        categoryScreen.classList.add("hidden");

        if (screenName === "home") {
            homeScreen.classList.remove("hidden");
        }

        if (screenName === "dispensa") {
            dispensaScreen.classList.remove("hidden");
        }

        if (screenName === "category") {
            categoryScreen.classList.remove("hidden");
        }

        window.scrollTo(0, 0);

    }


    /* =========================================================
       DISPENSA
    ========================================================= */

    function openDispensa(dispensa) {

        currentDispensa = dispensa;

        var data = dispensaData[dispensa];

        if (!data) {
            return;
        }

        dispensaTitle.textContent = data.title;
        dispensaSubtitle.textContent = data.subtitle;

        renderDispensaCategories();

        showScreen("dispensa");

    }


    function renderDispensaCategories() {

        categoryList.innerHTML = "";

        var data = dispensaData[currentDispensa];

        if (!data) {
            return;
        }

        for (var i = 0; i < data.categories.length; i++) {

            var categoryKey = data.categories[i];

            var info = categoryData[categoryKey];

            if (!info) {
                continue;
            }

            var button = document.createElement("button");

            button.type = "button";
            button.className = "category-card";

            button.setAttribute(
                "data-category",
                categoryKey
            );


            var iconContainer =
                document.createElement("span");

            iconContainer.className =
                "category-icon " + categoryKey;

            iconContainer.innerHTML =
                iconSvg(info.icon);


            var content =
                document.createElement("span");

            content.className =
                "category-content";


            var title =
                document.createElement("span");

            title.className =
                "category-title";

            title.textContent =
                info.title;


            var subtitle =
                document.createElement("span");

            subtitle.className =
                "category-subtitle";

            subtitle.textContent =
                info.subtitle;


            content.appendChild(title);
            content.appendChild(subtitle);


            var arrow =
                document.createElement("span");

            arrow.className =
                "category-arrow";

            arrow.innerHTML =
                iconSvg("arrow");


            button.appendChild(iconContainer);
            button.appendChild(content);
            button.appendChild(arrow);


            button.addEventListener(
                "click",
                function () {

                    openCategory(
                        this.getAttribute("data-category")
                    );

                }
            );


            categoryList.appendChild(button);

        }

    }


    function goHome() {

        currentDispensa = null;

        showScreen("home");

    }


    function goBackFromCategory() {

        if (currentDispensa) {

            renderDispensaCategories();

            showScreen("dispensa");

        } else {

            goHome();

        }

    }


    /* =========================================================
       CATEGORY
    ========================================================= */

    function openCategory(category) {

        if (!categoryData[category]) {
            return;
        }

        currentCategory = category;
        currentFilter = "all";

        searchInput.value = "";

        categoryTitle.textContent =
            categoryData[category].title;

        categorySubtitle.textContent =
            categoryData[category].subtitle;

        updateFilterButtons();

        renderProducts();

        showScreen("category");

    }


    function updateFilterButtons() {

        filterAllButton.classList.remove("active");
        filterLowButton.classList.remove("active");

        if (currentFilter === "all") {
            filterAllButton.classList.add("active");
        } else {
            filterLowButton.classList.add("active");
        }

    }


    /* =========================================================
       PRODUCTS
    ========================================================= */

    function renderProducts() {

        productsList.innerHTML = "";

        var search =
            String(searchInput.value || "")
                .toLowerCase()
                .replace(/^\s+|\s+$/g, "");


        var filtered = [];


        for (var i = 0; i < products.length; i++) {

            var product = products[i];

            if (product.category !== currentCategory) {
                continue;
            }


            if (
                currentFilter === "low" &&
                !isLowStock(product)
            ) {
                continue;
            }


            var text =
                (
                    String(product.name || "") +
                    " " +
                    String(product.brand || "") +
                    " " +
                    String(product.format || "")
                ).toLowerCase();


            if (
                search &&
                text.indexOf(search) === -1
            ) {
                continue;
            }


            filtered.push(product);

        }


        if (filtered.length === 0) {

            var empty =
                document.createElement("div");

            empty.className =
                "empty-state";


            var emptyIcon =
                document.createElement("div");

            emptyIcon.className =
                "empty-state-icon";

            emptyIcon.innerHTML =
                iconSvg("package");


            var strong =
                document.createElement("strong");

            strong.textContent =
                currentFilter === "low"
                    ? "Nessuna scorta bassa"
                    : "Nessun prodotto";


            var text =
                document.createElement("span");

            text.textContent =
                currentFilter === "low"
                    ? "Tutti i prodotti hanno una quantità sufficiente."
                    : "Aggiungi il primo prodotto a questa categoria.";


            empty.appendChild(emptyIcon);
            empty.appendChild(strong);
            empty.appendChild(text);

            productsList.appendChild(empty);

            return;
        }


        for (var j = 0; j < filtered.length; j++) {

            productsList.appendChild(
                createProductCard(filtered[j])
            );

        }

    }


    function createProductCard(product) {

        var card =
            document.createElement("article");

        card.className =
            "product-card";


        var main =
            document.createElement("div");

        main.className =
            "product-main";


        var image =
            document.createElement("div");

        image.className =
            "product-image";


        if (product.image) {

            var img =
                document.createElement("img");

            img.src =
                product.image;

            img.alt =
                product.name || "Prodotto";


            img.addEventListener(
                "error",
                function () {

                    this.style.display = "none";

                    this.parentNode.innerHTML =
                        iconSvg("package");

                }
            );


            image.appendChild(img);

        } else {

            image.innerHTML =
                iconSvg("package");

        }


        var info =
            document.createElement("div");

        info.className =
            "product-info";


        var name =
            document.createElement("div");

        name.className =
            "product-name";

        name.textContent =
            product.name || "Prodotto";


        var meta =
            document.createElement("div");

        meta.className =
            "product-meta";


        var metaParts = [];

        if (product.brand) {
            metaParts.push(product.brand);
        }

        if (product.format) {
            metaParts.push(product.format);
        }

        meta.textContent =
            metaParts.join(" · ");


        info.appendChild(name);
        info.appendChild(meta);


        if (isLowStock(product)) {

            var low =
                document.createElement("span");

            low.className =
                "low-stock";

            low.textContent =
                "Scorta bassa";

            info.appendChild(low);

        }


        var edit =
            document.createElement("button");

        edit.type = "button";

        edit.className =
            "product-edit";

        edit.setAttribute(
            "aria-label",
            "Modifica " + (product.name || "prodotto")
        );

        edit.innerHTML =
            iconSvg("pencil");


        edit.addEventListener(
            "click",
            function () {

                openProductModal(product.id);

            }
        );


        main.appendChild(image);
        main.appendChild(info);
        main.appendChild(edit);


        var quantityRow =
            document.createElement("div");

        quantityRow.className =
            "quantity-row";


        var quantityLabel =
            document.createElement("span");

        quantityLabel.className =
            "quantity-label";

        quantityLabel.textContent =
            "Quantità disponibile";


        var controls =
            document.createElement("div");

        controls.className =
            "quantity-controls";


        var minus =
            document.createElement("button");

        minus.type = "button";

        minus.className =
            "quantity-button";

        minus.setAttribute(
            "aria-label",
            "Diminuisci quantità"
        );

        minus.innerHTML =
            iconSvg("minus");


        minus.addEventListener(
            "click",
            function () {

                changeQuantity(
                    product.id,
                    -1
                );

            }
        );


        var quantity =
            document.createElement("span");

        quantity.className =
            "quantity-number";

        quantity.textContent =
            String(product.quantity);


        var plus =
            document.createElement("button");

        plus.type = "button";

        plus.className =
            "quantity-button";

        plus.setAttribute(
            "aria-label",
            "Aumenta quantità"
        );

        plus.innerHTML =
            iconSvg("plus");


        plus.addEventListener(
            "click",
            function () {

                changeQuantity(
                    product.id,
                    1
                );

            }
        );


        controls.appendChild(minus);
        controls.appendChild(quantity);
        controls.appendChild(plus);


        quantityRow.appendChild(quantityLabel);
        quantityRow.appendChild(controls);


        card.appendChild(main);
        card.appendChild(quantityRow);


        return card;

    }


    /* =========================================================
       LOW STOCK
    ========================================================= */

    function isLowStock(product) {

        return Number(product.quantity) <
            Number(product.minStock);

    }


    /* =========================================================
       QUANTITÀ
    ========================================================= */

    function changeQuantity(id, amount) {

        var product =
            findProductById(id);

        if (!product) {
            return;
        }


        var newQuantity =
            Number(product.quantity) +
            Number(amount);


        if (newQuantity < 0) {
            newQuantity = 0;
        }


        product.quantity =
            newQuantity;


        saveProducts();

        renderProducts();

    }


    /* =========================================================
       MODAL
    ========================================================= */

    function openProductModal(id) {

        editingProductId = id;

        productForm.reset();


        if (id === null) {

            modalTitle.textContent =
                "Nuovo prodotto";

            deleteProductButton.classList.add(
                "hidden"
            );

            productCategory.value =
                currentCategory;

            productQuantity.value =
                "0";

            productMinStock.value =
                "1";

        } else {

            var product =
                findProductById(id);

            if (!product) {
                return;
            }


            modalTitle.textContent =
                "Modifica prodotto";


            deleteProductButton.classList.remove(
                "hidden"
            );


            productName.value =
                product.name || "";

            productBrand.value =
                product.brand || "";

            productFormat.value =
                product.format || "";

            productQuantity.value =
                Number(product.quantity);

            productMinStock.value =
                Number(product.minStock);

            productCategory.value =
                product.category || currentCategory;

            productBarcode.value =
                product.barcode || "";

            productImage.value =
                product.image || "";

        }


        productModal.classList.remove(
            "hidden"
        );


        setTimeout(
            function () {

                productName.focus();

            },
            50
        );

    }


    function closeProductModal() {

        productModal.classList.add(
            "hidden"
        );

        editingProductId = null;

    }


    function saveProductFromForm() {

        var name =
            String(productName.value || "")
                .replace(/^\s+|\s+$/g, "");


        if (!name) {

            showToast(
                "Inserisci il nome del prodotto."
            );

            return;
        }


        var quantity =
            parseInt(
                productQuantity.value,
                10
            );


        var minStock =
            parseInt(
                productMinStock.value,
                10
            );


        if (isNaN(quantity) || quantity < 0) {
            quantity = 0;
        }


        if (isNaN(minStock) || minStock < 0) {
            minStock = 0;
        }


        var data = {

            name: name,

            brand:
                String(productBrand.value || "")
                    .replace(/^\s+|\s+$/g, ""),

            format:
                String(productFormat.value || "")
                    .replace(/^\s+|\s+$/g, ""),

            quantity: quantity,

            minStock: minStock,

            category:
                productCategory.value || currentCategory,

            barcode:
                String(productBarcode.value || "")
                    .replace(/^\s+|\s+$/g, ""),

            image:
                String(productImage.value || "")
                    .replace(/^\s+|\s+$/g, "")

        };


        if (editingProductId === null) {

            data.id =
                createId();

            products.push(data);

            showToast(
                "Prodotto aggiunto."
            );

        } else {

            var existing =
                findProductById(
                    editingProductId
                );


            if (!existing) {
                return;
            }


            existing.name =
                data.name;

            existing.brand =
                data.brand;

            existing.format =
                data.format;

            existing.quantity =
                data.quantity;

            existing.minStock =
                data.minStock;

            existing.category =
                data.category;

            existing.barcode =
                data.barcode;

            existing.image =
                data.image;


            showToast(
                "Prodotto aggiornato."
            );

        }


        saveProducts();

        closeProductModal();

        renderProducts();

    }


    function deleteCurrentProduct() {

        if (editingProductId === null) {
            return;
        }


        var product =
            findProductById(
                editingProductId
            );


        if (!product) {
            return;
        }


        var confirmed =
            window.confirm(
                "Vuoi eliminare \"" +
                product.name +
                "\"?"
            );


        if (!confirmed) {
            return;
        }


        var newProducts = [];


        for (var i = 0; i < products.length; i++) {

            if (
                products[i].id !==
                editingProductId
            ) {

                newProducts.push(
                    products[i]
                );

            }

        }


        products = newProducts;

        saveProducts();

        closeProductModal();

        renderProducts();

        showToast(
            "Prodotto eliminato."
        );

    }


    function findProductById(id) {

        for (var i = 0; i < products.length; i++) {

            if (products[i].id === id) {
                return products[i];
            }

        }

        return null;

    }


    /* =========================================================
       LOCAL STORAGE
    ========================================================= */

    function loadProducts() {

        var saved = null;


        try {

            saved =
                localStorage.getItem(
                    STORAGE_KEY
                );

        } catch (error) {

            saved = null;

        }


        if (saved) {

            try {

                products =
                    JSON.parse(saved);


                if (
                    !Array.isArray(products)
                ) {

                    products = [];

                }

            } catch (error2) {

                products = [];

            }

        }


        if (products.length === 0) {

            products = [

                {
                    id: createId(),
                    name: "Pasta",
                    brand: "Barilla",
                    format: "500 g",
                    quantity: 3,
                    minStock: 2,
                    category: "cibo",
                    barcode: "",
                    image: ""
                },

                {
                    id: createId(),
                    name: "Latte",
                    brand: "Parmalat",
                    format: "1 L",
                    quantity: 1,
                    minStock: 2,
                    category: "cibo",
                    barcode: "",
                    image: ""
                },

                {
                    id: createId(),
                    name: "Shampoo",
                    brand: "Pantene",
                    format: "250 ml",
                    quantity: 2,
                    minStock: 1,
                    category: "bagno",
                    barcode: "",
                    image: ""
                },

                {
                    id: createId(),
                    name: "Detersivo piatti",
                    brand: "Nelsen",
                    format: "900 ml",
                    quantity: 1,
                    minStock: 1,
                    category: "pulizia",
                    barcode: "",
                    image: ""
                }

            ];

            saveProducts();

        }

    }


    function saveProducts() {

        try {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(products)
            );

        } catch (error) {

            showToast(
                "Impossibile salvare i dati."
            );

        }

    }


    /* =========================================================
       SCANNER
    ========================================================= */

    function openScanner() {

        scannerLocked = false;

        scannerOverlay.classList.remove(
            "hidden"
        );

        startScanner();

    }


    function startScanner() {

        if (scannerStarting || scannerRunning) {
            return;
        }


        if (
            typeof Html5Qrcode ===
            "undefined"
        ) {

            showToast(
                "Scanner non disponibile."
            );

            return;
        }


        scannerStarting = true;


        html5QrCode =
            new Html5Qrcode("reader");


        var config = {

            fps: 10,

            qrbox: {
                width: 280,
                height: 150
            }

        };


        html5QrCode
            .start(
                {
                    facingMode: "user"
                },
                config,
                onBarcodeSuccess,
                onBarcodeError
            )
            .then(
                function () {

                    scannerStarting = false;
                    scannerRunning = true;

                }
            )
            .catch(
                function () {

                    tryFallbackCamera();

                }
            );

    }


    function tryFallbackCamera() {

        if (!html5QrCode) {

            scannerStarting = false;

            showToast(
                "Impossibile avviare la fotocamera."
            );

            return;
        }


        Html5Qrcode
            .getCameras()
            .then(
                function (devices) {

                    if (
                        !devices ||
                        devices.length === 0
                    ) {

                        scannerStarting = false;

                        showToast(
                            "Nessuna fotocamera trovata."
                        );

                        return;
                    }


                    var selectedCamera =
                        devices[0];


                    for (
                        var i = 0;
                        i < devices.length;
                        i++
                    ) {

                        var label =
                            String(
                                devices[i].label ||
                                ""
                            ).toLowerCase();


                        if (
                            label.indexOf("front") !== -1 ||
                            label.indexOf("facetime") !== -1 ||
                            label.indexOf("user") !== -1
                        ) {

                            selectedCamera =
                                devices[i];

                            break;

                        }

                    }


                    return html5QrCode.start(
                        selectedCamera.id,
                        {
                            fps: 10,
                            qrbox: {
                                width: 280,
                                height: 150
                            }
                        },
                        onBarcodeSuccess,
                        onBarcodeError
                    );

                }
            )
            .then(
                function () {

                    scannerStarting = false;
                    scannerRunning = true;

                }
            )
            .catch(
                function () {

                    scannerStarting = false;

                    showToast(
                        "Impossibile avviare la fotocamera."
                    );

                }
            );

    }


    function onBarcodeSuccess(
        decodedText,
        decodedResult
    ) {

        if (scannerLocked) {
            return;
        }


        scannerLocked = true;


        var code =
            String(decodedText || "")
                .replace(/^\s+|\s+$/g, "");


        if (!code) {

            scannerLocked = false;

            return;
        }


        showToast(
            "Codice rilevato: " + code
        );


        stopScanner()
            .then(
                function () {

                    scannerOverlay.classList.add(
                        "hidden"
                    );

                    lookupOpenFoodFacts(code);

                }
            );

    }


    function onBarcodeError(
        errorMessage
    ) {

        /*

           Errori normali durante la scansione:
           non mostriamo messaggi per non disturbare.

        */

    }


    function closeScanner() {

        scannerLocked = true;

        stopScanner();

        scannerOverlay.classList.add(
            "hidden"
        );

    }


    function stopScanner() {

        if (!html5QrCode) {

            scannerStarting = false;
            scannerRunning = false;

            return Promise.resolve();

        }


        var scanner =
            html5QrCode;


        html5QrCode = null;


        if (!scannerRunning) {

            scannerStarting = false;

            return Promise.resolve();

        }


        return scanner
            .stop()
            .then(
                function () {

                    scannerRunning = false;
                    scannerStarting = false;

                    try {

                        scanner.clear();

                    } catch (clearError) {}

                }
            )
            .catch(
                function () {

                    scannerRunning = false;
                    scannerStarting = false;

                }
            );

    }


    /* =========================================================
       OPEN FOOD FACTS
    ========================================================= */

    function lookupOpenFoodFacts(barcode) {

        var url =
            "https://world.openfoodfacts.org/api/v0/product/" +
            encodeURIComponent(barcode) +
            ".json";


        fetch(url)
            .then(
                function (response) {

                    if (!response.ok) {
                        throw new Error(
                            "HTTP " + response.status
                        );
                    }

                    return response.json();

                }
            )
            .then(
                function (data) {

                    if (
                        !data ||
                        Number(data.status) !== 1 ||
                        !data.product
                    ) {

                        openProductModal(null);

                        productBarcode.value =
                            barcode;

                        showToast(
                            "Prodotto non trovato. Inseriscilo manualmente."
                        );

                        return;

                    }


                    var product =
                        data.product;


                    openProductModal(null);


                    productName.value =
                        product.product_name_it ||
                        product.product_name ||
                        "";


                    productBrand.value =
                        product.brands ||
                        "";


                    productFormat.value =
                        product.quantity ||
                        "";


                    productBarcode.value =
                        barcode;


                    productImage.value =
                        product.image_front_url ||
                        product.image_url ||
                        "";


                    showToast(
                        "Dati prodotto trovati."
                    );

                }
            )
            .catch(
                function () {

                    openProductModal(null);

                    productBarcode.value =
                        barcode;

                    showToast(
                        "Inserisci manualmente i dati del prodotto."
                    );

                }
            );

    }


    /* =========================================================
       TOAST
    ========================================================= */

    function showToast(message) {

        clearTimeout(toastTimer);


        toast.textContent =
            message;


        toast.classList.remove(
            "hidden"
        );


        toastTimer =
            setTimeout(
                function () {

                    toast.classList.add(
                        "hidden"
                    );

                },
                2600
            );

    }


    /* =========================================================
       ID
    ========================================================= */

    function createId() {

        return (
            String(Date.now()) +
            "_" +
            String(
                Math.floor(
                    Math.random() * 100000
                )
            )
        );

    }


    /* =========================================================
       AVVIO
    ========================================================= */

    init();

})();
</script>
