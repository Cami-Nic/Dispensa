<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>La Mia Dispensa</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: #f4f5f7;
    color: #222;
}

body {
    min-height: 100vh;
}

button,
input,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
}

/* =========================================================
   SCHERMATE
   ========================================================= */

.screen {
    display: none;
    min-height: 100vh;
}

.screen.active {
    display: block;
}

/* =========================================================
   HOME
   ========================================================= */

.home-header {
    text-align: center;
    padding: 28px 20px 10px;
}

.home-logo {
    font-size: 48px;
    line-height: 1;
}

.home-title {
    margin: 10px 0 0;
    font-size: 32px;
    line-height: 1.15;
    color: #222;
}

/* Due pulsanti verticali centrati */

.dispensa-grid {
    min-height: calc(100vh - 150px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 60px;
    padding: 24px 20px 40px;
}

.dispensa-card {
    position: relative;
    width: 100%;
    max-width: 440px;
    min-height: 175px;
    border: 0;
    border-radius: 26px;
    padding: 28px 70px 28px 30px;
    color: #ffffff;
    text-align: left;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.14);
    -webkit-appearance: none;
    appearance: none;
}

.dispensa-card:active {
    transform: scale(0.98);
}

.dispensa-card.casa {
    background: linear-gradient(135deg, #4caf50, #2e7d32);
}

.dispensa-card.cantina {
    background: linear-gradient(135deg, #7e57c2, #512da8);
}

.dispensa-card-icon {
    font-size: 44px;
    line-height: 1;
    margin-bottom: 15px;
}

.dispensa-card h2 {
    margin: 0;
    font-size: 29px;
    line-height: 1.15;
    font-weight: 700;
}

.dispensa-card p {
    margin: 8px 0 0;
    font-size: 17px;
    line-height: 1.3;
    opacity: 0.94;
}

.dispensa-card-arrow {
    position: absolute;
    right: 25px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 40px;
    font-weight: 300;
}

/* =========================================================
   HEADER SCHERMATE INTERNE
   ========================================================= */

.page-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 18px 14px;
    background: #ffffff;
    border-bottom: 1px solid #e4e4e4;
    position: sticky;
    top: 0;
    z-index: 10;
}

.back-button {
    width: 48px;
    height: 48px;
    flex: 0 0 48px;
    border: 0;
    border-radius: 14px;
    background: #eeeeee;
    font-size: 27px;
    color: #333;
}

.page-header-text {
    min-width: 0;
}

.page-title {
    margin: 0;
    font-size: 26px;
    line-height: 1.15;
}

.page-subtitle {
    margin: 4px 0 0;
    color: #777;
    font-size: 14px;
}

/* =========================================================
   CATEGORIE DELLA DISPENSA
   ========================================================= */

.dispensa-content {
    padding: 24px 20px 40px;
}

.subcategory-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
    max-width: 700px;
    margin: 0 auto;
}

.subcategory-card {
    position: relative;
    min-height: 145px;
    width: 100%;
    border: 0;
    border-radius: 22px;
    padding: 24px 65px 24px 25px;
    color: #ffffff;
    text-align: left;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    -webkit-appearance: none;
    appearance: none;
}

.subcategory-card:active {
    transform: scale(0.98);
}

.subcategory-card.cibo {
    background: #ff8b5c;
}

.subcategory-card.bagno {
    background: #58b9ff;
}

.subcategory-card.pulizia {
    background: #a77bff;
}

.subcategory-icon {
    font-size: 38px;
    line-height: 1;
    margin-bottom: 12px;
}

.subcategory-card h2 {
    margin: 0;
    font-size: 25px;
}

.subcategory-card p {
    margin: 7px 0 0;
    font-size: 15px;
    opacity: 0.94;
}

.subcategory-arrow {
    position: absolute;
    right: 22px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 36px;
}

/* =========================================================
   SCHERMATA CATEGORIA PRODOTTI
   ========================================================= */

.category-content {
    padding: 16px 16px 40px;
    max-width: 900px;
    margin: 0 auto;
}

.category-actions {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
}

.add-button,
.scanner-button {
    flex: 1;
    min-height: 52px;
    border: 0;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 600;
}

.add-button {
    background: #222;
    color: #fff;
}

.scanner-button {
    background: #e8e8e8;
    color: #222;
}

.search-box {
    width: 100%;
    height: 50px;
    border: 1px solid #d5d5d5;
    border-radius: 14px;
    background: #ffffff;
    padding: 0 15px;
    font-size: 17px;
    outline: none;
    margin-bottom: 12px;
}

.filter-buttons {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 18px;
}

.filter-button {
    flex: 0 0 auto;
    min-height: 42px;
    padding: 0 15px;
    border: 0;
    border-radius: 20px;
    background: #e8e8e8;
    color: #333;
    font-size: 15px;
}

.filter-button.active {
    background: #222;
    color: #fff;
}

/* =========================================================
   PRODOTTI
   ========================================================= */

.products-list {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
}

.product-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 15px;
    background: #ffffff;
    border-radius: 18px;
    padding: 15px;
    box-shadow: 0 5px 16px rgba(0, 0, 0, 0.08);
}

.product-image {
    width: 82px;
    height: 82px;
    flex: 0 0 82px;
    border-radius: 14px;
    background: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-size: 38px;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.product-info {
    flex: 1;
    min-width: 0;
}

.product-name {
    margin: 0;
    font-size: 20px;
    line-height: 1.2;
}

.product-brand {
    margin: 4px 0 0;
    font-size: 14px;
    color: #777;
}

.product-format {
    margin: 3px 0 0;
    font-size: 14px;
    color: #777;
}

.low-stock {
    display: inline-block;
    margin-top: 7px;
    padding: 4px 8px;
    border-radius: 10px;
    background: #ffe0df;
    color: #c62828;
    font-size: 12px;
    font-weight: 700;
}

.quantity-area {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
}

.quantity-button {
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 11px;
    background: #eeeeee;
    font-size: 24px;
    color: #222;
}

.quantity-value {
    min-width: 32px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
}

.edit-product-button {
    position: absolute;
    right: 12px;
    top: 12px;
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 11px;
    background: #eeeeee;
    font-size: 18px;
}

.empty-message {
    text-align: center;
    color: #777;
    padding: 50px 20px;
    font-size: 17px;
}

/* =========================================================
   MODALE
   ========================================================= */

.modal-overlay {
    display: none;
    position: fixed;
    z-index: 100;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.48);
    padding: 18px;
    overflow-y: auto;
}

.modal-overlay.active {
    display: block;
}

.modal {
    max-width: 600px;
    margin: 30px auto;
    background: #ffffff;
    border-radius: 22px;
    padding: 22px;
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 18px;
}

.modal-title {
    margin: 0;
    font-size: 24px;
}

.close-modal {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 12px;
    background: #eeeeee;
    font-size: 24px;
}

.form-group {
    margin-bottom: 14px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    font-weight: 600;
    color: #555;
}

.form-group input,
.form-group select {
    width: 100%;
    height: 48px;
    border: 1px solid #d4d4d4;
    border-radius: 12px;
    padding: 0 12px;
    font-size: 16px;
    background: #fff;
}

.form-row {
    display: flex;
    gap: 10px;
}

.form-row .form-group {
    flex: 1;
}

.modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.save-button,
.delete-button {
    min-height: 50px;
    border: 0;
    border-radius: 13px;
    font-size: 16px;
    font-weight: 700;
}

.save-button {
    flex: 1;
    background: #222;
    color: #fff;
}

.delete-button {
    background: #ffe1e1;
    color: #c62828;
    padding: 0 18px;
}

/* =========================================================
   SCANNER
   ========================================================= */

.scanner-container {
    margin-top: 15px;
    background: #000;
    border-radius: 18px;
    overflow: hidden;
}

#reader {
    width: 100%;
}

.scanner-message {
    margin: 12px 0 0;
    color: #666;
    font-size: 14px;
}

/* =========================================================
   TOAST
   ========================================================= */

.toast {
    position: fixed;
    left: 50%;
    bottom: 25px;
    transform: translateX(-50%) translateY(20px);
    z-index: 200;
    background: #222;
    color: #fff;
    padding: 13px 18px;
    border-radius: 13px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    max-width: calc(100% - 40px);
    text-align: center;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* =========================================================
   IPAD MINI / SCHERMI PICCOLI
   ========================================================= */

@media (max-width: 600px) {
    .home-title {
        font-size: 29px;
    }

    .dispensa-grid {
        min-height: calc(100vh - 135px);
        padding-top: 20px;
    }

    .dispensa-card {
        min-height: 160px;
    }

    .dispensa-card h2 {
        font-size: 26px;
    }

    .category-actions {
        flex-direction: column;
    }

    .product-card {
        align-items: flex-start;
    }

    .product-image {
        width: 72px;
        height: 72px;
        flex-basis: 72px;
    }
}
</style>
</head>

<body>

<!-- =======================================================
     HOME
     ======================================================= -->

<main id="homeScreen" class="screen active">

    <header class="home-header">
        <div class="home-logo">🛒</div>
        <h1 class="home-title">La Mia Dispensa</h1>
    </header>

    <div class="dispensa-grid">

        <button
            type="button"
            class="dispensa-card casa"
            data-dispensa="casa">

            <div class="dispensa-card-icon">🏠</div>

            <h2>Dispensa Casa</h2>

            <p>Cibo e prodotti bagno</p>

            <span class="dispensa-card-arrow">→</span>

        </button>


        <button
            type="button"
            class="dispensa-card cantina"
            data-dispensa="cantina">

            <div class="dispensa-card-icon">🧹</div>

            <h2>Dispensa Cantina</h2>

            <p>Prodotti di pulizia</p>

            <span class="dispensa-card-arrow">→</span>

        </button>

    </div>

</main>


<!-- =======================================================
     SCHERMATA DISPENSA
     ======================================================= -->

<main id="dispensaScreen" class="screen">

    <header class="page-header">

        <button
            type="button"
            id="dispensaBackButton"
            class="back-button"
            aria-label="Torna alla home">
            ←
        </button>

        <div class="page-header-text">

            <h1 id="dispensaTitle" class="page-title">
                Dispensa Casa
            </h1>

            <p id="dispensaSubtitle" class="page-subtitle">
                Cibo e prodotti bagno
            </p>

        </div>

    </header>


    <div class="dispensa-content">

        <div
            id="dispensaCategories"
            class="subcategory-grid">
        </div>

    </div>

</main>


<!-- =======================================================
     SCHERMATA CATEGORIA
     ======================================================= -->

<main id="categoryScreen" class="screen">

    <header class="page-header">

        <button
            type="button"
            id="backButton"
            class="back-button"
            aria-label="Torna indietro">
            ←
        </button>

        <div class="page-header-text">

            <h1 id="categoryTitle" class="page-title">
                Cibo
            </h1>

            <p id="categorySubtitle" class="page-subtitle">
                Dispensa e alimentari
            </p>

        </div>

    </header>


    <div class="category-content">

        <div class="category-actions">

            <button
                type="button"
                id="addProductButton"
                class="add-button">
                ＋ Aggiungi prodotto
            </button>

            <button
                type="button"
                id="scannerButton"
                class="scanner-button">
                📷 Scansiona
            </button>

        </div>


        <input
            type="search"
            id="searchInput"
            class="search-box"
            placeholder="Cerca prodotto..."
            autocomplete="off">


        <div class="filter-buttons">

            <button
                type="button"
                class="filter-button active"
                data-filter="all">
                Tutti
            </button>

            <button
                type="button"
                class="filter-button"
                data-filter="low">
                Scorte basse
            </button>

        </div>


        <div
            id="productsList"
            class="products-list">
        </div>

    </div>

</main>


<!-- =======================================================
     MODALE PRODOTTO
     ======================================================= -->

<div
    id="productModal"
    class="modal-overlay">

    <div class="modal">

        <div class="modal-header">

            <h2
                id="modalTitle"
                class="modal-title">
                Nuovo prodotto
            </h2>

            <button
                type="button"
                id="closeModalButton"
                class="close-modal"
                aria-label="Chiudi">
                ×
            </button>

        </div>


        <form id="productForm">

            <div class="form-group">

                <label for="productName">
                    Nome prodotto
                </label>

                <input
                    type="text"
                    id="productName"
                    required
                    autocomplete="off">

            </div>


            <div class="form-group">

                <label for="productBrand">
                    Marca
                </label>

                <input
                    type="text"
                    id="productBrand"
                    autocomplete="off">

            </div>


            <div class="form-group">

                <label for="productFormat">
                    Formato
                </label>

                <input
                    type="text"
                    id="productFormat"
                    placeholder="es. 500 g, 1 L, 250 ml"
                    autocomplete="off">

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="productQuantity">
                        Quantità
                    </label>

                    <input
                        type="number"
                        id="productQuantity"
                        min="0"
                        step="1"
                        value="1">

                </div>


                <div class="form-group">

                    <label for="productMinStock">
                        Scorta minima
                    </label>

                    <input
                        type="number"
                        id="productMinStock"
                        min="0"
                        step="1"
                        value="1">

                </div>

            </div>


            <div class="form-group">

                <label for="productCategory">
                    Categoria
                </label>

                <select id="productCategory">

                    <option value="cibo">
                        Cibo
                    </option>

                    <option value="bagno">
                        Prodotti bagno
                    </option>

                    <option value="pulizia">
                        Prodotti pulizia
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="productBarcode">
                    Codice a barre
                </label>

                <input
                    type="text"
                    id="productBarcode"
                    autocomplete="off">

            </div>


            <div class="form-group">

                <label for="productImage">
                    URL immagine
                </label>

                <input
                    type="url"
                    id="productImage"
                    placeholder="https://..."
                    autocomplete="off">

            </div>


            <div class="modal-actions">

                <button
                    type="submit"
                    class="save-button">
                    Salva
                </button>

                <button
                    type="button"
                    id="deleteProductButton"
                    class="delete-button">
                    Elimina
                </button>

            </div>

        </form>

    </div>

</div>


<!-- =======================================================
     MODALE SCANNER
     ======================================================= -->

<div
    id="scannerModal"
    class="modal-overlay">

    <div class="modal">

        <div class="modal-header">

            <h2 class="modal-title">
                Scansiona codice
            </h2>

            <button
                type="button"
                id="closeScannerButton"
                class="close-modal"
                aria-label="Chiudi">
                ×
            </button>

        </div>


        <div class="scanner-container">

            <div id="reader"></div>

        </div>


        <p class="scanner-message">
            Inquadra il codice a barre del prodotto.
        </p>

    </div>

</div>


<div
    id="toast"
    class="toast">
</div>


<!-- =======================================================
     HTML5 QR CODE
     ======================================================= -->

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


<script>
/* =========================================================
   CONFIGURAZIONE
   ========================================================= */

var STORAGE_KEY = "laMiaDispensaProdotti";


var categoryData = {

    cibo: {
        title: "Cibo",
        subtitle: "Dispensa e alimentari",
        icon: "🍎"
    },

    bagno: {
        title: "Prodotti bagno",
        subtitle: "Cura personale",
        icon: "🧴"
    },

    pulizia: {
        title: "Prodotti pulizia",
        subtitle: "Pulizia della casa",
        icon: "🧹"
    }

};


var dispensaData = {

    casa: {
        title: "Dispensa Casa",
        subtitle: "Cibo e prodotti bagno",
        categories: [
            "cibo",
            "bagno"
        ]
    },

    cantina: {
        title: "Dispensa Cantina",
        subtitle: "Prodotti di pulizia",
        categories: [
            "pulizia"
        ]
    }

};


/* =========================================================
   STATO
   ========================================================= */

var products = [];

var currentCategory = "cibo";

var currentFilter = "all";

var currentDispensa = null;

var editingProductId = null;

var html5QrCode = null;

var scannerStarting = false;

var scannerRunning = false;

var scannerLocked = false;

var toastTimer = null;


/* =========================================================
   ELEMENTI DOM
   ========================================================= */

var homeScreen =
    document.getElementById("homeScreen");

var dispensaScreen =
    document.getElementById("dispensaScreen");

var categoryScreen =
    document.getElementById("categoryScreen");

var dispensaTitle =
    document.getElementById("dispensaTitle");

var dispensaSubtitle =
    document.getElementById("dispensaSubtitle");

var dispensaCategories =
    document.getElementById("dispensaCategories");

var categoryTitle =
    document.getElementById("categoryTitle");

var categorySubtitle =
    document.getElementById("categorySubtitle");

var productsList =
    document.getElementById("productsList");

var searchInput =
    document.getElementById("searchInput");

var productModal =
    document.getElementById("productModal");

var scannerModal =
    document.getElementById("scannerModal");

var productForm =
    document.getElementById("productForm");

var modalTitle =
    document.getElementById("modalTitle");

var deleteProductButton =
    document.getElementById("deleteProductButton");

var toast =
    document.getElementById("toast");


/* =========================================================
   INIZIALIZAZIONE
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        loadProducts();

        setupEvents();

    }
);


/* =========================================================
   EVENTI
   ========================================================= */

function setupEvents() {

    var dispensaButtons =
        document.querySelectorAll(
            ".dispensa-card"
        );

    for (
        var i = 0;
        i < dispensaButtons.length;
        i++
    ) {

        dispensaButtons[i].addEventListener(
            "click",
            function () {

                var dispensa =
                    this.getAttribute(
                        "data-dispensa"
                    );

                openDispensa(dispensa);

            }
        );

    }


    document.getElementById(
        "dispensaBackButton"
    ).addEventListener(
        "click",
        goHome
    );


    document.getElementById(
        "backButton"
    ).addEventListener(
        "click",
        goBackFromCategory
    );


    document.getElementById(
        "addProductButton"
    ).addEventListener(
        "click",
        function () {

            openProductModal(null);

        }
    );


    document.getElementById(
        "scannerButton"
    ).addEventListener(
        "click",
        openScanner
    );


    document.getElementById(
        "closeModalButton"
    ).addEventListener(
        "click",
        closeProductModal
    );


    document.getElementById(
        "closeScannerButton"
    ).addEventListener(
        "click",
        closeScanner
    );


    deleteProductButton.addEventListener(
        "click",
        deleteCurrentProduct
    );


    productForm.addEventListener(
        "submit",
        function (event) {

            event.preventDefault();

            saveProductFromForm();

        }
    );


    searchInput.addEventListener(
        "input",
        function () {

            renderProducts();

        }
    );


    var filterButtons =
        document.querySelectorAll(
            ".filter-button"
        );


    for (
        var j = 0;
        j < filterButtons.length;
        j++
    ) {

        filterButtons[j].addEventListener(
            "click",
            function () {

                currentFilter =
                    this.getAttribute(
                        "data-filter"
                    );


                var buttons =
                    document.querySelectorAll(
                        ".filter-button"
                    );


                for (
                    var k = 0;
                    k < buttons.length;
                    k++
                ) {

                    buttons[k].classList.remove(
                        "active"
                    );

                }


                this.classList.add(
                    "active"
                );


                renderProducts();

            }
        );

    }


    productsList.addEventListener(
        "click",
        function (event) {

            var quantityButton =
                event.target.closest(
                    ".quantity-button"
                );


            if (quantityButton) {

                var id =
                    quantityButton.getAttribute(
                        "data-id"
                    );

                var delta =
                    Number(
                        quantityButton.getAttribute(
                            "data-delta"
                        )
                    );

                changeQuantity(
                    id,
                    delta
                );

                return;

            }


            var editButton =
                event.target.closest(
                    ".edit-product-button"
                );


            if (editButton) {

                var productId =
                    editButton.getAttribute(
                        "data-id"
                    );

                openProductModal(
                    productId
                );

            }

        }
    );


    dispensaCategories.addEventListener(
        "click",
        function (event) {

            var button =
                event.target.closest(
                    ".subcategory-card"
                );


            if (!button) {
                return;
            }


            var category =
                button.getAttribute(
                    "data-category"
                );


            openCategory(category);

        }
    );


    productModal.addEventListener(
        "click",
        function (event) {

            if (
                event.target === productModal
            ) {

                closeProductModal();

            }

        }
    );


    scannerModal.addEventListener(
        "click",
        function (event) {

            if (
                event.target === scannerModal
            ) {

                closeScanner();

            }

        }
    );

}


/* =========================================================
   LOCAL STORAGE
   ========================================================= */

function loadProducts() {

    var saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (saved) {

        try {

            products =
                JSON.parse(saved);

            if (!Array.isArray(products)) {

                products = [];

            }

        } catch (error) {

            products = [];

        }

    }


    if (products.length === 0) {

        products = [

            {
                id: "1",
                name: "Pasta",
                brand: "Barilla",
                format: "500 g",
                quantity: 3,
                minStock: 2,
                category: "cibo",
                barcode: "",
                image: ""
            },

            {
                id: "2",
                name: "Latte",
                brand: "Parmalat",
                format: "1 L",
                quantity: 1,
                minStock: 2,
                category: "cibo",
                barcode: "",
                image: ""
            },

            {
                id: "3",
                name: "Shampoo",
                brand: "Pantene",
                format: "250 ml",
                quantity: 2,
                minStock: 1,
                category: "bagno",
                barcode: "",
                image: ""
            },

            {
                id: "4",
                name: "Detersivo piatti",
                brand: "Nelsen",

}


function saveProducts() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(products)
    );

}


/* =========================================================
   DISPENSE
   ========================================================= */

function openDispensa(dispensa) {

    var data =
        dispensaData[dispensa];


    if (!data) {
        return;
    }


    stopScanner();


    currentDispensa =
        dispensa;


    dispensaTitle.textContent =
        data.title;


    dispensaSubtitle.textContent =
        data.subtitle;


    homeScreen.classList.remove(
        "active"
    );


    categoryScreen.classList.remove(
        "active"
    );


    dispensaScreen.classList.add(
        "active"
    );


    renderDispensaCategories();


    window.scrollTo(
        0,
        0
    );

}


function renderDispensaCategories() {

    var data =
        dispensaData[
            currentDispensa
        ];


    if (!data) {
        return;
    }


    dispensaCategories.innerHTML = "";


    for (
        var i = 0;
        i < data.categories.length;
        i++
    ) {

        var category =
            data.categories[i];


        var info =
            categoryData[category];


        if (!info) {
            continue;
        }


        var html =

            '<button type="button" ' +

            'class="subcategory-card ' +
            category +
            '" ' +

            'data-category="' +
            category +
            '">' +

                '<div class="subcategory-icon">' +
                    info.icon +
                '</div>' +

                '<h2>' +
                    escapeHtml(info.title) +
                '</h2>' +

                '<p>' +
                    escapeHtml(info.subtitle) +
                '</p>' +

                '<span class="subcategory-arrow">→</span>' +

            '</button>';


        dispensaCategories.insertAdjacentHTML(
            "beforeend",
            html
        );

    }

}


/* =========================================================
   HOME
   ========================================================= */

function goHome() {

    stopScanner();


    categoryScreen.classList.remove(
        "active"
    );


    dispensaScreen.classList.remove(
        "active"
    );


    homeScreen.classList.add(
        "active"
    );


    window.scrollTo(
        0,
        0
    );

}


/* =========================================================
   INDIETRO DALLA CATEGORIA
   ========================================================= */

function goBackFromCategory() {

    stopScanner();


    categoryScreen.classList.remove(
        "active"
    );


    if (currentDispensa) {

        dispensaScreen.classList.add(
            "active"
        );

        renderDispensaCategories();

    } else {

        homeScreen.classList.add(
            "active"
        );

    }


    window.scrollTo(
        0,
        0
    );

}


/* =========================================================
   CATEGORIA
   ========================================================= */

function openCategory(category) {

    if (!categoryData[category]) {
        return;
    }


    stopScanner();


    currentCategory =
        category;


    currentFilter =
        "all";


    categoryTitle.textContent =
        categoryData[category].title;


    categorySubtitle.textContent =
        categoryData[category].subtitle;


    homeScreen.classList.remove(
        "active"
    );


    dispensaScreen.classList.remove(
        "active"
    );


    categoryScreen.classList.add(
        "active"
    );


    searchInput.value = "";


    var filterButtons =
        document.querySelectorAll(
            ".filter-button"
        );


    for (
        var i = 0;
        i < filterButtons.length;
        i++
    ) {

        filterButtons[i].classList.remove(
            "active"
        );

    }


    var allButton =
        document.querySelector(
            '.filter-button[data-filter="all"]'
        );


    if (allButton) {

        allButton.classList.add(
            "active"
        );

    }


    renderProducts();


    window.scrollTo(
        0,
        0
    );

}


/* =========================================================
   PRODOTTI
   ========================================================= */

function renderProducts() {

    var search =
        searchInput.value
            .toLowerCase()
            .trim();


    var filtered =
        [];


    for (
        var i = 0;
        i < products.length;
        i++
    ) {

        var product =
            products[i];


        if (
            product.category !==
            currentCategory
        ) {

            continue;

        }


        if (
            currentFilter === "low" &&
            !isLowStock(product)
        ) {

            continue;

        }


        var searchable = (

            String(
                product.name || ""
            ) +

            " " +

            String(
                product.brand || ""
            ) +

            " " +

            String(
                product.barcode || ""
            )

        ).toLowerCase();


        if (
            search &&
            searchable.indexOf(search) === -1
        ) {

            continue;

        }


        filtered.push(product);

    }


    productsList.innerHTML = "";


    if (filtered.length === 0) {

        productsList.innerHTML =
            '<div class="empty-message">' +
            'Nessun prodotto trovato.' +
            '</div>';

        return;

    }


    for (
        var j = 0;
        j < filtered.length;
        j++
    ) {

        productsList.insertAdjacentHTML(
            "beforeend",
            createProductCard(
                filtered[j]
            )
        );

    }

}


function createProductCard(product) {

    var imageHtml;


    if (product.image) {

        imageHtml =
            '<img src="' +
            escapeAttribute(
                product.image
            ) +
            '" alt="" onerror="this.style.display=\'none\'">';

    } else {

        imageHtml =
            "🛒";

    }


    var lowStockHtml = "";


    if (isLowStock(product)) {

        lowStockHtml =
            '<div class="low-stock">' +
            'Scorta bassa' +
            '</div>';

    }


    return (

        '<article class="product-card">' +

            '<div class="product-image">' +
                imageHtml +
            '</div>' +

            '<div class="product-info">' +

                '<h3 class="product-name">' +
                    escapeHtml(
                        product.name
                    ) +
                '</h3>' +

                (
                    product.brand
                    ?
                    '<p class="product-brand">' +
                        escapeHtml(
                            product.brand
                        ) +
                    '</p>'
                    :
                    ''
                ) +

                (
                    product.format
                    ?
                    '<p class="product-format">' +
                        escapeHtml(
                            product.format
                        ) +
                    '</p>'
                    :
                    ''
                ) +

                lowStockHtml +

                '<div class="quantity-area">' +

                    '<button type="button" ' +
                    'class="quantity-button" ' +
                    'data-id="' +
                    escapeAttribute(
                        product.id
                    ) +
                    '" ' +
                    'data-delta="-1">' +
                    '−' +
                    '</button>' +

                    '<span class="quantity-value">' +
                        Number(
                            product.quantity
                        ) +
                    '</span>' +

                    '<button type="button" ' +
                    'class="quantity-button" ' +
                    'data-id="' +
                    escapeAttribute(
                        product.id
                    ) +
                    '" ' +
                    'data-delta="1">' +
                    '+' +
                    '</button>' +

                '</div>' +

            '</div>' +

            '<button type="button" ' +
            'class="edit-product-button" ' +
            'data-id="' +
            escapeAttribute(
                product.id
            ) +
            '" ' +
            'aria-label="Modifica prodotto">' +
            '✎' +
            '</button>' +

        '</article>'

    );

}


/* =========================================================
   SCORTE
   ========================================================= */

function isLowStock(product) {

    return Number(
        product.quantity
    ) < Number(
        product.minStock
    );

}


/* =========================================================
   QUANTITÀ
   ========================================================= */

function changeQuantity(
    productId,
    delta
) {

    for (
        var i = 0;
        i < products.length;
        i++
    ) {

        if (
            String(
                products[i].id
            ) === String(productId)
        ) {

            var newQuantity =
                Number(
                    products[i].quantity
                ) + Number(delta);


            if (newQuantity < 0) {

                newQuantity = 0;

            }


            products[i].quantity =
                newQuantity;


            saveProducts();

            renderProducts();

            return;

        }

    }

}


/* =========================================================
   MODALE PRODOTTO
   ========================================================= */

function openProductModal(
    productId
) {

    editingProductId =
        productId;


    productForm.reset();


    deleteProductButton.style.display =
        productId
        ? "block"
        : "none";


    if (productId) {

        var product =
            findProductById(
                productId
            );


        if (!product) {
            return;
        }


        modalTitle.textContent =
            "Modifica prodotto";


        document.getElementById(
            "productName"
        ).value =
            product.name || "";


        document.getElementById(
            "productBrand"
        ).value =
            product.brand || "";


        document.getElementById(
            "productFormat"
        ).value =
            product.format || "";


        document.getElementById(
            "productQuantity"
        ).value =
            Number(
                product.quantity
            );


        document.getElementById(
            "productMinStock"
        ).value =
            Number(
                product.minStock
            );


        document.getElementById(
            "productCategory"
        ).value =
            product.category;


        document.getElementById(
            "productBarcode"
        ).value =
            product.barcode || "";


        document.getElementById(
            "productImage"
        ).value =
            product.image || "";

    } else {

        modalTitle.textContent =
            "Nuovo prodotto";


        document.getElementById(
            "productQuantity"
        ).value = 1;


        document.getElementById(
            "productMinStock"
        ).value = 1;


        document.getElementById(
            "productCategory"
        ).value =
            currentCategory;

    }


    productModal.classList.add(
        "active"
    );

}


function closeProductModal() {

    productModal.classList.remove(
        "active"
    );


    editingProductId = null;

}


/* =========================================================
   SALVATAGGIO PRODOTTO
   ========================================================= */

function saveProductFromForm() {

    var name =
        document.getElementById(
            "productName"
        ).value.trim();


    if (!name) {

        showToast(
            "Inserisci il nome del prodotto."
        );

        return;

    }


    var productData = {

        name: name,

        brand:
            document.getElementById(
                "productBrand"
            ).value.trim(),

        format:
            document.getElementById(
                "productFormat"
            ).value.trim(),

        quantity:
            Math.max(
                0,
                Number(
                    document.getElementById(
                        "productQuantity"
                    ).value
                ) || 0
            ),

        minStock:
            Math.max(
                0,
                Number(
                    document.getElementById(
                        "productMinStock"
                    ).value
                ) || 0
            ),

        category:
            document.getElementById(
                "productCategory"
            ).value,

        barcode:
            document.getElementById(
                "productBarcode"
            ).value.trim(),

        image:
            document.getElementById(
                "productImage"
            ).value.trim()

    };


    if (editingProductId) {

        var existing =
            findProductById(
                editingProductId
            );


        if (existing) {

            existing.name =
                productData.name;

            existing.brand =
                productData.brand;

            existing.format =
                productData.format;

            existing.quantity =
                productData.quantity;

            existing.minStock =
                productData.minStock;

            existing.category =
                productData.category;

            existing.barcode =
                productData.barcode;

            existing.image =
                productData.image;

        }

    } else {

        productData.id =
            createId();


        products.push(
            productData
        );

    }


    saveProducts();

    closeProductModal();

    renderProducts();

    showToast(
        "Prodotto salvato."
    );

}


/* =========================================================
   ELIMINA PRODOTTO
   ========================================================= */

function deleteCurrentProduct() {

    if (!editingProductId) {
        return;
    }


    var confirmed =
        window.confirm(
            "Vuoi eliminare questo prodotto?"
        );


    if (!confirmed) {
        return;
    }


    var newProducts = [];


    for (
        var i = 0;
        i < products.length;
        i++
    ) {

        if (
            String(
                products[i].id
            ) !==
            String(
                editingProductId
            )
        ) {

            newProducts.push(
                products[i]
            );

        }

    }


    products =
        newProducts;


    saveProducts();

    closeProductModal();

    renderProducts();

    showToast(
        "Prodotto eliminato."
    );

}


/* =========================================================
   RICERCA PRODOTTO
   ========================================================= */

function findProductById(id) {

    for (
        var i = 0;
        i < products.length;
        i++
    ) {

        if (
            String(
                products[i].id
            ) === String(id)
        ) {

            return products[i];

        }

    }


    return null;

}


/* =========================================================
   SCANNER
   ========================================================= */

function openScanner() {

    scannerLocked = false;

    scannerModal.classList.add(
        "active"
    );


    startScanner();

}


function closeScanner() {

    scannerLocked = true;

    stopScanner();

    scannerModal.classList.remove(
        "active"
    );

}


function startScanner() {

    if (scannerStarting || scannerRunning) {
        return;
    }


    scannerStarting = true;


    document.getElementById(
        "reader"
    ).innerHTML = "";


    if (
        typeof Html5Qrcode ===
        "undefined"
    ) {

        scannerStarting = false;

        showToast(
            "Scanner non disponibile."
        );

        return;

    }


    html5QrCode =
        new Html5Qrcode(
            "reader"
        );


    var config = {

        fps: 10,

        qrbox: {
            width: 250,
            height: 150
        }

    };


    html5QrCode.start(

        {
            facingMode: "user"
        },

        config,

        function (decodedText) {

            handleBarcode(
                decodedText
            );

        },

        function () {
            /* errori di scansione ignorati */
        }

    ).then(

        function () {

            scannerStarting = false;

            scannerRunning = true;

        }

    ).catch(

        function () {

            scannerStarting = false;

            tryFallbackCamera();

        }

    );

}


function tryFallbackCamera() {

    if (
        typeof Html5Qrcode ===
        "undefined"
    ) {

        return;

    }


    Html5Qrcode.getCameras()

        .then(
            function (devices) {

                if (
                    !devices ||
                    devices.length === 0
                ) {

                    showToast(
                        "Nessuna fotocamera trovata."
                    );

                    return;

                }


                var cameraId =
                    devices[0].id;


                for (
                    var i = 0;
                    i < devices.length;
                    i++
                ) {

                    var label =
                        String(
                            devices[i].label || ""
                        ).toLowerCase();


                    if (
                        label.indexOf("front") !== -1 ||
                        label.indexOf("facetime") !== -1 ||
                        label.indexOf("user") !== -1
                    ) {

                        cameraId =
                            devices[i].id;

                        break;

                    }

                }


                var config = {

                    fps: 10,

                    qrbox: {
                        width: 250,
                        height: 150
                    }

                };


                html5QrCode.start(

                    cameraId,

                    config,

                    function (decodedText) {

                        handleBarcode(
                            decodedText
                        );

                    },

                    function () {}

                ).then(

                    function () {

                        scannerRunning = true;

                    }

                ).catch(

                    function () {

                        showToast(
                            "Impossibile avviare la fotocamera. Usa HTTPS o localhost."
                        );

                    }

                );

            }
        )

        .catch(
            function () {

                showToast(
                    "Impossibile accedere alla fotocamera."
                );

            }
        );

}


function stopScanner() {

    scannerLocked = true;


    if (!html5QrCode) {

        scannerStarting = false;

        scannerRunning = false;

        return;

    }


    try {

        html5QrCode.stop()

            .then(
                function () {

                    scannerRunning = false;
                    scannerStarting = false;

                    try {
                        html5QrCode.clear();
                    } catch (e) {}

                    html5QrCode = null;

                }
            )

            .catch(
                function () {

                    scannerRunning = false;
                    scannerStarting = false;

                    html5QrCode = null;

                }
            );

    } catch (error) {

        scannerRunning = false;
        scannerStarting = false;
        html5QrCode = null;

    }

}


/* =========================================================
   BARCODE
   ========================================================= */

function handleBarcode(
    barcode
) {

    if (scannerLocked) {
        return;
    }


    scannerLocked = true;


    var code =
        String(
            barcode
        ).trim();


    if (!code) {

        scannerLocked = false;

        return;

    }


    var existing = null;


    for (
        var i = 0;
        i < products.length;
        i++
    ) {

        if (
            String(
                products[i].barcode || ""
            ) === code
        ) {

            existing =
                products[i];

            break;

        }

    }


    if (existing) {

        existing.quantity =
            Number(
                existing.quantity
            ) + 1;


        saveProducts();

        renderProducts();

        closeScanner();

        showToast(
            existing.name +
            " - quantità aumentata."
        );

        return;

    }


    closeScanner();

    lookupOpenFoodFacts(
        code
    );

}


/* =========================================================
   OPEN FOOD FACTS
   ========================================================= */

function lookupOpenFoodFacts(
    barcode
) {

    showToast(
        "Cerco il prodotto..."
    );


    var url =
        "https://world.openfoodfacts.org/api/v2/product/" +
        encodeURIComponent(
            barcode
        ) +
        ".json";


    fetch(url)

        .then(
            function (response) {

                if (!response.ok) {

                    throw new Error(
                        "Errore HTTP"
                    );

                }


                return response.json();

            }
        )

        .then(
            function (data) {

                var product =
                    data.product || {};


                openProductModal(
                    null
                );


                document.getElementById(
                    "productBarcode"
                ).value =
                    barcode;


                document.getElementById(
                    "productName"
                ).value =
                    product.product_name ||
                    product.product_name_it ||
                    "";


                document.getElementById(
                    "productBrand"
                ).value =
                    product.brands ||
                    "";


                document.getElementById(
                    "productFormat"
                ).value =
                    product.quantity ||
                    "";


                document.getElementById(
                    "productImage"
                ).value =
                    product.image_front_url ||
                    product.image_url ||
                    "";


                showToast(
                    "Prodotto trovato."
                );

            }
        )

        .catch(
            function () {

                openProductModal(
                    null
                );


                document.getElementById(
                    "productBarcode"
                ).value =
                    barcode;


                showToast(
                    "Prodotto non trovato. Inseriscilo manualmente."
                );

            }
        );

}


/* =========================================================
   TOAST
   ========================================================= */

function showToast(
    message
) {

    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    if (toastTimer) {

        clearTimeout(
            toastTimer
        );

    }


    toastTimer =
        setTimeout(
            function () {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =========================================================
   UTILITY
   ========================================================= */

function createId() {

    return String(
        new Date().getTime()
    ) +
    String(
        Math.floor(
            Math.random() * 10000
        )
    );

}


function escapeHtml(
    value
) {

    return String(
        value == null
        ? ""
        : value
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(
    value
) {

    return escapeHtml(
        value
    );

}
