<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#f7f7f5">

    <title>La Mia Dispensa</title>

    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: #f5f5f2;
            color: #222;

            min-height: 100vh;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }


        /* =========================================================
           APP
        ========================================================= */

        .app {
            min-height: 100vh;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }


        /* =========================================================
           HEADER
        ========================================================= */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;

            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: white;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.07);

            font-size: 26px;
        }

        .logo-text h1 {
            font-size: 24px;
            font-weight: 750;
        }

        .logo-text p {
            font-size: 13px;
            color: #777;
            margin-top: 2px;
        }


        /* =========================================================
           SCREENS
        ========================================================= */

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }


        /* =========================================================
           HOME
        ========================================================= */

        .home-title {
            margin-bottom: 22px;
        }

        .home-title h2 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .home-title p {
            color: #777;
            font-size: 16px;
        }

        .categories {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-top: 28px;
        }

        .category-card {
            border: none;

            min-height: 240px;

            background: white;

            border-radius: 28px;

            padding: 30px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 18px;

            box-shadow:
                0 8px 30px rgba(0,0,0,0.07);

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .category-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 35px rgba(0,0,0,0.11);
        }

        .category-card:active {
            transform: scale(0.98);
        }

        .category-icon {
            width: 95px;
            height: 95px;

            border-radius: 28px;

            background: #f3f3ef;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 50px;
        }

        .category-name {
            font-size: 22px;
            font-weight: 700;
        }


        /* =========================================================
           CATEGORY HEADER
        ========================================================= */

        .category-top {
            display: flex;
            align-items: center;
            gap: 14px;

            margin-bottom: 20px;
        }

        .back-button {
            width: 48px;
            height: 48px;

            border: none;

            border-radius: 15px;

            background: white;

            font-size: 24px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.07);
        }

        .category-title {
            flex: 1;
        }

        .category-title h2 {
            font-size: 28px;
        }

        .category-title p {
            color: #777;
            font-size: 14px;
            margin-top: 3px;
        }


        /* =========================================================
           TOOLBAR
        ========================================================= */

        .toolbar {
            display: flex;
            gap: 12px;

            margin-bottom: 16px;
        }

        .search-box {
            flex: 1;

            position: relative;
        }

        .search-box span {
            position: absolute;

            left: 16px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 18px;
        }

        .search-box input {
            width: 100%;

            height: 52px;

            border: none;

            background: white;

            border-radius: 16px;

            padding: 0 18px 0 46px;

            outline: none;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.05);
        }

        .scan-button {
            height: 52px;

            padding: 0 20px;

            border: none;

            border-radius: 16px;

            background: #222;

            color: white;

            font-weight: 650;

            display: flex;
            align-items: center;

            gap: 8px;
        }


        /* =========================================================
           FILTERS
        ========================================================= */

        .filters {
            display: flex;
            gap: 8px;

            margin-bottom: 22px;
        }

        .filter-button {
            border: none;

            background: #e8e8e4;

            color: #555;

            padding: 10px 17px;

            border-radius: 100px;

            font-size: 14px;

            font-weight: 600;
        }

        .filter-button.active {
            background: #222;
            color: white;
        }


        /* =========================================================
           PRODUCTS
        ========================================================= */

        .products {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 14px;
        }

        .product-card {
            background: white;

            border-radius: 22px;

            padding: 18px;

            display: flex;

            gap: 16px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.05);

            position: relative;
        }

        .product-card.low-stock {
            border: 2px solid #ef5350;
        }

        .product-image {
            width: 82px;
            height: 82px;

            flex-shrink: 0;

            border-radius: 18px;

            background: #f1f1ed;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            font-size: 34px;
        }

        .product-image img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .product-info {
            flex: 1;

            min-width: 0;
        }

        .product-brand {
            font-size: 12px;
            color: #888;

            margin-bottom: 3px;
        }

        .product-name {
            font-size: 17px;
            font-weight: 700;

            margin-bottom: 5px;
        }

        .product-format {
            font-size: 13px;
            color: #777;

            margin-bottom: 10px;
        }

        .stock-warning {
            display: inline-flex;

            background: #ffe5e5;

            color: #d93030;

            padding: 5px 9px;

            border-radius: 100px;

            font-size: 11px;

            font-weight: 700;

            margin-bottom: 10px;
        }

        .quantity-area {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-top: 4px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-button {
            width: 34px;
            height: 34px;

            border: none;

            border-radius: 11px;

            background: #eeeeeb;

            font-size: 20px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quantity {
            min-width: 25px;

            text-align: center;

            font-size: 17px;
            font-weight: 750;
        }

        .edit-button {
            border: none;

            background: transparent;

            color: #777;

            font-size: 18px;
        }


        /* =========================================================
           ADD PRODUCT
        ========================================================= */

        .add-product-button {
            width: 100%;

            height: 58px;

            margin-top: 20px;

            border: none;

            border-radius: 18px;

            background: white;

            color: #222;

            font-weight: 700;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.05);
        }


        /* =========================================================
           EMPTY STATE
        ========================================================= */

        .empty {
            text-align: center;

            background: white;

            border-radius: 22px;

            padding: 50px 20px;

            color: #777;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty h3 {
            color: #333;
            margin-bottom: 6px;
        }


        /* =========================================================
           MODAL
        ========================================================= */

        .modal-overlay {
            position: fixed;

            inset: 0;

            background: rgba(0,0,0,0.45);

            display: none;

            align-items: flex-end;
            justify-content: center;

            z-index: 100;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #f8f8f6;

            width: 100%;
            max-width: 650px;

            border-radius: 28px 28px 0 0;

            padding: 24px;

            max-height: 92vh;

            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 22px;
        }

        .modal-header h2 {
            font-size: 23px;
        }

        .close-button {
            width: 40px;
            height: 40px;

            border: none;

            border-radius: 50%;

            background: #e7e7e3;

            font-size: 20px;
        }


        /* =========================================================
           FORM
        ========================================================= */

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;

            font-size: 13px;

            font-weight: 650;

            margin-bottom: 7px;
        }

        .form-group input,
        .form-group select {
            width: 100%;

            height: 50px;

            border: 1px solid #ddd;

            border-radius: 14px;

            padding: 0 14px;

            background: white;

            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #999;
        }

        .form-row {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;
        }

        .save-button {
            width: 100%;

            height: 54px;

            border: none;

            border-radius: 16px;

            background: #222;

            color: white;

            font-weight: 700;

            margin-top: 8px;
        }

        .delete-button {
            width: 100%;

            height: 48px;

            border: none;

            border-radius: 16px;

            background: #ffe5e5;

            color: #d93030;

            font-weight: 700;

            margin-top: 10px;
        }


        /* =========================================================
           SCANNER
        ========================================================= */

        #reader {
            width: 100%;

            border-radius: 20px;

            overflow: hidden;

            background: #111;
        }

        .scanner-modal .modal {
            padding-bottom: 30px;
        }

        .scanner-info {
            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 15px;
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 750px) {

            .app {
                padding: 16px;
            }

            .categories {
                grid-template-columns: 1fr;
            }

            .category-card {
                min-height: 175px;

                flex-direction: row;

                justify-content: flex-start;

                padding: 22px;
            }

            .category-icon {
                width: 75px;
                height: 75px;

                font-size: 40px;
            }

            .products {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-direction: column;
            }

            .scan-button {
                justify-content: center;
            }

        }


        @media (min-width: 751px) {

            .modal-overlay {
                align-items: center;
            }

            .modal {
                border-radius: 28px;
                max-height: 90vh;
            }

        }

    </style>
</head>


<body>

<div class="app">


    <!-- =========================================================
         HOME
    ========================================================== -->

    <main id="homeScreen" class="screen active">

        <div class="home-title">
     <div class="logo-icon">
            
            </div>
            <h2>🛒 La tua dispensa</h2>

            <p>
                Scegli una categoria
            </p>

        </div>


        <div class="categories">


            <button
                class="category-card"
                onclick="openCategory('cibo')">

                <div class="category-icon">
                    🍎
                </div>

                <div class="category-name">
                    Cibo
                </div>

            </button>


            <button
                class="category-card"
                onclick="openCategory('bagno')">

                <div class="category-icon">
                    🧴
                </div>

                <div class="category-name">
                    Prodotti bagno
                </div>

            </button>


            <button
                class="category-card"
                onclick="openCategory('pulizia')">

                <div class="category-icon">
                    🧹
                </div>

                <div class="category-name">
                    Prodotti pulizia
                </div>

            </button>


        </div>

    </main>


    <!-- =========================================================
         CATEGORY SCREEN
    ========================================================== -->

    <main id="categoryScreen" class="screen">


        <div class="category-top">

            <button
                class="back-button"
                onclick="goHome()">

                ←

            </button>


            <div class="category-title">

                <h2 id="categoryTitle">
                    Cibo
                </h2>

                <p>
                    Gestisci i prodotti
                </p>

            </div>

        </div>


        <!-- SEARCH + SCANNER -->

        <div class="toolbar">

            <div class="search-box">

                <span>🔎</span>

                <input
                    id="searchInput"
                    type="search"
                    placeholder="Cerca prodotto..."
                    oninput="renderProducts()">

            </div>


            <button
                class="scan-button"
                onclick="openScanner()">

                📷 Scansiona

            </button>

        </div>


        <!-- FILTER -->

        <div class="filters">

            <button
                id="filterAll"
                class="filter-button active"
                onclick="setFilter('all')">

                Tutti

            </button>


            <button
                id="filterLow"
                class="filter-button"
                onclick="setFilter('low')">

                🔴 Scorte basse

            </button>

        </div>


        <!-- PRODUCTS -->

        <div
            id="products"
            class="products">
        </div>


        <!-- ADD PRODUCT -->

        <button
            class="add-product-button"
            onclick="openProductModal()">

            ＋ Aggiungi prodotto

        </button>


    </main>


</div>


<!-- =========================================================
     PRODUCT MODAL
========================================================== -->

<div
    id="productModal"
    class="modal-overlay">

    <div class="modal">


        <div class="modal-header">

            <h2 id="modalTitle">
                Nuovo prodotto
            </h2>

            <button
                class="close-button"
                onclick="closeProductModal()">

                ×

            </button>

        </div>


        <form id="productForm"
              onsubmit="saveProduct(event)">


            <div class="form-group">

                <label>
                    Nome prodotto
                </label>

                <input
                    id="productName"
                    type="text"
                    required
                    placeholder="Es. Piselli">

            </div>


            <div class="form-group">

                <label>
                    Marca
                </label>

                <input
                    id="productBrand"
                    type="text"
                    placeholder="Es. Findus">

            </div>


            <div class="form-group">

                <label>
                    Formato
                </label>

                <input
                    id="productFormat"
                    type="text"
                    placeholder="Es. 450 g">

            </div>


            <div class="form-row">


                <div class="form-group">

                    <label>
                        Quantità
                    </label>

                    <input
                        id="productQuantity"
                        type="number"
                        min="0"
                        value="1"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Scorta minima
                    </label>

                    <input
                        id="productMinStock"
                        type="number"
                        min="0"
                        value="1"
                        required>

                </div>


            </div>


            <div class="form-group">

                <label>
                    Categoria
                </label>

                <select id="productCategory">

                    <option value="cibo">
                        🍎 Cibo
                    </option>

                    <option value="bagno">
                        🧴 Prodotti bagno
                    </option>

                    <option value="pulizia">
                        🧹 Prodotti pulizia
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Codice a barre
                </label>

                <input
                    id="productBarcode"
                    type="text"
                    placeholder="EAN / barcode">

            </div>


            <div class="form-group">

                <label>
                    URL immagine
                </label>

                <input
                    id="productImage"
                    type="url"
                    placeholder="https://...">

            </div>


            <button
                class="save-button"
                type="submit">

                Salva prodotto

            </button>


            <button
                id="deleteButton"
                class="delete-button"
                type="button"
                onclick="deleteProduct()"
                style="display:none;">

                Elimina prodotto

            </button>


        </form>

    </div>

</div>


<!-- =========================================================
     SCANNER MODAL
========================================================== -->

<div
    id="scannerModal"
    class="modal-overlay scanner-modal">

    <div class="modal">


        <div class="modal-header">

            <h2>
                Scansiona prodotto
            </h2>

            <button
                class="close-button"
                onclick="closeScanner()">

                ×

            </button>

        </div>


        <p class="scanner-info">

            Inquadra il codice a barre del prodotto

        </p>


        <div id="reader"></div>


    </div>

</div>


<!-- =========================================================
     HTML5 QR CODE
========================================================== -->

<script src="https://unpkg.com/html5-qrcode"></script>


<script>

    /* =========================================================
       CONFIGURAZIONE
    ========================================================= */

    const STORAGE_KEY = "laMiaDispensaProdotti";


    const categories = {

        cibo: {
            name: "Cibo",
            icon: "🍎"
        },

        bagno: {
            name: "Prodotti bagno",
            icon: "🧴"
        },

        pulizia: {
            name: "Prodotti pulizia",
            icon: "🧹"
        }

    };


    /*
       Prodotti che devono avere automaticamente
       una scorta minima di 5.
    */

    const productsWithMinStock5 = [

        "piselli",
        "ceci",
        "fagioli",
        "passata di pomodoro",
        "pezzettoni di pomodoro"

    ];


    let products = [];

    let currentCategory = "cibo";

    let currentFilter = "all";

    let editingProductId = null;

    let html5QrCode = null;


    /* =========================================================
       CARICAMENTO DATI
    ========================================================= */

    function loadProducts() {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (saved) {

            try {

                products = JSON.parse(saved);

            } catch {

                products = [];

            }

        }


        /*
           Se è la prima apertura,
           inseriamo alcuni prodotti di esempio.
        */

        if (products.length === 0) {

            products = [

                {
                    id: crypto.randomUUID(),

                    name: "Piselli",
                    brand: "Esempio",
                    format: "450 g",

                    quantity: 8,
                    minStock: 5,

                    barcode: "",
                    image: "",

                    category: "cibo"

                },

                {
                    id: crypto.randomUUID(),

                    name: "Ceci",
                    brand: "Esempio",
                    format: "400 g",

                    quantity: 6,
                    minStock: 5,

                    barcode: "",
                    image: "",

                    category: "cibo"

                },

                {
                    id: crypto.randomUUID(),

                    name: "Fagioli",
                    brand: "Esempio",
                    format: "400 g",

                    quantity: 4,
                    minStock: 5,

                    barcode: "",
                    image: "",

                    category: "cibo"

                },

                {
                    id: crypto.randomUUID(),

                    name: "Passata di pomodoro",
                    brand: "Esempio",
                    format: "700 g",

                    quantity: 7,
                    minStock: 5,

                    barcode: "",
                    image: "",

                    category: "cibo"

                },

                {
                    id: crypto.randomUUID(),

                    name: "Pezzettoni di pomodoro",
                    brand: "Esempio",
                    format: "400 g",

                    quantity: 3,
                    minStock: 5,

                    barcode: "",
                    image: "",

                    category: "cibo"

                }

            ];

            saveProducts();

        }

    }


    function saveProducts() {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(products)
        );

    }


    /* =========================================================
       HOME / CATEGORIA
    ========================================================= */

    function openCategory(category) {

        currentCategory = category;

        currentFilter = "all";

        document
            .getElementById("homeScreen")
            .classList.remove("active");

        document
            .getElementById("categoryScreen")
            .classList.add("active");


        document
            .getElementById("categoryTitle")
            .textContent =
                categories[category].name;


        document
            .getElementById("searchInput")
            .value = "";


        updateFilterButtons();

        renderProducts();

    }


    function goHome() {

        document
            .getElementById("categoryScreen")
            .classList.remove("active");

        document
            .getElementById("homeScreen")
            .classList.add("active");

    }


    /* =========================================================
       FILTRI
    ========================================================= */

    function setFilter(filter) {

        currentFilter = filter;

        updateFilterButtons();

        renderProducts();

    }


    function updateFilterButtons() {

        document
            .getElementById("filterAll")
            .classList.toggle(
                "active",
                currentFilter === "all"
            );


        document
            .getElementById("filterLow")
            .classList.toggle(
                "active",
                currentFilter === "low"
            );

    }


    /* =========================================================
       RENDER PRODOTTI
    ========================================================= */

    function renderProducts() {

        const container =
            document.getElementById("products");


        const search =
            document
                .getElementById("searchInput")
                .value
                .toLowerCase()
                .trim();


        let filtered = products.filter(product => {

            return product.category === currentCategory;

        });


        if (search) {

            filtered =
                filtered.filter(product => {

                    return (

                        product.name
                            .toLowerCase()
                            .includes(search)

                        ||

                        (product.brand || "")
                            .toLowerCase()
                            .includes(search)

                    );

                });

        }


        if (currentFilter === "low") {

            filtered =
                filtered.filter(product => {

                    return isLowStock(product);

                });

        }


        if (filtered.length === 0) {

            container.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        📦
                    </div>

                    <h3>
                        Nessun prodotto
                    </h3>

                    <p>
                        Non ci sono prodotti da visualizzare.
                    </p>

                </div>

            `;

            return;

        }


        container.innerHTML =
            filtered.map(createProductCard).join("");

    }


    /* =========================================================
       CONTROLLO SCORTA
    ========================================================= */

    function isLowStock(product) {

        return Number(product.quantity)
            <= Number(product.minStock);

    }


    /* =========================================================
       PRODUCT CARD
    ========================================================= */

    function createProductCard(product) {

        const lowStock =
            isLowStock(product);


        const image =
            product.image

                ? `

                    <img
                        src="${escapeHtml(product.image)}"
                        alt="${escapeHtml(product.name)}"
                        onerror="this.style.display='none';">

                  `

                : "📦";


        return `

            <div
                class="product-card ${lowStock ? "low-stock" : ""}">


                <div class="product-image">

                    ${image}

                </div>


                <div class="product-info">


                    <div class="product-brand">

                        ${escapeHtml(product.brand || "")}

                    </div>


                    <div class="product-name">

                        ${escapeHtml(product.name)}

                    </div>


                    <div class="product-format">

                        ${escapeHtml(product.format || "")}

                    </div>


                    ${
                        lowStock

                        ?

                        `

                        <div class="stock-warning">

                            🔴 Scorta bassa

                        </div>

                        `

                        :

                        ""

                    }


                    <div class="quantity-area">


                        <div class="quantity-controls">


                            <button
                                class="quantity-button"
                                onclick="changeQuantity('${product.id}', -1)">

                                −

                            </button>


                            <div class="quantity">

                                ${product.quantity}

                            </div>


                            <button
                                class="quantity-button"
                                onclick="changeQuantity('${product.id}', 1)">

                                +

                            </button>


                        </div>


                        <button
                            class="edit-button"
                            onclick="editProduct('${product.id}')">

                            ✏️

                        </button>


                    </div>


                </div>


            </div>

        `;

    }


    /* =========================================================
       QUANTITÀ
    ========================================================= */

    function changeQuantity(id, amount) {

        const product =
            products.find(
                p => p.id === id
            );


        if (!product) return;


        product.quantity =
            Math.max(
                0,
                Number(product.quantity) + amount
            );


        saveProducts();

        renderProducts();

    }


    /* =========================================================
       MODAL PRODOTTO
    ========================================================= */

    function openProductModal(product = null) {

        editingProductId =
            product ? product.id : null;


        document
            .getElementById("productModal")
            .classList.add("active");


        document
            .getElementById("modalTitle")
            .textContent =
                product
                    ? "Modifica prodotto"
                    : "Nuovo prodotto";


        document
            .getElementById("deleteButton")
            .style.display =
                product ? "block" : "none";


        if (product) {

            document.getElementById("productName").value =
                product.name || "";

            document.getElementById("productBrand").value =
                product.brand || "";

            document.getElementById("productFormat").value =
                product.format || "";

            document.getElementById("productQuantity").value =
                product.quantity ?? 1;

            document.getElementById("productMinStock").value =
                product.minStock ?? 1;

            document.getElementById("productCategory").value =
                product.category || currentCategory;

            document.getElementById("productBarcode").value =
                product.barcode || "";

            document.getElementById("productImage").value =
                product.image || "";

        } else {

            document
                .getElementById("productForm")
                .reset();


            document
                .getElementById("productCategory")
                .value =
                    currentCategory;


            document
                .getElementById("productQuantity")
                .value = 1;


            document
                .getElementById("productMinStock")
                .value = 1;

        }

    }


    function closeProductModal() {

        document
            .getElementById("productModal")
            .classList.remove("active");

        editingProductId = null;

    }


    /* =========================================================
       SALVATAGGIO PRODOTTO
    ========================================================= */

    function saveProduct(event) {

        event.preventDefault();


        const name =
            document
                .getElementById("productName")
                .value
                .trim();


        const brand =
            document
                .getElementById("productBrand")
                .value
                .trim();


        const format =
            document
                .getElementById("productFormat")
                .value
                .trim();


        const quantity =
            Number(
                document
                    .getElementById("productQuantity")
                    .value
            );


        const minStock =
            Number(
                document
                    .getElementById("productMinStock")
                    .value
            );


        const category =
            document
                .getElementById("productCategory")
                .value;


        const barcode =
            document
                .getElementById("productBarcode")
                .value
                .trim();


        const image =
            document
                .getElementById("productImage")
                .value
                .trim();


        if (!name) return;


        if (editingProductId) {

            const product =
                products.find(
                    p => p.id === editingProductId
                );


            if (product) {

                product.name = name;
                product.brand = brand;
                product.format = format;
                product.quantity = quantity;
                product.minStock = minStock;
                product.category = category;
                product.barcode = barcode;
                product.image = image;

            }

        } else {

            products.push({

                id: crypto.randomUUID(),

                name,
                brand,
                format,

                quantity,
                minStock,

                category,

                barcode,
                image

            });

        }


        saveProducts();

        closeProductModal();

        /*
           Se abbiamo cambiato categoria,
           torniamo automaticamente a quella scelta.
        */

        currentCategory = category;

        document
            .getElementById("categoryTitle")
            .textContent =
                categories[category].name;


        renderProducts();

    }


    /* =========================================================
       MODIFICA
    ========================================================= */

    function editProduct(id) {

        const product =
            products.find(
                p => p.id === id
            );


        if (!product) return;


        openProductModal(product);

    }


    /* =========================================================
       ELIMINA
    ========================================================= */

    function deleteProduct() {

        if (!editingProductId) return;


        const confirmed =
            confirm(
                "Vuoi davvero eliminare questo prodotto?"
            );


        if (!confirmed) return;


        products =
            products.filter(
                p => p.id !== editingProductId
            );


        saveProducts();

        closeProductModal();

        renderProducts();

    }


    /* =========================================================
       SCORTA MINIMA AUTOMATICA
    ========================================================= */

    document
        .getElementById("productName")
        .addEventListener(
            "input",
            function () {

                const name =
                    this.value
                        .toLowerCase()
                        .trim();


                if (
                    productsWithMinStock5
                        .includes(name)
                ) {

                    document
                        .getElementById(
                            "productMinStock"
                        )
                        .value = 5;

                }

            }
        );


    /* =========================================================
       SCANNER
    ========================================================= */

    function openScanner() {

        document
            .getElementById("scannerModal")
            .classList.add("active");


        startScanner();

    }


    function closeScanner() {

        stopScanner();


        document
            .getElementById("scannerModal")
            .classList.remove("active");

    }


    function startScanner() {

        html5QrCode =
            new Html5Qrcode("reader");


        const config = {

            fps: 10,

            qrbox: {
                width: 280,
                height: 160
            },

            formatsToSupport: [

                Html5QrcodeSupportedFormats.EAN_13,

                Html5QrcodeSupportedFormats.EAN_8,

                Html5QrcodeSupportedFormats.UPC_A,

                Html5QrcodeSupportedFormats.UPC_E

            ]

        };


        html5QrCode
            .start(

                {
                    facingMode: "environment"
                },

                config,

                barcode => {

                    handleBarcode(barcode);

                },

                error => {

                    /*
                       Gli errori di scansione vengono
                       ignorati mentre cerca il codice.
                    */

                }

            )
            .catch(error => {

                alert(
                    "Non è possibile accedere alla fotocamera. Controlla i permessi del browser."
                );

            });

    }


    function stopScanner() {

        if (!html5QrCode) return;


        html5QrCode
            .stop()
            .then(() => {

                html5QrCode.clear();

                html5QrCode = null;

            })
            .catch(() => {

                html5QrCode = null;

            });

    }


    /* =========================================================
       BARCODE
    ========================================================= */

    async function handleBarcode(barcode) {

        stopScanner();

        document
            .getElementById("scannerModal")
            .classList.remove("active");


        /*
           Controlliamo prima se il prodotto
           esiste già nella nostra dispensa.
        */

        const existing =
            products.find(
                p => p.barcode === barcode
            );


        if (existing) {

            existing.quantity =
                Number(existing.quantity) + 1;


            saveProducts();

            currentCategory =
                existing.category;


            document
                .getElementById("categoryTitle")
                .textContent =
                    categories[
                        existing.category
                    ].name;


            renderProducts();

            alert(
                existing.name +
                " aggiunto. Quantità: " +
                existing.quantity
            );


            return;

        }


        /*
           Se non esiste, cerchiamo il prodotto
           su Open Food Facts.
        */

        try {

            const response =
                await fetch(
                    "https://world.openfoodfacts.org/api/v2/product/"
                    + encodeURIComponent(barcode)
                    + ".json"
                );


            const data =
                await response.json();


            if (
                data.status === 1 &&
                data.product
            ) {

                const p =
                    data.product;


                const category =
                    currentCategory;


                openProductModal();


                document
                    .getElementById("productName")
                    .value =
                        p.product_name || "";


                document
                    .getElementById("productBrand")
                    .value =
                        p.brands || "";


                document
                    .getElementById("productFormat")
                    .value =
                        p.quantity || "";


                document
                    .getElementById("productBarcode")
                    .value =
                        barcode;


                document
                    .getElementById("productImage")
                    .value =
                        p.image_front_url || "";


                document
                    .getElementById("productCategory")
                    .value =
                        category;


                document
                    .getElementById("productQuantity")
                    .value = 1;


                const productName =
                    (
                        p.product_name || ""
                    )
                    .toLowerCase()
                    .trim();


                document
                    .getElementById("productMinStock")
                    .value =
                        productsWithMinStock5
                            .includes(productName)
                            ? 5
                            : 1;

            } else {

                openProductModal();

                document
                    .getElementById("productBarcode")
                    .value =
                        barcode;

                alert(
                    "Prodotto non trovato su Open Food Facts. Inserisci i dati manualmente."
                );

            }

        } catch (error) {

            openProductModal();

            document
                .getElementById("productBarcode")
                .value =
                    barcode;

            alert(
                "Non riesco a contattare Open Food Facts. Puoi inserire il prodotto manualmente."
            );

        }

    }


    /* =========================================================
       SICUREZZA HTML
    ========================================================= */

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =========================================================
       AVVIO
    ========================================================= */

    loadProducts();

    renderProducts();

</script>

</body>
</html>
