
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7bbf6a">
<title>La Mia Dispensa</title>
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  color: #26342b;
  background: #f5f7f4;
}

body {
  margin: 0;
  padding-top: 8px;
  min-height: 100vh;
}

button, input, select {
  font: inherit;
}

button {
  cursor: pointer;
  touch-action: manipulation;
}

.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 8px;
  background: linear-gradient(90deg, #7bbf6a, #a8d96d, #6fb7a8);
  z-index: 10;
}

.screen {
  display: none;
  padding: 28px 20px 36px;
}

.screen.active {
  display: block;
}

.container {
  max-width: 1000px;
  margin: auto;
}

/* INTESTAZIONE */

.heading {
  display: flex;
  align-items: center;
  gap: 18px;
  margin: 16px 0 30px;
}

.logo {
  width: 72px;
  height: 72px;
  display: grid;
  place-items: center;
  background: white;
  border-radius: 20px;
  font-size: 42px;
  flex-shrink: 0;
}

h1 {
  font-size: 32px;
  margin: 0 0 6px;
}

.subtitle {
  margin: 0;
  color: #718076;
  font-size: 17px;
}

/* CATEGORIE */

.categories {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
}

.category {
  border: 1px solid #e7ece6;
  border-radius: 24px;
  background: #fff;
  box-shadow: 0 5px 18px #28463212;
  min-height: 190px;
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  color: #26342b;
}

.category-icon {
  width: 82px;
  height: 82px;
  border-radius: 23px;
  background: #f1f7ee;
  display: grid;
  place-items: center;
  font-size: 46px;
}

.category-name {
  font-size: 21px;
  font-weight: 700;
  text-align: center;
}

/* INTESTAZIONE CATEGORIA */

.header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 6px 0 24px;
}

.back {
  width: 56px;
  height: 56px;
  flex-shrink: 0;
  border: 0;
  border-radius: 16px;
  background: white;
  font-size: 30px;
}

.header h2 {
  font-size: 28px;
  margin: 0 0 5px;
}

.header p {
  margin: 0;
  font-size: 16px;
  color: #7a877e;
}

/* RICERCA E SCANNER */

.toolbar {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
}

.search {
  min-width: 0;
  flex: 1;
  height: 58px;
  border: 1px solid #dfe6df;
  border-radius: 16px;
  background: white;
  padding: 0 17px;
  font-size: 19px;
  outline: none;
}

.search:focus {
  border-color: #7bbf6a;
  box-shadow: 0 0 0 3px #7bbf6a25;
}

.scanner {
  width: 62px;
  height: 58px;
  flex-shrink: 0;
  border: 1px solid #dfe6df;
  border-radius: 16px;
  background: white;
  font-size: 30px;
}

/* FILTRI */

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 20px;
}

.filter {
  min-height: 46px;
  border: 1px solid #dce5dc;
  background: white;
  color: #66746b;
  border-radius: 30px;
  padding: 10px 18px;
  font-size: 17px;
}

.filter.active {
  background: #e8f4e4;
  border-color: #b8dbaa;
  color: #3d6935;
  font-weight: 700;
}

/* SCHEDE PRODOTTO */

.products {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.product {
  display: flex;
  align-items: center;
  gap: 22px;
  background: white;
  border: 2px solid transparent;
  border-radius: 20px;
  padding: 18px;
  box-shadow: 0 4px 15px #28463210;
}

/* Quantità uguale alla scorta minima: bordo arancione */
.product.stock-minimum {
  border: 3px solid #D97706 !important;
}

/* Quantità sotto la scorta minima: bordo rosso spesso */
.product.stock-critical {
  border: 4px solid #DC2626 !important;
}

/* Icona o immagine del prodotto */

.product-icon,
.product-image {
  width: 72px;
  height: 72px;
  flex-shrink: 0;
  border-radius: 16px;
  background: #f1f4f0;
  object-fit: cover;
  display: grid;
  place-items: center;
  font-size: 38px;
}

.info {
  flex: 1;
  min-width: 0;
}

.brand {
  font-size: 16px;
  color: #8a968e;
}

.name {
  font-size: 20px;
  font-weight: 700;
  overflow-wrap: anywhere;
  margin: 4px 0;
}

.format {
  font-size: 16px;
  color: #78857d;
}

.low-label {
  display: inline-block;
  background: #fff0ee;
  color: #c34c42;
  border-radius: 20px;
  padding: 6px 10px;
  font-size: 14px;
  font-weight: 700;
  margin-top: 8px;
}

/* CONTROLLI QUANTITÀ */


.controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.qty-btn,
.edit-btn {
  width: 55px;
  height: 55px;
  flex-shrink: 0;
  border: 0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  line-height: 1;
  text-align: center;
}

.qty-btn {
  background: #eef4eb;
  color: #41613a;
  font-size: 36px;
}

.edit-btn {
  background: #f3f5f3;
  font-size: 30px;
  margin-left: 10px;
}
  
.qty {
  min-width: 32px;
  text-align: center;
  font-size: 21px;
  font-weight: 700;
}

/* AGGIUNGI PRODOTTO */

.add {
  width: 100%;
  min-height: 62px;
  border: 0;
  border-radius: 17px;
  background: #7bbf6a;
  color: white;
  font-size: 20px;
  font-weight: 700;
  margin-top: 20px;
  padding: 14px;
}

.empty {
  padding: 45px 20px;
  text-align: center;
  background: white;
  border-radius: 20px;
  color: #718076;
  font-size: 18px;
}

/* FINESTRE MODALI */

.modal {
  display: none;
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 20;
  background: #19231c99;
  padding: 16px;
  align-items: center;
  justify-content: center;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.modal.active {
  display: flex;
}

.modal-content {
  width: 100%;
  max-width: 680px;
  max-height: 90vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: white;
  border-radius: 24px;
  padding: 24px;
  margin: auto;
  flex-shrink: 0;
}

.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 22px;
}

.modal-head h3 {
  margin: 0;
  font-size: 25px;
}

.close {
  flex-shrink: 0;
  border: 0;
  border-radius: 12px;
  background: #f1f4f1;
  width: 48px;
  height: 48px;
  font-size: 30px;
}

.field {
  margin-bottom: 18px;
}

.field label {
  display: block;
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 8px;
  color: #536158;
}

.field input,
.field select {
  width: 100%;
  height: 54px;
  border: 1px solid #dce4dc;
  border-radius: 13px;
  padding: 0 14px;
  background: white;
  color: #26342b;
  font-size: 18px;
}

.two {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.action {
  flex: 1;
  min-height: 54px;
  border: 0;
  border-radius: 14px;
  font-size: 18px;
  font-weight: 700;
  padding: 12px;
}

.save {
  background: #7bbf6a;
  color: white;
}

.cancel {
  background: #eef1ee;
  color: #5f6c64;
}

.delete {
  background: #fff0ee;
  color: #c34c42;
}

#reader {
  width: 100%;
  overflow: hidden;
  border-radius: 14px;
}

.help {
  font-size: 16px;
  line-height: 1.6;
  color: #718076;
  margin: 14px 0;
}

/* FEEDBACK AL TOCCO */

button:active {
  opacity: 0.82;
}

/* IPAD E TABLET */

@media screen and (min-width: 700px) {
  .screen {
    padding: 34px 28px 44px;
  }

  .categories {
    gap: 24px;
  }

  .category {
    min-height: 210px;
  }

.product {
  gap: 50px;
  padding: 20px;
}

.product-icon,
.product-image {
  margin-right: 8px;
}


  .name {
    font-size: 22px;
  }

  .controls {
    gap: 10px;
  }

  .qty-btn,
  .edit-btn {
    width: 52px;
    height: 52px;
  }
  .brand {
  font-size: 19px;
  font-weight: 500;
}
}

/* IPHONE E SCHERMI STRETTI */


@media screen and (max-width: 650px) {
  .categories {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .category {
    min-height: 110px;
    flex-direction: row;
    justify-content: flex-start;
    padding: 15px 20px;
  }

  .category-icon {
    width: 62px;
    height: 62px;
    font-size: 35px;
  }

  .category-name {
    font-size: 19px;
  }

  .product {
    gap: 14px;
    padding: 12px;
  }

  .product-icon,
  .product-image {
    width: 52px;
    height: 52px;
    font-size: 29px;
  }

  .name {
    font-size: 16px;
  }

  .controls {
    gap: 5px;
  }

  .qty-btn,
  .edit-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    line-height: 1;
  }

  .qty-btn {
    font-size: 20px;
  }

  .edit-btn {
    font-size: 18px;
    margin-left: 6px;
  }

  .two {
    gap: 9px;
  }

  .modal-content {
    padding: 18px;
  }
}


@media screen and (max-width: 390px) {
  .screen {
    padding-left: 12px;
    padding-right: 12px;
  }

  .product {
    gap: 18px;
    padding: 9px;
  }

  .product-icon,
  .product-image {
    width: 42px;
    height: 42px;
  }

  .name {
    font-size: 14px;
  }

  .controls {
    gap: 3px;
  }

  .qty-btn,
  .edit-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    line-height: 1;
  }

  .qty-btn {
    font-size: 18px;
  }

  .edit-btn {
    font-size: 16px;
    margin-left: 4px;
  }
}

</style>
</head>
<body>
<div class="topbar"></div>

<main id="home" class="screen active">
  <div class="container">
    <div class="heading">
      <div class="logo">🛒</div>
      <div><h1>La Mia Dispensa</h1><p class="subtitle">Scegli una categoria</p></div>
    </div>
    <div class="categories">
      <button type="button" class="category" data-action="category" data-category="cibo"><span class="category-icon">🍎</span><span class="category-name">Cibo</span></button>
      <button type="button" class="category" data-action="category" data-category="bagno"><span class="category-icon">🧴</span><span class="category-name">Prodotti bagno</span></button>
      <button type="button" class="category" data-action="category" data-category="pulizia"><span class="category-icon">🧹</span><span class="category-name">Prodotti pulizia</span></button>
    </div>
  </div>
</main>

<main id="categoryScreen" class="screen">
  <div class="container">
    <div class="header">
      <button type="button" class="back" data-action="home" aria-label="Torna indietro">←</button>
      <div><h2 id="categoryTitle">Cibo</h2><p>Gestisci i prodotti della categoria</p></div>
    </div>
    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Cerca prodotto..." autocomplete="off">
      <button type="button" class="scanner" data-action="scan" aria-label="Scansiona barcode">📷</button>
    </div>
    <div class="filters">
      <button type="button" id="filterAll" class="filter active" data-action="filter" data-filter="all">Tutti</button>
      <button type="button" id="filterLow" class="filter" data-action="filter" data-filter="low">🔴 Scorte basse</button>
    </div>
    <div id="products" class="products" aria-live="polite"></div>
    <button type="button" class="add" data-action="new">＋ Aggiungi prodotto</button>
  </div>
</main>

<div id="productModal" class="modal" role="dialog" aria-modal="true">
 <div class="modal-content">
  <div class="modal-head"><h3 id="modalTitle">Aggiungi prodotto</h3><button type="button" class="close" data-action="close-form" aria-label="Chiudi">×</button></div>
  <input id="productId" type="hidden">
  <div class="field"><label for="name">Nome prodotto *</label><input id="name" autocomplete="off" placeholder="Es. Piselli"></div>
  <div class="two">
   <div class="field"><label for="brand">Marca</label><input id="brand" placeholder="Es. Findus"></div>
   <div class="field"><label for="format">Formato</label><input id="format" placeholder="Es. 450 g"></div>
  </div>
  <div class="two">
   <div class="field"><label for="quantity">Quantità</label><input id="quantity" type="number" min="0" step="1" value="1" inputmode="numeric"></div>
   <div class="field"><label for="minStock">Scorta minima</label><input id="minStock" type="number" min="0" step="1" value="0" inputmode="numeric"></div>
  </div>
  <div class="field"><label for="productCategory">Categoria</label><select id="productCategory"><option value="cibo">Cibo</option><option value="bagno">Prodotti bagno</option><option value="pulizia">Prodotti pulizia</option></select></div>
  <div class="field"><label for="barcode">Barcode</label><input id="barcode" inputmode="numeric" placeholder="Codice a barre"></div>
  <div class="field"><label for="image">URL immagine</label><input id="image" type="url" placeholder="https://..."></div>
  <div class="actions"><button type="button" id="deleteBtn" class="action delete" data-action="delete" hidden>Elimina</button><button type="button" class="action cancel" data-action="close-form">Annulla</button><button type="button" class="action save" data-action="save">Salva</button></div>
 </div>
</div>

<div id="scannerModal" class="modal" role="dialog" aria-modal="true">
 <div class="modal-content">
  <div class="modal-head"><h3>Scansiona prodotto</h3><button type="button" class="close" data-action="close-scan" aria-label="Chiudi">×</button></div>
  <div id="reader"></div>
  <p class="help">La fotocamera richiede un sito HTTPS e il permesso del browser.</p>
  <button type="button" class="action cancel" style="width:100%" data-action="close-scan">Chiudi</button>
 </div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>

(function () {
  "use strict";

  var KEY = "laMiaDispensaProdotti";
  var categories = {
    cibo: { name: "Cibo", icon: "🍎" },
    bagno: { name: "Prodotti bagno", icon: "🧴" },
    pulizia: { name: "Prodotti pulizia", icon: "🧹" }
  };

  var products = [];
  var currentCategory = "cibo";
  var filter = "all";
  var editingId = null;
  var scanner = null;
  var scannerStarting = false;

  function $(id) {
    return document.getElementById(id);
  }

  function makeId() {
    return "id-" + new Date().getTime() + "-" +
      Math.floor(Math.random() * 1000000);
  }

  function number(value) {
    var n = Number(value);
    if (!isFinite(n) || n <= 0) return 0;
    return Math.floor(n);
  }

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function findProduct(id) {
    var i;
    for (i = 0; i < products.length; i++) {
      if (String(products[i].id) === String(id)) {
        return products[i];
      }
    }
    return null;
  }

  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify(products));
      return true;
    } catch (e) {
      console.error(e);
      alert("Impossibile salvare i dati in questo browser. Verifica le impostazioni di archiviazione.");
      return false;
    }
  }

  function load() {
    var raw, arr, i, p;

    try {
      raw = localStorage.getItem(KEY);

      if (raw !== null) {
        arr = JSON.parse(raw);

        if (!Array.isArray(arr)) {
          throw new Error("Dati non validi");
        }

        products = [];

        for (i = 0; i < arr.length; i++) {
          p = arr[i];

          products.push({
            id: String(p.id || makeId()),
            name: String(p.name || ""),
            brand: String(p.brand || ""),
            format: String(p.format || ""),
            quantity: number(p.quantity),
            minStock: number(p.minStock),
            category: categories[p.category] ? p.category : "cibo",
            barcode: String(p.barcode || ""),
            image: String(p.image || "")
          });
        }
      } else {
        products = [
          {
            id: makeId(), name: "Piselli", brand: "Esempio",
            format: "450 g", quantity: 8, minStock: 5,
            category: "cibo", barcode: "", image: ""
          },
          {
            id: makeId(), name: "Ceci", brand: "Esempio",
            format: "400 g", quantity: 6, minStock: 5,
            category: "cibo", barcode: "", image: ""
          },
          {
            id: makeId(), name: "Fagioli", brand: "Esempio",
            format: "400 g", quantity: 4, minStock: 5,
            category: "cibo", barcode: "", image: ""
          },
          {
            id: makeId(), name: "Passata di pomodoro", brand: "Esempio",
            format: "700 ml", quantity: 7, minStock: 5,
            category: "cibo", barcode: "", image: ""
          }
        ];

        persist();
      }
    } catch (e) {
      console.error(e);
      products = [];
      alert("Non riesco a leggere i dati salvati. Verifica la memoria del browser.");
    }
  }

  function setActive(id, active) {
    var el = $(id);
    if (!el) return;

    if (active) {
      if ((" " + el.className + " ").indexOf(" active ") === -1) {
        el.className += " active";
      }
    } else {
      el.className = (" " + el.className + " ")
        .replace(" active ", " ")
        .replace(/^\s+|\s+$/g, "");
    }
  }

  function goCategory(cat) {
    if (!categories[cat]) return;

    currentCategory = cat;
    filter = "all";

    setActive("home", false);
    setActive("categoryScreen", true);

    $("categoryTitle").textContent = categories[cat].name;
    $("search").value = "";

    updateFilters();
    render();
    window.scrollTo(0, 0);
  }

  function goHome() {
    closeForm();
    setActive("categoryScreen", false);
    setActive("home", true);
    window.scrollTo(0, 0);
  }

  function updateFilters() {
    setActive("filterAll", filter === "all");
    setActive("filterLow", filter === "low");
  }

function isLow(p) {
  return number(p.quantity) <= number(p.minStock);
}
  function render() {
    var query = $("search").value.toLowerCase()
      .replace(/^\s+|\s+$/g, "");
    var list = [];
    var i, p, text, icon, img, html = "";

    for (i = 0; i < products.length; i++) {
      p = products[i];

      if (p.category !== currentCategory) continue;

      text = (
        p.name + " " + p.brand + " " +
        p.format + " " + p.barcode
      ).toLowerCase();

      if (query && text.indexOf(query) === -1) continue;
      if (filter === "low" && !isLow(p)) continue;

      list.push(p);
    }

    list.sort(function (a, b) {
      return a.name.localeCompare(b.name);
    });

    if (!list.length) {
      $("products").innerHTML =
        '<div class="empty">📦<br><br>Nessun prodotto trovato.</div>';
      return;
    }

    for (i = 0; i < list.length; i++) {
      p = list[i];
      icon = categories[p.category] ?
        categories[p.category].icon : "📦";

      if (p.image && /^https?:\/\//i.test(p.image)) {
        img = '<img class="product-image" src="' +
          esc(p.image) + '" alt="">';
      } else {
        img = '<div class="product-icon">' + icon + '</div>';
      }

      html +=
 '<article class="product' +
  (number(p.quantity) < number(p.minStock)
    ? ' stock-critical'
    : number(p.quantity) === number(p.minStock)
      ? ' stock-minimum'
      : '') +
  '">' +
          img +
          '<div class="info">' +
            (p.brand ? '<div class="brand">' + esc(p.brand) + '</div>' : '') +
            '<div class="name">' + esc(p.name) + '</div>' +
            (p.format ? '<div class="format">' + esc(p.format) + '</div>' : '') +
            (isLow(p) ? '<div class="low-label">🔴 Scorta bassa</div>' : '') +
          '</div>' +
          '<div class="controls">' +
            '<button type="button" class="qty-btn" data-action="qty" data-id="' +
              esc(p.id) + '" data-delta="-1" aria-label="Diminuisci">−</button>' +
            '<span class="qty">' + number(p.quantity) + '</span>' +
            '<button type="button" class="qty-btn" data-action="qty" data-id="' +
              esc(p.id) + '" data-delta="1" aria-label="Aumenta">+</button>' +
            '<button type="button" class="edit-btn" data-action="edit" data-id="' +
              esc(p.id) + '" aria-label="Modifica">✏️</button>' +
          '</div>' +
        '</article>';
    }

    $("products").innerHTML = html;

    /* Gestisce gli errori delle immagini senza API moderne. */
    var images = $("products").getElementsByTagName("img");
    for (i = 0; i < images.length; i++) {
      images[i].onerror = function () {
        var replacement = document.createElement("div");
        replacement.className = "product-icon";
        replacement.textContent = "📦";

        if (this.parentNode) {
          this.parentNode.replaceChild(replacement, this);
        }
      };
    }
  }

  function changeQty(id, delta) {
    var p = findProduct(id);
    if (!p) return;

    p.quantity = Math.max(0, number(p.quantity) + delta);

    if (persist()) render();
  }

  function openForm(p) {
    editingId = p ? p.id : null;

    $("modalTitle").textContent =
      p ? "Modifica prodotto" : "Aggiungi prodotto";

    $("deleteBtn").hidden = !p;
    $("productId").value = p ? p.id : "";
    $("name").value = p ? p.name : "";
    $("brand").value = p ? p.brand : "";
    $("format").value = p ? p.format : "";
    $("quantity").value = p ? number(p.quantity) : 1;
    $("minStock").value = p ? number(p.minStock) : 0;
    $("productCategory").value = p ? p.category : currentCategory;
    $("barcode").value = p ? p.barcode : "";
    $("image").value = p ? p.image : "";

    setActive("productModal", true);
  }

  function closeForm() {
    setActive("productModal", false);
    editingId = null;
  }

  function saveProduct() {
    var name = $("name").value.replace(/^\s+|\s+$/g, "");
    var image = $("image").value.replace(/^\s+|\s+$/g, "");
    var data, p, i, found = false;

    if (!name) {
      alert("Inserisci il nome del prodotto.");
      $("name").focus();
      return;
    }

    if (image && !/^https?:\/\//i.test(image)) {
      alert("Inserisci un URL immagine valido che inizi con http:// o https://.");
      return;
    }

    data = {
      name: name,
      brand: $("brand").value.replace(/^\s+|\s+$/g, ""),
      format: $("format").value.replace(/^\s+|\s+$/g, ""),
      quantity: number($("quantity").value),
      minStock: number($("minStock").value),
      category: $("productCategory").value,
      barcode: $("barcode").value.replace(/^\s+|\s+$/g, ""),
      image: image
    };

    if (!categories[data.category]) {
      alert("Scegli una categoria valida.");
      return;
    }

    if (editingId) {
      p = findProduct(editingId);

      if (!p) {
        alert("Prodotto non trovato.");
        return;
      }

      for (i in data) {
        if (Object.prototype.hasOwnProperty.call(data, i)) {
          p[i] = data[i];
        }
      }
      found = true;
    }

    if (!found) {
      data.id = makeId();
      products.push(data);
    }

    if (persist()) {
      currentCategory = data.category;
      filter = "all";
      $("search").value = "";
      $("categoryTitle").textContent = categories[currentCategory].name;

      setActive("home", false);
      setActive("categoryScreen", true);

      updateFilters();
      closeForm();
      render();
    }
  }

  function removeProduct() {
    var p, old;

    if (!editingId) return;

    p = findProduct(editingId);
    if (!p) return;

    if (!window.confirm('Vuoi eliminare "' + p.name + '"?')) return;

    old = products.slice(0);
    products = products.filter(function (item) {
      return item.id !== editingId;
    });

    if (persist()) {
      closeForm();
      render();
    } else {
      products = old;
    }
  }

  function openScan() {
    setActive("scannerModal", true);

    if (scanner || scannerStarting) return;

    if (location.protocol !== "https:" &&
        location.hostname !== "localhost" &&
        location.hostname !== "127.0.0.1") {
      alert("La fotocamera richiede HTTPS. Apri l'app con un link che inizi con https://");
      return;
    }

    if (typeof Html5Qrcode === "undefined") {
      alert("Scanner non caricato. Controlla la connessione Internet e ricarica la pagina.");
      return;
    }

    scannerStarting = true;

    try {
      scanner = new Html5Qrcode("reader");

      var config = {
        fps: 10,
        qrbox: { width: 250, height: 140 }
      };

      if (window.Html5QrcodeSupportedFormats) {
        config.formatsToSupport = [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.CODE_128
        ];
      }
      scanner.start(
        { facingMode: "user" },
        config,
        function (code) {
          handleBarcode(code);
        },
        function () {}
      ).then(function () {
        scannerStarting = false;
      }).catch(function (e) {
        console.error(e);
        scannerStarting = false;
        alert("Fotocamera non disponibile. Controlla i permessi del browser.");
        closeScan();
      });
    } catch (e) {
      console.error(e);
      scannerStarting = false;
      alert("Impossibile avviare lo scanner su questo browser.");
      closeScan();
    }
  }

  function stopScan(callback)
 {
    var s = scanner;
    scanner = null;

    if (!s) {
      $("reader").innerHTML = "";
      if (callback) callback();
      return;
    }

    function clearScanner() {
      try { s.clear(); } catch (e) {}
      $("reader").innerHTML = "";
      if (callback) callback();
    }

    try {
      if (s.isScanning) {
        s.stop().then(clearScanner).catch(clearScanner);
      } else {
        clearScanner();
      }
    } catch (e) {
      clearScanner();
    }
  }

  function closeScan() {
    setActive("scannerModal", false);
    stopScan();
  }

  function handleBarcode(code) {
    var barcode = String(code || "").replace(/^\s+|\s+$/g, "");
    var existing;

    closeScan();
    if (!barcode) return;

    existing = null;

    for (var i = 0; i < products.length; i++) {
      if (products[i].barcode === barcode) {
        existing = products[i];
        break;
      }
    }

    if (existing) {
      existing.quantity = number(existing.quantity) + 1;

      if (persist()) {
        render();
        alert(existing.name + ": quantità " + existing.quantity);
      }
      return;
    }

    openForm(null);
    $("barcode").value = barcode;
    $("productCategory").value = currentCategory;

    if (!window.fetch) {
      alert("Ricerca online non supportata. Inserisci i dati manualmente.");
      return;
    }

    window.fetch(
      "https://world.openfoodfacts.org/api/v2/product/" +
      encodeURIComponent(barcode) + ".json"
    ).then(function (response) {
      if (!response.ok) throw new Error("Servizio non disponibile");
      return response.json();
    }).then(function (result) {
      if (result.status === 1 && result.product) {
        var product = result.product;

        $("name").value =
          product.product_name_it || product.product_name || "";
        $("brand").value = product.brands || "";
        $("format").value = product.quantity || "";
        $("image").value =
          product.image_front_url || product.image_url || "";
      } else {
        alert("Prodotto non trovato online. Inserisci i dati manualmente.");
      }
    }).catch(function (e) {
      console.warn(e);
      alert("Non riesco a recuperare i dati online. Puoi inserire il prodotto manualmente.");
    });
  }

  /*
   * Compatibilità con Safari iOS 12:
   * niente closest(), dataset, funzioni freccia o sintassi moderna.
   */
  document.addEventListener("click", function (event) {
    var el = event.target;
    var action, id, delta, p;

    while (el && el !== document) {
      if (el.getAttribute &&
          el.getAttribute("data-action")) {
        break;
      }
      el = el.parentNode;
    }

    if (!el || el === document) return;

    action = el.getAttribute("data-action");
    id = el.getAttribute("data-id");

    try {
      switch (action) {
        case "category":
          goCategory(el.getAttribute("data-category"));
          break;

        case "home":
          goHome();
          break;

        case "filter":
          filter = el.getAttribute("data-filter") === "low" ? "low" : "all";
          updateFilters();
          render();
          break;

        case "qty":
          delta = Number(el.getAttribute("data-delta"));
          changeQty(id, delta);
          break;

        case "new":
          openForm(null);
          break;

        case "edit":
          p = findProduct(id);
          if (p) openForm(p);
          break;

        case "close-form":
          closeForm();
          break;

        case "save":
          saveProduct();
          break;

        case "delete":
          removeProduct();
          break;

        case "scan":
          openScan();
          break;

        case "close-scan":
          closeScan();
          break;
      }
    } catch (e) {
      console.error(e);
      alert("Si è verificato un errore. Ricarica la pagina e riprova.");
    }
  }, false);

  $("search").addEventListener("input", render, false);

  $("productModal").addEventListener("click", function (event) {
    if (event.target === $("productModal")) closeForm();
  }, false);

  $("scannerModal").addEventListener("click", function (event) {
    if (event.target === $("scannerModal")) closeScan();
  }, false);

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      closeForm();
      closeScan();
    }
  }, false);

  window.addEventListener("pagehide", function () {
    stopScan();
  }, false);

  load();
  render();
}());
</script>
</body>
</html>
