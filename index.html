<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="La Mia Dispensa">

    <title>La Mia Dispensa</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>

<body>

    <!-- =========================
         HOME
    ========================= -->

    <section id="homeScreen" class="screen active">

        <div class="home-container">

            <h1 class="app-title">
                La Mia Dispensa
            </h1>

            <p class="app-subtitle">
                Organizza tutto ciò che hai in casa
            </p>

            <div class="home-cards">

                <button
                    type="button"
                    class="home-card casa"
                    onclick="openDispensa('casa')"
                >
                    <div class="home-card-icon">
                        🏠
                    </div>

                    <div class="home-card-title">
                        Dispensa Casa
                    </div>

                    <div class="home-card-subtitle">
                        Cibo e prodotti bagno
                    </div>

                    <div class="home-card-arrow">
                        →
                    </div>
                </button>


                <button
                    type="button"
                    class="home-card cantina"
                    onclick="openDispensa('cantina')"
                >
                    <div class="home-card-icon">
                        🧹
                    </div>

                    <div class="home-card-title">
                        Dispensa Cantina
                    </div>

                    <div class="home-card-subtitle">
                        Prodotti di pulizia
                    </div>

                    <div class="home-card-arrow">
                        →
                    </div>
                </button>

            </div>

        </div>

    </section>


    <!-- =========================
         DISPENSA
    ========================= -->

    <section id="dispensaScreen" class="screen">

        <div class="screen-header">

            <button
                type="button"
                class="back-button"
                onclick="goHome()"
            >
                ← Indietro
            </button>

            <h1
                id="dispensaTitle"
                class="screen-title"
            >
                Dispensa Casa
            </h1>

        </div>

        <div class="dispensa-container">

            <div
                id="categoryCards"
                class="dispensa-cards"
            ></div>

        </div>

    </section>


    <!-- =========================
         CATEGORY
    ========================= -->

    <section id="categoryScreen" class="screen">

        <div class="screen-header">

            <button
                type="button"
                class="back-button"
                onclick="backToDispensa()"
            >
                ← Indietro
            </button>

            <h1
                id="categoryTitle"
                class="screen-title"
            >
                Cibo
            </h1>

            <p
                id="categorySubtitle"
                class="screen-subtitle"
            >
                Dispensa e alimentari
            </p>

        </div>


        <div class="category-container">

            <div class="category-toolbar">

                <button
                    type="button"
                    class="primary-button"
                    onclick="openProductModal()"
                >
                    ＋ Aggiungi
                </button>

                <button
                    type="button"
                    class="secondary-button"
                    onclick="openScanner()"
                >
                    📷 Scanner
                </button>

            </div>


            <div class="search-wrapper">

                <input
                    id="searchInput"
                    class="search-input"
                    type="search"
                    placeholder="Cerca prodotto..."
                    autocomplete="off"
                    oninput="renderProducts()"
                >

            </div>


            <div class="filter-buttons">

                <button
                    id="filterAll"
                    type="button"
                    class="filter-button active"
                    onclick="setFilter('all')"
                >
                    Tutti
                </button>

                <button
                    id="filterLow"
                    type="button"
                    class="filter-button"
                    onclick="setFilter('low')"
                >
                    Scorte basse
                </button>

            </div>


            <div
                id="productsList"
                class="products-list"
            ></div>

        </div>

    </section>


    <!-- =========================
         PRODUCT MODAL
    ========================= -->

    <div
        id="productModal"
        class="modal-overlay"
        onclick="closeModalOutside(event, 'productModal')"
    >

        <div class="modal">

            <div class="modal-header">

                <h2
                    id="productModalTitle"
                    class="modal-title"
                >
                    Nuovo prodotto
                </h2>

                <button
                    type="button"
                    class="modal-close"
                    onclick="closeProductModal()"
                >
                    ×
                </button>

            </div>


            <div class="form-group">

                <label
                    class="form-label"
                    for="productName"
                >
                    Nome prodotto
                </label>

                <input
                    id="productName"
                    class="form-input"
                    type="text"
                    placeholder="Es. Pasta"
                >

            </div>


            <div class="form-group">

                <label
                    class="form-label"
                    for="productBrand"
                >
                    Marca
                </label>

                <input
                    id="productBrand"
                    class="form-input"
                    type="text"
                    placeholder="Es. Barilla"
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label
                        class="form-label"
                        for="productFormat"
                    >
                        Formato
                    </label>

                    <input
                        id="productFormat"
                        class="form-input"
                        type="text"
                        placeholder="Es. 500 g"
                    >

                </div>


                <div class="form-group">

                    <label
                        class="form-label"
                        for="productQuantity"
                    >
                        Quantità
                    </label>

                    <input
                        id="productQuantity"
                        class="form-input"
                        type="number"
                        min="0"
                        step="1"
                        value="1"
                    >

                </div>

            </div>


            <div class="form-group">

                <label
                    class="form-label"
                    for="productMinStock"
                >
                    Scorta minima
                </label>

                <input
                    id="productMinStock"
                    class="form-input"
                    type="number"
                    min="0"
                    step="1"
                    value="1"
                >

            </div>


            <div class="form-group">

                <label
                    class="form-label"
                    for="productCategory"
                >
                    Categoria
                </label>

                <select
                    id="productCategory"
                    class="form-select"
                >
                    <option value="cibo">
                        Cibo
                    </option>

                    <option value="bagno">
                        Prodotti bagno
                    </option>

                    <option value="pulizia">
                        Prodotti pulizia
                    </option>
                </select>

            </div>


            <div class="form-group">

                <label
                    class="form-label"
                    for="productBarcode"
                >
                    Codice a barre
                </label>

                <input
                    id="productBarcode"
                    class="form-input"
                    type="text"
                    placeholder="Codice EAN"
                >

            </div>


            <div class="form-group">

                <label
                    class="form-label"
                    for="productImage"
                >
                    URL immagine
                </label>

                <input
                    id="productImage"
                    class="form-input"
                    type="url"
                    placeholder="https://..."
                >

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="secondary-button"
                    onclick="closeProductModal()"
                >
                    Annulla
                </button>

                <button
                    type="button"
                    class="primary-button"
                    onclick="saveProduct()"
                >
                    Salva
                </button>

            </div>


            <button
                id="deleteProductButton"
                type="button"
                class="delete-button"
                onclick="deleteProduct()"
                style="display:none;"
            >
                Elimina prodotto
            </button>

        </div>

    </div>


    <!-- =========================
         SCANNER MODAL
    ========================= -->

    <div
        id="scannerModal"
        class="modal-overlay"
        onclick="closeModalOutside(event, 'scannerModal')"
    >

        <div class="modal scanner-modal">

            <div class="modal-header">

                <h2 class="modal-title">
                    Scansiona prodotto
                </h2>

                <button
                    type="button"
                    class="modal-close"
                    onclick="closeScanner()"
                >
                    ×
                </button>

            </div>


            <div id="reader"></div>


            <div
                id="scannerStatus"
                class="scanner-status"
            >
                Avvio fotocamera...
            </div>


            <button
                type="button"
                class="scanner-close-button"
                onclick="closeScanner()"
            >
                Chiudi scanner
            </button>

        </div>

    </div>


    <!-- =========================
         TOAST
    ========================= -->

    <div
        id="toast"
        class="toast"
    ></div>


    <script src="script.js"></script>

</body>
</html>
