
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>La Mia Dispensa</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #f4f5f7;
  color: #202124;
  min-height: 100%;
  -webkit-text-size-adjust: 100%;
}
body { padding-bottom: 24px; }
button, input, select { font: inherit; }
button { cursor: pointer; touch-action: manipulation; }
header {
  background: #287a55;
  color: white;
  padding: 18px 16px;
  text-align: center;
}
header h1 { font-size: 23px; margin: 0 0 5px; }
header p { font-size: 13px; margin: 0; opacity: .9; }
main { max-width: 760px; margin: 0 auto; padding: 14px; }
.hidden { display: none !important; }

.category-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-top: 8px;
}
.category-card {
  border: 0;
  border-radius: 14px;
  padding: 22px 16px;
  color: white;
  text-align: left;
  min-height: 92px;
  box-shadow: 0 2px 7px rgba(0,0,0,.08);
}
.category-card strong { display: block; font-size: 20px; margin-bottom: 5px; }
.category-card span { font-size: 13px; opacity: .95; }
.cat-cibo { background: #287a55; }
.cat-bagno { background: #3878bd; }
.cat-pulizia { background: #9a6b27; }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.btn {
  border: 0;
  border-radius: 10px;
  padding: 12px 14px;
  background: #287a55;
  color: white;
  font-weight: 600;
  min-height: 44px;
}
.btn.secondary { background: #e4e8eb; color: #252a2d; }
.btn.danger { background: #b83b3b; color: white; }
.btn.small { padding: 8px 11px; min-height: 40px; }
.back-btn { margin-bottom: 10px; }
h2 { font-size: 21px; margin: 8px 0; }

.search-row { display: flex; gap: 8px; margin: 12px 0; }
.search-row input { flex: 1; min-width: 0; }
input, select {
  width: 100%;
  border: 1px solid #cbd0d5;
  border-radius: 10px;
  padding: 12px;
  background: white;
  min-height: 44px;
  color: #202124;
}
.filter-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 8px 0 12px;
  font-size: 14px;
}
.filter-row input { width: 20px; height: 20px; min-height: 0; }

.product-list { display: flex; flex-direction: column; gap: 10px; }
.product {
  background: white;
  border-radius: 13px;
  padding: 13px;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}
.product-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: flex-start;
}
.product-name {
  font-size: 17px;
  font-weight: 700;
  overflow-wrap: anywhere;
}
.product-meta { font-size: 13px; color: #646b70; margin-top: 5px; }
.low-label {
  display: inline-block;
  color: #a42c2c;
  background: #ffeded;
  padding: 3px 7px;
  border-radius: 6px;
  font-size: 12px;
  margin-top: 6px;
}
.qty-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.qty-row .qty { font-size: 18px; font-weight: 700; min-width: 54px; text-align: center; }
.qty-btn {
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 10px;
  background: #e8efeb;
  color: #175e3c;
  font-size: 25px;
  font-weight: 700;
}
.product-actions { display: flex; gap: 7px; margin-left: auto; }
.empty {
  padding: 24px;
  text-align: center;
  color: #70777c;
  background: white;
  border-radius: 12px;
}
.modal-backdrop {
  position: fixed;
  z-index: 1000;
  left: 0; top: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.48);
  padding: 12px;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
}
.modal {
  background: white;
  border-radius: 16px;
  max-width: 520px;
  margin: 18px auto;
  padding: 18px;
}
.modal h2 { margin-top: 0; }
.form-row { margin: 12px 0; }
.form-row label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 5px;
}
.form-actions { display: flex; gap: 8px; margin-top: 18px; }
.form-actions button { flex: 1; }
.note { font-size: 12px; color: #697178; line-height: 1.4; }
#scanner-box { width: 100%; min-height: 20px; margin: 10px 0; }
#status { font-size: 13px; margin: 8px 0; color: #555; }

@media (min-width: 560px) {
  .category-grid { grid-template-columns: repeat(3, 1fr); }
  .category-card { min-height: 150px; }
  .category-card strong { font-size: 18px; }
}
</style>
</head>

<body>
<header>
  <h1>La Mia Dispensa</h1>
  <p>La tua lista di casa, sempre a portata di mano</p>
</header>

<main>
  <section id="home-screen">
    <h2>Le categorie</h2>
    <div class="category-grid">
      <button type="button" class="category-card cat-cibo" data-action="category" data-category="cibo">
        <strong>🍎 Cibo</strong><span>Dispensa e alimenti</span>
      </button>
      <button type="button" class="category-card cat-bagno" data-action="category" data-category="bagno">
        <strong>🧴 Bagno</strong><span>Igiene personale</span>
      </button>
      <button type="button" class="category-card cat-pulizia" data-action="category" data-category="pulizia">
        <strong>🧹 Pulizia</strong><span>Prodotti per la casa</span>
      </button>
    </div>
    <div class="toolbar">
      <button type="button" class="btn secondary" data-action="export">Esporta dati</button>
      <button type="button" class="btn secondary" data-action="import">Importa dati</button>
      <input id="import-file" class="hidden" type="file" accept="application/json,.json">
    </div>
  </section>

  <section id="category-screen" class="hidden">
    <button type="button" class="btn secondary back-btn" data-action="home">← Categorie</button>
    <h2 id="category-title">Categoria</h2>
    <div class="toolbar">
      <button type="button" class="btn" data-action="add">＋ Aggiungi prodotto</button>
      <button type="button" class="btn secondary" data-action="scan">▦ Scansiona codice</button>
    </div>
    <div class="search-row">
      <input id="search-input" type="search" placeholder="Cerca un prodotto…" autocomplete="off">
      <button type="button" class="btn secondary" data-action="clear-search">Pulisci</button>
    </div>
    <label class="filter-row">
      <input id="low-filter" type="checkbox">
      Mostra solo prodotti da riacquistare
    </label>
    <div id="product-list" class="product-list"></div>
    <div id="status" role="status"></div>
    <div id="scanner-box"></div>
  </section>
</main>

<div id="modal-backdrop" class="modal-backdrop hidden">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">Aggiungi prodotto</h2>
    <form id="product-form">
      <div class="form-row">
        <label for="name">Nome prodotto *</label>
        <input id="name" name="name" required maxlength="120" autocomplete="off">
      </div>
      <div class="form-row">
        <label for="quantity">Quantità attuale</label>
        <input id="quantity" name="quantity" type="number" min="0" step="1" value="1">
      </div>
      <div class="form-row">
        <label for="unit">Unità</label>
        <select id="unit" name="unit">
          <option value="pezzi">pezzi</option>
          <option value="confezioni">confezioni</option>
          <option value="kg">kg</option>
          <option value="g">g</option>
          <option value="l">l</option>
          <option value="ml">ml</option>
        </select>
      </div>
      <div class="form-row">
        <label for="minimum">Soglia per riacquisto</label>
        <input id="minimum" name="minimum" type="number" min="0" step="1" value="1">
      </div>
      <div class="form-row">
        <label for="barcode">Codice a barre (facoltativo)</label>
        <input id="barcode" name="barcode" inputmode="numeric">
      </div>
      <div class="form-actions">
        <button type="button" class="btn secondary" data-action="close-modal">Annulla</button>
        <button type="submit" class="btn">Salva</button>
      </div>
      <p class="note">I dati vengono salvati sul dispositivo in uso.</p>
    </form>
  </div>
</div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'laMiaDispensa_v1';
  var products = [];
  var currentCategory = 'cibo';
  var editingId = null;
  var scanner = null;
  var categoryNames = {
    cibo: '🍎 Cibo',
    bagno: '🧴 Bagno',
    pulizia: '🧹 Pulizia'
  };

  function byId(id) {
    return document.getElementById(id);
  }

  function makeId() {
    return 'p' + new Date().getTime() +
      String(Math.floor(Math.random() * 1000000));
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
    } catch (e) {
      setStatus('Impossibile salvare i dati nel browser.');
    }
  }

  function load() {
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      products = saved ? JSON.parse(saved) : [];
      if (!Array.isArray(products)) {
        products = [];
      }
    } catch (e) {
      products = [];
    }
  }

  function setStatus(message) {
    byId('status').textContent = message || '';
  }

  function showHome() {
    stopScanner();
    byId('home-screen').className = '';
    byId('category-screen').className = 'hidden';
  }

  function showCategory(category) {
    stopScanner();
    currentCategory = category;
    byId('home-screen').className = 'hidden';
    byId('category-screen').className = '';
    byId('category-title').textContent = categoryNames[category] || 'Categoria';
    byId('search-input').value = '';
    byId('low-filter').checked = false;
    setStatus('');
    renderProducts();
  }

  function renderProducts() {
    var list = byId('product-list');
    var search = byId('search-input').value.toLowerCase().replace(/^\s+|\s+$/g, '');
    var onlyLow = byId('low-filter').checked;
    var filtered = [];
    var i, p, qty, min, html = '';

    for (i = 0; i < products.length; i++) {
      p = products[i];
      if (p.category !== currentCategory) {
        continue;
      }
      if (search && String(p.name || '').toLowerCase().indexOf(search) === -1) {
        continue;
      }
      qty = Number(p.quantity) || 0;
      min = Number(p.minimum) || 0;
      if (onlyLow && qty > min) {
        continue;
      }
      filtered.push(p);
    }

    if (!filtered.length) {
      list.innerHTML = '<div class="empty">Nessun prodotto trovato.<br>Premi “Aggiungi prodotto” per iniziare.</div>';
      return;
    }

    for (i = 0; i < filtered.length; i++) {
      p = filtered[i];
      qty = Number(p.quantity) || 0;
      min = Number(p.minimum) || 0;

      html += '<article class="product">' +
        '<div class="product-top"><div>' +
        '<div class="product-name">' + escapeHtml(p.name) + '</div>' +
        '<div class="product-meta">Da riacquistare sotto: ' + min + ' ' + escapeHtml(p.unit || 'pezzi') + '</div>' +
        (qty <= min ? '<span class="low-label">Da riacquistare</span>' : '') +
        (p.barcode ? '<div class="product-meta">Codice: ' + escapeHtml(p.barcode) + '</div>' : '') +
        '</div><div class="product-actions">' +
        '<button type="button" class="btn secondary small" data-action="edit" data-id="' + escapeHtml(p.id) + '">Modifica</button>' +
        '<button type="button" class="btn danger small" data-action="delete" data-id="' + escapeHtml(p.id) + '">Elimina</button>' +
        '</div></div>' +
        '<div class="qty-row">' +
        '<button type="button" class="qty-btn" data-action="minus" data-id="' + escapeHtml(p.id) + '" aria-label="Diminuisci quantità">−</button>' +
        '<span class="qty">' + qty + ' ' + escapeHtml(p.unit || 'pezzi') + '</span>' +
        '<button type="button" class="qty-btn" data-action="plus" data-id="' + escapeHtml(p.id) + '" aria-label="Aumenta quantità">+</button>' +
        '</div></article>';
    }

    list.innerHTML = html;
  }

  function openModal(product) {
    editingId = product ? product.id : null;
    byId('modal-title').textContent = product ? 'Modifica prodotto' : 'Aggiungi prodotto';
    byId('name').value = product ? product.name : '';
    byId('quantity').value = product ? (Number(product.quantity) || 0) : 1;
    byId('unit').value = product && product.unit ? product.unit : 'pezzi';
    byId('minimum').value = product ? (Number(product.minimum) || 0) : 1;
    byId('barcode').value = product && product.barcode ? product.barcode : '';
    byId('modal-backdrop').className = 'modal-backdrop';
    window.setTimeout(function () {
      byId('name').focus();
    }, 100);
  }

  function closeModal() {
    byId('modal-backdrop').className = 'modal-backdrop hidden';
    editingId = null;
  }

  function findProduct(id) {
    var i;
    for (i = 0; i < products.length; i++) {
      if (String(products[i].id) === String(id)) {
        return products[i];
      }
    }
    return null;
  }

  function deleteProduct(id) {
    var p = findProduct(id);
    if (!p) {
      return;
    }
    if (!window.confirm('Eliminare "' + p.name + '"?')) {
      return;
    }
    products = products.filter(function (item) {
      return String(item.id) !== String(id);
    });
    save();
    renderProducts();
  }

  function stopScanner() {
    if (scanner) {
      try {
        scanner.stop().then(function () {
          scanner.clear();
        }).catch(function () {});
      } catch (e) {}
      scanner = null;
    }
    byId('scanner-box').innerHTML = '';
  }

  function startScanner() {
    setStatus('');

    if (location.protocol !== 'https:' &&
        location.hostname !== 'localhost' &&
        location.hostname !== '127.0.0.1') {
      setStatus('La scansione richiede una pagina aperta tramite HTTPS.');
      return;
    }

    if (typeof Html5Qrcode === 'undefined') {
      setStatus('Scanner non disponibile. Puoi inserire il codice a barre manualmente.');
      return;
    }

    byId('scanner-box').innerHTML = '<div id="reader" style="width:100%"></div>';

    try {
      scanner = new Html5Qrcode('reader');
      scanner.start(
        { facingMode: 'environment' },
        { fps: 8, qrbox: { width: 220, height: 120 } },
        function (decodedText) {
          byId('barcode').value = decodedText;
          stopScanner();
          setStatus('Codice letto: ' + decodedText + '. Inseriscilo nel prodotto.');
        },
        function () {}
      ).catch(function () {
        setStatus('Impossibile avviare la fotocamera. Controlla i permessi e usa HTTPS.');
      });
    } catch (e) {
      setStatus('Scanner non disponibile su questo browser.');
    }
  }

  function exportData() {
    var blob = new Blob([JSON.stringify(products, null, 2)], {
      type: 'application/json'
    });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'la-mia-dispensa.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1000);
  }

  function importData(file) {
    var reader = new FileReader();

    reader.onload = function () {
      try {
        var imported = JSON.parse(reader.result);

        if (!Array.isArray(imported)) {
          throw new Error('Formato non valido');
        }

        if (!window.confirm('Importare i dati? I prodotti attuali verranno sostituiti.')) {
          return;
        }

        products = imported;
        save();
        renderProducts();
        setStatus('Dati importati.');
      } catch (e) {
        window.alert('File non valido. Seleziona un file JSON esportato da La Mia Dispensa.');
      }

      byId('import-file').value = '';
    };

    reader.readAsText(file);
  }

  /*
   * Gestione centralizzata dei clic:
   * funziona anche con Safari meno recente e con i pulsanti
   * che vengono creati dinamicamente nella lista prodotti.
   */
  document.addEventListener('click', function (event) {
    var el = event.target;

    while (el && el !== document &&
           !(el.getAttribute && el.getAttribute('data-action'))) {
      el = el.parentNode;
    }

    if (!el || el === document) {
      return;
    }

    var action = el.getAttribute('data-action');
    var id = el.getAttribute('data-id');
    var p;

    if (action === 'category') {
      showCategory(el.getAttribute('data-category'));
    } else if (action === 'home') {
      showHome();
    } else if (action === 'add') {
      openModal(null);
    } else if (action === 'close-modal') {
      closeModal();
    } else if (action === 'edit') {
      p = findProduct(id);
      if (p) { openModal(p); }
    } else if (action === 'delete') {
      deleteProduct(id);
    } else if (action === 'plus' || action === 'minus') {
      p = findProduct(id);
      if (p) {
        p.quantity = Math.max(
          0,
          (Number(p.quantity) || 0) + (action === 'plus' ? 1 : -1)
        );
        save();
        renderProducts();
      }
    } else if (action === 'clear-search') {
      byId('search-input').value = '';
      renderProducts();
    } else if (action === 'scan') {
      startScanner();
    } else if (action === 'export') {
      exportData();
    } else if (action === 'import') {
      byId('import-file').click();
    }
  }, false);

  byId('product-form').addEventListener('submit', function (event) {
    event.preventDefault();

    var name = byId('name').value.replace(/^\s+|\s+$/g, '');
    var quantity = parseInt(byId('quantity').value, 10);
    var minimum = parseInt(byId('minimum').value, 10);

    if (!name) {
      window.alert('Inserisci il nome del prodotto.');
      return;
    }

    if (isNaN(quantity) || quantity < 0) { quantity = 0; }
    if (isNaN(minimum) || minimum < 0) { minimum = 0; }

    var product = {
      id: editingId || makeId(),
      category: currentCategory,
      name: name,
      quantity: quantity,
      unit: byId('unit').value,
      minimum: minimum,
      barcode: byId('barcode').value.replace(/^\s+|\s+$/g, '')
    };

    var i;
    var replaced = false;

    for (i = 0; i < products.length; i++) {
      if (String(products[i].id) === String(product.id)) {
        products[i] = product;
        replaced = true;
        break;
      }
    }

    if (!replaced) {
      products.push(product);
    }

    save();
    closeModal();
    renderProducts();
  }, false);

  byId('search-input').addEventListener('input', renderProducts, false);
  byId('low-filter').addEventListener('change', renderProducts, false);

  byId('import-file').addEventListener('change', function () {
    if (this.files && this.files[0]) {
      importData(this.files[0]);
    }
  }, false);

  byId('modal-backdrop').addEventListener('click', function (event) {
    if (event.target === byId('modal-backdrop')) {
      closeModal();
    }
  }, false);

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') {
      closeModal();
      stopScanner();
    }
  }, false);

  load();
  showHome();
}());
</script>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</body>
</html>
