<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f7d4a">

<title>La Mia Dispensa</title>

<style>
/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    min-height: 100dvh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background: #f3f6f4;
    color: #17231c;
}

button,
input,
select {
    font: inherit;
}

button {
    border: 0;
    cursor: pointer;

    /*
       Importante per touch:
       evita ritardi e migliora la gestione
       dei tocchi su dispositivi mobili.
    */
    touch-action: manipulation;
}

button:focus-visible,
input:focus-visible,
select:focus-visible {
    outline: 3px solid rgba(47, 125, 74, .28);
    outline-offset: 2px;
}

.app {
    min-height: 100vh;
}

.topbar {
    height: 7px;
    background: #2f7d4a;
}


/* =========================================================
   SCHERMATE
========================================================= */

.screen {
    display: none;
}

.screen.active {
    display: block;
}


/* =========================================================
   HOME
========================================================= */

.home {
    width: 100%;
    max-width: 1120px;

    margin: 0 auto;

    padding:
        34px
        32px
        48px;
}

.home-header {
    display: flex;
    align-items: center;

    gap: 20px;

    margin-bottom: 28px;
}

.logo {
    width: 92px;
    height: 92px;

    min-width: 92px;

    border-radius: 26px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #e5eee8
        );

    box-shadow:
        0 10px 28px rgba(22, 48, 32, .12);

    display: grid;
    place-items: center;

    font-size: 54px;
}

.home-header h1 {
    margin: 0 0 5px;

    font-size: clamp(28px, 3vw, 38px);

    line-height: 1.05;
}

.home-header p {
    margin: 0;

    color: #6c786f;

    font-size: 18px;
}

.categories {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 22px;
}

.category-card {
    min-height: 285px;

    padding: 28px 20px;

    border-radius: 28px;

    background: #ffffff;

    box-shadow:
        0 8px 25px rgba(24, 48, 33, .09);

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 18px;

    color: #17231c;

    transition:
        transform .12s ease,
        box-shadow .12s ease;
}

.category-card:active {
    transform: scale(.985);
}

.category-icon {
    width: 145px;
    height: 145px;

    border-radius: 38px;

    background: #edf4ef;

    display: grid;
    place-items: center;

    font-size: 78px;
}

.category-name {
    font-size: 25px;

    font-weight: 800;
}


/* =========================================================
   PAGINA CATEGORIA
========================================================= */

.category {
    width: 100%;
    max-width: 1120px;

    margin: 0 auto;

    padding:
        20px
        28px
        45px;
}

.category-head {
    display: flex;

    align-items: center;

    gap: 15px;

    margin-bottom: 18px;
}

.back {
    width: 58px;
    height: 58px;

    min-width: 58px;

    border-radius: 17px;

    background: #ffffff;

    box-shadow:
        0 5px 18px rgba(24, 48, 33, .10);

    font-size: 32px;
}

.title-wrap h2 {
    margin: 0;

    font-size: 30px;

    line-height: 1.1;
}

.title-wrap p {
    margin: 4px 0 0;

    color: #738077;

    font-size: 15px;
}


/* =========================================================
   RICERCA
========================================================= */

.tools {
    display: flex;

    gap: 11px;

    margin-bottom: 11px;
}

.search {
    height: 58px;

    flex: 1;

    min-width: 0;

    display: flex;

    align-items: center;

    gap: 9px;

    padding: 0 16px;

    border:
        2px solid #d9e2dc;

    border-radius: 17px;

    background: #ffffff;
}

.search span {
    font-size: 20px;
}

.search input {
    width: 100%;
    height: 100%;

    min-width: 0;

    border: 0;
    outline: 0;

    background: transparent;

    font-size: 18px;
}

.scan {
    width: 62px;
    height: 58px;

    min-width: 62px;

    border-radius: 17px;

    background: #20332a;

    color: #ffffff;

    display: grid;

    place-items: center;
}

.camera {
    width: 31px;
    height: 23px;

    border:
        3px solid #ffffff;

    border-radius: 6px;

    position: relative;
}

.camera::before {
    content: "";

    position: absolute;

    width: 13px;
    height: 5px;

    left: 6px;
    top: -8px;

    background: #ffffff;

    border-radius:
        3px 3px 0 0;
}

.lens {
    position: absolute;

    width: 11px;
    height: 11px;

    border:
        2px solid #ffffff;

    border-radius: 50%;

    left: 7px;
    top: 3px;
}


/* =========================================================
   FILTRI
========================================================= */

.filters {
    display: flex;

    gap: 9px;

    overflow-x: auto;

    padding:
        2px
        1px
        12px;

    scrollbar-width: none;
}

.filters::-webkit-scrollbar {
    display: none;
}

.filter {
    min-height: 46px;

    padding:
        0
        17px;

    border-radius: 15px;

    background: #e5ebe7;

    color: #3d4b43;

    font-weight: 750;

    white-space: nowrap;
}

.filter.active {
    background: #20332a;

    color: #ffffff;
}


/* =========================================================
   AGGIUNGI
========================================================= */

.add {
    width: 100%;

    min-height: 60px;

    border-radius: 18px;

    background: #2f7d4a;

    color: #ffffff;

    font-size: 19px;

    font-weight: 800;

    box-shadow:
        0 7px 18px rgba(47, 125, 74, .20);

    margin:
        2px
        0
        18px;
}


/* =========================================================
   PRODOTTI
========================================================= */

.products {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 13px;
}

.product {
    min-width: 0;

    background: #ffffff;

    border-radius: 21px;

    padding: 15px;

    box-shadow:
        0 5px 18px rgba(24, 48, 33, .07);

    display: grid;

    grid-template-columns:
        82px
        minmax(0, 1fr);

    gap: 13px;

    border:
        2px solid transparent;
}

.product.low {
    border-color: #e45c5c;
}

.product-img {
    width: 82px;
    height: 82px;

    border-radius: 17px;

    background: #edf2ee;

    display: grid;

    place-items: center;

    overflow: hidden;

    font-size: 38px;
}

.product-img img {
    width: 100%;
    height: 100%;

    object-fit: contain;
}

.product-main {
    min-width: 0;
}

.brand {
    font-size: 13px;

    color: #77837b;

    font-weight: 650;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.name {
    font-size: 18px;

    line-height: 1.15;

    font-weight: 800;

    margin:
        2px
        0
        4px;

    word-break: break-word;
}

.format {
    font-size: 14px;

    color: #68756d;
}

.low-label {
    display: inline-block;

    margin-top: 6px;

    padding:
        3px
        8px;

    border-radius: 8px;

    background: #fff0d8;

    color: #9a5a00;

    font-size: 12px;

    font-weight: 800;
}

.product-bottom {
    grid-column: 1 / -1;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;
}

.qty {
    display: flex;

    align-items: center;

    gap: 7px;
}

.qty button,
.edit {
    width: 48px;
    height: 48px;

    min-width: 48px;

    border-radius: 13px;

    background: #e9efeb;

    color: #20332a;

    font-size: 27px;

    font-weight: 750;
}

.qty-value {
    min-width: 38px;

    text-align: center;

    font-size: 21px;

    font-weight: 850;
}

.edit {
    font-size: 20px;

    margin-left: auto;
}

.empty {
    grid-column: 1 / -1;

    text-align: center;

    padding: 55px 20px;

    color: #7a867e;

    background: #ffffff;

    border-radius: 20px;
}

.empty .icon {
    font-size: 55px;

    margin-bottom: 10px;
}


/* =========================================================
   MODALI
========================================================= */

.modal {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 50;

    background:
        rgba(15, 25, 20, .58);

    padding: 14px;

    align-items: center;
    justify-content: center;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;

    max-width: 570px;

    max-height: 94vh;

    overflow-y: auto;

    background: #ffffff;

    border-radius: 24px;

    padding: 22px;

    box-shadow:
        0 20px 55px rgba(0,0,0,.25);
}

.modal-head {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    margin-bottom: 18px;
}

.modal-head h3 {
    margin: 0;

    font-size: 25px;
}

.close {
    width: 46px;
    height: 46px;

    border-radius: 13px;

    background: #edf1ee;

    font-size: 27px;
}

.group {
    margin-bottom: 14px;
}

.group label {
    display: block;

    margin-bottom: 6px;

    font-size: 14px;

    font-weight: 800;
}

.group input,
.group select {
    width: 100%;

    height: 50px;

    padding:
        0
        13px;

    border:
        2px solid #dce4df;

    border-radius: 13px;

    background: #ffffff;

    font-size: 16px;

    outline: 0;
}

.row {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 11px;
}

.actions {
    display: grid;

    grid-template-columns:
        auto 1fr 1fr;

    gap: 9px;

    margin-top: 19px;
}

.action {
    min-height: 52px;

    border-radius: 14px;

    font-weight: 800;

    padding:
        0
        17px;
}

.save {
    background: #2f7d4a;

    color: #ffffff;
}

.cancel {
    background: #e8eeea;

    color: #26352d;
}

.delete {
    background: #fbe3e3;

    color: #a62f2f;
}


/* =========================================================
   SCANNER
========================================================= */

.scanner-box {
    max-width: 620px;
}

#reader {
    width: 100%;

    min-height: 280px;

    background: #111111;

    border-radius: 16px;

    overflow: hidden;
}

.help {
    text-align: center;

    color: #68756d;

    font-size: 14px;

    line-height: 1.4;

    margin:
        13px
        0;
}


/* =========================================================
   IPAD MINI 2 — ORIZZONTALE
   1024 x 768 CSS PIXELS
========================================================= */

@media
only screen
and (min-width: 900px)
and (max-width: 1100px)
and (orientation: landscape) {

    .home {
        max-width: 960px;

        padding:
            27px
            30px
            38px;
    }

    .home-header {
        margin-bottom: 22px;
    }

    .logo {
        width: 82px;
        height: 82px;

        min-width: 82px;

        font-size: 48px;
    }

    .categories {
        gap: 18px;
    }

    .category-card {
        min-height: 240px;
    }

    .category-icon {
        width: 122px;
        height: 122px;

        font-size: 68px;
    }

    .category-name {
        font-size: 23px;
    }

    .category {
        max-width: 1020px;

        padding:
            18px
            26px
            36px;
    }

    /*
       Due colonne sfruttano meglio
       lo spazio disponibile dell'iPad.
    */

    .products {
        grid-template-columns:
            repeat(2, 1fr);

        gap: 12px;
    }

    .product {
        grid-template-columns:
            74px
            minmax(0, 1fr)
            auto;

        align-items: center;

        padding: 13px;
    }

    .product-img {
        width: 74px;
        height: 74px;
    }

    .product-bottom {
        grid-column: auto;
    }

    .qty button,
    .edit {
        width: 48px;
        height: 48px;

        min-width: 48px;
    }
}


/* =========================================================
   TABLET
========================================================= */

@media
only screen
and (min-width: 700px)
and (max-width: 899px) {

    .category-card {
        min-height: 245px;
    }

    .category-icon {
        width: 120px;
        height: 120px;

        font-size: 68px;
    }

    .products {
        grid-template-columns: 1fr;
    }
}


/* =========================================================
   SMARTPHONE
========================================================= */

@media
only screen
and (max-width: 699px) {

    .home {
        padding:
            23px
            16px
            34px;
    }

    .home-header {
        gap: 14px;

        margin-bottom: 22px;
    }

    .logo {
        width: 70px;
        height: 70px;

        min-width: 70px;

        border-radius: 20px;

        font-size: 42px;
    }

    .home-header h1 {
        font-size: 26px;
    }

    .home-header p {
        font-size: 15px;
    }

    .categories {
        grid-template-columns: 1fr;

        gap: 12px;
    }

    .category-card {
        min-height: 112px;

        flex-direction: row;

        justify-content: flex-start;

        text-align: left;

        padding:
            16px
            18px;

        gap: 16px;
    }

    .category-icon {
        width: 76px;
        height: 76px;

        min-width: 76px;

        border-radius: 21px;

        font-size: 43px;
    }

    .category-name {
        font-size: 20px;
    }

    .category {
        padding:
            15px
            14px
            30px;
    }

    .category-head {
        gap: 11px;
    }

    .back {
        width: 52px;
        height: 52px;

        min-width: 52px;
    }

    .title-wrap h2 {
        font-size: 25px;
    }

    .tools {
        gap: 8px;
    }

    .scan {
        width: 56px;
        min-width: 56px;

        height: 56px;
    }

    .search {
        height: 56px;
    }

    .products {
        grid-template-columns: 1fr;
    }

    .product {
        grid-template-columns:
            72px
            minmax(0, 1fr);
    }

    .product-img {
        width: 72px;
        height: 72px;
    }

    .product-bottom {
        grid-column: 1 / -1;
    }
}


/* =========================================================
   TELEFONI PICCOLI
========================================================= */

@media
only screen
and (max-width: 430px) {

    .home-header h1 {
        font-size: 23px;
    }

    .category-card {
        min-height: 96px;
    }

    .category-icon {
        width: 66px;
        height: 66px;

        min-width: 66px;

        font-size: 38px;
    }

    .category-name {
        font-size: 18px;
    }

    .row {
        grid-template-columns: 1fr;
    }

    .actions {
        grid-template-columns:
            1fr 1fr;
    }

    .delete {
        grid-column: 1 / -1;
    }
}
</style>
</head>


<body>

<div class="topbar"></div>

<div class="app">


<!-- =====================================================
     HOME
===================================================== -->

<section
    id="home"
    class="screen active"
>

    <div class="home">

        <header class="home-header">

            <div class="logo">
                🛒
            </div>

            <div>

                <h1>
                    La Mia Dispensa
                </h1>

                <p>
                    Scegli una categoria
                </p>

            </div>

        </header>


        <div class="categories">

            <button
                class="category-card"
                data-category="cibo"
            >

                <div class="category-icon">
                    🍎
                </div>

                <div class="category-name">
                    Cibo
                </div>

            </button>


            <button
                class="category-card"
                data-category="bagno"
            >

                <div class="category-icon">
                    🧴
                </div>

                <div class="category-name">
                    Prodotti bagno
                </div>

            </button>


            <button
                class="category-card"
                data-category="pulizia"
            >

                <div class="category-icon">
                    🧹
                </div>

                <div class="category-name">
                    Prodotti pulizia
                </div>

            </button>

        </div>

    </div>

</section>



<!-- =====================================================
     CATEGORIA
===================================================== -->

<section
    id="category"
    class="screen"
>

    <div class="category">


        <header class="category-head">

            <button
                class="back"
                id="backBtn"
                aria-label="Torna alla home"
            >
                ←
            </button>


            <div class="title-wrap">

                <h2 id="categoryTitle">
                    Cibo
                </h2>

                <p>
                    Gestisci i prodotti della categoria
                </p>

            </div>

        </header>



        <div class="tools">


            <label class="search">

                <span>
                    🔎
                </span>

                <input
                    id="searchInput"
                    type="search"
                    placeholder="Cerca prodotto..."
                    autocomplete="off"
                >

            </label>


            <button
                class="scan"
                id="scanBtn"
                aria-label="Scansiona barcode"
            >

                <span class="camera">

                    <span class="lens"></span>

                </span>

            </button>

        </div>



        <div class="filters">

            <button
                class="filter active"
                id="allFilter"
            >
                Tutti
            </button>


            <button
                class="filter"
                id="lowFilter"
            >
                🔴 Scorte basse
            </button>

        </div>



        <button
            class="add"
            id="addBtn"
        >
            ＋ Aggiungi prodotto
        </button>


        <div
            id="products"
            class="products"
        ></div>


    </div>

</section>

</div>



<!-- =====================================================
     MODALE PRODOTTO
===================================================== -->

<div
    id="productModal"
    class="modal"
    aria-hidden="true"
>

    <div class="modal-box">


        <div class="modal-head">

            <h3 id="modalTitle">
                Aggiungi prodotto
            </h3>


            <button
                class="close"
                data-close="productModal"
                aria-label="Chiudi"
            >
                ×
            </button>

        </div>



        <div class="group">

            <label for="name">
                Nome prodotto
            </label>

            <input
                id="name"
                type="text"
                placeholder="Es. Piselli"
            >

        </div>
