         Versione fissata per maggiore stabilità
         ========================================================= -->

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


    <script>
        /* =========================================================
           LA MIA DISPENSA
           JAVASCRIPT COMPATIBILE CON IOS 12.5.8
           ========================================================= */

        (function () {

            "use strict";


            /* =====================================================
               CONFIGURAZIONE
               ===================================================== */

            var STORAGE_KEY = "laMiaDispensaProdotti";

            var products = [];

            var currentCategory = "cibo";

            var currentFilter = "all";

            var editingProductId = null;

            var html5QrCode = null;

            var scannerStarting = false;

            var scannerRunning = false;

            var scannerLocked = false;

            var toastTimer = null;


            var categoryData = {

                cibo: {
                    title: "Cibo",
                    subtitle: "Alimenti e bevande",
                    icon: "🍎"
                },

                bagno: {
                    title: "Prodotti bagno",
                    subtitle: "Igiene e cura personale",
                    icon: "🧴"
                },

                pulizia: {
                    title: "Prodotti pulizia",
                    subtitle: "Casa e pulizie",
                    icon: "🧹"
                }

            };


            /* =====================================================
               ELEMENTI DOM
               ===================================================== */

            var homeScreen =
                document.getElementById("homeScreen");

            var categoryScreen =
                document.getElementById("categoryScreen");

            var categoryTitle =
                document.getElementById("categoryTitle");

            var categorySubtitle =
                document.getElementById("categorySubtitle");

            var searchInput =
                document.getElementById("searchInput");

            var productsContainer =
                document.getElementById("products");

            var productModal =
                document.getElementById("productModal");

            var scannerModal =
                document.getElementById("scannerModal");

            var productForm =
                document.getElementById("productForm");

            var productModalTitle =
                document.getElementById("productModalTitle");

            var deleteProductButton =
                document.getElementById("deleteProductButton");

            var productName =
                document.getElementById("productName");

            var productBrand =
                document.getElementById("productBrand");

            var productFormat =
                document.getElementById("productFormat");

            var productQuantity =
                document.getElementById("productQuantity");

            var productMinStock =
                document.getElementById("productMinStock");

            var productCategory =
                document.getElementById("productCategory");

            var productBarcode =
                document.getElementById("productBarcode");

            var productImage =
                document.getElementById("productImage");


            /* =====================================================
               ID
               ===================================================== */

            function generateId() {

                return (
                    "p_" +
                    new Date().getTime() +
                    "_" +
                    Math.floor(Math.random() * 1000000)
                );
            }


            /* =====================================================
               ESCAPE HTML
               ===================================================== */

            function escapeHtml(value) {

                if (value === null || value === undefined) {
                    return "";
                }

                return String(value)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }


            /* =====================================================
               STORAGE
               ===================================================== */

            function saveProducts() {

                try {

                    localStorage.setItem(
                        STORAGE_KEY,
                        JSON.stringify(products)
                    );

                } catch (error) {

                    console.log(
                        "Errore salvataggio:",
                        error
                    );
                }
            }


            function loadProducts() {

                var saved;

                try {

                    saved =
                        localStorage.getItem(
                            STORAGE_KEY
                        );

                } catch (error) {

                    saved = null;
                }


                if (saved) {

                    try {

                        var parsed =
                            JSON.parse(saved);

                        if (
                            parsed &&
                            Object.prototype.toString.call(parsed) === "[object Array]"
                        ) {

                            products = parsed;

                            return;
                        }

                    } catch (error2) {

                        console.log(
                            "Dati locali non validi:",
                            error2
                        );
                    }
                }


                /*
                 * Prodotti iniziali di esempio.
                 * Vengono creati solo al primo avvio.
                 */

                products = [

                    {
                        id: generateId(),
                        name: "Pasta",
                        brand: "Barilla",
                        format: "500 g",
                        quantity: 3,
                        minStock: 2,
                        category: "cibo",
                        barcode: "",
                        image: ""
                    },

                    {
                        id: generateId(),
                        name: "Latte",
                        brand: "Parmalat",
                        format: "1 L",
                        quantity: 1,
                        minStock: 2,
                        category: "cibo",
                        barcode: "",
                        image: ""
                    },

                    {
                        id: generateId(),
                        name: "Shampoo",
                        brand: "Pantene",
                        format: "250 ml",
                        quantity: 2,
                        minStock: 1,
                        category: "bagno",
                        barcode: "",
                        image: ""
                    },

                    {
                        id: generateId(),
                        name: "Detersivo piatti",
                        brand: "Nelsen",
                        format: "900 ml",
                        quantity: 1,
                        minStock: 1,
                        category: "pulizia",
                        barcode: "",
                        image: ""
                    }

                ];

                saveProducts();
            }


            /* =====================================================
               LOW STOCK
               ===================================================== */

            function isLowStock(product) {

                var quantity =
                    Number(product.quantity);

                var minStock =
                    Number(product.minStock);

                if (isNaN(quantity)) {
                    quantity = 0;
                }

                if (isNaN(minStock)) {
                    minStock = 0;
                }

                /*
                 * IMPORTANTE:
                 * la scorta bassa dipende SOLO
                 * dalla scorta minima impostata.
                 */

                return quantity < minStock;
            }


            /* =====================================================
               NAVIGAZIONE
               ===================================================== */

            function openCategory(category) {

                if (!categoryData[category]) {
                    return;
                }

                stopScanner();

                currentCategory = category;

                currentFilter = "all";

                searchInput.value = "";

                categoryTitle.innerHTML =
                    categoryData[category].icon +
                    " " +
                    categoryData[category].title;

                categorySubtitle.innerHTML =
                    categoryData[category].subtitle;


                var filterButtons =
                    document.getElementsByClassName(
                        "filter-button"
                    );

                var i;

                for (i = 0; i < filterButtons.length; i++) {

                    filterButtons[i].className =
                        "filter-button";

                    if (
                        filterButtons[i].getAttribute(
                            "data-filter"
                        ) === "all"
                    ) {

                        filterButtons[i].className +=
                            " active";
                    }
                }


                homeScreen.className =
                    "screen";

                categoryScreen.className =
                    "screen active";


                renderProducts();


                try {
                    window.scrollTo(0, 0);
                } catch (e) {
                }
            }


            function goHome() {

                stopScanner();

                closeProductModal();

                closeScanner();

                categoryScreen.className =
                    "screen";

                homeScreen.className =
                    "screen active";


                try {
                    window.scrollTo(0, 0);
                } catch (e) {
                }
            }


            /* =====================================================
               FILTRI
               ===================================================== */

            function setFilter(filter) {

                currentFilter = filter;

                var buttons =
                    document.getElementsByClassName(
                        "filter-button"
                    );

                var i;

                for (i = 0; i < buttons.length; i++) {

                    buttons[i].className =
                        "filter-button";

                    if (
                        buttons[i].getAttribute(
                            "data-filter"
                        ) === filter
                    ) {

                        buttons[i].className +=
                            " active";
                    }
                }

                renderProducts();
            }


            /* =====================================================
               RENDER PRODOTTI
               ===================================================== */

            function renderProducts() {

                var search =
                    String(searchInput.value || "")
                        .toLowerCase()
                        .replace(/^\s+|\s+$/g, "");


                var filtered = [];

                var i;

                for (i = 0; i < products.length; i++) {

                    var product =
                        products[i];


                    if (
                        product.category !==
                        currentCategory
                    ) {
                        continue;
                    }


                    if (
                        currentFilter === "low" &&
                        !isLowStock(product)
                    ) {
                        continue;
                    }


                    var text =
                        (
                            String(product.name || "") +
                            " " +
                            String(product.brand || "") +
                            " " +
                            String(product.barcode || "")
                        ).toLowerCase();


                    if (
                        search &&
                        text.indexOf(search) === -1
                    ) {
                        continue;
                    }


                    filtered.push(product);
                }


                filtered.sort(function (a, b) {

                    return String(a.name || "")
                        .localeCompare(
                            String(b.name || ""),
                            "it"
                        );
                });


                if (filtered.length === 0) {

                    productsContainer.innerHTML =
                        '<div class="empty-products">' +
                            '<div class="empty-icon">📦</div>' +
                            '<h3>Nessun prodotto</h3>' +
                            '<p>' +
                                (
                                    currentFilter === "low"
                                    ? "Non ci sono prodotti con scorte basse."
                                    : "Non ci sono prodotti da mostrare."
                                ) +
                            '</p>' +
                        '</div>';

                    return;
                }


                var html = "";

                for (i = 0; i < filtered.length; i++) {

                    html += createProductCard(
                        filtered[i]
                    );
                }


                productsContainer.innerHTML = html;
            }


            /* =====================================================
               CARD
               ===================================================== */

            function createProductCard(product) {

                var lowStock =
                    isLowStock(product);


                var imageHtml;

                if (product.image) {

                    imageHtml =
                        '<img src="' +
                        escapeHtml(product.image) +
                        '" alt="">';

                } else {

                    imageHtml =
                        '<span>' +
                        categoryData[
                            product.category
                        ].icon +
                        '</span>';
                }


                var brand =
                    product.brand
                    ? escapeHtml(product.brand)
                    : "Marca non specificata";


                var format =
                    product.format
                    ? escapeHtml(product.format)
                    : "";


                var barcode =
                    product.barcode
                    ? escapeHtml(product.barcode)
                    : "";


                var meta = "";

                if (format) {
                    meta += format;
                }

                if (barcode) {

                    if (meta) {
                        meta += " · ";
                    }

                    meta +=
                        "EAN " +
                        barcode;
                }


                return (
                    '<article class="product-card' +
                    (lowStock ? ' low-stock' : '') +
                    '" data-product-id="' +
                    escapeHtml(product.id) +
                    '">' +

                        '<div class="product-image">' +
                            imageHtml +
                        '</div>' +

                        '<div class="product-info">' +

                            '<h3 class="product-name">' +
                                escapeHtml(product.name) +
                            '</h3>' +

                            '<p class="product-brand">' +
                                brand +
                            '</p>' +

                            '<p class="product-meta">' +
                                meta +
                            '</p>' +

                            (
                                lowStock
                                ?
                                '<span class="low-stock-label">' +
                                    'Scorta bassa' +
                                '</span>'
                                :
                                ''
                            ) +

                        '</div>' +

                        '<div class="quantity-controls">' +

                            '<button ' +
                                'type="button" ' +
                                'class="quantity-button js-minus" ' +
                                'aria-label="Diminuisci quantità">' +
                                '−' +
                            '</button>' +

                            '<span class="quantity-value">' +
                                escapeHtml(product.quantity) +
                            '</span>' +

                            '<button ' +
                                'type="button" ' +
                                'class="quantity-button js-plus" ' +
                                'aria-label="Aumenta quantità">' +
                                '+' +
                            '</button>' +

                            '<button ' +
                                'type="button" ' +
                                'class="edit-button js-edit" ' +
                                'aria-label="Modifica prodotto">' +
                                '✎' +
                            '</button>' +

                        '</div>' +

                    '</article>'
                );
            }


            /* =====================================================
               QUANTITÀ
               ===================================================== */

            function changeQuantity(id, amount) {

                var i;

                for (i = 0; i < products.length; i++) {

                    if (
                        String(products[i].id) ===
                        String(id)
                    ) {

                        var current =
                            Number(products[i].quantity);

                        if (isNaN(current)) {
                            current = 0;
                        }

                        current += amount;

                        if (current < 0) {
                            current = 0;
                        }

                        products[i].quantity =
                            current;

                        saveProducts();

                        renderProducts();

                        return;
                    }
                }
            }


            /* =====================================================
               MODALE PRODOTTO
               ===================================================== */

            function openProductModal(product) {

                if (product) {

                    editingProductId =
                        product.id;

                    productModalTitle.innerHTML =
                        "Modifica prodotto";

                    productName.value =
                        product.name || "";

                    productBrand.value =
                        product.brand || "";

                    productFormat.value =
                        product.format || "";

                    productQuantity.value =
                        product.quantity || 0;

                    productMinStock.value =
                        product.minStock || 0;

                    productCategory.value =
                        product.category || currentCategory;

                    productBarcode.value =
                        product.barcode || "";

                    productImage.value =
                        product.image || "";

                    deleteProductButton.style.display =
                        "block";

                } else {

                    editingProductId = null;

                    productModalTitle.innerHTML =
                        "Nuovo prodotto";

                    productName.value = "";

                    productBrand.value = "";

                    productFormat.value = "";

                    productQuantity.value = 1;

                    productMinStock.value = 1;

                    productCategory.value =
                        currentCategory;

                    productBarcode.value = "";

                    productImage.value = "";

                    deleteProductButton.style.display =
                        "none";
                }


                productModal.className =
                    "modal active";

                productModal.setAttribute(
                    "aria-hidden",
                    "false"
                );


                window.setTimeout(function () {

                    try {
                        productName.focus();
                    } catch (e) {
                    }

                }, 100);
            }


            function closeProductModal() {

                productModal.className =
                    "modal";

                productModal.setAttribute(
                    "aria-hidden",
                    "true"
                );

                editingProductId = null;
            }


            /* =====================================================
               SALVATAGGIO
               ===================================================== */

            function saveProductFromForm(event) {

                event.preventDefault();

                var name =
                    String(productName.value || "")
                        .replace(/^\s+|\s+$/g, "");


                if (!name) {

                    showToast(
                        "Inserisci il nome del prodotto.",
                        "error"
                    );

                    try {
                        productName.focus();
                    } catch (e) {
                    }

                    return;
                }


                var quantity =
                    parseInt(
                        productQuantity.value,
                        10
                    );

                var minStock =
                    parseInt(
                        productMinStock.value,
                        10
                    );


                if (isNaN(quantity) || quantity < 0) {
                    quantity = 0;
                }

                if (isNaN(minStock) || minStock < 0) {
                    minStock = 0;
                }


                if (editingProductId) {

                    var i;

                    for (i = 0; i < products.length; i++) {

                        if (
                            String(products[i].id) ===
                            String(editingProductId)
                        ) {

                            products[i].name =
                                name;

                            products[i].brand =
                                String(
                                    productBrand.value || ""
                                ).replace(
                                    /^\s+|\s+$/g,
                                    ""
                                );

                            products[i].format =
                                String(
                                    productFormat.value || ""
                                ).replace(
                                    /^\s+|\s+$/g,
                                    ""
                                );

                            products[i].quantity =
                                quantity;

                            products[i].minStock =
                                minStock;

                            products[i].category =
                                productCategory.value;

                            products[i].barcode =
                                String(
                                    productBarcode.value || ""
                                ).replace(
                                    /^\s+|\s+$/g,
                                    ""
                                );

                            products[i].image =
                                String(
                                    productImage.value || ""
                                ).replace(
                                    /^\s+|\s+$/g,
                                    ""
                                );

                            break;
                        }
                    }

                    showToast(
                        "Prodotto aggiornato.",
                        "success"
                    );

                } else {

                    products.push({

                        id: generateId(),

                        name: name,

                        brand:
                            String(
                                productBrand.value || ""
                            ).replace(
                                /^\s+|\s+$/g,
                                ""
                            ),

                        format:
                            String(
                                productFormat.value || ""
                            ).replace(
                                /^\s+|\s+$/g,
                                ""
                            ),

                        quantity: quantity,

                        minStock: minStock,

                        category:
                            productCategory.value,

                        barcode:
                            String(
                                productBarcode.value || ""
                            ).replace(
                                /^\s+|\s+$/g,
                                ""
                            ),

                        image:
                            String(
                                productImage.value || ""
                            ).replace(
                                /^\s+|\s+$/g,
                                ""
                            )
                    });


                    showToast(
                        "Prodotto aggiunto.",
                        "success"
                    );
                }


                saveProducts();

                closeProductModal();

                renderProducts();
            }


            /* =====================================================
               ELIMINA
               ===================================================== */

            function deleteCurrentProduct() {

                if (!editingProductId) {
                    return;
                }


                var confirmed =
                    window.confirm(
                        "Vuoi eliminare questo prodotto?"
                    );


                if (!confirmed) {
                    return;
                }


                var newProducts = [];

                var i;

                for (i = 0; i < products.length; i++) {

                    if (
                        String(products[i].id) !==
                        String(editingProductId)
                    ) {

                        newProducts.push(
                            products[i]
                        );
                    }
                }


                products = newProducts;

                saveProducts();

                closeProductModal();

                renderProducts();

                showToast(
                    "Prodotto eliminato.",
                    "success"
                );
            }


            /* =====================================================
               SCANNER
               ===================================================== */

            function openScanner() {

                if (
                    scannerStarting ||
                    scannerRunning
                ) {
                    return;
                }


                scannerLocked = false;

                scannerModal.className =
                    "modal active";

                scannerModal.setAttribute(
                    "aria-hidden",
                    "false"
                );


                window.setTimeout(function () {

                    startScanner();

                }, 300);
            }


            function startScanner() {

                if (
                    scannerStarting ||
                    scannerRunning
                ) {
                    return;
                }


                if (
                    typeof Html5Qrcode ===
                    "undefined"
                ) {

                    showToast(
                        "Scanner non disponibile.",
                        "error"
                    );

                    return;
                }


                scannerStarting = true;

                scannerLocked = false;


                try {

                    html5QrCode =
                        new Html5Qrcode(
                            "reader"
                        );


                    var config = {

                        fps: 8,

                        qrbox: {
                            width: 280,
                            height: 160
                        }

                    };


                    /*
                     * CAMERA ANTERIORE
                     *
                     * user = front camera
                     */

                    html5QrCode.start(

                        {
                            facingMode: "user"
                        },

                        config,

                        function (decodedText) {

                            if (
                                scannerLocked
                            ) {
                                return;
                            }

                            scannerLocked =
                                true;

                            handleBarcode(
                                decodedText
                            );
                        },

                        function () {
                            /*
                             * Nessun messaggio:
                             * gli errori durante la ricerca
                             * del codice sono normali.
                             */
                        }

                    ).then(function () {

                        scannerRunning =
                            true;

                        scannerStarting =
                            false;

                    }).catch(function (error) {

                        console.log(
                            "Errore camera:",
                            error
                        );

                        scannerStarting =
                            false;

                        scannerRunning =
                            false;

                        startScannerFallback();
                    });


                } catch (error2) {

                    console.log(
                        "Errore scanner:",
                        error2
                    );

                    scannerStarting =
                        false;

                    scannerRunning =
                        false;

                    showCameraError();
                }
            }


            /*
             * FALLBACK PER SAFARI IOS 12
             */

            function startScannerFallback() {

                if (
                    typeof Html5Qrcode ===
                    "undefined"
                ) {

                    showCameraError();

                    return;
                }


                if (
                    typeof Html5Qrcode.getCameras !==
                    "function"
                ) {

                    showCameraError();

                    return;
                }


                Html5Qrcode.getCameras()

                    .then(function (devices) {

                        if (
                            !devices ||
                            devices.length === 0
                        ) {

                            showCameraError();

                            return;
                        }


                        var selected =
                            null;

                        var i;


                        /*
                         * Cerchiamo esplicitamente
                         * la camera frontale.
                         */

                        for (
                            i = 0;
                            i < devices.length;
                            i++
                        ) {

                            var label =
                                String(
                                    devices[i].label ||
                                    ""
                                ).toLowerCase();


                            if (
                                label.indexOf(
                                    "front"
                                ) !== -1 ||

                                label.indexOf(
                                    "facetime"
                                ) !== -1 ||

                                label.indexOf(
                                    "user"
                                ) !== -1
                            ) {

                                selected =
                                    devices[i];

                                break;
                            }
                        }


                        /*
                         * Se Safari non comunica il nome,
                         * utilizziamo la prima camera disponibile.
                         */

                        if (!selected) {
                            selected = devices[0];
                        }


                        try {

                            if (html5QrCode) {
                                html5QrCode.clear();
                            }

                        } catch (clearError) {
                        }


                        html5QrCode =
                            new Html5Qrcode(
                                "reader"
                            );


                        var config = {

                            fps: 8,

                            qrbox: {
                                width: 280,
                                height: 160
                            }

                        };


                        html5QrCode.start(

                            selected.id,

                            config,

                            function (decodedText) {

                                if (
                                    scannerLocked
                                ) {
                                    return;
                                }

                                scannerLocked =
                                    true;

                                handleBarcode(
                                    decodedText
                                );
                            },

                            function () {
                            }

                        ).then(function () {

                            scannerRunning =
                                true;

                            scannerStarting =
                                false;

                        }).catch(function (error) {

                            console.log(
                                "Errore fallback:",
                                error
                            );

                            scannerRunning =
                                false;

                            scannerStarting =
                                false;

                            showCameraError();
                        });

                    })

                    .catch(function (error) {

                        console.log(
                            "Errore camere:",
                            error
                        );

                        showCameraError();
                    });
            }


            function stopScanner() {

                scannerLocked = true;


                if (!html5QrCode) {

                    scannerRunning =
                        false;

                    scannerStarting =
                        false;

                    return;
                }


                try {

                    html5QrCode.stop()

                        .then(function () {

                            try {
                                html5QrCode.clear();
                            } catch (e) {
                            }

                            html5QrCode =
                                null;

                            scannerRunning =
                                false;

                            scannerStarting =
                                false;
                        })

                        .catch(function () {

                            try {
                                html5QrCode.clear();
                            } catch (e2) {
                            }

                            html5QrCode =
                                null;

                            scannerRunning =
                                false;

                            scannerStarting =
                                false;
                        });

                } catch (error) {

                    html5QrCode =
                        null;

                    scannerRunning =
                        false;

                    scannerStarting =
                        false;
                }
            }


            function closeScanner() {

                stopScanner();

                scannerModal.className =
                    "modal";

                scannerModal.setAttribute(
                    "aria-hidden",
                    "true"
                );
            }


            /* =====================================================
               BARCODE
               ===================================================== */

            function handleBarcode(barcode) {

                barcode =
                    String(barcode || "")
                        .replace(
                            /^\s+|\s+$/g,
                            ""
                        );


                if (!barcode) {

                    scannerLocked =
                        false;

                    return;
                }


                /*
                 * Fermiamo subito la fotocamera
                 * per evitare doppie scansioni.
                 */

                stopScanner();

                scannerModal.className =
                    "modal";

                scannerModal.setAttribute(
                    "aria-hidden",
                    "true"
                );


                /*
                 * Controlliamo se il prodotto esiste già.
                 */

                var i;

                for (i = 0; i < products.length; i++) {

                    if (
                        String(
                            products[i].barcode || ""
                        ) === barcode
                    ) {

                        var quantity =
                            Number(
                                products[i].quantity
                            );

                        if (isNaN(quantity)) {
                            quantity = 0;
                        }

                        products[i].quantity =
                            quantity + 1;

                        saveProducts();

                        /*
                         * Torniamo automaticamente
                         * alla categoria corretta.
                         */

                        currentCategory =
                            products[i].category;

                        categoryTitle.innerHTML =
                            categoryData[
                                currentCategory
                            ].icon +
                            " " +
                            categoryData[
                                currentCategory
                            ].title;

                        categorySubtitle.innerHTML =
                            categoryData[
                                currentCategory
                            ].subtitle;


                        homeScreen.className =
                            "screen";

                        categoryScreen.className =
                            "screen active";


                        renderProducts();


                        showToast(
                            "Prodotto trovato: quantità aumentata.",
                            "success"
                        );

                        return;
                    }
                }


                /*
                 * Non esiste:
                 * proviamo Open Food Facts.
                 */

                showToast(
                    "Ricerca del prodotto...",
                    "success"
                );


                lookupOpenFoodFacts(
                    barcode
                );
            }


            /* =====================================================
               OPEN FOOD FACTS
               ===================================================== */

            function lookupOpenFoodFacts(barcode) {

                var url =
                    "https://world.openfoodfacts.org/api/v0/product/" +
                    encodeURIComponent(barcode) +
                    ".json";


                /*
                 * fetch è supportato da Safari iOS 12.
                 */

                if (
                    typeof window.fetch !==
                    "function"
                ) {

                    openManualBarcodeProduct(
                        barcode
                    );

                    return;
                }


                fetch(url)

                    .then(function (response) {

                        if (!response.ok) {
                            throw new Error(
                                "HTTP " +
                                response.status
                            );
                        }

                        return response.json();
                    })

                    .then(function (data) {

                        if (
                            data &&
                            data.status === 1 &&
                            data.product
                        ) {

                            var p =
                                data.product;


                            var productNameFromApi =
                                p.product_name ||
                                p.product_name_it ||
                                "";


                            var brand =
                                p.brands ||
                                "";


                            var quantity =
                                p.quantity ||
                                "";


                            var image =
                                p.image_front_url ||
                                p.image_url ||
                                "";


                            openProductModal({

                                id: null,

                                name:
                                    productNameFromApi,

                                brand:
                                    brand,

                                format:
                                    quantity,

                                quantity: 1,

                                minStock: 1,

                                category:
                                    currentCategory,

                                barcode:
                                    barcode,

                                image:
                                    image

                            });


                            /*
                             * Il prodotto ricevuto è un nuovo
                             * prodotto, quindi l'ID deve restare
                             * nullo per far scattare l'inserimento.
                             */

                            editingProductId =
                                null;

                            deleteProductButton.style.display =
                                "none";


                        } else {

                            openManualBarcodeProduct(
                                barcode
                            );
                        }

                    })

                    .catch(function (error) {

                        console.log(
                            "Open Food Facts:",
                            error
                        );

                        openManualBarcodeProduct(
                            barcode
                        );
                    });
            }


            function openManualBarcodeProduct(
                barcode
            ) {

                openProductModal(null);

                productBarcode.value =
                    barcode;
            }


            /* =====================================================
               CAMERA ERROR
               ===================================================== */

            function showCameraError() {

                showToast(
                    "Impossibile accedere alla fotocamera. Controlla i permessi di Safari.",
                    "error"
                );
            }


            /* =====================================================
               TOAST
               ===================================================== */

            function showToast(
                message,
                type
            ) {

                var toast =
                    document.getElementById(
                        "toast"
                    );


                if (!toast) {
                    return;
                }


                if (toastTimer) {

                    window.clearTimeout(
                        toastTimer
                    );
                }


                toast.className =
                    "toast";


                if (type) {

                    toast.className +=
                        " " +
                        type;
                }


                toast.innerHTML =
                    escapeHtml(message);


                /*
                 * Piccolo timeout per permettere
                 * a Safari di applicare la classe.
                 */

                window.setTimeout(
                    function () {

                        toast.className +=
                            " show";

                    },
                    20
                );


                toastTimer =
                    window.setTimeout(
                        function () {

                            toast.className =
                                "toast";

                        },
                        3000
                    );
            }


            /* =====================================================
               EVENTI
               ===================================================== */

            function setupEvents() {

                /*
                 * CATEGORIE HOME
                 */

                var categoryButtons =
                    document.getElementsByClassName(
                        "category-card"
                    );


                var i;


                for (
                    i = 0;
                    i < categoryButtons.length;
                    i++
                ) {

                    categoryButtons[i]
                        .addEventListener(
                            "click",
                            function (event) {

                                event.preventDefault();

                                var category =
                                    this.getAttribute(
                                        "data-category"
                                    );

                                openCategory(
                                    category
                                );
                            },
                            false
                        );
                }


                /*
                 * INDIETRO
                 */

                document
                    .getElementById(
                        "backButton"
                    )
                    .addEventListener(
                        "click",
                        function (event) {

                            event.preventDefault();

                            goHome();
                        },
                        false
                    );


                /*
                 * AGGIUNGI
                 */

                document
                    .getElementById(
                        "addProductButton"
                    )
                    .addEventListener(
                        "click",
                        function (event) {

                            event.preventDefault();

                            openProductModal(
                                null
                            );
                        },
                        false
                    );


                /*
                 * SCANNER
                 */

                document
                    .getElementById(
                        "scannerButton"
                    )
                    .addEventListener(
                        "click",
                        function (event) {

                            event.preventDefault();

                            openScanner();
                        },
                        false
                    );


                /*
                 * CHIUDI MODALE PRODOTTO
                 */

                document
                    .getElementById(
                        "closeProductButton"
                    )
                    .addEventListener(
                        "click",
                        function (event) {

                            event.preventDefault();

                            closeProductModal();
                        },
                        false
                    );


                document
                    .getElementById(
                        "cancelProductButton"
                    )
                    .addEventListener(
                        "click",
                        function (event) {

                            event.preventDefault();

                            closeProductModal();
                        },
                        false
                    );


                /*
                 * ELIMINA
                 */

                deleteProductButton
                    .addEventListener(
                        "click",
                        function (event) {

                            event.preventDefault();

                            deleteCurrentProduct();
                        },
                        false
                    );


                /*
                 * FORM
                 */

                productForm
                    .addEventListener(
                        "submit",
                        saveProductFromForm,
                        false
                    );


                /*
                 * RICERCA
                 */

                searchInput
                    .addEventListener(
                        "input",
                        function () {

                            renderProducts();
                        },
                        false
                    );


                /*
                 * FILTRI
                 */

                var filterButtons =
                    document.getElementsByClassName(
                        "filter-button"
                    );


                for (
                    i = 0;
                    i < filterButtons.length;
                    i++
                ) {

                    filterButtons[i]
                        .addEventListener(
                            "click",
                            function (event) {

                                event.preventDefault();

                                setFilter(
                                    this.getAttribute(
                                        "data-filter"
                                    )
                                );
                            },
                            false
                        );
                }


                /*
                 * SCANNER CHIUSURA
                 */

                document
                    .getElementById(
                        "closeScannerButton"
                    )
                    .addEventListener(
                        "click",
                        function (event) {

                            event.preventDefault();

                            closeScanner();
                        },
                        false
                    );


                document
                    .getElementById(
                        "manualScannerClose"
                    )
                    .addEventListener(
                        "click",
                        function (event) {

                            event.preventDefault();

                            closeScanner();
                        },
                        false
                    );


                /*
                 * EVENT DELEGATION DEI PRODOTTI
                 *
                 * Questo è particolarmente utile su iOS:
                 * abbiamo un solo listener sul contenitore.
                 */

                productsContainer
                    .addEventListener(
                        "click",
                        function (event) {

                            var target =
                                event.target;

                            /*
                             * Risaliamo fino al pulsante.
                             */

                            while (
                                target &&
                                target !==
                                productsContainer &&
                                target.tagName !==
                                "BUTTON"
                            ) {

                                target =
                                    target.parentNode;
                            }


                            if (
                                !target ||
                                target ===
                                productsContainer
                            ) {
                                return;
                            }


                            var card =
                                target.parentNode;


                            while (
                                card &&
                                card !==
                                productsContainer &&
                                (
                                    !card.getAttribute ||
                                    !card.getAttribute(
                                        "data-product-id"
                                    )
                                )
                            ) {

                                card =
                                    card.parentNode;
                            }


                            if (
                                !card ||
                                card ===
                                productsContainer
                            ) {
                                return;
                            }


                            var id =
                                card.getAttribute(
                                    "data-product-id"
                                );


                            if (
                                target.className.indexOf(
                                    "js-minus"
                                ) !== -1
                            ) {

                                event.preventDefault();

                                changeQuantity(
                                    id,
                                    -1
                                );

                                return;
                            }


                            if (
                                target.className.indexOf(
                                    "js-plus"
                                ) !== -1
                            ) {

                                event.preventDefault();

                                changeQuantity(
                                    id,
                                    1
                                );

                                return;
                            }


                            if (
                                target.className.indexOf(
                                    "js-edit"
                                ) !== -1
                            ) {

                                event.preventDefault();

                                var product =
                                    findProductById(
                                        id
                                    );

                                if (product) {
                                    openProductModal(
                                        product
                                    );
                                }

                                return;
                            }

                        },
                        false
                    );


                /*
                 * CLICK SULLO SFONDO DEL MODALE
                 */

                productModal
                    .addEventListener(
                        "click",
                        function (event) {

                            if (
                                event.target ===
                                productModal
                            ) {

                                closeProductModal();
                            }
                        },
                        false
                    );


                scannerModal
                    .addEventListener(
                        "click",
                        function (event) {

                            if (
                                event.target ===
                                scannerModal
                            ) {

                                closeScanner();
                            }
                        },
                        false
                    );


                /*
                 * ESC DA TASTIERA
                 */

                document.addEventListener(
                    "keydown",
                    function (event) {

                        if (
                            event.keyCode === 27
                        ) {

                            closeProductModal();

                            closeScanner();
                        }
                    },
                    false
                );


                /*
                 * PAGE HIDE
                 *
                 * Utile quando Safari cambia scheda
                 * o mette la pagina in background.
                 */

                document.addEventListener(
                    "visibilitychange",
                    function () {

                        if (
                            document.hidden
                        ) {

                            stopScanner();
                        }
                    },
                    false
                );


                /*
                 * Quando Safari cambia pagina.
                 */

                window.addEventListener(
                    "pagehide",
                    function () {

                        stopScanner();
                    },
                    false
                );
            }


            /* =====================================================
               TROVA PRODOTTO
               ===================================================== */

            function findProductById(id) {

                var i;

                for (
                    i = 0;
                    i < products.length;
                    i++
                ) {

                    if (
                        String(products[i].id) ===
                        String(id)
                    ) {

                        return products[i];
                    }
                }

                return null;
            }


            /* =====================================================
               AVVIO
               ===================================================== */

            loadProducts();

            setupEvents();

            renderProducts();


        })();
    </script>

</body>
</html>
