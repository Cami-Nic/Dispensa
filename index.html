
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D4E8DC">
<title>La Mia Dispensa</title>

<style>
:root {
  --bg:#f5f7f4; --text:#29372d; --muted:#78857d;
  --green:#7bbf6a; --pale:#edf2eb; --white:#fff;
}
*{box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;font-size:1rem;line-height:1.45}
button,input,select{font:inherit;max-width:100%}
button{cursor:pointer;border:0;border-radius:15px;padding:13px 17px;min-height:48px;touch-action:manipulation}
button:disabled{opacity:.55;cursor:wait}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #4d9360;outline-offset:3px}
main{width:100%;max-width:1180px;margin:auto;padding:28px 24px}
.hidden{display:none!important}
h1{font-size:clamp(2rem,4vw,2.7rem);line-height:1.12;margin:0 0 8px;letter-spacing:-.035em}
h2{font-size:clamp(1.5rem,3vw,2rem);line-height:1.2;margin:0}
p{margin:12px 0}
.muted{color:var(--muted);font-size:.95rem}
.small,.lowlabel{font-size:.82rem}
.top{display:flex;align-items:center;gap:18px;margin:18px 0 34px}
.logo{font-size:42px;background:white;border-radius:22px;padding:13px}
.top button{margin-left:auto}
.primary,.add{background:var(--green);color:white;font-weight:700;box-shadow:0 5px 14px #427b3820}
.secondary{background:var(--pale);color:#425343}
.danger{background:#fff0ee;color:#b64238}
.categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.category{border-radius:24px;min-height:165px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:700;font-size:1.2rem;box-shadow:0 5px 18px #29372d0b;transition:transform .15s}
.category:active{transform:scale(.98)}
.category span{font-size:46px}
.environment-casa{background:#D4E8DC;color:#285C48}
.environment-cantina{background:#EADCF5;color:#684783}
.category-cibo{background:#FFE2A8;color:#855A17}
.category-bagno{background:#CDE8FA;color:#285F83}
.category-pulizia{background:#F8D8D0;color:#914F43}
.category-freezer{background:#C9EDF0;color:#22666D}
.header{display:flex;align-items:center;gap:16px;margin:12px 0 24px}
.header button{font-size:1.6rem;background:white;min-width:54px;min-height:54px}
.toolbar{display:flex;gap:12px;margin-bottom:16px}
input,select{width:100%;min-width:0;min-height:54px;padding:14px 16px;border:1px solid #dce4dc;border-radius:15px;background:white;color:var(--text)}
.toolbar input{flex:1}
.toolbar button{min-width:58px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 22px}
.filter{background:var(--pale);color:#425343}
.filter.active{background:#e3f2dd;color:#356c2e}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.product{display:flex;align-items:center;gap:12px;background:white;border-radius:20px;padding:15px;min-width:0;box-shadow:0 4px 16px #29372d0a}
.product.low{outline:2px solid #e57368}
.product.empty-stock{outline:2px solid #b64238;background:#fff8f7}
.product img,.emoji{width:66px;height:66px;border-radius:15px;object-fit:cover;display:grid;place-items:center;background:#f0f4ee;font-size:32px;flex-shrink:0}
.info{flex:1;min-width:0}
.name{font-weight:700;overflow-wrap:anywhere;line-height:1.3}
.small{color:var(--muted);overflow-wrap:anywhere}
.lowlabel{color:#c34c42;font-weight:700}
.controls{display:flex;align-items:center;gap:4px;flex-shrink:0}
.controls button{min-width:38px;min-height:42px;padding:6px;background:var(--pale);border-radius:11px}
.qty{min-width:22px;text-align:center;font-weight:700}
.add{width:100%;margin-top:20px;padding:17px;min-height:60px}
.empty{grid-column:1/-1;background:white;border-radius:18px;padding:35px 18px;text-align:center;color:var(--muted)}
.card{max-width:560px;margin:6vh auto;background:white;padding:30px;border-radius:26px;box-shadow:0 8px 30px #29372d0b}
.card label,.field label{display:block;font-size:.9rem;font-weight:700;margin:13px 0 7px}
.card input{margin-bottom:8px}
.card button{width:100%;margin-top:12px}
.error{color:#b42318;font-size:.85rem}
#loginStatus{font-size:.85rem;color:var(--muted)}
.modal{position:fixed;inset:0;background:#17251b99;display:flex;align-items:center;justify-content:center;padding:12px;z-index:100;overflow:auto}
.dialog{background:white;width:100%;max-width:680px;max-height:94dvh;overflow:auto;border-radius:24px;padding:24px}
.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.dialoghead h2{font-size:1.4rem}
.field{margin:14px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.actions{display:flex;gap:10px;margin-top:20px}
.actions button{flex:1}
#scannerModal{position:fixed!important;inset:0!important;display:flex;align-items:flex-start!important;justify-content:center!important;padding:0!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch;z-index:99999!important}
#scannerModal.hidden{display:none!important}
#scannerModal .scanner-dialog{position:relative!important;width:100%!important;max-width:1000px!important;height:auto!important;max-height:none!important;margin:0!important;padding:16px!important;border-radius:0 0 22px 22px!important;overflow:visible!important}
#scannerModal .dialoghead{margin-bottom:10px!important}
#reader{display:block!important;width:100%!important;min-height:0!important;height:auto!important;margin:0 0 10px!important;padding:0!important;overflow:hidden!important}
#reader video{display:block!important;width:100%!important;max-width:100%!important;height:auto!important;object-fit:contain!important}
#reader canvas{max-width:100%!important}
#scannerModal .scanner-help{margin:10px 0 14px!important}
#scannerModal .scanner-close{width:100%!important}
#reader__dashboard{display:block!important;width:100%!important;max-width:100%!important;margin:8px auto 0!important;padding:8px 0!important;box-sizing:border-box!important;text-align:center!important}
#reader__dashboard button,#reader__dashboard select{max-width:100%!important;margin:4px auto!important;min-height:44px}
#reader__dashboard_section,#reader__dashboard_section_csr{width:100%!important;text-align:center!important}
@media(max-width:600px){
  html{font-size:17px}
  main{padding:20px 16px}
  .top{gap:12px;margin:14px 0 26px}
  .logo{font-size:36px;padding:11px}
  .categories{grid-template-columns:1fr;gap:14px}
  .category{min-height:110px;flex-direction:row;justify-content:flex-start;padding:18px 22px;gap:18px}
  .category span{font-size:38px}
  .header{gap:12px;margin-bottom:18px}
  .toolbar{gap:8px}
  .toolbar button{min-width:52px;padding:8px}
  .filters{gap:7px}
  .filters button{padding:9px 11px;min-height:42px;font-size:.84rem}
  .products{grid-template-columns:minmax(0,1fr);gap:12px}
  .product{gap:10px;padding:12px;min-height:85px}
  .product img,.emoji{width:56px;height:56px;font-size:28px}
  .controls{gap:3px}
  .controls button{min-width:35px;min-height:40px;padding:5px}
  .card{padding:24px 20px;margin:4vh auto}
  .dialog{padding:20px 16px;border-radius:20px}
  .two{grid-template-columns:1fr;gap:0}
  .actions{flex-direction:column}
  .actions button{width:100%}
  #scannerModal .scanner-dialog{padding:12px!important}
}
@media(min-width:1025px){
  main{padding:28px}
  .categories{gap:24px}
  .products{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
  .product img,.emoji{width:76px;height:76px}
}
</style>
</head>

<body>
<main id="loginScreen">
  <div class="card">
    <div class="logo" style="display:inline-block">🛒</div>
    <h1>La Mia Dispensa</h1>
    <p class="muted">Accedi alla tua dispensa personale.</p>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="primary" id="loginButton" type="submit">Accedi</button>
    </form>
    <p id="loginStatus" role="status"></p>
    <p id="loginError" class="error" role="alert"></p>
  </div>
</main>

<main id="home" class="hidden">
  <div class="top">
    <div class="logo">🛒</div>
    <div><h1>La Mia Dispensa</h1><div class="muted">Scegli un ambiente</div></div>
    <button class="secondary" id="logout">Esci</button>
  </div>
  <div class="categories">
    <button class="category environment-casa" data-action="environment" data-env="casa"><span>🏠</span>Casa</button>
    <button class="category environment-cantina" data-action="environment" data-env="cantina"><span>🪜</span>Cantina</button>
  </div>
</main>

<main id="environmentScreen" class="hidden">
  <div class="header">
    <button data-action="home" aria-label="Torna alla home">←</button>
    <div><h2 id="environmentTitle">Casa</h2><div class="muted">Scegli una categoria</div></div>
  </div>
  <div class="categories">
    <button class="category category-cibo" data-action="category" data-cat="cibo" data-env="casa"><span>🍎</span>Cibo</button>
    <button class="category category-bagno" data-action="category" data-cat="bagno" data-env="casa"><span>🛁</span>Bagno</button>
    <button class="category category-pulizia" data-action="category" data-cat="pulizia" data-env="cantina"><span>🧴</span>Pulizia</button>
    <button class="category category-freezer" data-action="category" data-cat="freezer" data-env="cantina"><span>🧊</span>Freezer</button>
  </div>
</main>

<main id="categoryScreen" class="hidden">
  <div class="header">
    <button data-action="backEnvironment" aria-label="Torna alle categorie">←</button>
    <div><h2 id="categoryTitle">Cibo</h2><div class="muted">I tuoi prodotti</div></div>
  </div>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Cerca prodotto..." aria-label="Cerca prodotto">
    <button class="secondary" data-action="scan" aria-label="Scansiona barcode">📷</button>
  </div>
  <div class="filters">
    <button id="allFilter" class="filter active" data-action="filter" data-filter="all">Tutti</button>
    <button id="lowFilter" class="filter" data-action="filter" data-filter="low">🟠 Scorte basse</button>
    <button id="emptyFilter" class="filter" data-action="filter" data-filter="empty">🔴 Terminati</button>
  </div>
  <div id="products" class="products"></div>
  <button class="add" data-action="new">＋ Aggiungi prodotto</button>
</main>

<div id="productModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="formTitle">
  <div class="dialog">
    <div class="dialoghead">
      <h2 id="formTitle">Aggiungi prodotto</h2>
      <button type="button" data-action="closeForm" aria-label="Chiudi">✕</button>
    </div>
    <form id="productForm">
      <div class="field"><label for="pName">Nome prodotto *</label><input id="pName" required></div>
      <div class="two">
        <div class="field"><label for="pBrand">Marca</label><input id="pBrand"></div>
        <div class="field"><label for="pFormat">Formato</label><input id="pFormat" placeholder="Es. 450 g"></div>
      </div>
      <div class="two">
        <div class="field"><label for="pQty">Quantità</label><input id="pQty" type="number" min="0" step="1" value="1"></div>
        <div class="field"><label for="pMin">Scorta minima</label><input id="pMin" type="number" min="0" step="1" placeholder="Facoltativa"></div>
      </div>
      <div class="field">
        <label for="pCat">Categoria</label>
        <select id="pCat">
          <option value="cibo">🍎 Cibo</option><option value="bagno">🛁 Bagno</option>
          <option value="pulizia">🧴 Pulizia</option><option value="freezer">🧊 Freezer</option>
        </select>
      </div>
      <div class="field"><label for="pBarcode">Barcode</label><input id="pBarcode" inputmode="numeric"></div>
      <div class="field"><label for="pImage">URL immagine</label><input id="pImage" type="url" placeholder="https://..."></div>
      <div class="actions">
        <button type="button" class="danger hidden" id="deleteProduct">Elimina</button>
        <button type="button" class="secondary" data-action="closeForm">Annulla</button>
        <button class="primary" id="saveButton" type="submit">Salva</button>
      </div>
    </form>
  </div>
</div>

<div id="scannerModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="scannerTitle">
  <div class="dialog scanner-dialog">
    <div class="dialoghead">
      <h2 id="scannerTitle">Scansiona barcode</h2>
      <button type="button" data-action="closeScan" aria-label="Chiudi scanner">✕</button>
    </div>
    <div id="reader"></div>
    <p class="muted scanner-help">Consenti l'accesso alla fotocamera quando richiesto.</p>
    <button class="secondary scanner-close" data-action="closeScan">Chiudi scanner</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
(function () {
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyDd1tEuQeo4Bk7wjRJL-zkkSQXTbmq7wb4",
    authDomain: "la-mia-dispensa-a3a62.firebaseapp.com",
    projectId: "la-mia-dispensa-a3a62",
    storageBucket: "la-mia-dispensa-a3a62.firebasestorage.app",
    messagingSenderId: "806958296645",
    appId: "1:806958296645:web:7dbfa0b8d37757a2dbfd2c"
  };

  firebase.initializeApp(firebaseConfig);

  var auth = firebase.auth();
  var db = firebase.firestore();

  var user = null;
  var inventoryRef = null;
  var products = [];
  var category = "cibo";
  var currentEnvironment = "casa";
  var filter = "all";
  var editingId = null;
  var busy = false;

  // Scanner: stato unico, senza dichiarazioni duplicate.
  var scanner = null;
  var scannerStarting = false;
  var scannerStartPromise = null;
  var processingBarcode = false;
  var scannerEpoch = 0;

  // Le modifiche vengono salvate in sequenza per non perdere aggiornamenti.
  var mutationQueue = Promise.resolve();

  var categories = {
    cibo: { name:"Cibo", icon:"🍎", environment:"casa" },
    bagno: { name:"Bagno", icon:"🛁", environment:"casa" },
    pulizia: { name:"Pulizia", icon:"🧴", environment:"cantina" },
    freezer: { name:"Freezer", icon:"🧊", environment:"cantina" }
  };

  function $(id) {
    return document.getElementById(id);
  }

  function escapeHTML(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
      return {
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
      }[c];
    });
  }

  function num(value) {
    var n = Number(value);
    return isFinite(n) && n > 0 ? Math.floor(n) : 0;
  }

  function newId() {
    return "p-" + Date.now() + "-" + Math.floor(Math.random() * 1000000);
  }

  function low(p) {
    return num(p.quantity) < num(p.minStock);
  }

  function setScreen(id) {
    ["loginScreen", "home", "environmentScreen", "categoryScreen"].forEach(function (key) {
      $(key).classList.toggle("hidden", key !== id);
    });
  }

  function showError(message) {
    $("loginError").textContent = message || "";
  }

  function cleanProduct(p) {
    return {
      id: String(p.id || newId()),
      name: String(p.name || "").trim(),
      brand: String(p.brand || ""),
      format: String(p.format || ""),
      quantity: num(p.quantity),
      minStock: num(p.minStock),
      category: categories[p.category] ? p.category : "cibo",
      barcode: String(p.barcode || "").trim(),
      image: String(p.image || "")
    };
  }

  function findProduct(id) {
    return products.find(function (p) { return p.id === id; });
  }

  /* Navigazione */
  function openEnvironment(env) {
    if (!user || (env !== "casa" && env !== "cantina")) return;

    currentEnvironment = env;
    $("environmentTitle").textContent = env === "casa" ? "Casa 🏠" : "Cantina 🪜";

    Array.prototype.forEach.call(
      $("environmentScreen").querySelectorAll("[data-env]"),
      function (button) {
        button.classList.toggle("hidden", button.dataset.env !== env);
      }
    );

    setScreen("environmentScreen");
  }

  function backToEnvironment() {
    openEnvironment(currentEnvironment);
  }

  function openCategory(cat) {
    if (!user || !categories[cat]) return;

    category = cat;
    currentEnvironment = categories[cat].environment;
    filter = "all";
    $("categoryTitle").textContent = categories[cat].name;
    $("search").value = "";

    updateFilters();
    setScreen("categoryScreen");
    render();
  }

  function updateFilters() {
    $("allFilter").classList.toggle("active", filter === "all");
    $("lowFilter").classList.toggle("active", filter === "low");
    $("emptyFilter").classList.toggle("active", filter === "empty");
  }

  /* Visualizzazione */
  function render() {
    if (!user) return;

    var query = $("search").value.trim().toLowerCase();

    var list = products.filter(function (p) {
      var searchable = (p.name + " " + p.brand + " " + p.format + " " + p.barcode).toLowerCase();
      var matchesQuery = searchable.indexOf(query) !== -1;

      return p.category === category && matchesQuery && (
        filter === "all" ||
        (filter === "low" && low(p) && num(p.quantity) > 0) ||
        (filter === "empty" && num(p.quantity) === 0)
      );
    }).sort(function (a, b) {
      return a.name.localeCompare(b.name, "it");
    });

    if (!list.length) {
      $("products").innerHTML =
        '<div class="empty">📦<br><br>Nessun prodotto trovato.' +
        '<br>Puoi aggiungerne uno con il pulsante qui sotto.</div>';
      return;
    }

    $("products").innerHTML = list.map(function (p) {
      var picture = p.image && /^https?:\/\//i.test(p.image)
        ? '<img src="' + escapeHTML(p.image) + '" alt="Foto di ' +
          escapeHTML(p.name) + '" loading="lazy" referrerpolicy="no-referrer">'
        : '<div class="emoji">' + categories[p.category].icon + '</div>';

      return '<article class="product ' +
        (num(p.quantity) === 0 ? "empty-stock" : (low(p) ? "low" : "")) + '">' +
        picture +
        '<div class="info">' +
        (p.brand ? '<div class="small">' + escapeHTML(p.brand) + '</div>' : "") +
        '<div class="name">' + escapeHTML(p.name) + '</div>' +
        (p.format ? '<div class="small">' + escapeHTML(p.format) + '</div>' : "") +
        (low(p) ? '<div class="lowlabel">🔴 Scorta bassa</div>' : "") +
        '</div><div class="controls">' +
        '<button data-action="qty" data-id="' + escapeHTML(p.id) +
        '" data-delta="-1" aria-label="Diminuisci quantità">−</button>' +
        '<span class="qty">' + num(p.quantity) + '</span>' +
        '<button data-action="qty" data-id="' + escapeHTML(p.id) +
        '" data-delta="1" aria-label="Aumenta quantità">＋</button>' +
        '<button data-action="edit" data-id="' + escapeHTML(p.id) +
        '" aria-label="Modifica prodotto">✏️</button>' +
        '</div></article>';
    }).join("");

    Array.prototype.forEach.call($("products").querySelectorAll("img"), function (img) {
      img.onerror = function () {
        var fallback = document.createElement("div");
        fallback.className = "emoji";
        fallback.textContent = "📦";
        if (img.parentNode) img.parentNode.replaceChild(fallback, img);
      };
    });
  }

  /* Scrittura Firestore e coda delle modifiche */
  function persistInventory(nextProducts) {
    if (!user || !inventoryRef) {
      return Promise.reject(new Error("Non sei autenticata."));
    }

    var targetRef = inventoryRef;
    var targetUid = user.uid;
    var safe = nextProducts.map(cleanProduct);

    return targetRef.set({
      products: safe,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function () {
      // Evita che una scrittura di una sessione precedente cambi lo stato corrente.
      if (user && user.uid === targetUid && inventoryRef === targetRef) {
        products = safe;
        render();
      }
      return safe;
    }).catch(function (error) {
      console.error("Firestore:", error);
      alert(
        "Salvataggio non riuscito (" + (error.code || "errore") +
        "). Controlla la connessione e le regole Firestore."
      );
      throw error;
    });
  }

  function updateProducts(mutator) {
    var operation = mutationQueue.then(function () {
      if (!user || !inventoryRef) throw new Error("Non sei autenticata.");

      var next = products.map(function (p) {
        return Object.assign({}, p);
      });

      mutator(next);
      return persistInventory(next);
    });

    // Un errore non deve bloccare per sempre le operazioni successive.
    mutationQueue = operation.catch(function () {});
    return operation;
  }

  function loadInventory() {
    products = [];
    $("products").innerHTML = '<div class="empty">Caricamento…</div>';
    inventoryRef = db.collection("inventories").doc(user.uid);

    var targetRef = inventoryRef;
    var targetUid = user.uid;

    targetRef.get().then(function (doc) {
      if (!user || user.uid !== targetUid || inventoryRef !== targetRef) return;

      products = doc.exists && Array.isArray(doc.data().products)
        ? doc.data().products.map(cleanProduct)
        : [];

      render();
    }).catch(function (error) {
      console.error("Lettura Firestore:", error);
      if (!user || user.uid !== targetUid) return;

      $("products").innerHTML =
        '<div class="empty">Impossibile caricare la dispensa. Controlla le regole Firestore.</div>';

      alert("Errore di caricamento (" + (error.code || "errore") +
        "). Verifica le regole Firestore.");
    });
  }

  function changeQuantity(id, delta) {
    return updateProducts(function (next) {
      var target = next.find(function (p) { return p.id === id; });
      if (target) target.quantity = Math.max(0, num(target.quantity) + delta);
    }).catch(function () {});
  }

  /* Modulo prodotto */
  function openForm(p) {
    if (!user) return;

    editingId = p ? p.id : null;
    $("formTitle").textContent = p ? "Modifica prodotto" : "Aggiungi prodotto";
    $("pName").value = p ? p.name : "";
    $("pBrand").value = p ? p.brand : "";
    $("pFormat").value = p ? p.format : "";
    $("pQty").value = p ? num(p.quantity) : 1;
    $("pMin").value = p && num(p.minStock) > 0 ? num(p.minStock) : "";
    $("pCat").value = p ? p.category : category;
    $("pBarcode").value = p ? p.barcode : "";
    $("pImage").value = p ? p.image : "";
    $("deleteProduct").classList.toggle("hidden", !p);
    $("productModal").classList.remove("hidden");
  }

  function closeForm() {
    $("productModal").classList.add("hidden");
    editingId = null;
    $("productForm").reset();
    $("pQty").value = 1;
  }

  $("productForm").addEventListener("submit", function (event) {
    event.preventDefault();
    if (!user || busy) return;

    var name = $("pName").value.trim();
    if (!name) {
      alert("Inserisci il nome del prodotto.");
      return;
    }

    var image = $("pImage").value.trim();
    if (image && !/^https?:\/\//i.test(image)) {
      alert("L'URL dell'immagine deve iniziare con https:// o http://.");
      return;
    }

    var qtyValue = $("pQty").value;
    var minValue = $("pMin").value;

    if (qtyValue !== "" && (!Number.isFinite(Number(qtyValue)) || Number(qtyValue) < 0)) {
      alert("Inserisci una quantità valida.");
      return;
    }
    if (minValue !== "" && (!Number.isFinite(Number(minValue)) || Number(minValue) < 0)) {
      alert("Inserisci una scorta minima valida.");
      return;
    }

    var p = cleanProduct({
      id: editingId || newId(),
      name: name,
      brand: $("pBrand").value.trim(),
      format: $("pFormat").value.trim(),
      quantity: qtyValue === "" ? 0 : qtyValue,
      minStock: minValue,
      category: $("pCat").value,
      barcode: $("pBarcode").value.trim(),
      image: image
    });

    busy = true;
    $("saveButton").disabled = true;

    updateProducts(function (next) {
      var index = next.findIndex(function (item) { return item.id === p.id; });
      if (index >= 0) next[index] = p;
      else next.push(p);
    }).then(function () {
      category = p.category;
      currentEnvironment = categories[category].environment;
      filter = "all";
      $("search").value = "";
      $("categoryTitle").textContent = categories[category].name;
      updateFilters();
      closeForm();
      setScreen("categoryScreen");
      render();
    }).catch(function () {
      // Non chiudere il modulo se il salvataggio fallisce.
    }).finally(function () {
      busy = false;
      $("saveButton").disabled = false;
    });
  });

  $("deleteProduct").addEventListener("click", function () {
    if (!editingId || busy) return;

    var id = editingId;
    var p = findProduct(id);
    if (!p || !confirm('Eliminare "' + p.name + '"?')) return;

    busy = true;
    $("deleteProduct").disabled = true;

    updateProducts(function (next) {
      var index = next.findIndex(function (item) { return item.id === id; });
      if (index >= 0) next.splice(index, 1);
    }).then(function () {
      closeForm();
    }).catch(function () {
      // Mantieni aperto il modulo se la scrittura non riesce.
    }).finally(function () {
      busy = false;
      $("deleteProduct").disabled = false;
    });
  });

  /* Accesso Firebase */
  $("loginForm").addEventListener("submit", function (event) {
    event.preventDefault();
    showError("");

    $("loginButton").disabled = true;
    $("loginButton").textContent = "Accesso in corso…";
    $("loginStatus").textContent = "";

    auth.signInWithEmailAndPassword(
      $("email").value.trim(),
      $("password").value
    ).catch(function (error) {
      console.error("Login:", error);
      showError("Accesso non riuscito. Controlla email e password e verifica che Email/Password sia abilitato in Firebase.");
    }).finally(function () {
      $("loginButton").disabled = false;
      $("loginButton").textContent = "Accedi";
    });
  });

  $("logout").addEventListener("click", function () {
    closeScan();
    auth.signOut().catch(function (error) {
      alert("Non è stato possibile uscire: " + error.message);
    });
  });

  $("search").addEventListener("input", render);

  /* Scanner barcode */
  function stopScanner() {
    // Invalida i callback appartenenti alla sessione precedente.
    scannerEpoch++;
    processingBarcode = false;
    scannerStarting = false;

    var currentScanner = scanner;
    var startPromise = scannerStartPromise;

    scanner = null;
    scannerStartPromise = null;

    if (!currentScanner) {
      $("reader").innerHTML = "";
      return Promise.resolve();
    }

    // Se start() è ancora in corso, aspetta che termini prima di fermare/azzerare.
    return Promise.resolve(startPromise).catch(function () {}).then(function () {
      var stopPromise = Promise.resolve();

      try {
        if (currentScanner.isScanning) {
          stopPromise = currentScanner.stop();
        }
      } catch (error) {
        console.warn("Arresto scanner:", error);
      }

      return Promise.resolve(stopPromise).catch(function (error) {
        console.warn("Arresto scanner:", error);
      }).then(function () {
        try {
          currentScanner.clear();
        } catch (error) {
          console.warn("Pulizia scanner:", error);
        }

        $("reader").innerHTML = "";
      });
    });
  }

  function closeScan() {
    $("scannerModal").classList.add("hidden");
    return stopScanner();
  }

  function scanBarcode(code) {
    code = String(code || "").trim();
    if (!code || !user) return;

    // Cerca il codice nella dispensa indipendentemente dalla categoria.
    var existing = products.find(function (p) {
      return String(p.barcode || "").trim() === code;
    });

    if (existing) {
      category = existing.category;
      currentEnvironment = categories[category].environment;
      filter = "all";
      $("categoryTitle").textContent = categories[category].name;
      $("search").value = "";
      updateFilters();
      setScreen("categoryScreen");
      changeQuantity(existing.id, 1);
      return;
    }

    openForm(null);
    $("pBarcode").value = code;
    $("pName").value = "";
    $("pBrand").value = "";
    $("pFormat").value = "";
    $("pImage").value = "";

    var url = "https://world.openfoodfacts.org/api/v2/product/" +
      encodeURIComponent(code) +
      ".json?fields=code,status,product_name,product_name_it,generic_name,generic_name_it,brands,quantity,image_front_url,image_front_small_url,image_url";

    fetch(url, { headers: { Accept: "application/json" } })
      .then(function (response) {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      })
      .then(function (data) {
        // Evita di sovrascrivere i campi se l'utente ha chiuso o cambiato modulo.
        if ($("productModal").classList.contains("hidden") ||
            $("pBarcode").value.trim() !== code) return;

        if (!data || data.status !== 1 || !data.product) {
          alert("Prodotto non trovato su Open Food Facts. Il barcode è stato mantenuto: puoi inserire i dati manualmente.");
          return;
        }

        var p = data.product;
        var name = p.product_name_it || p.product_name ||
          p.generic_name_it || p.generic_name || "";

        if (name) $("pName").value = name;
        if (p.brands) $("pBrand").value = p.brands;
        if (p.quantity) $("pFormat").value = p.quantity;

        var imageUrl = p.image_front_url || p.image_front_small_url || p.image_url || "";
        if (imageUrl && /^https?:\/\//i.test(imageUrl)) {
          $("pImage").value = imageUrl;
        }

        if (!name) {
          alert("Il codice è stato trovato, ma il nome non è disponibile. Completa i campi manualmente.");
        }
      })
      .catch(function (error) {
        console.error("Open Food Facts:", error);
        if (!$("productModal").classList.contains("hidden") &&
            $("pBarcode").value.trim() === code) {
          alert("Non riesco a recuperare il prodotto online. Il barcode è stato mantenuto: puoi inserire i dati manualmente.");
        }
      });
  }

  async function openScan() {
    if (!user || scanner || scannerStarting) return;

    if (!window.isSecureContext) {
      alert("La fotocamera richiede HTTPS. Apri la pagina tramite un indirizzo https://.");
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert("Questo browser non permette di accedere alla fotocamera. Prova con Safari aggiornato e HTTPS.");
      return;
    }

    if (typeof Html5Qrcode === "undefined" ||
        typeof Html5QrcodeSupportedFormats === "undefined") {
      alert("Scanner non disponibile. Controlla la connessione e ricarica la pagina.");
      return;
    }

    scannerStarting = true;
    processingBarcode = false;
    var myEpoch = ++scannerEpoch;

    $("scannerModal").classList.remove("hidden");
    $("reader").innerHTML = "";

    var currentScanner = null;

    try {
      var formats = [
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39
      ];

      currentScanner = new Html5Qrcode("reader", {
        formatsToSupport: formats,
        verbose: false
      });

      scanner = currentScanner;

      var startPromise = currentScanner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: function (width, height) {
            return {
              width: Math.max(120, Math.min(Math.floor(width * 0.9), 360)),
              height: Math.max(60, Math.min(Math.floor(height * 0.32), 150))
            };
          },
          aspectRatio: 1.5,
          disableFlip: true
        },
        function (decodedText) {
          if (!decodedText || processingBarcode ||
              scanner !== currentScanner || myEpoch !== scannerEpoch) return;

          processingBarcode = true;
          var code = String(decodedText).trim();

          // Ferma la fotocamera prima di mostrare il modulo o aggiornare la dispensa.
          closeScan().then(function () {
            if (user) scanBarcode(code);
          });
        },
        function () {
          // I fotogrammi senza un codice leggibile sono normali.
        }
      );

      scannerStartPromise = startPromise;
      await startPromise;

      // Se nel frattempo l'utente ha chiuso lo scanner, non lasciarlo attivo.
      if (myEpoch !== scannerEpoch || scanner !== currentScanner ||
          $("scannerModal").classList.contains("hidden")) {
        try {
          if (currentScanner.isScanning) await currentScanner.stop();
        } catch (error) {
          console.warn("Arresto dopo chiusura:", error);
        }
        try {
          currentScanner.clear();
        } catch (error) {
          console.warn("Pulizia dopo chiusura:", error);
        }
        if (scanner === currentScanner) scanner = null;
        $("reader").innerHTML = "";
        return;
      }

      scannerStarting = false;
    } catch (error) {
      console.error("Errore apertura scanner:", error);

      if (scanner === currentScanner) scanner = null;
      scannerStarting = false;
      scannerStartPromise = null;
      processingBarcode = false;

      try {
        if (currentScanner) {
          if (currentScanner.isScanning) await currentScanner.stop();
          currentScanner.clear();
        }
      } catch (cleanupError) {
        console.warn("Pulizia scanner:", cleanupError);
      }

      $("reader").innerHTML = "";
      $("scannerModal").classList.add("hidden");

      alert("Impossibile avviare la fotocamera. Controlla i permessi di Safari, la connessione HTTPS e riprova.");
    }
  }

  /* Eventi interfaccia */
  document.addEventListener("click", function (event) {
    var el = event.target.closest("[data-action]");
    if (!el) return;

    var action = el.dataset.action;

    if (action === "environment") openEnvironment(el.dataset.env);
    else if (action === "category") openCategory(el.dataset.cat);
    else if (action === "home") setScreen("home");
    else if (action === "backEnvironment") backToEnvironment();
    else if (action === "new") openForm(null);
    else if (action === "edit") openForm(findProduct(el.dataset.id));
    else if (action === "closeForm") closeForm();
    else if (action === "scan") openScan();
    else if (action === "closeScan") closeScan();
    else if (action === "filter") {
      filter = el.dataset.filter;
      updateFilters();
      render();
    } else if (action === "qty") {
      changeQuantity(el.dataset.id, Number(el.dataset.delta));
    }
  });

  $("productModal").addEventListener("click", function (event) {
    if (event.target === $("productModal")) closeForm();
  });

  $("scannerModal").addEventListener("click", function (event) {
    if (event.target === $("scannerModal")) closeScan();
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      closeForm();
      closeScan();
    }
  });

  window.addEventListener("pagehide", closeScan);

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) closeScan();
  });

  /* Stato autenticazione */
  auth.onAuthStateChanged(function (authUser) {
    user = authUser;
    products = [];
    inventoryRef = null;

    if (user) {
      showError("");
      setScreen("home");
      loadInventory();
    } else {
      closeForm();
      closeScan();
      setScreen("loginScreen");
    }
  });

}());
</script>
</body>
</html>
