<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#7bbf6a"
    >

    <title>La Mia Dispensa</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {

            width: 100%;
            min-height: 100%;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #f5f7f4;
            color: #26342b;
        }


        body {
            padding-top: 6px;
        }


        button,
        input,
        select {
            font: inherit;
        }


        button {

            cursor: pointer;

            -webkit-tap-highlight-color:
                transparent;
        }


        /* =====================================================
           BARRA SUPERIORE
        ===================================================== */

        .top-color-bar {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            height: 6px;

            background:
                linear-gradient(
                    90deg,
                    #7bbf6a,
                    #a8d96d,
                    #6fb7a8
                );

            z-index: 200;
        }


        .app {

            min-height: 100vh;

            padding-bottom: 30px;
        }


        .screen {

            display: none;

            width: 100%;

            min-height:
                calc(100vh - 6px);
        }


        .screen.active {
            display: block;
        }


        /* =====================================================
           HOME
        ===================================================== */

        #homeScreen {

            padding:
                42px
                20px
                30px;
        }


        .home-title {

            max-width: 760px;

            margin:
                0
                auto
                28px;
        }


        .home-heading {

            display: flex;

            align-items: center;

            gap: 14px;
        }


        .logo-icon {

            width: 58px;
            height: 58px;

            border-radius: 18px;

            background: white;

            box-shadow:
                0
                5px
                18px
                rgba(
                    40,
                    70,
                    50,
                    0.10
                );

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 32px;

            flex-shrink: 0;
        }


        .home-heading h2 {

            font-size: 28px;

            line-height: 1.15;

            color: #26342b;

            margin-bottom: 5px;
        }


        .home-heading p {

            color: #718076;

            font-size: 15px;
        }


        .categories {

            width: 100%;

            max-width: 760px;

            margin: 0 auto;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 16px;
        }


        .category-card {

            min-height: 180px;

            border: none;

            border-radius: 24px;

            background: white;

            box-shadow:
                0
                7px
                22px
                rgba(
                    40,
                    70,
                    50,
                    0.09
                );

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 14px;

            padding:
                22px
                14px;

            color: #26342b;

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }


        .category-card:active {

            transform:
                scale(0.97);
        }


        .category-card:hover {

            box-shadow:
                0
                10px
                28px
                rgba(
                    40,
                    70,
                    50,
                    0.13
                );
        }


        .category-icon {

            width: 76px;
            height: 76px;

            border-radius: 22px;

            background: #f1f7ee;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 42px;
        }


        .category-name {

            font-size: 18px;

            font-weight: 700;

            text-align: center;
        }


        /* =====================================================
           CATEGORY SCREEN
        ===================================================== */

        #categoryScreen {

            padding:
                18px
                16px
                30px;
        }


        .category-container {

            width: 100%;

            max-width: 900px;

            margin: 0 auto;
        }


        .category-header {

            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 18px;
        }


        .back-button {

            width: 44px;
            height: 44px;

            border: none;

            border-radius: 14px;

            background: white;

            box-shadow:
                0
                4px
                14px
                rgba(
                    40,
                    70,
                    50,
                    0.08
                );

            font-size: 23px;

            display: flex;

            align-items: center;
            justify-content: center;

            color: #34443a;
        }


        .category-title {

            flex: 1;
        }


        .category-title h2 {

            font-size: 24px;

            line-height: 1.15;
        }


        .category-title p {

            color: #7a877e;

            font-size: 13px;

            margin-top: 3px;
        }


        /* =====================================================
           SEARCH + SCANNER
        ===================================================== */

        .toolbar {

            display: flex;

            gap: 10px;

            margin-bottom: 14px;
        }


        .search-box {

            flex: 1;

            position: relative;
        }


        .search-box input {

            width: 100%;

            height: 48px;

            border:
                1px solid
                #dfe6df;

            border-radius: 15px;

            background: white;

            padding:
                0
                16px
                0
                44px;

            outline: none;

            color: #26342b;
        }


        .search-box input:focus {

            border-color: #9ac78e;

            box-shadow:
                0
                0
                0
                3px
                rgba(
                    123,
                    191,
                    106,
                    0.12
                );
        }


        .search-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            font-size: 18px;

            color: #7d8b82;

            pointer-events: none;
        }


        .scanner-button {

            width: 48px;
            height: 48px;

            border:
                1px solid
                #dfe6df;

            border-radius: 15px;

            background: #ffffff;

            box-shadow:
                0
                4px
                14px
                rgba(
                    40,
                    70,
                    50,
                    0.07
                );

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 0;
        }


        /* =====================================================
           ICONA FOTOCAMERA
        ===================================================== */

        .camera-icon {

            position: relative;

            width: 28px;
            height: 21px;

            background: #4f5d54;

            border-radius: 5px;

            display: flex;

            align-items: center;
            justify-content: center;
        }


        .camera-lens {

            width: 10px;
            height: 10px;

            border:
                3px solid
                white;

            border-radius: 50%;

            display: block;
        }


        .camera-icon::before {

            content: "";

            position: absolute;

            width: 10px;
            height: 4px;

            top: -4px;
            left: 5px;

            background: #4f5d54;

            border-radius:
                3px
                3px
                0
                0;
        }


        .camera-icon::after {

            content: "";

            position: absolute;

            width: 4px;
            height: 4px;

            top: 4px;
            right: 4px;

            background: white;

            border-radius: 50%;
        }


        .scanner-button:active {

            transform:
                scale(0.96);
        }


        /* =====================================================
           FILTRI
        ===================================================== */

        .filters {

            display: flex;

            gap: 8px;

            margin-bottom: 18px;

            overflow-x: auto;

            padding-bottom: 2px;
        }


        .filter-button {

            border:
                1px solid
                #dce5dc;

            background: white;

            color: #66746b;

            border-radius: 999px;

            padding:
                9px
                15px;

            white-space: nowrap;

            font-size: 14px;
        }


        .filter-button.active {

            background: #e8f4e4;

            border-color: #b8dbaa;

            color: #3d6935;

            font-weight: 700;
        }


        /* =====================================================
           PRODUCTS
        ===================================================== */

        .products {

            display: flex;

            flex-direction: column;

            gap: 12px;
        }


        .product-card {

            background: white;

            border:
                2px solid
                transparent;

            border-radius: 19px;

            padding: 14px;

            box-shadow:
                0
                5px
                17px
                rgba(
                    40,
                    70,
                    50,
                    0.07
                );

            display: flex;

            align-items: center;

            gap: 13px;
        }


        /* Bordo rosso quando
           quantità < scorta minima */

        .product-card.low-stock-border {

            border-color:
                #e57368;
        }


        .product-image {

            width: 74px;
            height: 74px;

            border-radius: 15px;

            background: #f1f4f0;

            object-fit: cover;

            flex-shrink: 0;
        }


        .product-info {

            flex: 1;

            min-width: 0;
        }


        .product-brand {

            font-size: 12px;

            color: #8a968e;

            margin-bottom: 3px;
        }


        .product-name {

            font-size: 17px;

            font-weight: 700;

            color: #26342b;

            margin-bottom: 4px;

            word-break: break-word;
        }


        .product-format {

            font-size: 13px;

            color: #78857d;
        }


        .low-stock {

            display: inline-flex;

            align-items: center;

            gap: 4px;

            margin-top: 7px;

            padding:
                4px
                8px;

            border-radius: 999px;

            background: #fff0ee;

            color: #c34c42;

            font-size: 11px;

            font-weight: 700;
        }


        .quantity-control {

            display: flex;

            align-items: center;

            gap: 7px;

            flex-shrink: 0;
        }


        .quantity-button {

            width: 34px;
            height: 34px;

            border: none;

            border-radius: 11px;

            background: #eef4eb;

            color: #41613a;

            font-size: 20px;

            display: flex;

            align-items: center;
            justify-content: center;
        }


        .quantity-value {

            min-width: 27px;

            text-align: center;

            font-size: 17px;

            font-weight: 700;
        }


        .edit-button {

            width: 34px;
            height: 34px;

            border: none;

            border-radius: 11px;

            background: #f3f5f3;

            color: #69766e;

            font-size: 16px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-left: 2px;
        }


        .empty-products {

            background: white;

            border-radius: 20px;

            padding:
                40px
                20px;

            text-align: center;

            color: #7b887f;

            box-shadow:
                0
                5px
                17px
                rgba(
                    40,
                    70,
                    50,
                    0.06
                );
        }


        .empty-products-icon {

            font-size: 42px;

            margin-bottom: 10px;
        }


        .add-product-button {

            width: 100%;

            height: 54px;

            margin-top: 16px;

            border: none;

            border-radius: 17px;

            background: #7bbf6a;

            color: white;

            font-size: 16px;

            font-weight: 700;

            box-shadow:
                0
                6px
                16px
                rgba(
                    123,
                    191,
                    106,
                    0.22
                );
        }


        /* =====================================================
           MODALS
        ===================================================== */

        .modal {

            position: fixed;

            inset: 0;

            background:
                rgba(
                    25,
                    35,
                    28,
                    0.46
                );

            display: none;

            align-items: flex-end;

            justify-content: center;

            z-index: 500;

            padding: 12px;
        }


        .modal.active {

            display: flex;
        }


        .modal-content {

            width: 100%;

            max-width: 620px;

            max-height:
                calc(100vh - 24px);

            overflow-y: auto;

            background: white;

            border-radius: 25px;

            padding: 20px;

            box-shadow:
                0
                15px
                50px
                rgba(
                    0,
                    0,
                    0,
                    0.20
                );
        }


        .modal-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            margin-bottom: 18px;
        }


        .modal-header h3 {

            font-size: 21px;
        }


        .close-button {

            width: 38px;
            height: 38px;

            border: none;

            border-radius: 12px;

            background: #f1f4f1;

            color: #56635b;

            font-size: 20px;
        }


        .form-group {

            margin-bottom: 14px;
        }


        .form-group label {

            display: block;

            font-size: 13px;

            font-weight: 700;

            color: #536158;

            margin-bottom: 6px;
        }


        .form-group input,
        .form-group select {

            width: 100%;

            height: 46px;

            border:
                1px solid
                #dce4dc;

            border-radius: 13px;

            padding:
                0
                13px;

            outline: none;

            background: #fff;

            color: #26342b;
        }


        .form-group input:focus,
        .form-group select:focus {

            border-color: #9ac78e;

            box-shadow:
                0
                0
                0
                3px
                rgba(
                    123,
                    191,
                    106,
                    0.10
                );
        }


        .form-row {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;
        }


        .modal-actions {

            display: flex;

            gap: 10px;

            margin-top: 18px;
        }


        .modal-action {

            flex: 1;

            height: 48px;

            border: none;

            border-radius: 14px;

            font-weight: 700;
        }


        .cancel-action {

            background: #eef1ee;

            color: #5f6c64;
        }


        .save-action {

            background: #7bbf6a;

            color: white;
        }


        .delete-action {

            background: #fff0ee;

            color: #c34c42;
        }


        /* =====================================================
           SCANNER
        ===================================================== */

        #scannerModal {

            align-items: center;
        }


        .scanner-content {

            max-width: 560px;

            text-align: center;
        }


        #reader {

            width: 100%;

            overflow: hidden;

            border-radius: 17px;

            margin-bottom: 14px;
        }


        .scanner-help {

            color: #77847b;

            font-size: 13px;

            line-height: 1.45;

            margin-bottom: 14px;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 700px) {

            .categories {

                grid-template-columns:
                    1fr;
            }


            .category-card {

                min-height: 145px;

                flex-direction: row;

                justify-content:
                    flex-start;

                padding:
                    20px
                    24px;

                gap: 18px;
            }


            .category-icon {

                width: 68px;
                height: 68px;

                font-size: 37px;
            }


            .category-name {

                font-size: 18px;
            }


            .product-card {

                align-items:
                    flex-start;
            }


            .quantity-control {

                flex-wrap: wrap;

                justify-content:
                    flex-end;
            }

        }


        @media (min-width: 701px) {

            .modal {

                align-items: center;
            }

        }


        @media (max-width: 430px) {

            #homeScreen {

                padding-left: 16px;

                padding-right: 16px;
            }


            .home-heading h2 {

                font-size: 25px;
            }


            .product-card {

                gap: 10px;

                padding: 12px;
            }


            .product-image {

                width: 64px;

                height: 64px;
            }


            .product-name {

                font-size: 15px;
            }


            .quantity-button,
            .edit-button {

                width: 31px;

                height: 31px;
            }

        }

    </style>

</head>


<body>


<div class="top-color-bar"></div>


<div class="app">


    <!-- =====================================================
         HOME
    ====================================================== -->

    <main
        id="homeScreen"
        class="screen active"
    >

        <div class="home-title">

            <div class="home-heading">

                <div class="logo-icon">
                    🛒
                </div>

                <div>

                    <h2>
                        La Mia Dispensa
                    </h2>

                    <p>
                        Scegli una categoria
                    </p>

                </div>

            </div>

        </div>


        <div class="categories">


            <button
                class="category-card"
                onclick="openCategory('cibo')"
            >

                <div class="category-icon">
                    🍎
                </div>

                <div class="category-name">
                    Cibo
                </div>

            </button>


            <button
                class="category-card"
                onclick="openCategory('bagno')"
            >

                <div class="category-icon">
                    🧴
                </div>

                <div class="category-name">
                    Prodotti bagno
                </div>

            </button>


            <button
                class="category-card"
                onclick="openCategory('pulizia')"
            >

                <div class="category-icon">
                    🧹
                </div>

                <div class="category-name">
                    Prodotti pulizia
                </div>

            </button>


        </div>

    </main>


    <!-- =====================================================
         CATEGORY
    ====================================================== -->

    <main
        id="categoryScreen"
        class="screen"
    >

        <div class="category-container">


            <div class="category-header">

                <button
                    class="back-button"
                    onclick="goHome()"
                >
                    ←
                </button>


                <div class="category-title">

                    <h2 id="categoryTitle">
                        Cibo
                    </h2>

                    <p>
                        Gestisci i prodotti della categoria
                    </p>

                </div>

            </div>


            <div class="toolbar">


                <div class="search-box">

                    <span class="search-icon">
                        🔎
                    </span>


                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Cerca prodotto..."
                        autocomplete="off"
                    >

                </div>


                <button
                    class="scanner-button"
                    onclick="openScanner()"
                    title="Scansiona barcode"
                    aria-label="Scansiona barcode"
                >

                    <span class="camera-icon">

                        <span class="camera-lens"></span>

                    </span>

                </button>


            </div>


            <div class="filters">


                <button
                    id="filterAll"
                    class="filter-button active"
                    onclick="setFilter('all')"
                >
                    Tutti
                </button>


                <button
                    id="filterLow"
                    class="filter-button"
                    onclick="setFilter('low')"
                >
                    🔴 Scorte basse
                </button>


            </div>


            <div
                id="products"
                class="products"
            ></div>


            <button
                class="add-product-button"
                onclick="openProductModal()"
            >
                ＋ Aggiungi prodotto
            </button>


        </div>

    </main>


</div>


<!-- =====================================================
     PRODUCT MODAL
====================================================== -->

<div
    id="productModal"
    class="modal"
>


    <div class="modal-content">


        <div class="modal-header">

            <h3 id="productModalTitle">
                Aggiungi prodotto
            </h3>


            <button
                class="close-button"
                onclick="closeProductModal()"
            >
                ×
            </button>

        </div>


        <input
            type="hidden"
            id="productId"
        >


        <div class="form-group">

            <label for="productName">
                Nome prodotto
            </label>


            <input
                id="productName"
                type="text"
                placeholder="Es. Piselli"
                autocomplete="off"
            >

        </div>


        <div class="form-row">


            <div class="form-group">

                <label for="productBrand">
                    Marca
                </label>


                <input
                    id="productBrand"
                    type="text"
                    placeholder="Es. Findus"
                >

            </div>


            <div class="form-group">

                <label for="productFormat">
                    Formato
                </label>


                <input
                    id="productFormat"
                    type="text"
                    placeholder="Es. 450 g"
                >

            </div>


        </div>


        <div class="form-row">


            <div class="form-group">

                <label for="productQuantity">
                    Quantità
                </label>


                <input
                    id="productQuantity"
                    type="number"
                    min="0"
                    step="1"
                    value="1"
                >

            </div>


            <div class="form-group">

                <label for="productMinStock">
                    Scorta minima
                </label>


                <input
                    id="productMinStock"
                    type="number"
                    min="0"
                    step="1"
                    value="0"
                >

            </div>


        </div>


        <div class="form-group">

            <label for="productCategory">
                Categoria
            </label>


            <select id="productCategory">

                <option value="cibo">
                    Cibo
                </option>

                <option value="bagno">
                    Prodotti bagno
                </option>

                <option value="pulizia">
                    Prodotti pulizia
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="productBarcode">
                Barcode
            </label>


            <input
                id="productBarcode"
                type="text"
                placeholder="Codice a barre"
            >

        </div>


        <div class="form-group">

            <label for="productImage">
                URL immagine
            </label>


            <input
                id="productImage"
                type="url"
                placeholder="https://..."
            >

        </div>


        <div class="modal-actions">


            <button
                id="deleteProductButton"
                class="modal-action delete-action"
                onclick="deleteProduct()"
                style="display:none;"
            >
                Elimina
            </button>


            <button
                class="modal-action cancel-action"
                onclick="closeProductModal()"
            >
                Annulla
            </button>


            <button
                class="modal-action save-action"
                onclick="saveProduct()"
            >
                Salva
            </button>


        </div>


    </div>

</div>


<!-- =====================================================
     SCANNER MODAL
====================================================== -->

<div
    id="scannerModal"
    class="modal"
>


    <div
        class="modal-content scanner-content"
    >


        <div class="modal-header">


            <h3>
                Scansiona prodotto
            </h3>


            <button
                class="close-button"
                onclick="closeScanner()"
            >
                ×
            </button>


        </div>


        <div id="reader"></div>


        <p class="scanner-help">

            Inquadra il codice a barre del prodotto.
            La fotocamera verrà utilizzata per leggere
            automaticamente il codice.

        </p>


        <button
            class="modal-action cancel-action"
            onclick="closeScanner()"
            style="width:100%;"
        >
            Chiudi
        </button>


    </div>

</div>


<!-- =====================================================
     HTML5 QR CODE
====================================================== -->

<script src="https://unpkg.com/html5-qrcode"></script>


<script>


    /* =====================================================
       CONFIGURAZIONE
    ===================================================== */

    const STORAGE_KEY =
        "laMiaDispensaProdotti";


    const categories = {

        cibo: {

            name: "Cibo",

            icon: "🍎"

        },


        bagno: {

            name: "Prodotti bagno",

            icon: "🧴"

        },


        pulizia: {

            name: "Prodotti pulizia",

            icon: "🧹"

        }

    };


    let products = [];


    let currentCategory =
        "cibo";


    let currentFilter =
        "all";


    let editingProductId =
        null;


    let html5QrCode =
        null;


    /* =====================================================
       SICUREZZA HTML
    ===================================================== */

    function escapeHtml(value) {

        return String(value ?? "")

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =====================================================
       LOCAL STORAGE
    ===================================================== */

    function loadProducts() {

        try {

            const saved =
                localStorage.getItem(
                    STORAGE_KEY
                );


            if (saved) {

                products =
                    JSON.parse(saved);

            } else {

                products = [

                    {
                        id: crypto.randomUUID(),

                        name: "Piselli",

                        brand: "Esempio",

                        format: "450 g",

                        quantity: 8,

                        minStock: 5,

                        category: "cibo",

                        barcode: "",

                        image: ""
                    },


                    {
                        id: crypto.randomUUID(),

                        name: "Ceci",

                        brand: "Esempio",

                        format: "400 g",

                        quantity: 6,

                        minStock: 5,

                        category: "cibo",

                        barcode: "",

                        image: ""
                    },


                    {
                        id: crypto.randomUUID(),

                        name: "Fagioli",

                        brand: "Esempio",

                        format: "400 g",

                        quantity: 4,

                        minStock: 5,

                        category: "cibo",

                        barcode: "",

                        image: ""
                    },


                    {
                        id: crypto.randomUUID(),

                        name:
                            "Passata di pomodoro",

                        brand: "Esempio",

                        format: "700 ml",

                        quantity: 7,

                        minStock: 5,

                        category: "cibo",

                        barcode: "",

                        image: ""
                    },


                    {
                        id: crypto.randomUUID(),

                        name:
                            "Pezzettoni di pomodoro",

                        brand: "Esempio",

                        format: "400 g",

                        quantity: 3,

                        minStock: 5,

                        category: "cibo",

                        barcode: "",

                        image: ""
                    }

                ];


                saveProducts();

            }

        } catch (error) {

            console.error(
                "Errore caricamento prodotti:",
                error
            );


            products = [];

        }

    }


    function saveProducts() {

        localStorage.setItem(

            STORAGE_KEY,

            JSON.stringify(products)

        );

    }


    /* =====================================================
       NAVIGAZIONE
    ===================================================== */

    function openCategory(category) {

        if (!categories[category]) {

            return;

        }


        currentCategory =
            category;


        currentFilter =
            "all";


        document
            .getElementById("homeScreen")
            .classList.remove("active");


        document
            .getElementById("categoryScreen")
            .classList.add("active");


        document
            .getElementById("categoryTitle")
            .textContent =
                categories[category].name;


        document
            .getElementById("searchInput")
            .value = "";


        document
            .getElementById("filterAll")
            .classList.add("active");


        document
            .getElementById("filterLow")
            .classList.remove("active");


        document
            .getElementById("productCategory")
            .value =
                category;


        renderProducts();

    }


    function goHome() {

        document
            .getElementById("categoryScreen")
            .classList.remove("active");


        document
            .getElementById("homeScreen")
            .classList.add("active");

    }


    /* =====================================================
       FILTRI
    ===================================================== */

    function setFilter(filter) {

        currentFilter =
            filter;


        document
            .getElementById("filterAll")
            .classList.toggle(

                "active",

                filter === "all"

            );


        document
            .getElementById("filterLow")
            .classList.toggle(

                "active",

                filter === "low"

            );


        renderProducts();

    }


    /* =====================================================
       SCORTE BASSE
       USA ESCLUSIVAMENTE IL VALORE
       INSERITO DALL'UTENTE
    ===================================================== */

    function isLowStock(product) {

        const quantity =
            Number(
                product.quantity
            ) || 0;


        const minStock =
            Number(
                product.minStock
            ) || 0;


        return quantity < minStock;

    }


    /* =====================================================
       RENDER PRODOTTI
    ===================================================== */

    function renderProducts() {

        const container =
            document.getElementById(
                "products"
            );


        const search =
            document
                .getElementById(
                    "searchInput"
                )
                .value
                .trim()
                .toLowerCase();


        let filteredProducts =
            products.filter(
                product => {


                    if (
                        product.category !==
                        currentCategory
                    ) {

                        return false;

                    }


                    if (

                        search &&

                        !String(
                            product.name || ""
                        )
                            .toLowerCase()
                            .includes(search) &&

                        !String(
                            product.brand || ""
                        )
                            .toLowerCase()
                            .includes(search)

                    ) {

                        return false;

                    }


                    if (

                        currentFilter === "low" &&

                        !isLowStock(product)

                    ) {

                        return false;

                    }


                    return true;

                }
            );


        filteredProducts.sort(
            (a, b) =>

                String(
                    a.name || ""
                ).localeCompare(

                    String(
                        b.name || ""
                    ),

                    "it"

                )
        );


        if (
            filteredProducts.length === 0
        ) {

            container.innerHTML = `

                <div class="empty-products">

                    <div
                        class="empty-products-icon"
                    >
                        📦
                    </div>

                    <div>
                        Nessun prodotto trovato.
                    </div>

                </div>

            `;


            return;

        }


        container.innerHTML =

            filteredProducts
                .map(createProductCard)
                .join("");

    }


    /* =====================================================
       CARD PRODOTTO
    ===================================================== */

    function createProductCard(product) {

        const quantity =
            Number(
                product.quantity
            ) || 0;


        const minStock =
            Number(
                product.minStock
            ) || 0;


        /*
           Bordo rosso quando la quantità
           è inferiore alla scorta minima
        */

        const stockClass =

            quantity < minStock

                ? "low-stock-border"

                : "";


        const lowStock =

            quantity < minStock;


        const image =

            product.image

                ? escapeHtml(
                    product.image
                )

                : "";


        const imageHtml = image

            ? `

                <img
                    class="product-image"
                    src="${image}"
                    alt="${escapeHtml(
                        product.name
                    )}"
                    onerror="
                        this.style.display='none';
                    "
                >

              `

            : `

                <div
                    class="product-image"
                    style="
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        font-size:30px;
                    "
                >
                    ${
                        categories[
                            product.category
                        ]?.icon || "📦"
                    }
                </div>

              `;


        return `

            <div
                class="product-card ${stockClass}"
            >

                ${imageHtml}


                <div class="product-info">


                    ${
                        product.brand

                        ? `

                            <div
                                class="product-brand"
                            >
                                ${escapeHtml(
                                    product.brand
                                )}
                            </div>

                          `

                        : ""
                    }


                    <div
                        class="product-name"
                    >
                        ${escapeHtml(
                            product.name
                        )}
                    </div>


                    ${
                        product.format

                        ? `

                            <div
                                class="product-format"
                            >
                                ${escapeHtml(
                                    product.format
                                )}
                            </div>

                          `

                        : ""
                    }


                    ${
                        lowStock

                        ? `

                            <div
                                class="low-stock"
                            >
                                🔴 Scorta bassa
                            </div>

                          `

                        : ""
                    }


                </div>


                <div
                    class="quantity-control"
                >


                    <button
                        class="quantity-button"
                        onclick="
                            changeQuantity(
                                '${product.id}',
                                -1
                            )
                        "
                    >
                        −
                    </button>


                    <div
                        class="quantity-value"
                    >
                        ${quantity}
                    </div>


                    <button
                        class="quantity-button"
                        onclick="
                            changeQuantity(
                                '${product.id}',
                                1
                            )
                        "
                    >
                        +
                    </button>


                    <button
                        class="edit-button"
                        onclick="
                            editProduct(
                                '${product.id}'
                            )
                        "
                        title="Modifica prodotto"
                    >
                        ✏️
                    </button>


                </div>


            </div>

        `;

    }


    /* =====================================================
       QUANTITÀ
    ===================================================== */

    function changeQuantity(
        id,
        amount
    ) {

        const product =
            products.find(
                item =>
                    item.id === id
            );


        if (!product) {

            return;

        }


        let quantity =

            Number(
                product.quantity
            ) || 0;


        quantity += amount;


        if (quantity < 0) {

            quantity = 0;

        }


        product.quantity =
            quantity;


        saveProducts();

        renderProducts();

    }


    /* =====================================================
       MODAL PRODOTTO
    ===================================================== */

    function openProductModal(
        product = null
    ) {

        editingProductId =
            product
                ? product.id
                : null;


        document
            .getElementById(
                "productModal"
            )
            .classList.add(
                "active"
            );


        document
            .getElementById(
                "productModalTitle"
            )
            .textContent =

                product

                    ? "Modifica prodotto"

                    : "Aggiungi prodotto";


        document
            .getElementById(
                "deleteProductButton"
            )
            .style.display =

                product
                    ? "block"
                    : "none";


        document
            .getElementById(
                "productId"
            )
            .value =

                product?.id || "";


        document
            .getElementById(
                "productName"
            )
            .value =

                product?.name || "";


        document
            .getElementById(
                "productBrand"
            )
            .value =

                product?.brand || "";


        document
            .getElementById(
                "productFormat"
            )
            .value =

                product?.format || "";


        document
            .getElementById(
                "productQuantity"
            )
            .value =

                product?.quantity ?? 1;


        /*
           La scorta minima viene presa
           ESCLUSIVAMENTE dal valore
           salvato dall'utente.
        */

        document
            .getElementById(
                "productMinStock"
            )
            .value =

                product?.minStock ?? 0;


        document
            .getElementById(
                "productCategory"
            )
            .value =

                product?.category ||
                currentCategory;


        document
            .getElementById(
                "productBarcode"
            )
            .value =

                product?.barcode || "";


        document
            .getElementById(
                "productImage"
            )
            .value =

                product?.image || "";

    }


    function closeProductModal() {

        document
            .getElementById(
                "productModal"
            )
            .classList.remove(
                "active"
            );


        editingProductId =
            null;

    }


    /* =====================================================
       SALVATAGGIO PRODOTTO
    ===================================================== */

    function saveProduct() {

        const name =

            document
                .getElementById(
                    "productName"
                )
                .value
                .trim();


        if (!name) {

            alert(
                "Inserisci il nome del prodotto."
            );

            return;

        }


        const brand =

            document
                .getElementById(
                    "productBrand"
                )
                .value
                .trim();


        const format =

            document
                .getElementById(
                    "productFormat"
                )
                .value
                .trim();


        const quantity =

            Math.max(

                0,

                Number(
                    document
                        .getElementById(
                            "productQuantity"
                        )
                        .value
                ) || 0

            );


        /*
           IMPORTANTE:
           questo è il valore inserito
           MANUALMENTE dall'utente.
        */

        const minStock =

            Math.max(

                0,

                Number(
                    document
                        .getElementById(
                            "productMinStock"
                        )
                        .value
                ) || 0

            );


        const category =

            document
                .getElementById(
                    "productCategory"
                )
                .value;


        const barcode =

            document
                .getElementById(
                    "productBarcode"
                )
                .value
                .trim();


        const image =

            document
                .getElementById(
                    "productImage"
                )
                .value
                .trim();


        /* =================================================
           MODIFICA PRODOTTO
        ================================================= */

        if (editingProductId) {

            const product =

                products.find(

                    item =>

                        item.id ===
                        editingProductId

                );


            if (product) {

                product.name =
                    name;

                product.brand =
                    brand;

                product.format =
                    format;

                product.quantity =
                    quantity;

                product.minStock =
                    minStock;

                product.category =
                    category;

                product.barcode =
                    barcode;

                product.image =
                    image;

            }

        }


        /* =================================================
           NUOVO PRODOTTO
        ================================================= */

        else {

            products.push({

                id:
                    crypto.randomUUID(),

                name:
                    name,

                brand:
                    brand,

                format:
                    format,

                quantity:
                    quantity,

                minStock:
                    minStock,

                category:
                    category,

                barcode:
                    barcode,

                image:
                    image

            });

        }


        saveProducts();

        closeProductModal();

        renderProducts();

    }


    /* =====================================================
       MODIFICA PRODOTTO
    ===================================================== */

    function editProduct(id) {

        const product =

            products.find(

                item =>
                    item.id === id

            );


        if (!product) {

            return;

        }


        openProductModal(
            product
        );

    }


    /* =====================================================
       ELIMINA PRODOTTO
    ===================================================== */

    function deleteProduct() {

        if (!editingProductId) {

            return;

        }


        const product =

            products.find(

                item =>
                    item.id ===
                    editingProductId

            );


        if (!product) {

            return;

        }


        const confirmed =

            confirm(
                `Vuoi eliminare "${product.name}"?`
            );


        if (!confirmed) {

            return;

        }


        products =

            products.filter(

                item =>
                    item.id !==
                    editingProductId

            );


        saveProducts();

        closeProductModal();

        renderProducts();

    }


    /* =====================================================
       SCANNER
    ===================================================== */

    function openScanner() {

        document
            .getElementById(
                "scannerModal"
            )
            .classList.add(
                "active"
            );


        startScanner();

    }


    function closeScanner() {

        stopScanner();


        document
            .getElementById(
                "scannerModal"
            )
            .classList.remove(
                "active"
            );

    }


    async function startScanner() {

        try {

            if (html5QrCode) {

                return;

            }


            if (
                typeof Html5Qrcode ===
                "undefined"
            ) {

                alert(
                    "Il lettore barcode non è disponibile. Controlla la connessione Internet."
                );

                return;

            }


            html5QrCode =
                new Html5Qrcode(
                    "reader"
                );


            const formats = [];


            if (
                typeof Html5QrcodeSupportedFormats !==
                "undefined"
            ) {

                formats.push(
                    Html5QrcodeSupportedFormats
                        .EAN_13
                );


                formats.push(
                    Html5QrcodeSupportedFormats
                        .EAN_8
                );


                formats.push(
                    Html5QrcodeSupportedFormats
                        .UPC_A
                );


                formats.push(
                    Html5QrcodeSupportedFormats
                        .UPC_E
                );

            }


            const config = {

                fps: 10,

                qrbox: {

                    width: 280,

                    height: 160

                }

            };


            if (
                formats.length > 0
            ) {

                config.formatsToSupport =
                    formats;

            }


            await html5QrCode.start(

                {
                    facingMode:
                        "environment"
                },

                config,


                barcode => {

                    handleBarcode(
                        barcode
                    );

                },


                errorMessage => {

                    /*
                       Errori temporanei
                       ignorati.
                    */

                }

            );

        }

        catch (error) {

            console.error(
                "Errore scanner:",
                error
            );


            alert(
                "Non è possibile accedere alla fotocamera. Controlla i permessi del browser."
            );


            html5QrCode =
                null;

        }

    }


    async function stopScanner() {

        if (!html5QrCode) {

            return;

        }


        try {

            await html5QrCode.stop();

        }

        catch (error) {

            console.warn(
                "Errore arresto scanner:",
                error
            );

        }


        try {

            html5QrCode.clear();

        }

        catch (error) {

            /*
               Ignora eventuale
               errore di pulizia.
            */

        }


        html5QrCode =
            null;

    }


    /* =====================================================
       GESTIONE BARCODE
    ===================================================== */

    async function handleBarcode(
        barcode
    ) {

        if (!barcode) {

            return;

        }


        const cleanBarcode =

            String(
                barcode
            ).trim();


        if (!cleanBarcode) {

            return;

        }


        await stopScanner();


        document
            .getElementById(
                "scannerModal"
            )
            .classList.remove(
                "active"
            );


        /* =================================================
           PRODOTTO GIÀ PRESENTE
        ================================================= */

        const existingProduct =

            products.find(

                product =>

                    String(
                        product.barcode || ""
                    ) ===
                    cleanBarcode

            );


        if (existingProduct) {

            existingProduct.quantity =

                (
                    Number(
                        existingProduct.quantity
                    ) || 0
                ) + 1;


            saveProducts();

            renderProducts();


            alert(

                `${existingProduct.name} aggiunto. Quantità: ${existingProduct.quantity}`

            );


            return;

        }


        /* =================================================
           OPEN FOOD FACTS
        ================================================= */

        try {

            const response =

                await fetch(

                    `https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(cleanBarcode)}.json`

                );


            if (!response.ok) {

                throw new Error(
                    "Errore richiesta Open Food Facts"
                );

            }


            const data =
                await response.json();


            if (

                data.status === 1 &&

                data.product

            ) {

                const product =
                    data.product;


                const productName =

                    product.product_name ||

                    product.product_name_it ||

                    "";


                const brand =

                    product.brands ||
                    "";


                const format =

                    product.quantity ||
                    "";


                const image =

                    product.image_front_url ||

                    product.image_url ||

                    "";


                /*
                   Apriamo il modulo.

                   La scorta minima NON viene
                   impostata automaticamente.
                */

                openProductModal();


                document
                    .getElementById(
                        "productName"
                    )
                    .value =
                        productName;


                document
                    .getElementById(
                        "productBrand"
                    )
                    .value =
                        brand;


                document
                    .getElementById(
                        "productFormat"
                    )
                    .value =
                        format;


                /*
                   Quantità iniziale.
                */

                document
                    .getElementById(
                        "productQuantity"
                    )
                    .value = 1;


                /*
                   Scorta minima iniziale.

                   L'utente la inserirà
                   manualmente.
                */

                document
                    .getElementById(
                        "productMinStock"
                    )
                    .value = 0;


                document
                    .getElementById(
                        "productBarcode"
                    )
                    .value =
                        cleanBarcode;


                document
                    .getElementById(
                        "productImage"
                    )
                    .value =
                        image;


                document
                    .getElementById(
                        "productCategory"
                    )
                    .value =
                        currentCategory;


                return;

            }


            /* =================================================
               BARCODE NON TROVATO
            ================================================= */

            openProductModal();


            /*
               Anche in questo caso
               la scorta minima è manuale.
            */

            document
                .getElementById(
                    "productMinStock"
                )
                .value = 0;


            document
                .getElementById(
                    "productBarcode"
                )
                .value =
                    cleanBarcode;


            document
                .getElementById(
                    "productCategory"
                )
                .value =
                    currentCategory;


            alert(
                "Prodotto non trovato. Inserisci manualmente i dati."
            );

        }

        catch (error) {

            console.error(
                "Errore Open Food Facts:",
                error
            );


            openProductModal();


            /*
               Anche quando Open Food Facts
               non risponde, la scorta minima
               resta completamente manuale.
            */

            document
                .getElementById(
                    "productMinStock"
                )
                .value = 0;


            document
                .getElementById(
                    "productBarcode"
                )
                .value =
                    cleanBarcode;


            document
                .getElementById(
                    "productCategory"
                )
                .value =
                    currentCategory;


            alert(

                "Non è stato possibile recuperare automaticamente i dati del prodotto. Puoi inserirli manualmente."

            );

        }

    }


    /* =====================================================
       RICERCA
    ===================================================== */

    document
        .getElementById(
            "searchInput"
        )
        .addEventListener(

            "input",

            function () {

                renderProducts();

            }

        );


    /* =====================================================
       CHIUSURA MODAL CLICCANDO FUORI
    ===================================================== */

    document
        .getElementById(
            "productModal"
        )
        .addEventListener(

            "click",

            function (event) {

                if (
                    event.target === this
                ) {

                    closeProductModal();

                }

            }

        );


    document
        .getElementById(
            "scannerModal"
        )
        .addEventListener(

            "click",

            function (event) {

                if (
                    event.target === this
                ) {

                    closeScanner();

                }

            }

        );


    /* =====================================================
       AVVIO APP
    ===================================================== */

    loadProducts();

    renderProducts();


</script>
