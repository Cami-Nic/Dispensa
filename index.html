       /* =========================================================
   LA MIA DISPENSA

/* =========================================================
   RESET
   ========================================================= */

* {

}

html,

}

}

body {

        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    background: #f4f7f4;
    color: #20352a;

    overflow-x: hidden;

button,
input,
select,
textarea {

button {

/* =========================================================
   VARIABILI
   ========================================================= */

/* =========================================================

   ========================================================= */

/* =========================================================

    display: -ms-flexbox;
    display: flex;

    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;

    -webkit-box-pack: center;
    -ms-flex-pack: center;
    justify-content: center;

    font-size: 34px;

    -ms-flex-negative: 0;
    flex-shrink: 0;
}

.category-content {
    min-width: 0;
}

.category-name {
    margin: 0 0 4px;

    font-size: 19px;
    line-height: 1.2;
    font-weight: 750;

    color: var(--text);
}

.category-description {
    margin: 0;

    color: var(--text-light);

    font-size: 14px;
    line-height: 1.35;
}


/* =========================================================
   SCHERMATA CATEGORIA
   ========================================================= */

.category-screen {
    min-height: 100vh;
    padding: 16px 16px 30px;

    background: var(--background);
}

.category-container {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
}


/* =========================================================

   ========================================================= */

.category-header {

    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;

    -webkit-box-align: center;
    -ms-flex-align: center;

}

}

    transform: scale(0.96);
}

.category-heading {
    min-width: 0;
}

.category-title {
    margin: 0;

    color: var(--green-dark);

    font-size: 25px;
    line-height: 1.2;
    font-weight: 800;
}

.category-subtitle {
    margin: 3px 0 0;

    color: var(--text-light);

}


/* =========================================================
   TOOLBAR
   Ricerca compatta + fotocamera grande
   ========================================================= */

.toolbar {
    width: 100%;

    display: -ms-flexbox;
    display: flex;

}


/* =========================================================
   RICERCA
   ========================================================= */

.search-box {
    min-width: 0;

    -webkit-box-flex: 1;
    -ms-flex: 1;
    flex: 1;

    height: 50px;

    padding: 0 14px;

    border: 1px solid var(--border);

    display: flex;

}

}


/* =========================================================
   PULSANTE FOTOCAMERA
   ========================================================= */

.scanner-button {
    width: 72px;
    min-width: 72px;

    height: 72px;
    min-height: 72px;

    padding: 0;

    border-radius: 18px;

    background: var(--green);
    color: #ffffff;

    font-size: 34px;

    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;

    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;

    -webkit-box-pack: center;
    -ms-flex-pack: center;
    justify-content: center;

    -ms-flex-negative: 0;
    flex-shrink: 0;

        0 7px 18px rgba(47, 125, 74, 0.25);

    box-shadow:
        0 7px 18px rgba(47, 125, 74, 0.25);

    transition:
        transform 0.12s ease,
        background 0.12s ease;
}

.scanner-button:active {
    background: var(--green-dark);

    -webkit-transform: scale(0.96);
    transform: scale(0.96);
}


/* =========================================================
   FILTRI
   ========================================================= */

.filters {
    width: 100%;

    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;

    gap: 8px;

    margin-bottom: 14px;

    overflow-x: auto;
    -webkit-overflow-scrolling: touch;

    padding-bottom: 2px;
}

.filter-button {
    min-width: 92px;

    height: 42px;
    min-height: 42px;

    padding: 0 15px;

    border-radius: 12px;

    background: #ffffff;
    color: var(--text-light);

    border: 1px solid var(--border);

    font-size: 14px;
    font-weight: 700;

    white-space: nowrap;

    -ms-flex-negative: 0;
    flex-shrink: 0;
}

.filter-button.active {
    background: var(--green);

    border-color: var(--green);
}

.filter-button.low-stock.active {
    background: var(--red);

}


/* =========================================================
   PULSANTE AGGIUNGI
   ========================================================= */

.add-product-button {
    width: 100%;

    min-height: 52px;

    margin-bottom: 16px;

    border-radius: 15px;

    background: var(--green);
    color: #ffffff;

    font-size: 16px;
    font-weight: 750;

    -webkit-box-shadow:
        0 7px 18px rgba(47, 125, 74, 0.20);

    box-shadow:
        0 7px 18px rgba(47, 125, 74, 0.20);
}

.add-product-button:active {
    background: var(--green-dark);

    -webkit-transform: scale(0.99);
    transform: scale(0.99);
}


/* =========================================================
   LISTA PRODOTTI
   ========================================================= */

.products {
    width: 100%;
}

.products-list {
    width: 100%;
}

.empty-products {
    width: 100%;

    padding: 40px 20px;

    border-radius: var(--radius);

    background: #ffffff;

    border: 1px solid var(--border);

    text-align: center;

    color: var(--text-light);

    -webkit-box-shadow: var(--shadow-small);

}

}

    margin: 0 0 5px;

    color: var(--text);

    font-size: 18px;
    font-weight: 750;
}

.empty-products-text {
    margin: 0;

    font-size: 14px;
}


/* =========================================================
   CARD PRODOTTO
   ========================================================= */

.product-card {
    width: 100%;

    margin-bottom: 12px;

    padding: 14px;

    border-radius: 18px;

    background: #ffffff;

    border: 1px solid var(--border);

    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;

    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;

    gap: 13px;

    -webkit-box-shadow: var(--shadow-small);
    box-shadow: var(--shadow-small);

    position: relative;
}

.product-card.low-stock {
    border-color: #f0caca;
    background: #fffafa;
}


/* =========================================================
   IMMAGINE PRODOTTO
   ========================================================= */

.product-image {
    width: 70px;
    min-width: 70px;

    height: 70px;
    min-height: 70px;

    border-radius: 15px;

    background: #f0f4f1;

    overflow: hidden;

    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;

    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;

    -webkit-box-pack: center;
    -ms-flex-pack: center;
    justify-content: center;

    color: #91a097;

    font-size: 30px;
}

.product-image img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}


/* =========================================================
   INFO PRODOTTO
   ========================================================= */

.product-info {
    min-width: 0;

    -webkit-box-flex: 1;
    -ms-flex: 1;
    flex: 1;
}

.product-name {
    margin: 0 0 3px;

    color: var(--text);

    font-size: 17px;
    line-height: 1.25;

    font-weight: 800;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.product-brand {
    margin: 0 0 3px;

    color: var(--text-light);

    font-size: 13px;

    overflow: hidden;

}

.product-details {

}

.product-barcode {

    font-size: 11px;
}


/* =========================================================

   ========================================================= */

.product-quantity {
    min-width: 110px;

    display: -ms-flexbox;
    display: flex;

    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;

    -webkit-box-pack: center;
    -ms-flex-pack: center;
    justify-content: center;

    gap: 7px;
}

.quantity-button {
    width: 40px;
    min-width: 40px;

    height: 40px;
    min-height: 40px;

}

/* =========================================================
   PULSANTE MODIFICA
   ========================================================= */

.edit-product-button {
    width: 42px;
    min-width: 42px;

    height: 42px;
    min-height: 42px;

    border-radius: 12px;

    background: #f0f4f1;
    color: var(--green-dark);

    font-size: 19px;

    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;

    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;

    -webkit-box-pack: center;
    -ms-flex-pack: center;
    justify-content: center;

.edit-product-button:active {

/* =========================================================

    background: var(--red-light);
    color: var(--red);

    font-size: 11px;
    font-weight: 750;
}


/* =========================================================
   MODALI
   ========================================================= */

.modal {
    position: fixed;

    top: 0;
    left: 0;
    right: 0;
    bottom: 0;

    width: 100%;
    height: 100vh;

    display: none;

    background: rgba(18, 35, 25, 0.55);

    z-index: 1000;

    padding: 14px;

    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

.modal.active {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;

    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;

    -webkit-box-pack: center;
    -ms-flex-pack: center;
    justify-content: center;
}


/* =========================================================
   CONTENUTO MODALE
   ========================================================= */

.modal-content {
    width: 100%;
    max-width: 600px;

    max-height: calc(100vh - 28px);

    overflow-y: auto;
    -webkit-overflow-scrolling: touch;

    background: #ffffff;

    border-radius: 22px;

    padding: 20px;

    -webkit-box-shadow: var(--shadow-strong);
    box-shadow: var(--shadow-strong);
}

.modal-header {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;

    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;

    -webkit-box-pack: justify;
    -ms-flex-pack: justify;
    justify-content: space-between;

    margin-bottom: 18px;
}

/* =========================================================
   FORM
   ========================================================= */

.form-group {
    margin-bottom: 14px;
}

.form-label {
    display: block;

    margin-bottom: 6px;

    color: var(--text);

    font-size: 14px;
    font-weight: 700;
}

.form-input,
.form-select {
    width: 100%;

    height: 48px;
    min-height: 48px;

    padding: 0 13px;

    border: 1px solid var(--border);

    background: #ffffff;

    font-size: 16px;

    outline: 0;
}

.form-input:focus,

    gap: 10px;
}

    flex: 1;

    min-width: 0;
}


/* =========================================================
   AZIONI MODALE
   ========================================================= */

.modal-actions {

}

}

    background: #eef2ef;

}

}

.modal-button:active {
    -webkit-transform: scale(0.98);
    transform: scale(0.98);
}


/* =========================================================
   SCANNER
   ========================================================= */

.scanner-modal-content {
    max-width: 650px;

    padding: 16px;
}

.scanner-header {
    margin-bottom: 12px;
}

.scanner-description {
    margin: 0 0 12px;

    color: var(--text-light);

    font-size: 14px;

}

#reader {
    width: 100%;

    min-height: 240px;

    overflow: hidden;

    border-radius: 18px;

    background: #111111;
}

    width: 100% !important;
    height: auto !important;

    max-height: 55vh;

    object-fit: cover;
}

    max-width: 100%;
}


/* =========================================================

   ========================================================= */

}

    min-height: 50px;

    border-radius: 13px;

    background: #eef2ef;
    color: var(--text);

    font-size: 15px;
    font-weight: 750;
}


/* =========================================================
   TOAST
   ========================================================= */

.toast {
    position: fixed;

    left: 50%;

    bottom: 20px;

    z-index: 3000;

    width: calc(100% - 32px);
    max-width: 420px;

    padding: 13px 16px;

    border-radius: 13px;

    background: #20352a;
    color: #ffffff;

    text-align: center;

    font-size: 14px;
    line-height: 1.35;

    -webkit-box-shadow: var(--shadow-strong);
    box-shadow: var(--shadow-strong);

    opacity: 0;
    visibility: hidden;

    -webkit-transform: translate(-50%, 15px);
    transform: translate(-50%, 15px);

    -webkit-transition:
        opacity 0.18s ease,
        -webkit-transform 0.18s ease;

    transition:
        opacity 0.18s ease,
        transform 0.18s ease;
}

.toast.show {
    opacity: 1;
    visibility: visible;

    -webkit-transform: translate(-50%, 0);
    transform: translate(-50%, 0);
}


/* =========================================================
   TABLET / iPAD
   ========================================================= */

@media only screen and (min-width: 600px) {

    .home-screen {
        padding: 35px 25px 40px;
    }

    .home-header {
        margin-bottom: 35px;
    }

    .home-logo {

    <script>
        /* =========================================================
           LA MIA DISPENSA
           JAVASCRIPT COMPATIBILE CON IOS 12.5.8
           ========================================================= */

        (function () {

            "use strict";


            /* =====================================================
               CONFIGURAZIONE
               ===================================================== */

            var STORAGE_KEY = "laMiaDispensaProdotti";

            var products = [];

            var currentCategory = "cibo";

            var currentFilter = "all";

            var editingProductId = null;

            var html5QrCode = null;

            var scannerStarting = false;

            var scannerRunning = false;

            var scannerLocked = false;

            var toastTimer = null;


            var categoryData = {

                cibo: {
                    title: "Cibo",
                    subtitle: "Alimenti e bevande",
                    icon: "🍎"
                },

                bagno: {
                    title: "Prodotti bagno",
                    subtitle: "Igiene e cura personale",
                    icon: "🧴"
                },

                pulizia: {
                    title: "Prodotti pulizia",
                    subtitle: "Casa e pulizie",
                    icon: "🧹"
                }

            };


            /* =====================================================
               ELEMENTI DOM
               ===================================================== */

            var homeScreen =
                document.getElementById("homeScreen");

            var categoryScreen =
                document.getElementById("categoryScreen");

            var categoryTitle =
                document.getElementById("categoryTitle");

            var categorySubtitle =
                document.getElementById("categorySubtitle");

            var searchInput =
                document.getElementById("searchInput");

            var productsContainer =
                document.getElementById("products");

            var productModal =
                document.getElementById("productModal");

            var scannerModal =
                document.getElementById("scannerModal");

            var productForm =
                document.getElementById("productForm");

            var productModalTitle =
                document.getElementById("productModalTitle");

            var deleteProductButton =
                document.getElementById("deleteProductButton");

            var productName =
                document.getElementById("productName");

            var productBrand =
                document.getElementById("productBrand");

            var productFormat =
                document.getElementById("productFormat");

            var productQuantity =
                document.getElementById("productQuantity");

            var productMinStock =
                document.getElementById("productMinStock");

            var productCategory =
                document.getElementById("productCategory");

            var productBarcode =
                document.getElementById("productBarcode");

            var productImage =
                document.getElementById("productImage");


            /* =====================================================
               ID
               ===================================================== */

            function generateId() {

                return (
                    "p_" +
                    new Date().getTime() +
                    "_" +
                    Math.floor(Math.random() * 1000000)
                );
            }


            /* =====================================================
               ESCAPE HTML
               ===================================================== */

            function escapeHtml(value) {

                if (value === null || value === undefined) {
                    return "";
                }

                return String(value)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }


            /* =====================================================
               STORAGE
               ===================================================== */

            function saveProducts() {

                try {

                    localStorage.setItem(
                        STORAGE_KEY,
                        JSON.stringify(products)
                    );

                } catch (error) {

                    console.log(
                        "Errore salvataggio:",
                        error
                    );
                }
            }


            function loadProducts() {

                var saved;

                try {

                    saved =
                        localStorage.getItem(
                            STORAGE_KEY
                        );

                } catch (error) {

                    saved = null;
                }


                if (saved) {

                    try {

                        var parsed =
                            JSON.parse(saved);

                        if (
                            parsed &&
                            Object.prototype.toString.call(parsed) === "[object Array]"
                        ) {

                            products = parsed;

                            return;
                        }

                    } catch (error2) {

                        console.log(
                            "Dati locali non validi:",
                            error2
                        );
                    }
                }


                /*
                 * Prodotti iniziali di esempio.
                 * Vengono creati solo al primo avvio.
                 */

                products = [

                    {
                        id: generateId(),
                        name: "Pasta",
                        brand: "Barilla",
                        format: "500 g",
                        quantity: 3,
                        minStock: 2,
                        category: "cibo",
                        barcode: "",
                        image: ""
                    },

                    {
                        id: generateId(),
                        name: "Latte",
                        brand: "Parmalat",
                        format: "1 L",
                        quantity: 1,
                        minStock: 2,
                        category: "cibo",
                        barcode: "",
                        image: ""
                    },

                    {
                        id: generateId(),
                        name: "Shampoo",
                        brand: "Pantene",
                        format: "250 ml",
                        quantity: 2,
                        minStock: 1,
                        category: "bagno",
                        barcode: "",
                        image: ""
                    },

                    {
                        id: generateId(),
                        name: "Detersivo piatti",
                        brand: "Nelsen",
                        format: "900 ml",
                        quantity: 1,
                        minStock: 1,
                        category: "pulizia",
                        barcode: "",
                        image: ""
                    }

                ];

                saveProducts();
            }


            /* =====================================================
               LOW STOCK
               ===================================================== */

            function isLowStock(product) {

                var quantity =
                    Number(product.quantity);

                var minStock =
                    Number(product.minStock);

                if (isNaN(quantity)) {
                    quantity = 0;
                }

                if (isNaN(minStock)) {
                    minStock = 0;
                }

                /*
                 * IMPORTANTE:
                 * la scorta bassa dipende SOLO
                 * dalla scorta minima impostata.
                 */

                return quantity < minStock;
            }


            /* =====================================================
               NAVIGAZIONE
               ===================================================== */

            function openCategory(category) {

                if (!categoryData[category]) {
                    return;
                }

                stopScanner();

                currentCategory = category;

                currentFilter = "all";

                searchInput.value = "";

                categoryTitle.innerHTML =
                    categoryData[category].icon +
                    " " +
                    categoryData[category].title;

                categorySubtitle.innerHTML =
                    categoryData[category].subtitle;


                var filterButtons =
                    document.getElementsByClassName(
                        "filter-button"
                    );

                var i;

                for (i = 0; i < filterButtons.length; i++) {

                    filterButtons[i].className =
                        "filter-button";

                    if (
                        filterButtons[i].getAttribute(
                            "data-filter"
                        ) === "all"
                    ) {

                        filterButtons[i].className +=
                            " active";
                    }
                }


                homeScreen.className =
                    "screen";

                categoryScreen.className =
                    "screen active";


                renderProducts();


                try {
                    window.scrollTo(0, 0);
                } catch (e) {
                }
            }


            function goHome() {

                stopScanner();

                closeProductModal();

                closeScanner();

                categoryScreen.className =
                    "screen";

                homeScreen.className =
                    "screen active";


                try {
                    window.scrollTo(0, 0);
                } catch (e) {
                }
            }


            /* =====================================================
               FILTRI
               ===================================================== */

            function setFilter(filter) {

                currentFilter = filter;

                var buttons =
                    document.getElementsByClassName(
                        "filter-button"
                    );

                var i;

                for (i = 0; i < buttons.length; i++) {

                    buttons[i].className =
                        "filter-button";

                    if (
                        buttons[i].getAttribute(
                            "data-filter"
                        ) === filter
                    ) {

                        buttons[i].className +=
                            " active";
                    }
                }

                renderProducts();
            }


            /* =====================================================
               RENDER PRODOTTI
               ===================================================== */

            function renderProducts() {

                var search =
                    String(searchInput.value || "")
                        .toLowerCase()
                        .replace(/^\s+|\s+$/g, "");


                var filtered = [];

                var i;

                for (i = 0; i < products.length; i++) {

                    var product =
                        products[i];


                    if (
                        product.category !==
                        currentCategory
                    ) {
                        continue;
                    }


                    if (
                        currentFilter === "low" &&
                        !isLowStock(product)
                    ) {
                        continue;
                    }


                    var text =
                        (
                            String(product.name || "") +
                            " " +
                            String(product.brand || "") +
                            " " +
                            String(product.barcode || "")
                        ).toLowerCase();


                    if (
                        search &&
                        text.indexOf(search) === -1
                    ) {
                        continue;
                    }


                    filtered.push(product);
                }


                filtered.sort(function (a, b) {

                    return String(a.name || "")
                        .localeCompare(
                            String(b.name || ""),
                            "it"
                        );
                });


                if (filtered.length === 0) {

                    productsContainer.innerHTML =
                        '<div class="empty-products">' +
                            '<div class="empty-icon">📦</div>' +
                            '<h3>Nessun prodotto</h3>' +
                            '<p>' +
                                (
                                    currentFilter === "low"
                                    ? "Non ci sono prodotti con scorte basse."
                                    : "Non ci sono prodotti da mostrare."
                                ) +
                            '</p>' +
                        '</div>';

                    return;
                }


                var html = "";

                for (i = 0; i < filtered.length; i++) {

                    html += createProductCard(
                        filtered[i]
                    );
                }


                productsContainer.innerHTML = html;
            }


            /* =====================================================
               CARD
               ===================================================== */

            function createProductCard(product) {

                var lowStock =
                    isLowStock(product);


                var imageHtml;

                if (product.image) {

                    imageHtml =
                        '<img src="' +
                        escapeHtml(product.image) +
                        '" alt="">';

                } else {

                    imageHtml =
                        '<span>' +
                        categoryData[
                            product.category
                        ].icon +
                        '</span>';
                }


                var brand =
                    product.brand
                    ? escapeHtml(product.brand)
                    : "Marca non specificata";


                var format =
                    product.format
                    ? escapeHtml(product.format)
                    : "";


                var barcode =
                    product.barcode
                    ? escapeHtml(product.barcode)
                    : "";


                var meta = "";

                if (format) {
                    meta += format;
                }

                if (barcode) {

                    if (meta) {
                        meta += " · ";
                    }

                    meta +=
                        "EAN " +
                        barcode;
                }


                return (
                    '<article class="product-card' +
                    (lowStock ? ' low-stock' : '') +
                    '" data-product-id="' +
                    escapeHtml(product.id) +
                    '">' +

                        '<div class="product-image">' +
                            imageHtml +
                        '</div>' +

                        '<div class="product-info">' +

                            '<h3 class="product-name">' +
                                escapeHtml(product.name) +
                            '</h3>' +

                            '<p class="product-brand">' +
                                brand +
                            '</p>' +

                            '<p class="product-meta">' +
                                meta +
                            '</p>' +

                            (
                                lowStock
                                ?
                                '<span class="low-stock-label">' +
                                    'Scorta bassa' +
                                '</span>'
                                :
                                ''
                            ) +

                        '</div>' +

                        '<div class="quantity-controls">' +

                            '<button ' +
                                'type="button" ' +
                                'class="quantity-button js-minus" ' +
                                'aria-label="Diminuisci quantità">' +
                                '−' +
                            '</button>' +

                            '<span class="quantity-value">' +
                                escapeHtml(product.quantity) +
                            '</span>' +

                            '<button ' +
                                'type="button" ' +
                                'class="quantity-button js-plus" ' +
                                'aria-label="Aumenta quantità">' +
                                '+' +
                            '</button>' +

                            '<button ' +
                                'type="button" ' +
                                'class="edit-button js-edit" ' +
                                'aria-label="Modifica prodotto">' +
                                '✎' +
                            '</button>' +

                        '</div>' +

                    '</article>'
                );
            }


            /* =====================================================
               QUANTITÀ
               ===================================================== */

            function changeQuantity(id, amount) {

                var i;

                for (i = 0; i < products.length; i++) {

                    if (
                        String(products[i].id) ===
                        String(id)
                    ) {

                        var current =
                            Number(products[i].quantity);

                        if (isNaN(current)) {
                            current = 0;
                        }

                        current += amount;

                        if (current < 0) {
                            current = 0;
                        }

                        products[i].quantity =
                            current;

                        saveProducts();

                        renderProducts();

                        return;
                    }
                }
            }


            /* =====================================================
               MODALE PRODOTTO
               ===================================================== */

            function openProductModal(product) {

                if (product) {

                    editingProductId =
                        product.id;

                    productModalTitle.innerHTML =
                        "Modifica prodotto";

                    productName.value =
                        product.name || "";

                    productBrand.value =
                        product.brand || "";

                    productFormat.value =
                        product.format || "";

                    productQuantity.value =
                        product.quantity || 0;

                    productMinStock.value =
                        product.minStock || 0;

                    productCategory.value =
                        product.category || currentCategory;

                    productBarcode.value =
                        product.barcode || "";

                    productImage.value =
                        product.image || "";

                    deleteProductButton.style.display =
                        "block";

                } else {

                    editingProductId = null;

                    productModalTitle.innerHTML =
                        "Nuovo prodotto";

                    productName.value = "";

                    productBrand.value = "";

                    productFormat.value = "";

                    productQuantity.value = 1;

                    productMinStock.value = 1;

                    productCategory.value =
                        currentCategory;

                    productBarcode.value = "";

                    productImage.value = "";

                    deleteProductButton.style.display =
                        "none";
                }


                productModal.className =
                    "modal active";

                productModal.setAttribute(
                    "aria-hidden",
                    "false"
                );


                window.setTimeout(function () {

                    try {
                        productName.focus();
                    } catch (e) {
                    }

                }, 100);
            }


            function closeProductModal() {

                productModal.className =
                    "modal";

                productModal.setAttribute(
                    "aria-hidden",
                    "true"
                );

                editingProductId = null;
            }


            /* =====================================================
               SALVATAGGIO
               ===================================================== */

            function saveProductFromForm(event) {

                event.preventDefault();

                var name =
                    String(productName.value || "")
                        .replace(/^\s+|\s+$/g, "");


                if (!name) {

                    showToast(
                        "Inserisci il nome del prodotto.",
                        "error"
                    );

                    try {
                        productName.focus();
                    } catch (e) {
                    }

                    return;
                }


                var quantity =
                    parseInt(
                        productQuantity.value,
                        10
                    );

                var minStock =
                    parseInt(
                        productMinStock.value,
                        10
                    );


                if (isNaN(quantity) || quantity < 0) {
                    quantity = 0;
                }

                if (isNaN(minStock) || minStock < 0) {
                    minStock = 0;
                }


                if (editingProductId) {

                    var i;

                    for (i = 0; i < products.length; i++) {

                        if (
                            String(products[i].id) ===
                            String(editingProductId)
                        ) {

                            products[i].name =
                                name;

                            products[i].brand =
                                String(
                                    productBrand.value || ""
                                ).replace(
                                    /^\s+|\s+$/g,
                                    ""
                                );

                            products[i].format =
                                String(
                                    productFormat.value || ""
                                ).replace(
                                    /^\s+|\s+$/g,
                                    ""
                                );

                            products[i].quantity =
                                quantity;

                            products[i].minStock =
                                minStock;

                            products[i].category =
                                productCategory.value;

                            products[i].barcode =
                                String(
                                    productBarcode.value || ""
                                ).replace(
                                    /^\s+|\s+$/g,
                                    ""
                                );

                            products[i].image =
                                String(
                                    productImage.value || ""
                                ).replace(
                                    /^\s+|\s+$/g,
                                    ""
                                );

                            break;
                        }
                    }

                    showToast(
                        "Prodotto aggiornato.",
                        "success"
                    );

                } else {

                    products.push({

                        id: generateId(),

                        name: name,

                        brand:
                            String(
                                productBrand.value || ""
                            ).replace(
                                /^\s+|\s+$/g,
                                ""
                            ),

                        format:
                            String(
                                productFormat.value || ""
                            ).replace(
                                /^\s+|\s+$/g,
                                ""
                            ),

                        quantity: quantity,

                        minStock: minStock,

                        category:
                            productCategory.value,

                        barcode:
                            String(
                                productBarcode.value || ""
                            ).replace(
                                /^\s+|\s+$/g,
                                ""
                            ),

                        image:
                            String(
                                productImage.value || ""
                            ).replace(
                                /^\s+|\s+$/g,
                                ""
                            )
                    });


                    showToast(
                        "Prodotto aggiunto.",
                        "success"
                    );
                }


                saveProducts();

                closeProductModal();

                renderProducts();
            }


            /* =====================================================
               ELIMINA
               ===================================================== */

            function deleteCurrentProduct() {

                if (!editingProductId) {
                    return;
                }


                var confirmed =
                    window.confirm(
                        "Vuoi eliminare questo prodotto?"
                    );


                if (!confirmed) {
                    return;
                }


                var newProducts = [];

                var i;

                for (i = 0; i < products.length; i++) {

                    if (
                        String(products[i].id) !==
                        String(editingProductId)
                    ) {

                        newProducts.push(
                            products[i]
                        );
                    }
                }


                products = newProducts;

                saveProducts();

                closeProductModal();

                renderProducts();

                showToast(
                    "Prodotto eliminato.",
                    "success"
                );
            }


            /* =====================================================
               SCANNER
               ===================================================== */

            function openScanner() {

                if (
                    scannerStarting ||
                    scannerRunning
                ) {
                    return;
                }


                scannerLocked = false;

                scannerModal.className =
                    "modal active";

                scannerModal.setAttribute(
                    "aria-hidden",
                    "false"
                );


                window.setTimeout(function () {

                    startScanner();

                }, 300);
            }


            function startScanner() {

                if (
                    scannerStarting ||
                    scannerRunning
                ) {
                    return;
                }


                if (
                    typeof Html5Qrcode ===
                    "undefined"
                ) {

                    showToast(
                        "Scanner non disponibile.",
                        "error"
                    );

                    return;
                }


                scannerStarting = true;

                scannerLocked = false;


                try {

                    html5QrCode =
                        new Html5Qrcode(
                            "reader"
                        );


                    var config = {

                        fps: 8,

                        qrbox: {
                            width: 280,
                            height: 160
                        }

                    };


                    /*
                     * CAMERA ANTERIORE
                     *
                     * user = front camera
                     */

                    html5QrCode.start(

                        {
                            facingMode: "user"
                        },

                        config,

                        function (decodedText) {

                            if (
                                scannerLocked
                            ) {
                                return;
                            }

                            scannerLocked =
                                true;

                            handleBarcode(
                                decodedText
                            );
                        },

                        function () {
                            /*
                             * Nessun messaggio:
                             * gli errori durante la ricerca
                             * del codice sono normali.
                             */
                        }

                    ).then(function () {

                        scannerRunning =
                            true;

                        scannerStarting =
                            false;

                    }).catch(function (error) {

                        console.log(
                            "Errore camera:",
                            error
                        );

                        scannerStarting =
                            false;

                        scannerRunning =
                            false;

                        startScannerFallback();
                    });


                } catch (error2) {

                    console.log(
                        "Errore scanner:",
                        error2
                    );

                    scannerStarting =
                        false;

                    scannerRunning =
                        false;

                    showCameraError();
                }
            }


            /*
             * FALLBACK PER SAFARI IOS 12
             */

            function startScannerFallback() {

                if (
                    typeof Html5Qrcode ===
                    "undefined"
                ) {

                    showCameraError();

                    return;
                }


                if (
                    typeof Html5Qrcode.getCameras !==
                    "function"
                ) {

                    showCameraError();

                    return;
                }


                Html5Qrcode.getCameras()

                    .then(function (devices) {

                        if (
                            !devices ||
                            devices.length === 0
                        ) {

                            showCameraError();

                            return;
                        }


                        var selected =
                            null;

                        var i;


                        /*
                         * Cerchiamo esplicitamente
                         * la camera frontale.
                         */

                        for (
                            i = 0;
                            i < devices.length;
                            i++
                        ) {

                            var label =
                                String(
                                    devices[i].label ||
                                    ""
                                ).toLowerCase();


                            if (
                                label.indexOf(
                                    "front"
                                ) !== -1 ||

                                label.indexOf(
                                    "facetime"
                                ) !== -1 ||

                                label.indexOf(
                                    "user"
                                ) !== -1
                            ) {

                                selected =
                                    devices[i];

                                break;
                            }
                        }


                        /*
                         * Se Safari non comunica il nome,
                         * utilizziamo la prima camera disponibile.
                         */

                        if (!selected) {
                            selected = devices[0];
                        }


                        try {

                            if (html5QrCode) {
                                html5QrCode.clear();
                            }

                        } catch (clearError) {
                        }


                        html5QrCode =
                            new Html5Qrcode(
                                "reader"
                            );


                        var config = {

                            fps: 8,

                            qrbox: {
                                width: 280,
                                height: 160
                            }

                        };


                        html5QrCode.start(

                            selected.id,

                            config,

                            function (decodedText) {

                                if (
                                    scannerLocked
                                ) {
                                    return;
                                }

                                scannerLocked =
                                    true;

                                handleBarcode(
                                    decodedText
                                );
                            },

                            function () {
                            }

                        ).then(function () {

                            scannerRunning =
                                true;

                            scannerStarting =
                                false;

                        }).catch(function (error) {

                            console.log(
                                "Errore fallback:",
                                error
                            );

                            scannerRunning =
                                false;

                            scannerStarting =
                                false;

                            showCameraError();
                        });

                    })

                    .catch(function (error) {

                        console.log(
                            "Errore camere:",
                            error
                        );

                        showCameraError();
                    });
            }


            function stopScanner() {

                scannerLocked = true;


                if (!html5QrCode) {

                    scannerRunning =
                        false;

                    scannerStarting =
                        false;

                    return;
                }


                try {

                    html5QrCode.stop()

                        .then(function () {

                            try {
                                html5QrCode.clear();
                            } catch (e) {
                            }

                            html5QrCode =
                                null;

                            scannerRunning =
                                false;

                            scannerStarting =
                                false;
                        })

                        .catch(function () {

                            try {
                                html5QrCode.clear();
                            } catch (e2) {
                            }

                            html5QrCode =
                                null;

                            scannerRunning =
                                false;

                            scannerStarting =
                                false;
                        });

                } catch (error) {

                    html5QrCode =
                        null;

                    scannerRunning =
                        false;

                    scannerStarting =
                        false;
                }
            }


            function closeScanner() {

                stopScanner();

                scannerModal.className =
                    "modal";

                scannerModal.setAttribute(
                    "aria-hidden",
                    "true"
                );
            }


            /* =====================================================
               BARCODE
               ===================================================== */

            function handleBarcode(barcode) {

                barcode =
                    String(barcode || "")
                        .replace(
                            /^\s+|\s+$/g,
                            ""
                        );


                if (!barcode) {

                    scannerLocked =
                        false;

                    return;
                }


                /*
                 * Fermiamo subito la fotocamera
                 * per evitare doppie scansioni.
                 */

                stopScanner();

                scannerModal.className =
                    "modal";

                scannerModal.setAttribute(
                    "aria-hidden",
                    "true"
                );


                /*
                 * Controlliamo se il prodotto esiste già.
                 */

                var i;

                for (i = 0; i < products.length; i++) {

                    if (
                        String(
                            products[i].barcode || ""
                        ) === barcode
                    ) {

                        var quantity =
                            Number(
                                products[i].quantity
                            );

                        if (isNaN(quantity)) {
                            quantity = 0;
                        }

                        products[i].quantity =
                            quantity + 1;

                        saveProducts();

                        /*
                         * Torniamo automaticamente
                         * alla categoria corretta.
                         */

                        currentCategory =
                            products[i].category;

                        categoryTitle.innerHTML =
                            categoryData[
                                currentCategory
                            ].icon +
                            " " +
                            categoryData[
                                currentCategory
                            ].title;

                        categorySubtitle.innerHTML =
                            categoryData[
                                currentCategory
                            ].subtitle;


                        homeScreen.className =
                            "screen";

                        categoryScreen.className =
                            "screen active";


                        renderProducts();


                        showToast(
                            "Prodotto trovato: quantità aumentata.",
                            "success"
                        );

                        return;
                    }
                }


                /*
                 * Non esiste:
                 * proviamo Open Food Facts.
                 */

                showToast(
                    "Ricerca del prodotto...",
                    "success"
                );


                lookupOpenFoodFacts(
                    barcode
                );
            }


            /* =====================================================
               OPEN FOOD FACTS
               ===================================================== */

            function lookupOpenFoodFacts(barcode) {

                var url =
                    "https://world.openfoodfacts.org/api/v0/product/" +
                    encodeURIComponent(barcode) +
                    ".json";


                /*
                 * fetch è supportato da Safari iOS 12.
                 */

                if (
                    typeof window.fetch !==
                    "function"
                ) {

                    openManualBarcodeProduct(
                        barcode
                    );

                    return;
                }


                fetch(url)

                    .then(function (response) {

                        if (!response.ok) {
                            throw new Error(
                                "HTTP " +
                                response.status
                            );
                        }

                        return response.json();
                    })

                    .then(function (data) {

                        if (
                            data &&
                            data.status === 1 &&
                            data.product
                        ) {

                            var p =
                                data.product;


                            var productNameFromApi =
                                p.product_name ||
                                p.product_name_it ||
                                "";


                            var brand =
                                p.brands ||
                                "";


                            var quantity =
                                p.quantity ||
                                "";


                            var image =
                                p.image_front_url ||
                                p.image_url ||
                                "";


                            openProductModal({

                                id: null,

                                name:
                                    productNameFromApi,

                                brand:
                                    brand,

                                format:
                                    quantity,

                                quantity: 1,

                                minStock: 1,

                                category:
                                    currentCategory,

                                barcode:
                                    barcode,

                                image:
                                    image

                            });


                            /*
                             * Il prodotto ricevuto è un nuovo
                             * prodotto, quindi l'ID deve restare
                             * nullo per far scattare l'inserimento.
                             */

                            editingProductId =
                                null;

                            deleteProductButton.style.display =
                                "none";


                        } else {

                            openManualBarcodeProduct(
                                barcode
                            );
                        }

                    })

                    .catch(function (error) {

                        console.log(
                            "Open Food Facts:",
                            error
                        );

                        openManualBarcodeProduct(
                            barcode
                        );
                    });
            }


            function openManualBarcodeProduct(
                barcode
            ) {

                openProductModal(null);

                productBarcode.value =
                    barcode;
            }


            /* =====================================================
               CAMERA ERROR
               ===================================================== */

            function showCameraError() {

                showToast(
                    "Impossibile accedere alla fotocamera. Controlla i permessi di Safari.",
                    "error"
                );
            }


            /* =====================================================
               TOAST
               ===================================================== */

            function showToast(
                message,
                type
            ) {

                var toast =
                    document.getElementById(
                        "toast"
                    );


                if (!toast) {
                    return;
                }


                if (toastTimer) {

                    window.clearTimeout(
                        toastTimer
                    );
                }


                toast.className =
                    "toast";


                if (type) {

                    toast.className +=
                        " " +
                        type;
                }


                toast.innerHTML =
                    escapeHtml(message);


                /*
                 * Piccolo timeout per permettere
                 * a Safari di applicare la classe.
                 */

                window.setTimeout(
                    function () {

                        toast.className +=
                            " show";

                    },
                    20
                );


                toastTimer =
                    window.setTimeout(
                        function () {

                            toast.className =
                                "toast";

                        },
                        3000
                    );
            }


            /* =====================================================
               EVENTI
               ===================================================== */

            function setupEvents() {

                /*
                 * CATEGORIE HOME
                 */

                var categoryButtons =
                    document.getElementsByClassName(
                        "category-card"
                    );


                var i;


                for (
                    i = 0;
                    i < categoryButtons.length;
                    i++
                ) {

                    categoryButtons[i]
                        .addEventListener(
                            "click",
                            function (event) {

                                event.preventDefault();

                                var category =
                                    this.getAttribute(
                                        "data-category"
                                    );

                                openCategory(
                                    category
                                );
                            },
                            false
                        );
                }


                /*
                 * INDIETRO
                 */

                document
                    .getElementById(
                        "backButton"
                    )
                    .addEventListener(
                        "click",
                        function (event) {

                            event.preventDefault();

                            goHome();
                        },
                        false
                    );


                /*
                 * AGGIUNGI
                 */

                document
                    .getElementById(
                        "addProductButton"
                    )
                    .addEventListener(
                        "click",
                        function (event) {

                            event.preventDefault();

                            openProductModal(
                                null
                            );
                        },
                        false
                    );


                /*
                 * SCANNER
                 */

                document
                    .getElementById(
                        "scannerButton"
                    )
                    .addEventListener(
                        "click",
                        function (event) {

                            event.preventDefault();

                            openScanner();
                        },
                        false
                    );


                /*
                 * CHIUDI MODALE PRODOTTO
                 */

                document
                    .getElementById(
                        "closeProductButton"
                    )
                    .addEventListener(
                        "click",
                        function (event) {

                            event.preventDefault();

                            closeProductModal();
                        },
                        false
                    );


                document
                    .getElementById(
                        "cancelProductButton"
                    )
                    .addEventListener(
                        "click",
                        function (event) {

                            event.preventDefault();

                            closeProductModal();
                        },
                        false
                    );


                /*
                 * ELIMINA
                 */

                deleteProductButton
                    .addEventListener(
                        "click",
                        function (event) {

                            event.preventDefault();

                            deleteCurrentProduct();
                        },
                        false
                    );


                /*
                 * FORM
                 */

                productForm
                    .addEventListener(
                        "submit",
                        saveProductFromForm,
                        false
                    );


                /*
                 * RICERCA
                 */

                searchInput
                    .addEventListener(
                        "input",
                        function () {

                            renderProducts();
                        },
                        false
                    );


                /*
                 * FILTRI
                 */

                var filterButtons =
                    document.getElementsByClassName(
                        "filter-button"
                    );


                for (
                    i = 0;
                    i < filterButtons.length;
                    i++
                ) {

                    filterButtons[i]
                        .addEventListener(
                            "click",
                            function (event) {

                                event.preventDefault();

                                setFilter(
                                    this.getAttribute(
                                        "data-filter"
                                    )
                                );
                            },
                            false
                        );
                }


                /*
                 * SCANNER CHIUSURA
                 */

                document
                    .getElementById(
                        "closeScannerButton"
                    )
                    .addEventListener(
                        "click",
                        function (event) {

                            event.preventDefault();

                            closeScanner();
                        },
                        false
                    );


                document
                    .getElementById(
                        "manualScannerClose"
                    )
                    .addEventListener(
                        "click",
                        function (event) {

                            event.preventDefault();

                            closeScanner();
                        },
                        false
                    );


                /*
                 * EVENT DELEGATION DEI PRODOTTI
                 *
                 * Questo è particolarmente utile su iOS:
                 * abbiamo un solo listener sul contenitore.
                 */

                productsContainer
                    .addEventListener(
                        "click",
                        function (event) {

                            var target =
                                event.target;

                            /*
                             * Risaliamo fino al pulsante.
                             */

                            while (
                                target &&
                                target !==
                                productsContainer &&
                                target.tagName !==
                                "BUTTON"
                            ) {

                                target =
                                    target.parentNode;
                            }


                            if (
                                !target ||
                                target ===
                                productsContainer
                            ) {
                                return;
                            }


                            var card =
                                target.parentNode;


                            while (
                                card &&
                                card !==
                                productsContainer &&
                                (
                                    !card.getAttribute ||
                                    !card.getAttribute(
                                        "data-product-id"
                                    )
                                )
                            ) {

                                card =
                                    card.parentNode;
                            }


                            if (
                                !card ||
                                card ===
                                productsContainer
                            ) {
                                return;
                            }


                            var id =
                                card.getAttribute(
                                    "data-product-id"
                                );


                            if (
                                target.className.indexOf(
                                    "js-minus"
                                ) !== -1
                            ) {

                                event.preventDefault();

                                changeQuantity(
                                    id,
                                    -1
                                );

                                return;
                            }


                            if (
                                target.className.indexOf(
                                    "js-plus"
                                ) !== -1
                            ) {

                                event.preventDefault();

                                changeQuantity(
                                    id,
                                    1
                                );

                                return;
                            }


                            if (
                                target.className.indexOf(
                                    "js-edit"
                                ) !== -1
                            ) {

                                event.preventDefault();

                                var product =
                                    findProductById(
                                        id
                                    );

                                if (product) {
                                    openProductModal(
                                        product
                                    );
                                }

                                return;
                            }

                        },
                        false
                    );


                /*
                 * CLICK SULLO SFONDO DEL MODALE
                 */

                productModal
                    .addEventListener(
                        "click",
                        function (event) {

                            if (
                                event.target ===
                                productModal
                            ) {

                                closeProductModal();
                            }
                        },
                        false
                    );


                scannerModal
                    .addEventListener(
                        "click",
                        function (event) {

                            if (
                                event.target ===
                                scannerModal
                            ) {

                                closeScanner();
                            }
                        },
                        false
                    );


                /*
                 * ESC DA TASTIERA
                 */

                document.addEventListener(
                    "keydown",
                    function (event) {

                        if (
                            event.keyCode === 27
                        ) {

                            closeProductModal();

                            closeScanner();
                        }
                    },
                    false
                );


                /*
                 * PAGE HIDE
                 *
                 * Utile quando Safari cambia scheda
                 * o mette la pagina in background.
                 */

                document.addEventListener(
                    "visibilitychange",
                    function () {

                        if (
                            document.hidden
                        ) {

                            stopScanner();
                        }
                    },
                    false
                );


                /*
                 * Quando Safari cambia pagina.
                 */

                window.addEventListener(
                    "pagehide",
                    function () {

                        stopScanner();
                    },
                    false
                );
            }


            /* =====================================================
               TROVA PRODOTTO
               ===================================================== */

            function findProductById(id) {

                var i;

                for (
                    i = 0;
                    i < products.length;
                    i++
                ) {

                    if (
                        String(products[i].id) ===
                        String(id)
                    ) {

                        return products[i];
                    }
                }

                return null;
            }


            /* =====================================================
               AVVIO
               ===================================================== */

            loadProducts();

            setupEvents();

            renderProducts();


        })();
    </script>

</body>
</html>
