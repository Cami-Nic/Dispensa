<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f6f7f5">

    <title>La Mia Dispensa</title>

    <script src="https://unpkg.com/html5-qrcode" defer></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
            background: #f6f7f5;
            color: #222;
        }

        body {
            min-height: 100vh;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =====================================================
           BARRA COLORATA SUPERIORE
        ===================================================== */

        .top-color-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;

            height: 6px;

            background:
                linear-gradient(
                    90deg,
                    #7bbf6a,
                    #a8d96d,
                    #6fb7a8
                );

            z-index: 200;
        }

        /* =====================================================
           APP
        ===================================================== */

        .app {
            width: 100%;
            max-width: 760px;
            min-height: 100vh;

            margin: 0 auto;

            padding:
                max(24px, calc(env(safe-area-inset-top) + 12px))
                18px
                max(28px, env(safe-area-inset-bottom));
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* =====================================================
           HOME
        ===================================================== */

        .home-screen {
            padding-top: 18px;
        }

        .home-title {
            margin-bottom: 22px;
        }

        .home-heading {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /*
         * ICONA CARRELLO
         *
         * Nessun riquadro bianco.
         * Nessuno sfondo.
         * Nessuna ombra.
         */

        .home-cart-icon {
            width: 52px;
            height: 52px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #333;
        }

        .home-cart-icon svg {
            width: 42px;
            height: 42px;

            display: block;
        }

        .home-title h2 {
            margin: 0 0 4px;

            font-size: 30px;
            line-height: 1.1;

            letter-spacing: -0.5px;
        }

        .home-title p {
            margin: 0;

            color: #777;

            font-size: 16px;
        }

        /* =====================================================
           CATEGORIE
        ===================================================== */

        .category-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .category-card {
            width: 100%;
            min-height: 125px;

            border: 0;
            border-radius: 24px;

            background: #fff;

            display: flex;
            align-items: center;

            gap: 18px;

            padding: 22px;

            text-align: left;

            box-shadow:
                0 6px 22px rgba(0, 0, 0, 0.06);

            color: #222;

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .category-card:active {
            transform: scale(0.98);

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.07);
        }

        .category-icon {
            width: 66px;
            height: 66px;

            flex-shrink: 0;

            border-radius: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 34px;

            background: #f3f4f2;
        }

        .category-card h3 {
            margin: 0;

            font-size: 22px;
            font-weight: 700;
        }

        /* =====================================================
           SCHERMATA CATEGORIA
        ===================================================== */

        .category-screen {
            padding-top: 4px;
        }

        .category-top {
            display: flex;
            align-items: center;

            gap: 12px;

            margin-bottom: 18px;
        }

        .back-button {
            width: 46px;
            height: 46px;

            border: 0;
            border-radius: 15px;

            background: #fff;
            color: #222;

            font-size: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .category-heading {
            min-width: 0;
        }

        .category-heading h2 {
            margin: 0;

            font-size: 27px;
            line-height: 1.1;
        }

        .category-heading p {
            margin: 4px 0 0;

            color: #777;

            font-size: 14px;
        }

        /* =====================================================
           RICERCA + SCANNER
        ===================================================== */

        .tools-row {
            display: grid;

            grid-template-columns: 1fr 54px;

            gap: 10px;

            margin-bottom: 12px;
        }

        .search-box {
            height: 54px;

            background: #fff;

            border-radius: 17px;

            display: flex;
            align-items: center;

            padding: 0 15px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .search-box span {
            font-size: 20px;
            margin-right: 9px;
        }

        .search-box input {
            width: 100%;

            border: 0;
            outline: none;

            background: transparent;

            font-size: 16px;
            color: #222;
        }

        .scan-button {
            height: 54px;

            border: 0;
            border-radius: 17px;

            background: #222;
            color: #fff;

            font-size: 24px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.10);
        }

        /* =====================================================
           FILTRI
        ===================================================== */

        .filter-row {
            display: flex;

            gap: 8px;

            margin-bottom: 16px;
        }

        .filter-button {
            border: 0;
            border-radius: 14px;

            padding: 10px 14px;

            background: #e8eae7;
            color: #555;

            font-size: 14px;
            font-weight: 600;
        }

        .filter-button.active {
            background: #222;
            color: #fff;
        }

        /* =====================================================
           PRODOTTI
        ===================================================== */

        .products-list {
            display: flex;
            flex-direction: column;

            gap: 11px;
        }

        .product-card {
            background: #fff;

            border-radius: 19px;

            padding: 13px;

            display: grid;

            grid-template-columns:
                62px
                1fr
                auto;

            gap: 12px;

            align-items: center;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .product-image {
            width: 62px;
            height: 62px;

            border-radius: 15px;

            background: #f1f2f0;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 26px;
        }

        .product-image img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .product-info {
            min-width: 0;

            cursor: pointer;
        }

        .product-name {
            font-weight: 700;

            font-size: 16px;

            margin-bottom: 3px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .product-meta {
            color: #777;

            font-size: 13px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .low-stock {
            margin-top: 5px;

            color: #d34b4b;

            font-size: 12px;

            font-weight: 700;
        }

        /* =====================================================
           QUANTITÀ
        ===================================================== */

        .quantity-control {
            display: flex;
            align-items: center;

            gap: 5px;
        }

        .quantity-control button {
            width: 34px;
            height: 34px;

            border: 0;
            border-radius: 11px;

            background: #f0f1ef;

            color: #222;

            font-size: 20px;

            line-height: 1;
        }

        .quantity-value {
            min-width: 28px;

            text-align: center;

            font-weight: 700;

            font-size: 16px;
        }

        /* =====================================================
           NESSUN PRODOTTO
        ===================================================== */

        .empty-state {
            text-align: center;

            padding: 45px 20px;

            color: #777;
        }

        .empty-state .empty-icon {
            font-size: 42px;

            margin-bottom: 10px;
        }

        .empty-state h3 {
            margin: 0 0 6px;

            color: #333;
        }

        .empty-state p {
            margin: 0;

            font-size: 14px;
        }

        /* =====================================================
           AGGIUNGI PRODOTTO
        ===================================================== */

        .add-button {
            width: 100%;

            min-height: 56px;

            margin-top: 18px;

            border: 0;

            border-radius: 18px;

            background: #222;
            color: #fff;

            font-weight: 700;

            font-size: 16px;

            box-shadow:
                0 5px 18px rgba(0, 0, 0, 0.10);
        }

        /* =====================================================
           MODALE
        ===================================================== */

        .modal-overlay {
            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.38);

            display: none;

            align-items: flex-end;
            justify-content: center;

            z-index: 100;

            padding: 0;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 760px;

            max-height: 92vh;

            overflow-y: auto;

            background: #f6f7f5;

            border-radius: 26px 26px 0 0;

            padding:
                18px
                18px
                max(25px, env(safe-area-inset-bottom));

            animation: slideUp 0.2s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0.5;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-handle {
            width: 42px;
            height: 5px;

            border-radius: 99px;

            background: #d0d2cf;

            margin:
                0 auto 18px;
        }

        .modal-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 15px;

            margin-bottom: 18px;
        }

        .modal-header h3 {
            margin: 0;

            font-size: 23px;
        }

        .close-button {
            width: 42px;
            height: 42px;

            border: 0;

            border-radius: 14px;

            background: #fff;

            font-size: 22px;
        }

        /* =====================================================
           FORM
        ===================================================== */

        .form-grid {
            display: grid;

            gap: 13px;
        }

        .form-field label {
            display: block;

            margin:
                0 0 6px 3px;

            color: #555;

            font-size: 13px;

            font-weight: 600;
        }

        .form-field input,
        .form-field select {
            width: 100%;

            height: 50px;

            border: 1px solid #e1e3df;

            border-radius: 15px;

            padding: 0 14px;

            background: #fff;

            outline: none;

            color: #222;
        }

        .form-field input:focus,
        .form-field select:focus {
            border-color: #999;
        }

        .form-two {
            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap: 10px;
        }

        .save-button {
            width: 100%;

            height: 54px;

            margin-top: 6px;

            border: 0;

            border-radius: 17px;

            background: #222;
            color: #fff;

            font-weight: 700;

            font-size: 16px;
        }

        /* =====================================================
           SCANNER
        ===================================================== */

        .scanner-modal {
            align-items: center;

            padding: 18px;
        }

        .scanner-modal .modal {
            border-radius: 26px;

            max-height: 90vh;
        }

        #reader {
            width: 100%;

            overflow: hidden;

            border-radius: 18px;

            background: #111;

            min-height: 260px;
        }

        .scanner-help {
            margin: 12px 0 0;

            text-align: center;

            color: #777;

            font-size: 13px;
        }

        .scanner-actions {
            margin-top: 15px;
        }

        .secondary-button {
            width: 100%;

            height: 50px;

            border: 0;

            border-radius: 15px;

            background: #e8eae7;

            color: #333;

            font-weight: 600;
        }

        /* =====================================================
           TABLET / IPAD
        ===================================================== */

        @media (min-width: 600px) {

            .app {
                padding-left: 24px;
                padding-right: 24px;
            }

            .modal {
                border-radius: 26px;

                margin-bottom: 20px;
            }

            .modal-overlay {
                align-items: center;

                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Barra colorata superiore -->
    <div class="top-color-bar"></div>


    <div class="app">

        <!-- =================================================
             HOME
        ================================================= -->

        <section
            id="homeScreen"
            class="screen active home-screen"
        >

            <div class="home-title">

                <div class="home-heading">

                    <!-- CARRELLO MINIMAL -->
                    <div
                        class="home-cart-icon"
                        aria-hidden="true"
                    >

                        <svg
                            viewBox="0 0 64 64"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                        >

                            <!-- Manico e struttura -->
                            <path
                                d="M9 13H15L21 42H50L56 22H18"
                                stroke="currentColor"
                                stroke-width="4"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />

                            <!-- Parte inferiore -->
                            <path
                                d="M21 42C19 42 17 44 17 46C17 48 19 50 21 50H49"
                                stroke="currentColor"
                                stroke-width="4"
                                stroke-linecap="round"
                            />

                            <!-- Ruote -->
                            <circle
                                cx="25"
                                cy="55"
                                r="3.5"
                                fill="currentColor"
                            />

                            <circle
                                cx="46"
                                cy="55"
                                r="3.5"
                                fill="currentColor"
                            />

                            <!-- Primo prodotto -->
                            <path
                                d="M27 20V13C27 11.3 28.3 10 30 10H34C35.7 10 37 11.3 37 13V20"
                                stroke="currentColor"
                                stroke-width="3.5"
                                stroke-linecap="round"
                            />

                            <!-- Secondo prodotto -->
                            <path
                                d="M39 20V15C39 13.3 40.3 12 42 12H45C46.7 12 48 13.3 48 15V20"
                                stroke="currentColor"
                                stroke-width="3.5"
                                stroke-linecap="round"
                            />

                        </svg>

                    </div>


                    <div>

                        <h2>
                            La tua dispensa
                        </h2>

                        <p>
                            Scegli una categoria
                        </p>

                    </div>

                </div>

            </div>


            <!-- CATEGORIE -->

            <div class="category-grid">

                <button
                    class="category-card"
                    onclick="openCategory('cibo')"
                >

                    <div class="category-icon">
                        🍎
                    </div>

                    <div>
                        <h3>
                            Cibo
                        </h3>
                    </div>

                </button>


                <button
                    class="category-card"
                    onclick="openCategory('bagno')"
                >

                    <div class="category-icon">
                        🧴
                    </div>

                    <div>
                        <h3>
                            Prodotti bagno
                        </h3>
                    </div>

                </button>


                <button
                    class="category-card"
                    onclick="openCategory('pulizia')"
                >

                    <div class="category-icon">
                        🧹
                    </div>

                    <div>
                        <h3>
                            Prodotti pulizia
                        </h3>
                    </div>

                </button>

            </div>

        </section>


        <!-- =================================================
             CATEGORIA
        ================================================= -->

        <section
            id="categoryScreen"
            class="screen category-screen"
        >

            <div class="category-top">

                <button
                    class="back-button"
                    onclick="goHome()"
                    aria-label="Torna indietro"
                >
                    ‹
                </button>


                <div class="category-heading">

                    <h2 id="categoryTitle">
                        Cibo
                    </h2>

                    <p>
                        Gestisci i tuoi prodotti
                    </p>

                </div>

            </div>


            <!-- RICERCA + SCANNER -->

            <div class="tools-row">

                <div class="search-box">

                    <span>
                        ⌕
                    </span>

                    <input
                        id="searchInput"
                        type="search"
                        placeholder="Cerca prodotto..."
                        oninput="renderProducts()"
                    >

                </div>


                <button
                    class="scan-button"
                    onclick="openScanner()"
                    aria-label="Scansiona barcode"
                >
                    ▦
                </button>

            </div>


            <!-- FILTRI -->

            <div class="filter-row">

                <button
                    id="filterAll"
                    class="filter-button active"
                    onclick="setFilter('all')"
                >
                    Tutti
                </button>

                <button
                    id="filterLow"
                    class="filter-button"
                    onclick="setFilter('low')"
                >
                    Scorte basse
                </button>

            </div>


            <!-- LISTA PRODOTTI -->

            <div
                id="productsList"
                class="products-list"
            ></div>


            <!-- AGGIUNGI -->

            <button
                class="add-button"
                onclick="openProductModal()"
            >
                + Aggiungi prodotto
            </button>

        </section>

    </div>


    <!-- =====================================================
         MODALE PRODOTTO
    ====================================================== -->

    <div
        id="productModal"
        class="modal-overlay"
        onclick="closeModalFromOverlay(event)"
    >

        <div class="modal">

            <div class="modal-handle"></div>


            <div class="modal-header">

                <h3 id="modalTitle">
                    Aggiungi prodotto
                </h3>

                <button
                    class="close-button"
                    onclick="closeProductModal()"
                >
                    ×
                </button>

            </div>


            <form
                id="productForm"
                onsubmit="saveProduct(event)"
            >

                <div class="form-grid">

                    <div class="form-field">

                        <label for="productName">
                            Nome prodotto
                        </label>

                        <input
                            id="productName"
                            type="text"
                            required
                        >

                    </div>


                    <div class="form-field">

                        <label for="productBrand">
                            Marca
                        </label>

                        <input
                            id="productBrand"
                            type="text"
                        >

                    </div>


                    <div class="form-field">

                        <label for="productFormat">
                            Formato
                        </label>

                        <input
                            id="productFormat"
                            type="text"
                            placeholder="es. 400 g, 1 L, 12 pezzi"
                        >

                    </div>


                    <div class="form-two">

                        <div class="form-field">

                            <label for="productQuantity">
                                Quantità
                            </label>

                            <input
                                id="productQuantity"
                                type="number"
                                min="0"
                                step="1"
                                value="1"
                                required
                            >

                        </div>


                        <div class="form-field">

                            <label for="productMinStock">
                                Scorta minima
                            </label>

                            <input
                                id="productMinStock"
                                type="number"
                                min="0"
                                step="1"
                                value="1"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-field">

                        <label for="productBarcode">
                            Barcode
                        </label>

                        <input
                            id="productBarcode"
                            type="text"
                            inputmode="numeric"
                        >

                    </div>


                    <div class="form-field">

                        <label for="productImage">
                            URL immagine
                        </label>

                        <input
                            id="productImage"
                            type="url"
                            placeholder="https://..."
                        >

                    </div>


                    <div class="form-field">

                        <label for="productCategory">
                            Categoria
                        </label>

                        <select id="productCategory">

                            <option value="cibo">
                                Cibo
                            </option>

                            <option value="bagno">
                                Prodotti bagno
                            </option>

                            <option value="pulizia">
                                Prodotti pulizia
                            </option>

                        </select>

                    </div>


                    <button
                        class="save-button"
                        type="submit"
                    >
                        Salva prodotto
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- =====================================================
         SCANNER
    ====================================================== -->

    <div
        id="scannerModal"
        class="modal-overlay scanner-modal"
    >

        <div class="modal">

            <div class="modal-handle"></div>


            <div class="modal-header">

                <h3>
                    Scansiona barcode
                </h3>

                <button
                    class="close-button"
                    onclick="closeScanner()"
                >
                    ×
                </button>

            </div>


            <div id="reader"></div>


            <p class="scanner-help">
                Inquadra il codice a barre del prodotto.
            </p>


            <div class="scanner-actions">

                <button
                    class="secondary-button"
                    onclick="closeScanner()"
                >
                    Chiudi
                </button>

            </div>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        const STORAGE_KEY =
            "laMiaDispensa_products";


        const categories = {

            cibo:
                "Cibo",

            bagno:
                "Prodotti bagno",

            pulizia:
                "Prodotti pulizia"

        };


        /*
         * Questi prodotti hanno automaticamente
         * una scorta minima di 5.
         */

        const DEFAULT_MIN_STOCK_PRODUCTS = [

            "piselli",

            "ceci",

            "fagioli",

            "passata di pomodoro",

            "pezzettoni di pomodoro"

        ];


        let currentCategory = "cibo";

        let currentFilter = "all";

        let editingProductId = null;

        let html5QrCode = null;

        let products = loadProducts();


        /* =================================================
           FUNZIONI GENERALI
        ================================================= */

        function normalizeText(value) {

            return String(value || "")
                .toLowerCase()
                .trim()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "");

        }


        function getDefaultMinStock(name) {

            return DEFAULT_MIN_STOCK_PRODUCTS.some(
                item =>
                    normalizeText(name) ===
                    normalizeText(item)
            )
                ? 5
                : 1;

        }


        function createId() {

            return (
                Date.now().toString(36) +
                Math.random().toString(36).slice(2)
            );

        }


        /* =================================================
           STORAGE
        ================================================= */

        function loadProducts() {

            const saved =
                localStorage.getItem(STORAGE_KEY);


            if (saved) {

                try {

                    return JSON.parse(saved);

                } catch (error) {

                    console.error(
                        "Errore nel caricamento:",
                        error
                    );

                }

            }


            /*
             * Prodotti demo iniziali
             */

            const demoProducts = [

                {
                    id: createId(),
                    name: "Piselli",
                    brand: "",
                    format: "400 g",
                    quantity: 3,
                    minStock: 5,
                    barcode: "",
                    image: "",
                    category: "cibo"
                },

                {
                    id: createId(),
                    name: "Ceci",
                    brand: "",
                    format: "400 g",
                    quantity: 7,
                    minStock: 5,
                    barcode: "",
                    image: "",
                    category: "cibo"
                },

                {
                    id: createId(),
                    name: "Fagioli",
                    brand: "",
                    format: "400 g",
                    quantity: 5,
                    minStock: 5,
                    barcode: "",
                    image: "",
                    category: "cibo"
                },

                {
                    id: createId(),
                    name: "Passata di pomodoro",
                    brand: "",
                    format: "700 ml",
                    quantity: 2,
                    minStock: 5,
                    barcode: "",
                    image: "",
                    category: "cibo"
                },

                {
                    id: createId(),
                    name: "Pezzettoni di pomodoro",
                    brand: "",

            );

        }


        function saveProductsToStorage() {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(products)
            );

        }


        /* =================================================
           NAVIGAZIONE
        ================================================= */

        function openCategory(category) {

            currentCategory = category;

            currentFilter = "all";


            document
                .getElementById("homeScreen")
                .classList
                .remove("active");


            document
                .getElementById("categoryScreen")
                .classList
                .add("active");


            document
                .getElementById("categoryTitle")
                .textContent =
                categories[category];


            document
                .getElementById("searchInput")
                .value = "";


            updateFilterButtons();

            renderProducts();


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        function goHome() {

            document
                .getElementById("categoryScreen")
                .classList
                .remove("active");


            document
                .getElementById("homeScreen")
                .classList
                .add("active");


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        /* =================================================
           FILTRI
        ================================================= */

        function setFilter(filter) {

            currentFilter = filter;

            updateFilterButtons();

            renderProducts();

        }


        function updateFilterButtons() {

            document
                .getElementById("filterAll")
                .classList
                .toggle(
                    "active",
                    currentFilter === "all"
                );


            document
                .getElementById("filterLow")
                .classList
                .toggle(
                    "active",
                    currentFilter === "low"
                );

        }


        function isLowStock(product) {

            return (
                Number(product.quantity) <=
                Number(product.minStock)
            );

        }


        /* =================================================
           LISTA PRODOTTI
        ================================================= */

        function renderProducts() {

            const list =
                document.getElementById(
                    "productsList"
                );


            const search =
                normalizeText(
                    document.getElementById(
                        "searchInput"
                    ).value
                );


            let filteredProducts =
                products.filter(
                    product =>
                        product.category ===
                        currentCategory
                );


            if (search) {

                filteredProducts =
                    filteredProducts.filter(
                        product => {

                            const searchable =
                                normalizeText(
                                    [
                                        product.name,
                                        product.brand,
                                        product.format,
                                        product.barcode
                                    ].join(" ")
                                );


                            return searchable.includes(
                                search
                            );

                        }
                    );

            }


            if (currentFilter === "low") {

                filteredProducts =
                    filteredProducts.filter(
                        isLowStock
                    );

            }


            if (filteredProducts.length === 0) {

                list.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            📦
                        </div>

                        <h3>
                            Nessun prodotto
                        </h3>

                        <p>
                            Non ci sono prodotti che
                            corrispondono alla ricerca.
                        </p>

                    </div>

                `;

                return;

            }


            list.innerHTML =
                filteredProducts
                    .map(product => {

                        const lowStock =
                            isLowStock(product);


                        const imageHtml =
                            product.image

                                ? `
                                    <img
                                        src="${escapeHtml(product.image)}"
                                        alt=""
                                        onerror="
                                            this.parentElement.innerHTML='📦'
                                        "
                                    >
                                  `

                                : "📦";


                        const meta =
                            [
                                product.brand,
                                product.format
                            ]
                                .filter(Boolean)
                                .join(" · ") ||
                            "Nessun dettaglio";


                        return `

                            <div class="product-card">

                                <div class="product-image">

                                    ${imageHtml}

                                </div>


                                <div
                                    class="product-info"
                                    onclick="
                                        openProductModal('${product.id}')
                                    "
                                >

                                    <div class="product-name">

                                        ${escapeHtml(
                                            product.name
                                        )}

                                    </div>


                                    <div class="product-meta">

                                        ${escapeHtml(
                                            meta
                                        )}

                                    </div>


                                    ${
                                        lowStock
                                            ? `
                                                <div class="low-stock">
                                                    🔴 Scorta bassa · minimo ${product.minStock}
                                                </div>
                                              `
                                            : ""
                                    }

                                </div>


                                <div class="quantity-control">

                                    <button
                                        onclick="
                                            changeQuantity(
                                                '${product.id}',
                                                -1
                                            )
                                        "
                                        aria-label="Diminuisci quantità"
                                    >
                                        −
                                    </button>


                                    <div class="quantity-value">

                                        ${product.quantity}

                                    </div>


                                    <button
                                        onclick="
                                            changeQuantity(
                                                '${product.id}',
                                                1
                                            )
                                        "
                                        aria-label="Aumenta quantità"
                                    >
                                        +
                                    </button>

                                </div>

                            </div>

                        `;

                    })
                    .join("");

        }


        /* =================================================
           QUANTITÀ
        ================================================= */

        function changeQuantity(
            productId,
            amount
        ) {

            const product =
                products.find(
                    item =>
                        item.id === productId
                );


            if (!product) {
                return;
            }


            product.quantity =
                Math.max(
                    0,
                    Number(product.quantity) +
                    Number(amount)
                );


            saveProductsToStorage();

            renderProducts();

        }


        /* =================================================
           MODALE PRODOTTO
        ================================================= */

        function openProductModal(
            productId = null
        ) {

            editingProductId = productId;


            const modal =
                document.getElementById(
                    "productModal"
                );


            const title =
                document.getElementById(
                    "modalTitle"
                );


            document
                .getElementById("productForm")
                .reset();


            if (productId) {

                const product =
                    products.find(
                        item =>
                            item.id === productId
                    );


                if (!product) {
                    return;
                }


                title.textContent =
                    "Modifica prodotto";


                document.getElementById(
                    "productName"
                ).value =
                    product.name || "";


                document.getElementById(
                    "productBrand"
                ).value =
                    product.brand || "";


                document.getElementById(
                    "productFormat"
                ).value =
                    product.format || "";


                document.getElementById(
                    "productQuantity"
                ).value =
                    product.quantity ?? 0;


                document.getElementById(
                    "productMinStock"
                ).value =
                    product.minStock ?? 1;


                document.getElementById(
                    "productBarcode"
                ).value =
                    product.barcode || "";


                document.getElementById(
                    "productImage"
                ).value =
                    product.image || "";


                document.getElementById(
                    "productCategory"
                ).value =
                    product.category ||
                    currentCategory;

            }

            else {

                title.textContent =
                    "Aggiungi prodotto";


                document.getElementById(
                    "productQuantity"
                ).value = 1;


                document.getElementById(
                    "productMinStock"
                ).value = 1;


                document.getElementById(
                    "productCategory"
                ).value =
                    currentCategory;

            }


            modal.classList.add("active");

        }


        function closeProductModal() {

            document
                .getElementById("productModal")
                .classList
                .remove("active");


            editingProductId = null;

        }


        function closeModalFromOverlay(event) {

            if (
                event.target ===
                event.currentTarget
            ) {

                closeProductModal();

            }

        }


        /* =================================================
           SALVATAGGIO
        ================================================= */

        function saveProduct(event) {

            event.preventDefault();


            const name =
                document
                    .getElementById("productName")
                    .value
                    .trim();


            if (!name) {
                return;
            }


            let minStock =
                Number(
                    document.getElementById(
                        "productMinStock"
                    ).value
                );


            if (
                !Number.isFinite(minStock) ||
                minStock < 0
            ) {

                minStock =
                    getDefaultMinStock(name);

            }


            const productData = {

                name,

                brand:
                    document
                        .getElementById(
                            "productBrand"
                        )
                        .value
                        .trim(),

                format:
                    document
                        .getElementById(
                            "productFormat"
                        )
                        .value
                        .trim(),

                quantity:
                    Math.max(
                        0,
                        Number(
                            document.getElementById(
                                "productQuantity"
                            ).value
                        ) || 0
                    ),

                minStock,

                barcode:
                    document
                        .getElementById(
                            "productBarcode"
                        )
                        .value
                        .trim(),

                image:
                    document
                        .getElementById(
                            "productImage"
                        )
                        .value
                        .trim(),

                category:
                    document.getElementById(
                        "productCategory"
                    ).value

            };


            if (editingProductId) {

                const index =
                    products.findIndex(
                        product =>
                            product.id ===
                            editingProductId
                    );


                if (index !== -1) {

                    products[index] = {

                        ...products[index],

                        ...productData

                    };

                }

            }

            else {

                products.push({

                    id: createId(),

                    ...productData

                });

            }


            saveProductsToStorage();

            closeProductModal();


            currentCategory =
                productData.category;


            document.getElementById(
                "categoryTitle"
            ).textContent =
                categories[currentCategory];


            renderProducts();

        }


        /* =================================================
           SCANNER
        ================================================= */

        async function openScanner() {

            document
                .getElementById("scannerModal")
                .classList
                .add("active");


            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        150
                    )
            );


            if (
                typeof Html5Qrcode ===
                "undefined"
            ) {

                alert(
                    "Il lettore barcode non è ancora disponibile. Controlla la connessione a Internet."
                );

                return;

            }


            try {

                html5QrCode =
                    new Html5Qrcode(
                        "reader"
                    );


                await html5QrCode.start(

                    {
                        facingMode:
                            "environment"
                    },

                    {
                        fps: 10,

                        qrbox: {
                            width: 280,
                            height: 160
                        }
                    },

                    onBarcodeScanned,

                    () => {}

                );

            }

            catch (error) {

                console.error(
                    "Errore scanner:",
                    error
                );


                alert(
                    "Non è stato possibile avviare la fotocamera. Controlla il permesso della fotocamera in Safari."
                );

            }

        }


        async function onBarcodeScanned(
            decodedText
        ) {

            await closeScanner();


            if (
                !document
                    .getElementById(
                        "productModal"
                    )
                    .classList
                    .contains("active")
            ) {

                openProductModal();

            }


            document.getElementById(
                "productBarcode"
            ).value =
                decodedText;


            await lookupOpenFoodFacts(
                decodedText
            );

        }


        /* =================================================
           OPEN FOOD FACTS
        ================================================= */

        async function lookupOpenFoodFacts(
            barcode
        ) {

            try {

                const response =
                    await fetch(
                        `https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(barcode)}.json`
                    );


                if (!response.ok) {
                    return;
                }


                const data =
                    await response.json();


                if (
                    data.status !== 1 ||
                    !data.product
                ) {

                    return;

                }


                const product =
                    data.product;


                const name =
                    product.product_name_it ||
                    product.product_name ||
                    "";


                const brand =
                    product.brands ||
                    "";


                const format =
                    product.quantity ||
                    "";


                const image =
                    product.image_front_url ||
                    product.image_url ||
                    "";


                if (name) {

                    document.getElementById(
                        "productName"
                    ).value =
                        name;


                    document.getElementById(
                        "productMinStock"
                    ).value =
                        getDefaultMinStock(
                            name
                        );

                }


                if (brand) {

                    document.getElementById(
                        "productBrand"
                    ).value =
                        brand;

                }


                if (format) {

                    document.getElementById(
                        "productFormat"
                    ).value =
                        format;

                }


                if (image) {

                    document.getElementById(
                        "productImage"
                    ).value =
                        image;

                }

            }

            catch (error) {

                console.error(
                    "Errore Open Food Facts:",
                    error
                );

            }

        }


        /* =================================================
           CHIUSURA SCANNER
        ================================================= */

        async function closeScanner() {

            document
                .getElementById(
                    "scannerModal"
                )
                .classList
                .remove("active");


            if (html5QrCode) {

                try {

                    if (
                        html5QrCode.isScanning
                    ) {

                        await html5QrCode.stop();

                    }

                }

                catch (error) {

                    console.error(
                        "Errore chiusura scanner:",
                        error
                    );

                }


                try {

                    html5QrCode.clear();

                }

                catch (error) {}


                html5QrCode = null;

            }

        }


        /* =================================================
           SICUREZZA HTML
        ================================================= */

        function escapeHtml(value) {

            return String(value ?? "")
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =================================================
           TASTO ESC
        ================================================= */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape"
                ) {

                    closeProductModal();

                    closeScanner();

                }

            }
        );


        /* =================================================
           AVVIO
        ================================================= */

        renderProducts();

    </script>
